<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile – Three-Trick-Pony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cosmetics.css">
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="update-indicator.js"></script>
  <script src="changelog.js"></script>
  <script src="stickers.js"></script>
  <script src="stickers-neon.js"></script>
  <script src="stickers-lockin.js"></script>
  <script src="stickers-worlds.js"></script>
  <script src="stickers-ranked.js"></script>
  <script src="stickers-fa.js"></script>
  <style>
    /* Spielerprofil (v5.5.0): eine Widget-Flaeche, die genau so aussieht, wie
       Freunde sie spaeter sehen. "Edit profile" oeffnet den Bearbeitungsmodus
       (Nutzerdesign 2026-10-09): links Werkzeuge (Widgets hinzufuegen,
       Speichern/Abbrechen), rechts das Inventar (Borders, spaeter Backgrounds,
       Sticker, Themes). Widgets rasten in ein 6-Spalten-Raster ein und haben
       je Typ erlaubte Groessen (wie iPhone-Widgets) - je groesser, desto mehr
       Infos. Layout liegt in progression.json (profileLayout). */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .site-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .content {
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      padding: 0 30px;
      margin: 12px 0 24px;
    }

    /* ----- Flaeche + Raster ----- */
    .canvas-wrap {
      container-type: inline-size;
    }
    .canvas {
      --gap: 12px;
      --cell: calc((100cqw - 5 * var(--gap)) / 6);
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-rows: var(--cell);
      gap: var(--gap);
    }
    .slot {
      border: 1px dashed color-mix(in srgb, var(--text-faint) 55%, transparent);
      border-radius: 10px;
      pointer-events: none;
    }
    .widget:has(> .sticker-w) { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .sticker-w { position: absolute; inset: 4px; transition: transform .35s cubic-bezier(.3,.7,.3,1); transform-origin: center; transform-style: preserve-3d; }
    .sticker-w > .stk-square { box-shadow: 0 6px 14px rgba(0,0,0,.45); }
    /* Hover (v6.5.0, Nutzer): Sticker zoomt heran und neigt sich mit der Maus; beim Verlassen zurueck */
    .widget:has(> .sticker-w) { overflow: visible; }
    .widget:has(> .sticker-w.zoom) { z-index: 40; }
    .sticker-w.zoom { transition: transform .12s ease-out; }
    .sticker-w.zoom > .stk-square, .sticker-w.zoom .stk-sq3d > .stk-square { box-shadow: 0 18px 30px rgba(0,0,0,.6); }
    .sticker-w .stk-glare { position: absolute; inset: 0; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.28), transparent 55%); }
    .sticker-w.zoom .stk-glare { opacity: 1; }
    body.editing .widget:has(> .sticker-w) { border: 1px dashed var(--border); }
    .inv-sticker { width: 100%; aspect-ratio: 1; margin-bottom: 4px; }
    .inv-item[data-sticker] { cursor: grab; }
    /* Sticker-Inventar: Set-Umschalter (v6.5.0) */
    .set-switch { position: relative; display: flex; gap: 4px; align-items: stretch; margin-bottom: 8px; }
    .set-switch button { font: inherit; color: var(--text-dim); background: color-mix(in srgb, var(--input-bg) 70%, transparent); border: 1px solid var(--border); border-radius: 9px; cursor: pointer; transition: color .15s, border-color .15s; }
    .set-switch button:hover:not(:disabled) { color: var(--text); border-color: var(--border-hover); }
    .set-switch button:disabled { opacity: .35; cursor: default; }
    .set-nav { width: 22px; flex-shrink: 0; font-size: 1rem; line-height: 1; padding: 0; }
    .set-cur { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 5px 6px; }
    .set-cur b, .set-menu b { font-family: 'Cinzel', Georgia, serif; font-weight: normal; color: var(--gold); font-size: .68rem; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
    .set-menu b { white-space: normal; text-align: left; }
    .set-cur span, .set-menu span { font-size: .7rem; color: var(--text-faint); flex-shrink: 0; }
    .set-cur em { font-style: normal; font-size: .65rem; transition: transform .15s; }
    .set-cur.open em { transform: rotate(180deg); }
    .set-switch i { font-style: normal; color: #e8d43a; font-size: .75rem; }
    .set-menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 4px; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--input-bg); box-shadow: 0 10px 24px rgba(0,0,0,.5); }
    .set-menu button { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-color: transparent; background: transparent; }
    .set-menu button.on { border-color: var(--gold); }
    .widget {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      background: var(--panel-bg);
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    .w-body {
      height: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: Georgia, serif;
    }
    .w-title {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .w-center { align-items: center; text-align: center; }
    .w-big {
      color: var(--text);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.9rem;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .w-label {
      color: var(--text-faint);
      font-size: 0.66rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .w-stats {
      display: flex;
      gap: 8px;
    }
    .w-stat {
      flex: 1;
      min-width: 0;
      padding: 8px 4px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--input-bg) 55%, transparent);
      text-align: center;
    }
    .w-stat .v {
      display: block;
      color: var(--text);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .w-stat .l {
      display: block;
      margin-top: 2px;
      color: var(--text-faint);
      font-size: 0.6rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pos { color: var(--green) !important; }
    .neg { color: var(--red) !important; }

    /* Identitaet (feste 6x1) */
    /* Nutzerwunsch: Profilbild immer mittig im ERSTEN Rasterquadrat, Name
       beginnt immer im ZWEITEN - so verschiebt sich nichts, egal wie gross
       der ausgeruestete Rahmen ist. Alle Borders haben dieselbe Bildgroesse;
       ueberstehende Rahmen duerfen ueber den Widget-Rand hinausragen. */
    .identity {
      display: grid;
      grid-template-columns: var(--cell) minmax(0, 1fr);
      column-gap: var(--gap);
      align-items: center;
      padding: 0 20px 0 0;
    }
    .identity > .id-frame { justify-self: center; }
    .widget:has(> .identity) { overflow: visible; z-index: 2; }
    .id-frame {
      width: calc(var(--cell) * 0.7);
      height: calc(var(--cell) * 0.7);
      max-width: 110px;
      max-height: 110px;
      --cos-width: 4px;
    }
    .identity .id-frame { margin: 0 !important; }
    .id-frame img { opacity: 0; transition: opacity 0.15s ease; }
    .id-frame img.loaded { opacity: 1; }
    .id-main { flex: 1; min-width: 0; }
    .id-top { display: flex; align-items: baseline; gap: 12px; }
    .id-name {
      min-width: 0;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coin-pill, .level-pill {
      flex-shrink: 0;
      padding: 2px 10px;
      border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent);
      border-radius: 11px;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.82rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .coin-pill { margin-left: auto; }
    .id-since {
      color: var(--text-faint);
      font-size: 0.78rem;
      font-style: italic;
      margin: 2px 0 8px;
      min-height: 1.2em;
    }
    .level-line { display: flex; align-items: center; gap: 12px; }
    .xp-bar {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--text-faint) 18%, transparent);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 70%, transparent), var(--gold));
    }
    .xp-text {
      flex-shrink: 0;
      color: var(--text-dim);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Champion-Widgets */
    .champ-splash {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
    }
    .champ-splash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(var(--bg-rgb), 0.95) 0%, rgba(var(--bg-rgb), 0.35) 60%, rgba(var(--bg-rgb), 0.1) 100%);
    }
    .champ-over {
      position: relative;
      z-index: 1;
      margin-top: auto;
    }
    .champ-over .n {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.95rem;
    }
    .champ-over .s { color: var(--text-dim); font-size: 0.75rem; }
    .champ-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
      font-size: 0.85rem;
    }
    .champ-row:last-child { border-bottom: none; }
    .champ-row img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); }
    .champ-row .name { flex: 1; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .champ-row .g { color: var(--text-dim); font-size: 0.75rem; }

    /* Die Riot-Embleme haben sehr viel transparenten Rand -> Ausschnitt. */
    .emblem-box { overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .emblem-box img { width: 100%; height: 100%; object-fit: contain; transform: scale(3.4); }
    .emblem-box.big { width: 62%; max-width: 92px; aspect-ratio: 1; }
    .emblem-box.small { width: 72px; height: 72px; }
    .rank-row { display: flex; align-items: center; gap: 12px; }
    .rank-text { color: var(--text); font-family: 'Cinzel', Georgia, serif; font-size: 1.1rem; }
    .bio-text {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow: hidden;
    }
    .bio-text.empty { color: var(--text-faint); font-style: italic; }
    .bio-edit {
      width: 100%;
      flex: 1;
      box-sizing: border-box;
      resize: none;
      background: color-mix(in srgb, var(--input-bg) 70%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 0.88rem;
      padding: 6px 8px;
    }

    /* ----- Bearbeiten-Knopf unter der Flaeche ----- */
    .edit-toggle {
      display: block;
      margin: 14px auto 0;
      padding: 4px 8px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.9rem;
      font-style: italic;
      cursor: pointer;
    }
    .edit-toggle:hover { color: var(--gold); }
    body.editing .edit-toggle { display: none; }
    /* Im Bearbeitungsmodus passt die Flaeche immer zwischen die beiden
       Seitenleisten (je 20px Rand + 230px Breite + 20px Luft) - die Zellen
       skalieren ueber die Container-Einheiten mit. */
    body.editing .content { max-width: min(900px, calc(100vw - 540px)); padding: 0; }

    /* ----- Bearbeitungsmodus ----- */
    body.editing .widget { cursor: grab; user-select: none; }
    body.editing .widget.dragging { cursor: grabbing; opacity: 0.85; z-index: 5; border-color: var(--gold); }
    body.editing .widget.swap-preview { opacity: .45; border-style: dashed; border-color: var(--gold); pointer-events: none; }
    body.editing .widget.invalid { border-color: var(--red); box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 50%, transparent); }
    body.editing .widget.selected { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 45%, transparent); }
    .w-remove, .w-resize, .w-size {
      display: none;
      position: absolute;
      z-index: 3;
    }
    body.editing .w-remove, body.editing .w-resize { display: flex; }
    /* Groessen-Schild nur bei Hover/Ziehen, sonst verdeckt es Inhalt. */
    body.editing .widget:hover .w-size, body.editing .widget.dragging .w-size { display: flex; }
    .w-remove {
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--red);
      background: var(--bg);
      color: var(--red);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .w-resize {
      right: 4px;
      bottom: 4px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      border-right: 3px solid var(--gold);
      border-bottom: 3px solid var(--gold);
      border-radius: 0 0 6px 0;
      opacity: 0.8;
    }
    .w-size {
      left: 6px;
      bottom: 6px;
      padding: 0 6px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.65rem;
      line-height: 16px;
    }

    .side-panel {
      position: fixed;
      top: 90px;
      bottom: 24px;
      width: 230px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      font-family: Georgia, serif;
      transition: transform 0.22s ease, opacity 0.22s ease;
      opacity: 0;
      pointer-events: none;
    }
    .side-panel.left { left: 20px; transform: translateX(-30px); }
    .side-panel.right { right: 20px; transform: translateX(30px); }
    body.editing .side-panel { opacity: 1; transform: none; pointer-events: auto; }
    .side-panel h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .panel-scroll { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
    .edit-bar { position: fixed; left: 50%; bottom: 18px; z-index: 35; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--input-bg); box-shadow: 0 10px 28px rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s; }
    body.editing .edit-bar { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .edit-dirty { font-size: .75rem; color: var(--text-faint); font-style: italic; min-width: 110px; }
    .edit-dirty.on { color: var(--gold); }
    .edit-bar button {
      min-width: 96px;
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-save { border: 1px solid var(--gold); background: var(--gold); color: var(--bg); }
    .btn-cancel { border: 1px solid var(--border); background: transparent; color: var(--text-dim); }
    .btn-cancel:hover { color: var(--text); border-color: var(--border-hover); }
    /* Platz fuer die Leiste unter der Widget-Flaeche */
    body.editing .canvas-wrap { margin-bottom: 70px; }
    .btn-reset {
      margin-top: 8px;
      border: none;
      background: none;
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .inv-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .inv-tab {
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .inv-tab.active { border-color: var(--gold); color: var(--gold); }
    .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .inv-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px 8px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      color: var(--text-dim);
      font-size: 0.72rem;
      text-align: center;
      cursor: pointer;
    }
    .inv-item:hover { border-color: var(--border-hover); color: var(--text); }
    .inv-item.equipped { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
    .inv-item .cos-border { width: 40px; height: 40px; }
    /* Noch nicht gesammelt: ausgegraut, Schloss, nicht anklickbar */
    .inv-item { position: relative; }
    .inv-item.locked { cursor: not-allowed; opacity: 0.5; filter: grayscale(1); }
    .inv-item.locked:hover { border-color: color-mix(in srgb, var(--border) 70%, transparent); color: var(--text-dim); }
    .inv-item.locked::after { content: '🔒'; position: absolute; top: 4px; right: 5px; font-size: 0.7rem; filter: grayscale(1); }
    .inv-count { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 10px; color: var(--text-dim); font-size: 0.72rem; }
    .inv-count > span:first-child { white-space: nowrap; }
    .mini-avatar { border-radius: 50%; }
    .mini-app-icon { width: 34px; height: 34px; display: block; margin: 0 auto 4px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
    .inv-lock-toggle {
      flex-shrink: 0; margin-left: auto; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim); font-family: inherit; font-size: 0.68rem; cursor: pointer; white-space: nowrap;
    }
    .inv-lock-toggle:hover { border-color: var(--gold); color: var(--gold); }
    .inv-lock-toggle.off { border-color: var(--gold); color: var(--gold); }
    .inv-count b { color: var(--gold); font-weight: normal; }
    .inv-count .bar { flex: 1 1 50px; min-width: 50px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--text-faint) 25%, transparent); overflow: hidden; }
    .inv-count .bar i { display: block; height: 100%; background: var(--gold); }
    .inv-tab small { margin-left: 4px; color: var(--text-faint); font-size: 0.62rem; }
    .inv-tab.active small { color: inherit; }
    .inv-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .inv-sub {
      margin: 12px 0 6px;
      color: var(--text-faint);
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .inv-sub:first-child { margin-top: 0; }
    .inv-note { margin: 10px 0 0; color: var(--text-faint); font-size: 0.72rem; font-style: italic; }
    .inv-anim { display: block; color: var(--gold); font-size: 0.62rem; }
    .inv-item .rar { display: block; margin-top: -3px; }
    .inv-trial { display: block; color: var(--gold); font-size: 0.6rem; }
    .inv-item .mini-frame { width: 40px; height: 30px; }
    .inv-item .mini-theme { width: 34px; height: 34px; }
    .mini-frame.mini-none { border: 1px dashed var(--text-faint); }
    .inv-empty { color: var(--text-faint); font-size: 0.8rem; font-style: italic; line-height: 1.4; }

    .status {
      text-align: center;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }
    /* ----- v5.6.0: mehr Widgets, Ziehen aus der Seitenleiste ----- */

    .ms-row.ms.done .ms-name { color: #f6e27a; }
    /* Booster verschenken (v6.6.0) */
    .gift-btn { text-decoration: none; font: inherit; font-size: .8rem; color: var(--gold); background: transparent; border: 1px solid var(--gold); border-radius: 14px; padding: 3px 12px; cursor: pointer; transition: background .15s; }

    .visit-banner b { color: var(--gold); font-weight: normal; }

  </style>
</head>
<body>
  <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="Settings" aria-label="Settings">⚙</button>
  <button type="button" class="quit-btn" id="quitBtn" title="Quit completely" aria-label="Quit completely">⏻</button>
  <header class="site-header">
    <h1>League of Legends</h1>
    <p class="subtitle">Three-Trick-Pony</p>
  </header>

  <div class="content">
    <div class="visit-banner" id="visitBanner" hidden></div>
    <div class="visit-challenge" id="visitChallenge" hidden></div>
    <div class="canvas-wrap"><div class="canvas" id="canvas"></div></div>
    <button type="button" class="edit-toggle" id="editToggle">✎ Edit profile</button>
    <p class="status" id="status"></p>
  </div>

  <aside class="side-panel left" id="toolPanel" aria-label="Profile tools">
    <h3>Widgets <span class="hint" tabindex="0"><span class="info-icon">?</span><span class="hint-pop">Drag a widget from this list onto your profile. On the profile: drag to move, pull the corner to resize (each widget has its own sizes - bigger shows more), × removes. Empty spaces are fine.</span></span></h3>
    <div class="panel-scroll" id="addList"></div>
    <button type="button" class="btn-reset" id="resetLayoutBtn">Reset to default layout</button>
  </aside>
  <!-- v6.7.2 (Nutzer): ALLES im Editor (Widgets, Cosmetics, Theme, Profilbild,
       App-Icon, Stats-Summoner) gilt erst nach Save - darum eine eigene Leiste -->
  <div class="edit-bar" id="editBar">
    <span class="edit-dirty" id="editDirty">Unsaved changes</span>
    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
    <button type="button" class="btn-save" id="saveBtn">Save</button>
  </div>

  <aside class="side-panel right" id="invPanel" aria-label="Cosmetics">
    <h3>Cosmetics</h3>
    <div class="inv-tabs" id="invTabs"></div>
    <div class="panel-scroll" id="invList"></div>
  </aside>

  <script>
    const DDRAGON_VERSION = window.TTP_DDRAGON_VERSION || '16.22.1';
    const COLS = 6;
    const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    const fmtNum = n => Number(n).toLocaleString('en-US');
    const fmtDate = iso => new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const esc = str => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');
    // Freundesprofil (v6.1.0): profile.html?u=<userId> zeigt die Momentaufnahme
    // des Freundes (supabase public_profiles) - nur ansehen, in SEINEM Theme
    // (Nutzerentscheidung 2026-10-09, "zu Besuch").
    const VISIT = new URLSearchParams(location.search).get('u');
    let visit = null;
    const viewName = () => (VISIT ? (visit ? visit.username : '…') : (window.ttpUsername() || '…'));
    const viewAvatar = () => (VISIT ? (visit && visit.avatar ? `avatars/${visit.avatar}.svg` : 'avatar-placeholder.svg') : window.ttpAvatar());

    async function parseApiResponse(res) {
      const text = await res.text();
      try { return JSON.parse(text); } catch (e) { return { error: text || `HTTP ${res.status}` }; }
    }

    // ===== Daten =====
    const data = { account: null, stats: null, rank: null, champions: [] };
    // Inventar: nicht besessene Items zeigen? Standard aus, per Knopf an -
    // setzt sich bei jedem Oeffnen des Editors zurueck (Nutzerwunsch)
    let showLocked = false;
    // Sticker-Inventar: gewaehltes Set (gemerkt) + offene Set-Liste
    let invStickerSet = (() => { try { return localStorage.getItem('ttp_inv_sticker_set') || 'base'; } catch (e) { return 'base'; } })();
    let setMenuOpen = false;

    // ===== Bausteine =====
    const RANK_ABBR = { IRON: 'Iron', BRONZE: 'Bronze', SILVER: 'Silver', GOLD: 'Gold', PLATINUM: 'Plat', EMERALD: 'Emerald', DIAMOND: 'Diamond', MASTER: 'Master', GRANDMASTER: 'GM', CHALLENGER: 'Challenger' };
    const APEX = new Set(['MASTER', 'GRANDMASTER', 'CHALLENGER']);
    const ROLE_NAMES = { TOP: 'Top', JUNGLE: 'Jungle', MIDDLE: 'Mid', BOTTOM: 'Bot', UTILITY: 'Support' };
    const emblemUrl = tier => `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${tier.toLowerCase()}.png`;
    const champIcon = id => `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/champion/${id}.png`;
    const champSplash = id => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${id}_0.jpg`;
    const tone = pct => (pct === null ? '' : pct >= 50 ? 'pos' : 'neg');
    const stat = (v, l, cls = '') => `<div class="w-stat"><span class="v ${cls}">${v}</span><span class="l">${l}</span></div>`;
    const big = (v, l, cls = '') => `<div class="w-body w-center"><div class="w-big ${cls}">${v}</div><div class="w-label">${l}</div></div>`;
    const title = t => `<div class="w-title">${t}</div>`;
    const bar = (pct, text) => `<div class="level-line"><div class="xp-bar"><div class="xp-bar-fill" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>${text ? `<span class="xp-text">${text}</span>` : ''}</div>`;
    const S = () => data.stats;
    // Sticker-Sets fuer die Sammel-Bausteine (Status vom Server, auch bei Freunden)
    const stickerSetRows = () => {
      const col = (S() && S().stickers) || {}, st = (S() && S().setStatus) || {};
      return Object.entries(window.STICKER_SETS || {}).map(([id, L]) => {
        const total = (L.SET || []).length, have = (L.SET || []).filter(s => (col[id] || {})[s.n]).length;
        return { id, name: id === 'base' ? 'Base Set' : (L.name || id), special: !!L.special, have, total, complete: st[id] ? !!st[id].complete : total > 0 && have >= total, master: !!(st[id] && st[id].master) };
      });
    };
    // Ohne Profil-Daten (Ladefehler) "–" statt erfundener Werte wie Level 1 / 0 Coins
    const NO_LEVEL = { level: '–', xpIntoLevel: 0, xpForNextLevel: 1 };
    const winrate = () => (S() && S().games ? Math.round((S().wins / S().games) * 100) : null);
    // Anzahl Stat-Kacheln je Groesse fuer die Listen-Widgets
    const statCount = w => (w.w >= 6 ? 5 : w.w >= 4 ? 4 : w.w);
    function statsWidget(name, all, w) {
      if (w.w === 1 && w.h === 1) return big(all[0].v, all[0].l, all[0].cls || '');
      const n = w.h >= 2 ? Math.min(4, all.length) : statCount(w);
      return `<div class="w-body">${title(name)}<div class="w-stats${w.h >= 2 ? ' grid2' : ''}">${all.slice(0, n).map(s => stat(s.v, s.l, s.cls || '')).join('')}</div></div>`;
    }
    function pool() {
      if (VISIT) return (visit && visit.pool && visit.pool.champions) || [];
      try { return JSON.parse(ls('ttp_selected_champs') || '[]').filter(c => c && c.id); } catch (e) { return []; }
    }

    // ===== Widget-Katalog =====
    // sizes: erlaubte [Breite, Hoehe] in Rasterzellen, erste = Standard beim
    // Hinzufuegen. Je groesser, desto mehr Infos (Nutzerdesign: wie iPhone-
    // Widgets, aber nur Groessen, die fuer das Widget Sinn ergeben).
    // Profil-Sticker: beim Hovern heranzoomen + zur Maus neigen (nicht im Bearbeiten-Modus)
    (function stickerHover() {
      let cur = null;
      const reset = () => { if (!cur) return; const el = cur; cur = null; el.classList.remove('zoom'); if (window.STICKERS) window.STICKERS.untilt(el); el.style.transform = ''; };
      document.addEventListener('mousemove', e => {
        const el = e.target.closest && e.target.closest('.sticker-w');
        if (el !== cur) reset();
        if (!el || document.body.classList.contains('editing') || document.documentElement.classList.contains('fx-off') || !el.querySelector('.stk-square')) return;
        cur = el;
        const r = el.getBoundingClientRect(), w = el.offsetWidth || r.width;
        // Position relativ zur UNSKALIERTEN Flaeche, damit die Neigung nicht springt
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2, half = w / 2;
        const px = Math.max(-1, Math.min(1, (e.clientX - cx) / half)), py = Math.max(-1, Math.min(1, (e.clientY - cy) / half));
        const zoom = w < 140 ? 1.6 : 1.3;
        el.classList.add('zoom');
        // gleiche Tiefe wie im Album (tiltTo setzt --lift/--step/--comp fuer die Hologramm-Figur)
        window.STICKERS.tiltTo(el, px / 2, py / 2, 16);
        el.style.transform += ` scale(${zoom})`;
        el.style.setProperty('--gx', `${50 + px * 40}%`); el.style.setProperty('--gy', `${50 + py * 40}%`);
      }, { passive: true });
      document.addEventListener('mouseleave', reset);
      window.addEventListener('blur', reset);
    })();
    const stickerLib = id => (window.STICKER_SETS && window.STICKER_SETS[id || 'base']) || window.STICKERS;
    const WIDGETS = {
      identity: {
        group: 'Basics', name: 'Name & Level', desc: 'Always on your profile', fixed: true, sizes: [[6, 1], [4, 1], [3, 2]],
        render(w) {

    };
    const GROUPS = ['Basics', 'Stats', 'Champions', 'Progress', 'Collectables', 'Personal'];

    const DEFAULT_LAYOUT = [
      { id: 'identity', type: 'identity', x: 0, y: 0, w: 6, h: 1 },
      { id: 'challenges', type: 'challenges', x: 0, y: 1, w: 3, h: 1 },
      { id: 'games', type: 'games', x: 3, y: 1, w: 3, h: 1 },
      { id: 'mostPlayed', type: 'mostPlayed', x: 0, y: 2, w: 2, h: 2 },
      { id: 'rank', type: 'rank', x: 2, y: 2, w: 2, h: 1 },
      { id: 'winrate', type: 'winrate', x: 4, y: 2, w: 1, h: 1 },
      { id: 'level', type: 'level', x: 5, y: 2, w: 1, h: 1 },
      { id: 'bio', type: 'bio', x: 2, y: 3, w: 3, h: 1, config: { text: '' } }
    ];

    let layout = DEFAULT_LAYOUT.map(w => ({ ...w }));
    // editState: null = Ansicht; sonst { snapshot (fuer Abbrechen), border }
    let editState = null;

    // ===== Raster-Logik =====
    function overlaps(a, b) {
      return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    }
    function fits(rect, ignoreId) {
      if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > COLS) return false;
      return layout.every(o => o.id === ignoreId || !overlaps(rect, o));
    }
    function rowCount() {
      const bottom = layout.reduce((m, w) => Math.max(m, w.y + w.h), 1);
      return editState ? bottom + 2 : bottom;
    }
    function setRows(min = 0) {
      canvas.style.gridTemplateRows = `repeat(${Math.max(rowCount(), min)}, var(--cell))`;
    }

    function widgetInner(w) {
      const def = WIDGETS[w.type];
      return `${def.render(w)}
        ${def.fixed ? '' : '<button type="button" class="w-remove" title="Remove widget" data-remove>×</button>'}
        ${def.sizes.length > 1 ? '<span class="w-resize" title="Drag to resize" data-resize></span>' : ''}
        <span class="w-size">${w.w}×${w.h}</span>`;
    }

    // Benutzername kommt nach dem Laden von /api/auth/me (nav.js)
    document.addEventListener('ttp-account', () => render());
    function render() {
      const rows = rowCount();
      let html = '';
      if (editState) {
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < COLS; x++) html += `<div class="slot" style="grid-column:${x + 1};grid-row:${y + 1}"></div>`;
        }
      }
      layout.forEach(w => {
        if (!WIDGETS[w.type]) return;
        html += `<div class="widget" data-id="${w.id}" style="grid-column:${w.x + 1} / span ${w.w};grid-row:${w.y + 1} / span ${w.h}">${widgetInner(w)}</div>`;
      });
      setRows();
      canvas.innerHTML = html;
      applyFrame();
      if (editState) renderPanels();
    }

    function cellStep() {
      const rect = canvas.getBoundingClientRect();
      return { rect, step: (rect.width - 12 * (COLS - 1)) / COLS + 12 };
    }

    // ===== Verschieben / Groesse aendern (vorhandene Widgets) =====
    let drag = null;
    canvas.addEventListener('pointerdown', e => {
      if (!editState) return;
      const el = e.target.closest('.widget');
      if (!el || el.classList.contains('ghost') || e.target.closest('[data-remove], textarea, select')) return;
      const w = layout.find(x => x.id === el.dataset.id);
      if (!w) return;
      e.preventDefault();
      drag = { mode: e.target.closest('[data-resize]') ? 'resize' : 'move', w, el, startX: e.clientX, startY: e.clientY, orig: { x: w.x, y: w.y, w: w.w, h: w.h }, ok: true };
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    });
    // ===== Platz machen (v6.7.2, Nutzer: "umfassend alles verschieben") =====
    // Fuer eine Zielflaeche R des Widgets id (null = neues Widget) wird
    // berechnet, wohin die getroffenen Widgets ausweichen:
    // 1. Tausch: passen alle getroffenen Widgets (gleicher Versatz) in den Platz,
    //    den das gezogene Widget frei macht, wandern sie dorthin - z.B. ein 3x1
    //    auf drei (oder zwei) 1x1, oder zwei 1x1 auf ein 2x1.
    // 2. Sonst werden sie nach unten weggeschoben (und alles, was dann im Weg
    //    ist, ebenfalls) - so laesst sich ein Widget ueberall dazwischenschieben.
    // layout bleibt waehrend des Ziehens unveraendert = Ausgangsstand.
    function planMove(id, R, allowSwap) {
      const others = layout.filter(w => w.id !== id && WIDGETS[w.type]);
      const hit = others.filter(w => overlaps(R, w));
      const plan = new Map();
      if (!hit.length) return plan;
      const O = id ? layout.find(w => w.id === id) : null;
      if (O && allowSwap) {
        const dx = O.x - R.x, dy = O.y - R.y;
        const hitIds = new Set(hit.map(w => w.id));
        const moved = hit.map(w => ({ id: w.id, r: { x: w.x + dx, y: w.y + dy, w: w.w, h: w.h } }));
        const inO = r => r.x >= O.x && r.y >= O.y && r.x + r.w <= O.x + O.w && r.y + r.h <= O.y + O.h;
        if (moved.every(m => inO(m.r) && !overlaps(m.r, R) && others.every(w => hitIds.has(w.id) || !overlaps(m.r, w)))) {
          moved.forEach(m => plan.set(m.id, m.r));
          return plan;
        }
      }
      const placed = [R];
      [...others].sort((p, q) => p.y - q.y || p.x - q.x).forEach(w => {
        let r = { x: w.x, y: w.y, w: w.w, h: w.h };
        for (let guard = 0; guard < 500; guard++) {
          const blk = placed.filter(q => overlaps(r, q));
          if (!blk.length) break;
          r = { ...r, y: Math.max(...blk.map(q => q.y + q.h)) };
        }
        placed.push(r);
        if (r.y !== w.y || r.x !== w.x) plan.set(w.id, r);
      });
      return plan;
    }
    // Vorschau: ausweichende Widgets halb durchsichtig an ihrem neuen Platz
    function showPlan(plan) {
      let bottom = 0;
      canvas.querySelectorAll('.widget[data-id]').forEach(el => {
        if (drag && drag.el === el) return;
        const w = layout.find(x => x.id === el.dataset.id);
        if (!w) return;
        const r = plan.get(w.id) || w;
        el.classList.toggle('swap-preview', plan.has(w.id));
        el.style.gridColumn = `${r.x + 1} / span ${r.w}`;
        el.style.gridRow = `${r.y + 1} / span ${r.h}`;
        bottom = Math.max(bottom, r.y + r.h);
      });
      return bottom;
    }
    function commitPlan(plan) {
      plan.forEach((r, id) => { const w = layout.find(x => x.id === id); if (w) Object.assign(w, { x: r.x, y: r.y }); });
    }
    canvas.addEventListener('pointermove', e => {
      if (!drag || drag.mode === 'new') return;
      const { rect, step } = cellStep();
      const o = drag.orig;
      let next;
      if (drag.mode === 'move') {
        // Ueber einem gleich grossen Widget: genau auf dessen Platz einrasten (Tausch)
        const cx = Math.floor((e.clientX - rect.left) / step), cy = Math.floor((e.clientY - rect.top) / step);
        const mate = layout.find(b => b.id !== drag.w.id && b.w === o.w && b.h === o.h && cx >= b.x && cx < b.x + b.w && cy >= b.y && cy < b.y + b.h);
        if (mate) next = { ...o, x: mate.x, y: mate.y };
        else {
          next = { ...o, x: o.x + Math.round((e.clientX - drag.startX) / step), y: o.y + Math.round((e.clientY - drag.startY) / step) };
          next.x = Math.max(0, Math.min(COLS - o.w, next.x));
          next.y = Math.max(0, next.y);
        }
      } else {
        // Naechste erlaubte Groesse zum Mauszeiger
        const wantW = o.w + (e.clientX - drag.startX) / step;
        const wantH = o.h + (e.clientY - drag.startY) / step;
        const best = WIDGETS[drag.w.type].sizes.reduce((b, s) => {
          const d = Math.hypot(s[0] - wantW, s[1] - wantH);
          return !b || d < b.d ? { s, d } : b;
        }, null).s;
        next = { ...o, w: best[0], h: best[1] };
        if (next.x + next.w > COLS) next.x = COLS - next.w;
        // Live-Vorschau: Inhalt sofort in der neuen Groesse zeigen, damit man
        // sieht, was dazukommt bzw. wegfaellt (nicht erst nach dem Loslassen).
        const key = `${next.w}x${next.h}`;
        if (drag.sizeKey !== key) {
          drag.sizeKey = key;
          drag.el.innerHTML = widgetInner({ ...drag.w, ...next });
        }
      }
      const same = drag.next && ['x', 'y', 'w', 'h'].every(k => drag.next[k] === next[k]);
      drag.next = next;
      drag.ok = true;
      drag.el.style.gridColumn = `${next.x + 1} / span ${next.w}`;
      drag.el.style.gridRow = `${next.y + 1} / span ${next.h}`;
      drag.el.classList.remove('invalid');
      if (same) return;
      drag.plan = planMove(drag.w.id, next, drag.mode === 'move');
      const bottom = showPlan(drag.plan);
      setRows(Math.max(bottom, next.y + next.h) + 1);
    });
    function endDrag() {
      if (!drag || drag.mode === 'new') return;
      if (drag.next && drag.ok) {
        markDirty(true);
        commitPlan(drag.plan || new Map());
        Object.assign(drag.w, { x: drag.next.x, y: drag.next.y, w: drag.next.w, h: drag.next.h });
      }
      drag = null;
      render();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // ===== Neues Widget aus der Seitenleiste ziehen =====
    const chip = document.createElement('div');
    chip.className = 'drag-chip';
    document.body.appendChild(chip);

    document.getElementById('addList').addEventListener('pointerdown', e => {
      const item = e.target.closest('[data-add]');
      if (!item || item.classList.contains('disabled')) return;
      e.preventDefault();
      const type = item.dataset.add;
      const [w, h] = WIDGETS[type].sizes[0];
      const ghost = document.createElement('div');
      ghost.className = 'widget ghost';
      ghost.innerHTML = WIDGETS[type].render({ id: '_ghost', type, w, h, config: {} });
      drag = { mode: 'new', type, w, h, ghost, ok: false, next: null };
      chip.textContent = `${WIDGETS[type].name} · ${w}×${h}`;
      chip.style.display = 'block';
      moveNew(e);
    });
    function moveNew(e) {
      chip.style.left = `${e.clientX + 14}px`;
      chip.style.top = `${e.clientY + 14}px`;
      const { rect, step } = cellStep();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top - step / 2 && e.clientY <= rect.bottom + step;
      if (!inside) {
        drag.ghost.remove();
        drag.ok = false;
        drag.plan = new Map();
        showPlan(drag.plan);
        return;
      }
      const x = Math.max(0, Math.min(COLS - drag.w, Math.round((e.clientX - rect.left) / step - drag.w / 2)));
      const y = Math.max(0, Math.round((e.clientY - rect.top) / step - drag.h / 2));
      drag.next = { x, y, w: drag.w, h: drag.h };
      drag.ok = true;
      drag.ghost.style.gridColumn = `${x + 1} / span ${drag.w}`;
      drag.ghost.style.gridRow = `${y + 1} / span ${drag.h}`;
      drag.ghost.classList.remove('invalid');
      if (!drag.ghost.isConnected) canvas.appendChild(drag.ghost);
      // neue Widgets schieben die getroffenen ebenfalls nach unten weg
      drag.plan = planMove(null, drag.next, false);
      const bottom = showPlan(drag.plan);
      setRows(Math.max(bottom, y + drag.h) + 1);
    }
    document.addEventListener('pointermove', e => { if (drag && drag.mode === 'new') moveNew(e); });
    document.addEventListener('pointerup', () => {
      if (!drag || drag.mode !== 'new') return;
      const { type, next, ok, config, plan } = drag;
      drag.ghost.remove();
      chip.style.display = 'none';
      drag = null;
      if (ok && next) {
        markDirty(true);
        commitPlan(plan || new Map());
        const id = type === 'sticker' ? `sticker-${Date.now().toString(36)}` : type;
        layout.push({ id, type, ...next, config: config || (type === 'bio' ? { text: '' } : {}) });
      }
      render();
    });

    canvas.addEventListener('click', e => {
      if (!editState || !e.target.closest('[data-remove]')) return;
      const id = e.target.closest('.widget').dataset.id;
      layout = layout.filter(w => w.id !== id);
      markDirty(true);
      render();
    });
    canvas.addEventListener('input', e => {
      const ta = e.target.closest('[data-bio]');
      if (!ta) return;
      markDirty(true);
      const w = layout.find(x => x.id === ta.dataset.bio);
      if (w) w.config = { ...(w.config || {}), text: ta.value };
    });
    canvas.addEventListener('change', e => {
      const sel = e.target.closest('[data-fav]');
      if (!sel) return;
      const w = layout.find(x => x.id === sel.dataset.fav);
      if (w) w.config = { ...(w.config || {}), champId: sel.value };
      markDirty(true);
      render();
    });

    // ===== Panels =====
    // Reihenfolge nach Nutzerwunsch: Themes (das Praegnanteste) zuerst.
    let invTab = 'theme';
    const INV_TABS = [
      { id: 'theme', label: 'Themes' },
      { id: 'border', label: 'Borders' },
      { id: 'frame', label: 'Frames' },
      { id: 'avatar', label: 'Pictures' },
      { id: 'icon', label: 'Icons' },
      { id: 'sticker', label: 'Stickers' }
    ];
    // Die 8 Grund-Themes hat jeder (seit v5.11.0 nur noch hier waehlbar,
    // nicht mehr in den Einstellungen); Farben fuer die Vorschau-Kreise.
    const BASE_THEMES = [
      { themeKey: 'classic', name: 'Classic', c: ['#0a1428', '#c8aa6e', '#785a28'] },
      { themeKey: 'graphite', name: 'Graphite', c: ['#18181b', '#b4b8c0', '#3f3f46'] },
      { themeKey: 'light', name: 'Light', c: ['#f4f0e6', '#8b6914', '#c9b892'] },
      { themeKey: 'hextech', name: 'Hextech', c: ['#071a1f', '#0ac8b9', '#0e4f57'] },
      { themeKey: 'arcane', name: 'Arcane', c: ['#150d26', '#b088ff', '#4a2f7a'] },
      { themeKey: 'noxus', name: 'Noxus', c: ['#170a0a', '#d1373f', '#6e1f1f'] },
      { themeKey: 'freljord', name: 'Freljord', c: ['#0d1b2a', '#e8935a', '#2c4a63'] },
      { themeKey: 'ionia', name: 'Ionia', c: ['#0f1f1a', '#ff8fb1', '#2c5245'] }
    ];

    function miniGrid([w, h]) {
      return `<span class="mini-grid" style="grid-template-columns:repeat(${w}, 9px);grid-template-rows:repeat(${h}, 9px)">${'<i></i>'.repeat(w * h)}</span>`;
    }

    function renderPanels() {
      const present = new Set(layout.map(w => w.type));
      const accs = (S() && S().statsAccounts) || [];
      const statsPick = accs.length ? `<label class="stats-src"><span>Stats from<small>Your stat widgets show this summoner - no matter which one is selected at the top.</small></span>
          <select id="statsSrc">${accs.map(a => `<option value="${esc(a.puuid)}"${editState && editState.statsPuuid === a.puuid ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>` : '';
      document.getElementById('addList').innerHTML = statsPick + GROUPS.map(group => {
        // Einzelne Sticker kommen aus dem Inventar (Reiter Stickers), nicht aus dieser Liste
        const items = Object.entries(WIDGETS).filter(([type, def]) => def.group === group && !def.fixed && type !== 'sticker');
        if (!items.length) return '';
        return `<div class="add-group">${group}</div>` + items.map(([type, def]) => `
          <div class="add-item${present.has(type) ? ' disabled' : ''}" data-add="${type}" title="${present.has(type) ? 'Already on your profile' : `Drag onto your profile · sizes ${def.sizes.map(s => s.join('×')).join(', ')}`}">
            ${miniGrid(def.sizes[0])}
            <span class="add-text">${def.name}<small>${present.has(type) ? 'On your profile' : def.desc}</small></span>
          </div>`).join('');
      }).join('');

      // Sammelansicht (Nutzerwunsch, "als Completionist"): ALLE Cosmetics,
      // fehlende ausgegraut mit Schloss und nicht anklickbar, pro Reiter
      // "x / y gesammelt". Standard-Border/kein Rahmen zaehlen nicht mit,
      // die 8 Grund-Themes schon (die hat jeder).
      const owned = S() ? S().owned : [];
      // Per "Try It On" geliehene Sachen (rentedUntil) sind nutzbar, zaehlen
      // aber nicht als gesammelt
      const ownedIds = new Set(owned.filter(c => !c.rentedUntil).map(c => c.id));
      const usableIds = new Set(owned.map(c => c.id));
      const rentedIds = new Set(owned.filter(c => c.rentedUntil).map(c => c.id));
      const catalog = (S() && S().catalog) || owned;
      const ofType = type => catalog.filter(c => c.type === type);
      const counts = {
        theme: [BASE_THEMES.length + ofType('theme').filter(c => ownedIds.has(c.id)).length, BASE_THEMES.length + ofType('theme').length],
        border: [ofType('border').filter(c => ownedIds.has(c.id)).length, ofType('border').length],
        frame: [ofType('frame').filter(c => ownedIds.has(c.id)).length, ofType('frame').length],
        icon: [ofType('icon').filter(c => ownedIds.has(c.id)).length, ofType('icon').length],
        avatar: [ofType('avatar').filter(c => ownedIds.has(c.id)).length, ofType('avatar').length]
      };
      document.getElementById('invTabs').innerHTML = INV_TABS
        .map(t => `<button type="button" class="inv-tab${t.id === invTab ? ' active' : ''}" data-invtab="${t.id}">${t.label}${counts[t.id] ? `<small>${counts[t.id][0]}/${counts[t.id][1]}</small>` : ''}</button>`).join('');
      const list = document.getElementById('invList');
      const countLine = ([have, all]) => `<div class="inv-count"><span>Collected <b>${have} / ${all}</b></span><span class="bar"><i style="width:${all ? have / all * 100 : 0}%"></i></span>` +
        `<button type="button" class="inv-lock-toggle${showLocked ? '' : ' off'}" data-toggle-locked title="${showLocked ? 'Hide' : 'Show'} items you don't own yet">🔒 ${showLocked ? 'Hide locked' : 'Show locked'}</button></div>`;
      const RAR = { basic: 'Basic', refined: 'Refined', fancy: 'Fancy', animated: 'Animated', animatedplus: 'Animated+' };
      const rarTag = c => (c.id && c.rarity ? `<small class="rar rar-${c.rarity}">${RAR[c.rarity]}</small>` : '') + (rentedIds.has(c.id) ? '<small class="inv-trial">⏳ Trial</small>' : '');
      // Reihenfolge (Nutzerdesign 2026-10-10): oben NUR der laufende Monatspass,
      // danach nach Seltenheit absteigend (aeltere Pass-Items rutschen in ihre
      // Stufe). In jeder Stufe erst Besessenes, dann Fehlendes. Fehlendes kann
      // per Knopf ausgeblendet werden (gemerkt in localStorage).
      const RANK_ORDER = ['animatedplus', 'animated', 'fancy', 'refined', 'basic'];
      const nowD = new Date();
      const curMonth = `${nowD.getFullYear()}-${String(nowD.getMonth() + 1).padStart(2, '0')}`;
      const isOwned = c => !c.id || usableIds.has(c.id);
      const sections = (items, cell, basicExtras = []) => {
        const vis = c => showLocked || isOwned(c);
        const byOwn = list => [...list.filter(isOwned), ...list.filter(c => !isOwned(c))].filter(vis);
        const block = (title, list) => list.length ? `<div class="inv-sub">${title}</div><div class="inv-grid">${list.map(cell).join('')}</div>` : '';
        const inCurPass = c => !!c.passMonth && curMonth >= c.passMonth && curMonth <= (c.passUntil || c.passMonth);
        const cur = items.filter(inCurPass);
        const rest = items.filter(c => !inCurPass(c));
        return block('Monthly Pass', byOwn(cur)) + RANK_ORDER.map(r => block(RAR[r],
          r === 'basic' ? [...basicExtras, ...byOwn(rest.filter(c => (c.rarity || 'basic') === 'basic'))] : byOwn(rest.filter(c => c.rarity === r))
        )).join('');
      };
      const lockAttr = c => `class="inv-item locked" title="Locked - ${esc(c.source || 'not collected yet')}" aria-disabled="true"`;
      if (invTab === 'border') {
        const cell = c => {
          const has = !c.id || usableIds.has(c.id);
          return `<div ${has ? `class="inv-item${(c.id || 'none') === editState.border ? ' equipped' : ''}" data-equip="${c.id || 'none'}"` : lockAttr(c)}>
            <span class="cos-border cos-${c.id || 'none'}"><span class="cos-fill"></span></span>${esc(c.name)}${rarTag(c)}
          </div>`;
        };
        list.innerHTML = countLine(counts.border) + sections(ofType('border'), cell, [{ id: null, name: 'Default' }]);
      } else if (invTab === 'frame') {
        const sel = owned.find(c => c.id === editState.frame);
        const cell = c => {
          const has = !c.id || usableIds.has(c.id);
          return `<div ${has ? `class="inv-item${(c.id || 'none') === editState.frame ? ' equipped' : ''}" data-frame="${c.id || 'none'}"` : lockAttr(c)}>
            ${c.id ? `<span class="mini-frame mini-frame-${c.id}"></span>` : '<span class="mini-frame mini-none"></span>'}${esc(c.name)}${rarTag(c)}
          </div>`;
        };
        list.innerHTML = countLine(counts.frame) + sections(ofType('frame'), cell, [{ id: null, name: 'No frame' }]) +
          (sel && sel.hasBackground
            ? `<label class="inv-toggle"><input type="checkbox" id="frameBgToggle"${editState.frameBg ? ' checked' : ''}> Show profile background</label>`
            : '');
      } else if (invTab === 'avatar') {
        // Profilbild (v6.1.0): wie das App-Icon sofort aktiv; sehen auch Freunde
        const active = (S() && S().equipped && S().equipped.avatar) || null;
        const cell = c => {
          const has = !c.id || usableIds.has(c.id);
          return `<div ${has ? `class="inv-item${(c.id || null) === active ? ' equipped' : ''}" data-avatar="${c.id || 'none'}"` : lockAttr(c)}>
            <img class="mini-app-icon mini-avatar" src="${c.id ? `avatars/${c.id}.svg` : 'avatar-placeholder.svg'}" alt="">${esc(c.name)}${rarTag(c)}
          </div>`;
        };
        list.innerHTML = countLine(counts.avatar) + sections(ofType('avatar'), cell, [{ id: null, name: 'Default' }]) +
          (ofType('avatar').length ? '' : '<p class="inv-note">Profile pictures are coming to the shop soon.</p>');
      } else if (invTab === 'icon') {
        // App-Icon (v5.28.0): wie Themes persoenlich und sofort aktiv -
        // Taskleiste + Tray wechseln live, nicht Teil von Speichern/Abbrechen
        const active = (S() && S().equipped && S().equipped.icon) || 'icon-base-classic';
        const cell = c => {
          const has = usableIds.has(c.id);
          return `<div ${has ? `class="inv-item${c.id === active ? ' equipped' : ''}" data-app-icon="${c.id}"` : lockAttr(c)}>
            <img class="mini-app-icon" src="app-icons/${c.id}.png" alt="">${esc(c.name)}${rarTag(c)}
          </div>`;
        };
        list.innerHTML = countLine(counts.icon) + sections(ofType('icon'), cell) +
          '<p class="inv-note">Changes your app icon when you save - window, tray, taskbar and your desktop / start menu shortcut.</p>';
      } else if (invTab === 'theme') {
        // Themes: Vorschau sofort, gespeichert erst mit Save (v6.7.2)
        const passThemes = ofType('theme');
        const active = editState ? editState.theme : currentThemeKey();
        const item = c => {
          const has = !c.id || usableIds.has(c.id);
          return `<div ${has ? `class="inv-item${c.themeKey === active ? ' equipped' : ''}" data-theme-key="${c.themeKey}"` : lockAttr(c)}>
            ${c.c ? `<span class="mini-theme" style="background:conic-gradient(${c.c[0]} 0 50%, ${c.c[1]} 50% 75%, ${c.c[2]} 75%);border:1px solid ${c.c[1]}"></span>` : `<span class="mini-theme mini-theme-${c.themeKey}"></span>`}${esc(c.name)}${rarTag(c.id ? c : { id: 'base', rarity: 'basic' })}
          </div>`;
        };
        list.innerHTML = countLine(counts.theme) +
          sections(passThemes, item, BASE_THEMES) +
          '<p class="inv-note">Only you see your theme.</p>';
      } else if (invTab === 'sticker') {
        // Sticker aus dem Album aufs Profil ziehen (beliebig oft). Set-Umschalter
        // (v6.5.0, Nutzer): Pfeile blaettern, Klick auf den Namen zeigt alle Sets -
        // bleibt auch bei vielen Sets kompakt; das gewaehlte Set wird gemerkt.
        const cols = (S() && S().stickers) || {};
        const sets = Object.entries(window.STICKER_SETS || { base: window.STICKERS });
        if (!sets.some(([id]) => id === invStickerSet)) invStickerSet = sets[0][0];
        const order = ['anim', 'holo', 'uncommon', 'common'];
        const setName = (id, L) => id === 'base' ? 'Base Set' : (L.name || id);
        const haveOf = (id, L) => (L.SET || []).filter(s => (cols[id] || {})[s.n]).length;
        const L = window.STICKER_SETS ? window.STICKER_SETS[invStickerSet] : window.STICKERS;
        const col = cols[invStickerSet] || {};
        const all = L.SET || [];
        const have = all.filter(s => col[s.n]);
        const cell = s => col[s.n]
          ? `<div class="inv-item" data-sticker="${s.n}" data-set="${invStickerSet}" title="Drag onto your profile"><div class="inv-sticker">${L.square(s)}</div>${esc(s.name)}</div>`
          : `<div class="inv-item locked" title="Not in your album yet" aria-disabled="true"><div class="inv-sticker" style="display:grid;place-items:center;border:1px dashed var(--border);border-radius:10px">?</div>#${String(s.n).padStart(3, '0')}</div>`;
        const vis = s => showLocked || col[s.n];
        const switcher = `<div class="set-switch">
            <button type="button" class="set-nav" data-setnav="-1" aria-label="Previous set"${sets.length < 2 ? ' disabled' : ''}>‹</button>
            <button type="button" class="set-cur${setMenuOpen ? ' open' : ''}" data-setmenu title="All sets">${L.special ? '<i>★</i>' : ''}<b>${esc(setName(invStickerSet, L))}</b><em>▾</em></button>
            <button type="button" class="set-nav" data-setnav="1" aria-label="Next set"${sets.length < 2 ? ' disabled' : ''}>›</button>
            ${setMenuOpen ? `<div class="set-menu">${sets.map(([id, X]) => `<button type="button" class="${id === invStickerSet ? 'on' : ''}" data-setpick="${id}">${X.special ? '<i>★</i>' : ''}<b>${esc(setName(id, X))}</b><span>${haveOf(id, X)}/${(X.SET || []).length}</span></button>`).join('')}</div>` : ''}
          </div>`;
        list.innerHTML = switcher + countLine([have.length, all.length]) +
          (have.length || showLocked ? (() => {
            // Full Arts (v6.6.0): nur eigene, nie leere Plaetze (geheim)
            const fas = all.filter(s => (((S() && S().fullArts) || {})[invStickerSet] || {})[s.n]);
            return fas.length ? `<div class="inv-sub">Full Art</div><div class="inv-grid">${fas.map(s => `<div class="inv-item" data-sticker="${s.n}" data-set="${invStickerSet}" data-fa="1" title="Drag onto your profile"><div class="inv-sticker">${window.STICKER_FA.square(L, s)}</div>${esc(s.name)}</div>`).join('')}</div>` : '';
          })() + order.map(r => {
            const items = all.filter(s => s.r === r && vis(s));
            return items.length ? `<div class="inv-sub">${window.STICKERS.RL[r]}</div><div class="inv-grid">${items.map(cell).join('')}</div>` : '';
          }).join('') : `<p class="inv-empty">No stickers from this set yet - open boosters in your <a href="album.html">Album</a>.</p>`) +
          '<p class="inv-note">Drag a sticker onto your profile. You can place the same sticker more than once.</p>';
      }
    }

    // Sticker aus dem Inventar aufs Profil ziehen (gleiche Logik wie neue Widgets)
    document.getElementById('invList').addEventListener('pointerdown', e => {
      const item = e.target.closest('[data-sticker]');
      if (!item || !editState) return;
      e.preventDefault();
      const n = Number(item.dataset.sticker), set = item.dataset.set || 'base', fa = item.dataset.fa ? true : undefined;
      const [w, h] = WIDGETS.sticker.sizes[0];
      const ghost = document.createElement('div');
      ghost.className = 'widget ghost';
      ghost.innerHTML = WIDGETS.sticker.render({ id: '_ghost', type: 'sticker', w, h, config: { set, n, fa } });
      drag = { mode: 'new', type: 'sticker', w, h, ghost, ok: false, next: null, config: { set, n, fa } };
      chip.textContent = `Sticker · ${w}×${h}`;
      chip.style.display = 'block';
      moveNew(e);
    });

    document.getElementById('invList').addEventListener('click', e => {
      const nav = e.target.closest('[data-setnav]'), menu = e.target.closest('[data-setmenu]'), pick = e.target.closest('[data-setpick]');
      if (nav || menu || pick) {
        const ids = Object.keys(window.STICKER_SETS || { base: 1 });
        if (nav) invStickerSet = ids[(ids.indexOf(invStickerSet) + Number(nav.dataset.setnav) + ids.length) % ids.length];
        if (pick) invStickerSet = pick.dataset.setpick;
        setMenuOpen = menu ? !setMenuOpen : false;
        try { localStorage.setItem('ttp_inv_sticker_set', invStickerSet); } catch (err) {}
        renderPanels();
        return;
      }
      if (!e.target.closest('[data-toggle-locked]')) return;
      showLocked = !showLocked;
      renderPanels();
    });
    document.getElementById('invTabs').addEventListener('click', e => {
      const t = e.target.closest('[data-invtab]');
      if (!t) return;
      invTab = t.dataset.invtab;
      renderPanels();
    });
    function currentThemeKey() {
      try { return localStorage.getItem('ttp_theme') || 'classic'; } catch (e) { return 'classic'; }
    }
    document.getElementById('invList').addEventListener('click', e => {
      const b = e.target.closest('[data-equip]');
      const f = e.target.closest('[data-frame]');
      const t = e.target.closest('[data-theme-key]');
      const av = e.target.closest('[data-avatar]');
      if (!editState) return;
      if (av) {
        const id = av.dataset.avatar === 'none' ? null : av.dataset.avatar;
        if (S()) S().equipped = { ...(S().equipped || {}), avatar: id };
        markDirty(true);
        render();
        return;
      }
      const ic = e.target.closest('[data-app-icon]');
      if (ic) {
        const id = ic.dataset.appIcon;
        if (S()) S().equipped = { ...(S().equipped || {}), icon: id === 'icon-base-classic' ? null : id };
        markDirty(true);
        renderPanels();
        return;
      }
      if (b) { editState.border = b.dataset.equip; markDirty(true); render(); }
      if (f) { editState.frame = f.dataset.frame; markDirty(true); render(); }
      if (t) {
        editState.theme = t.dataset.themeKey;
        showTheme(editState.theme);
        markDirty(true);
        renderPanels();
      }
    });
    document.getElementById('invList').addEventListener('change', e => {
      if (e.target.id === 'frameBgToggle') { editState.frameBg = e.target.checked; markDirty(true); applyFrame(); }
    });

    // ===== Profil-Rahmen um die Widget-Flaeche =====
    // Sichtbar fuer alle (anders als das Theme). Die Deko baut cosmetics-fx.js
    // (TTPCos.decorateFrame); fancy Rahmen spielen beim Oeffnen einmal ihr Intro.
    let introPlayed = false;
    let introUntil = 0; // Intro-Klasse ueberlebt Neu-Renders (Daten laden nach)
    function applyFrame() {
      const wrap = document.querySelector('.canvas-wrap');
      const eq = (S() && S().equipped) || {};
      const frameId = editState ? (editState.frame === 'none' ? null : editState.frame) : eq.frame;
      const bgOn = editState ? editState.frameBg : eq.frameBg !== false;
      const cos = frameId && S() ? S().owned.find(c => c.id === frameId) : null;
      wrap.querySelectorAll(':scope > .pframe-bg').forEach(n => n.remove());
      wrap.className = 'canvas-wrap' + (cos ? ` pframe pframe-${cos.id}` : '') + (Date.now() < introUntil ? ' intro' : '');
      const decoId = cos ? cos.id : '';
      if (window.TTPCos && (wrap.dataset.pfDeco !== decoId || (decoId && !wrap.querySelector(':scope > .pf-deco')))) {
        wrap.dataset.pfDeco = decoId;
        window.TTPCos.decorateFrame(wrap, decoId);
      }
      if (!cos) return;
      if (cos.hasBackground && bgOn) {
        const bg = document.createElement('div');
        bg.className = `pframe-bg bg-${cos.id}`;
        wrap.prepend(bg);
      }
      if (!introPlayed && !editState) {
        introPlayed = true;
        introUntil = Date.now() + 3000;
        wrap.classList.add('intro');
        setTimeout(() => wrap.classList.remove('intro'), 3000);
      }
    }

    // ===== Modus wechseln / Speichern =====
    async function loadChampionList() {
      if (data.champions.length) return;
      try {
        const res = await fetch('data/champions.json');
        const list = await res.json();
        data.champions = list.map(c => ({ id: c.id, name: c.name })).sort((a, b) => a.name.localeCompare(b.name));
      } catch (e) {}
    }

    async function enterEdit() {
      showLocked = false;
      editState = {
        snapshot: JSON.parse(JSON.stringify(layout)),
        border: (S() && S().equipped && S().equipped.border) || 'none',
        frame: (S() && S().equipped && S().equipped.frame) || 'none',
        frameBg: !S() || !S().equipped || S().equipped.frameBg !== false,
        statsPuuid: S() && S().statsSummoner ? S().statsSummoner.puuid : null,
        statsBefore: S() && S().statsSummoner ? S().statsSummoner.puuid : null,
        // v6.7.2: Profilbild, App-Icon und Theme sind nur Vorschau bis Save
        eqBefore: JSON.parse(JSON.stringify((S() && S().equipped) || {})),
        theme: currentThemeKey(),
        themeBefore: currentThemeKey()
      };
      document.body.classList.add('editing');
      markDirty(false);
      render();
      await loadChampionList();
      if (editState && !drag) render();
    }
    function leaveEdit() {
      editState = null;
      document.body.classList.remove('editing');
      markDirty();
      render();
    }
    // Theme anzeigen (Vorschau im Editor bzw. zurueck auf das gespeicherte)
    function showTheme(key) {
      if (key === 'classic') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', key);
    }
    // "Unsaved changes": grob - sobald im Editor etwas angefasst wurde
    function markDirty(on = false) {
      const el = document.getElementById('editDirty');
      if (!el) return;
      el.classList.toggle('on', on);
      el.textContent = on ? '● Unsaved changes' : 'Nothing changed yet';
    }

    document.getElementById('editToggle').addEventListener('click', enterEdit);
    document.getElementById('addList').addEventListener('change', e => {
      const sel = e.target.closest('#statsSrc');
      if (!sel || !editState) return;
      editState.statsPuuid = sel.value;
      markDirty(true);
      loadStatsFor(sel.value);
    });
    document.getElementById('cancelBtn').addEventListener('click', () => {
      layout = editState.snapshot;
      // Vorschau von Profilbild/App-Icon/Theme zuruecknehmen
      if (S()) S().equipped = editState.eqBefore;
      showTheme(editState.themeBefore);
      const back = editState.statsPuuid !== editState.statsBefore ? editState.statsBefore : null;
      leaveEdit();
      if (back) loadStatsFor(back);
    });
    // Stats eines anderen eigenen Summoners laden (Vorschau im Editor bzw.
    // nach Abbrechen zurueck) - das Layout bleibt dabei unangetastet
    async function loadStatsFor(puuid) {
      try {
        const res = await fetch(`/api/profile-stats?${new URLSearchParams({ preview: puuid })}`);
        const stats = await parseApiResponse(res);
        if (!res.ok) throw new Error(stats.error || 'Unknown error');
        const keep = data.stats ? data.stats.profileLayout : null;
        data.stats = { ...stats, profileLayout: keep };
        data.rank = null;
        render();
        const r = await fetch(`/api/current-rank?${new URLSearchParams({ puuid })}`);
        const rk = await parseApiResponse(r);
        if (r.ok) data.rank = rk.current || null;
        if (!drag) render();
      } catch (e) { statusEl.textContent = `Could not load stats: ${e.message}`; }
    }
    document.getElementById('resetLayoutBtn').addEventListener('click', () => {
      const bio = layout.find(w => w.type === 'bio');
      layout = DEFAULT_LAYOUT.map(w => (w.type === 'bio' && bio ? { ...w, config: bio.config } : { ...w }));
      markDirty(true);
      render();
    });
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/profile/layout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ layout })
        });
        const out = await parseApiResponse(res);
        if (!res.ok) throw new Error(out.error || 'Unknown error');
        if (editState.statsPuuid && editState.statsPuuid !== editState.statsBefore) {
          const rs = await fetch('/api/profile/stats-summoner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ puuid: editState.statsPuuid }) });
          const os = await parseApiResponse(rs);
          if (!rs.ok) throw new Error(os.error || 'Unknown error');
        }
        const eq = editState.eqBefore || {};
        const cur = (S() && S().equipped) || {};
        const changes = [
          ['border', editState.border === 'none' ? null : editState.border, eq.border || null],
          ['frame', editState.frame === 'none' ? null : editState.frame, eq.frame || null],
          ['frameBg', editState.frameBg ? 'on' : 'off', eq.frameBg === false ? 'off' : 'on'],
          ['avatar', cur.avatar || null, eq.avatar || null],
          ['icon', cur.icon || null, eq.icon || null]
        ].filter(([, now, before]) => now !== before);
        for (const [type, id] of changes) {
          const r2 = await fetch('/api/cosmetics/equip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type, id })
          });
          const o2 = await parseApiResponse(r2);
          if (!r2.ok) throw new Error(o2.error || 'Unknown error');
          data.stats.equipped = o2.equipped;
          if (type === 'avatar') { try { if (id) localStorage.setItem('ttp_avatar', id); else localStorage.removeItem('ttp_avatar'); } catch (err) {} }
          if (type === 'icon' && window.ttpMain && window.ttpMain.applyAppIcon) window.ttpMain.applyAppIcon();
        }
        if (editState.theme !== editState.themeBefore) {
          try { localStorage.setItem('ttp_theme', editState.theme); } catch (err) {}
        }
        statusEl.textContent = '';
        leaveEdit();
        if (window.ttpPublishProfile) window.ttpPublishProfile(true);
      } catch (err) {
        statusEl.textContent = `Could not save: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });

    // ===== Laden =====
    // Laufende Challenge des Freundes (v6.3.0): Pool, Rollen, Rang-Weg, Trophies
    function renderVisitChallenge(snap) {
      const el = document.getElementById('visitChallenge');
      const c = snap.challenge;
      const RN = { TOP: 'Top', JUNGLE: 'Jungle', MIDDLE: 'Mid', BOTTOM: 'Bot', UTILITY: 'Support' };
      const LV = { easy: 'Easy', normal: 'Normal', hard: 'Hard', very_hard: 'Very Hard', majestic: 'Majestic' };
      const rk = r => (r && r.tier ? `${r.tier.charAt(0) + r.tier.slice(1).toLowerCase()}${['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(r.tier) ? '' : ` ${r.rank || r.division || ''}`}${r.leaguePoints !== undefined || r.lp !== undefined ? ` · ${r.leaguePoints !== undefined ? r.leaguePoints : r.lp} LP` : ''}` : '–');
      el.hidden = false;
      if (!c) { el.innerHTML = '<span class="vc-none">No challenge running right now.</span>'; return; }
      const days = Math.max(1, Math.ceil((Date.now() - new Date(c.since).getTime()) / 86400000));
      el.innerHTML = `<div class="vc-head"><b>Current challenge</b><span>${RN[c.mainRole] || '–'} / ${RN[c.secondRole] || '–'} · ${LV[c.level] || '–'} · day ${days}</span></div>
        <div class="vc-row">
          <div class="vc-champs">${c.champions.map(ch => `<span class="vc-champ" title="${esc(ch.name)}"><img src="${champIcon(ch.id)}" alt="">${esc(ch.name)}</span>`).join('')}</div>
          <div class="vc-rank"><small>Start</small>${rk(c.startRank)}<i>→</i><small>Now</small>${rk(snap.rank)}<i>→</i><small>Goal</small>${rk(c.lpGoal)}</div>
          <div class="vc-trophies">🏆 ${c.trophies ? `${c.trophies.unlocked} / ${c.trophies.total}` : '–'}</div>
        </div>`;
    }

    // Booster verschenken (v6.6.0): aus den eigenen ungeoeffneten Boostern,
    // optional mit kurzer Nachricht. Der Freund bekommt sie beim naechsten Oeffnen der App.
    async function openGiftDialog(toId, toName) {
      if (document.querySelector('.gift-ov')) return;
      let album = null;
      try { album = await (await fetch('/api/album')).json(); } catch (e) {}
      const sets = ((album && album.sets) || []).filter(s => s.owned > 0);
      let pick = sets[0] ? sets[0].id : null, qty = 1, busy = false;
      const ov = document.createElement('div'); ov.className = 'gift-ov';
      const draw = (msg = '', ok = false) => {
        const cur = sets.find(s => s.id === pick);
        const max = cur ? Math.min(10, cur.owned) : 1;
        qty = Math.min(qty, max);
        const keepText = ov.querySelector('#giftMsg') ? ov.querySelector('#giftMsg').value : '';
        ov.innerHTML = `<div class="gift-box" role="dialog" aria-label="Gift a booster">
          <button type="button" class="gift-x" aria-label="Close">✕</button>
          <h3>🎁 Gift a booster</h3>
          <p class="gift-to">to <b>${esc(toName)}</b></p>
          ${ok ? `<p class="gift-done">${msg}</p><button type="button" class="gift-send" data-close>Done</button>` : sets.length ? `
          <div class="gift-sets">${sets.map(s => `<button type="button" class="gift-set${s.id === pick ? ' on' : ''}${s.special ? ' special' : ''}" data-pick="${s.id}"><b>${esc(s.name)}</b><span>${s.owned} unopened</span></button>`).join('')}</div>
          <div class="gift-qty"><span>Boosters</span><span class="dk-ctrl"><button type="button" data-q="-1"${qty <= 1 ? ' disabled' : ''}>−</button><b>${qty}</b><button type="button" data-q="1"${qty >= max ? ' disabled' : ''}>+</button></span></div>
          <input id="giftMsg" class="gift-msg" maxlength="80" placeholder="Add a message (optional)" value="${esc(keepText)}">
          <p class="gift-err">${msg}</p>
          <button type="button" class="gift-send" data-send${busy ? ' disabled' : ''}>Send ${qty} booster${qty > 1 ? 's' : ''}</button>` : `<p class="gift-err" style="color:var(--text-dim)">You have no unopened boosters to give.<br>Get some in the <a href="shop.html">Shop</a> first.</p>`}
        </div>`;
      };
      draw();
      document.body.appendChild(ov);
      requestAnimationFrame(() => ov.classList.add('on'));
      const close = () => { ov.classList.remove('on'); setTimeout(() => ov.remove(), 200); };
      ov.addEventListener('click', async e => {
        if (e.target === ov || e.target.closest('.gift-x') || e.target.closest('[data-close]')) { close(); return; }
        const p = e.target.closest('[data-pick]'), q = e.target.closest('[data-q]'), send = e.target.closest('[data-send]');
        if (p) { pick = p.dataset.pick; draw(); return; }
        if (q) { qty += Number(q.dataset.q); draw(); return; }
        if (!send || busy) return;
        busy = true;
        const message = ov.querySelector('#giftMsg').value;
        send.disabled = true; send.textContent = 'Sending …';
        let r;
        try {
          const res = await fetch('/api/gifts/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: toId, set: pick, qty, message }) });
          r = await res.json(); if (!res.ok) r.ok = false;
        } catch (err) { r = { ok: false, error: 'Could not reach the app server.' }; }
        busy = false;
        if (r.ok) { const s = sets.find(x => x.id === pick); draw(`Sent ${qty} ${esc(s.name)} booster${qty > 1 ? 's' : ''} to <b>${esc(toName)}</b>.<br>They get ${qty > 1 ? 'them' : 'it'} the next time they open the app.`, true); }
        else draw(esc(r.error || 'Something went wrong.'));
      });
    }

    async function loadVisit() {
      document.getElementById('editToggle').hidden = true;
      document.documentElement.setAttribute('data-visiting', '1');
      const banner = document.getElementById('visitBanner');
      banner.hidden = false;
      banner.innerHTML = '<a href="profile.html">← My profile</a><span>Loading profile …</span>';
      try {
        const res = await fetch(`/api/friends/profile?${new URLSearchParams({ id: VISIT })}`);
        const snap = await parseApiResponse(res);
        if (!res.ok) throw new Error(snap.error || 'Unknown error');
        visit = snap;
        // Fehlende Felder (z.B. aeltere Momentaufnahme) nicht als Absturz enden lassen
        data.stats = snap.stats ? { challenges: {}, ...snap.stats } : null;
        data.rank = snap.rank || null;
        if (data.stats && Array.isArray(data.stats.profileLayout) && data.stats.profileLayout.length) {
          layout = data.stats.profileLayout.filter(w => WIDGETS[w.type]);
          if (!layout.some(w => w.type === 'identity')) layout.unshift({ ...DEFAULT_LAYOUT[0] });
        }
        // Die ganze Seite im Theme des Besitzers (nur fuer diesen Besuch)
        if (snap.theme && snap.theme !== 'classic') document.documentElement.setAttribute('data-theme', snap.theme);
        else document.documentElement.removeAttribute('data-theme');
        const when = snap.updatedAt ? new Date(snap.updatedAt).toLocaleString([], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
        banner.innerHTML = `<a href="profile.html">← My profile</a><span>Visiting <b>${esc(snap.username || '')}</b>${snap.summoner ? ` · stats of ${esc(snap.summoner)}` : ''}${when ? ` · updated ${when}` : ''}</span><button type="button" class="gift-btn" id="giftBtn">🎁 Gift a booster</button><a class="gift-btn" href="album.html?trade=${encodeURIComponent(VISIT)}">⇄ Trade stickers</a>`;
        document.getElementById('giftBtn').addEventListener('click', () => openGiftDialog(VISIT, snap.username || 'your friend'));
        document.title = `${snap.username || 'Profile'} – Three-Trick-Pony`;
        renderVisitChallenge(snap);
        if (layout.some(w => w.type === 'favChamp')) await loadChampionList();
      } catch (e) {
        banner.innerHTML = `<a href="profile.html">← My profile</a><span>${esc(e.message)}</span>`;
      }
      render();
    }

    async function loadProfile() {
      if (VISIT) { await loadVisit(); return; }
      render();
      // Stats-Summoner bestimmt der Server (Wahl im Profil-Editor, v6.7.1)
      let puuid = '';
      try {
        const res = await fetch('/api/profile-stats');
        const stats = await parseApiResponse(res);
        if (!res.ok) throw new Error(stats.error || 'Unknown error');
        data.stats = stats;
        puuid = stats.statsSummoner ? stats.statsSummoner.puuid : '';
        if (!puuid) statusEl.textContent = 'No summoner linked yet - link one via the menu top right.';
        if (Array.isArray(stats.profileLayout) && stats.profileLayout.length) {
          layout = stats.profileLayout.filter(w => WIDGETS[w.type]);
          if (!layout.some(w => w.type === 'identity')) layout.unshift({ ...DEFAULT_LAYOUT[0] });
        }
        if (layout.some(w => w.type === 'favChamp')) await loadChampionList();
      } catch (e) {
        statusEl.textContent = `Could not load profile stats: ${e.message}`;
      }
      if (!drag) render();

      if (puuid) {
        try {
          const res = await fetch(`/api/current-rank?${new URLSearchParams({ puuid })}`);
          const r = await parseApiResponse(res);
          if (res.ok) data.rank = r.current || null;
        } catch (e) {}
        if (!drag) render();
      }
    }
    loadProfile();

    document.getElementById('settingsGearBtn').addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });
    document.getElementById('quitBtn').addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });
  </script>
</body>
