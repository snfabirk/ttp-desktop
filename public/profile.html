<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile – Three-Trick-Pony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cosmetics.css">
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="update-indicator.js"></script>
  <script src="changelog.js"></script>
  <style>
    /* Spielerprofil (v5.5.0): eine Widget-Flaeche, die genau so aussieht, wie
       Freunde sie spaeter sehen. "Edit profile" oeffnet den Bearbeitungsmodus
       (Nutzerdesign 2026-10-09): links Werkzeuge (Widgets hinzufuegen,
       Speichern/Abbrechen), rechts das Inventar (Borders, spaeter Backgrounds,
       Sticker, Themes). Widgets rasten in ein 6-Spalten-Raster ein und haben
       je Typ erlaubte Groessen (wie iPhone-Widgets) - je groesser, desto mehr
       Infos. Layout liegt in progression.json (profileLayout). */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .site-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .content {
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      padding: 0 30px;
      margin: 12px 0 24px;
    }

    /* ----- Flaeche + Raster ----- */
    .canvas-wrap {
      container-type: inline-size;
    }
    .canvas {
      --gap: 12px;
      --cell: calc((100cqw - 5 * var(--gap)) / 6);
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-rows: var(--cell);
      gap: var(--gap);
    }
    .slot {
      border: 1px dashed color-mix(in srgb, var(--text-faint) 55%, transparent);
      border-radius: 10px;
      pointer-events: none;
    }
    .widget {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      background: var(--panel-bg);
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    .w-body {
      height: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: Georgia, serif;
    }
    .w-title {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .w-center { align-items: center; text-align: center; }
    .w-big {
      color: var(--text);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.9rem;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .w-label {
      color: var(--text-faint);
      font-size: 0.66rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .w-stats {
      display: flex;
      gap: 8px;
    }
    .w-stat {
      flex: 1;
      min-width: 0;
      padding: 8px 4px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--input-bg) 55%, transparent);
      text-align: center;
    }
    .w-stat .v {
      display: block;
      color: var(--text);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .w-stat .l {
      display: block;
      margin-top: 2px;
      color: var(--text-faint);
      font-size: 0.6rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pos { color: var(--green) !important; }
    .neg { color: var(--red) !important; }

    /* Identitaet (feste 6x1) */
    /* Nutzerwunsch: Profilbild immer mittig im ERSTEN Rasterquadrat, Name
       beginnt immer im ZWEITEN - so verschiebt sich nichts, egal wie gross
       der ausgeruestete Rahmen ist. Alle Borders haben dieselbe Bildgroesse;
       ueberstehende Rahmen duerfen ueber den Widget-Rand hinausragen. */
    .identity {
      display: grid;
      grid-template-columns: var(--cell) minmax(0, 1fr);
      column-gap: var(--gap);
      align-items: center;
      padding: 0 20px 0 0;
    }
    .identity > .id-frame { justify-self: center; }
    .widget:has(> .identity) { overflow: visible; z-index: 2; }
    .id-frame {
      width: calc(var(--cell) * 0.7);
      height: calc(var(--cell) * 0.7);
      max-width: 110px;
      max-height: 110px;
      --cos-width: 4px;
    }
    .identity .id-frame { margin: 0 !important; }
    .id-frame img { opacity: 0; transition: opacity 0.15s ease; }
    .id-frame img.loaded { opacity: 1; }
    .id-main { flex: 1; min-width: 0; }
    .id-top { display: flex; align-items: baseline; gap: 12px; }
    .id-name {
      min-width: 0;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coin-pill, .level-pill {
      flex-shrink: 0;
      padding: 2px 10px;
      border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent);
      border-radius: 11px;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.82rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .coin-pill { margin-left: auto; }
    .id-since {
      color: var(--text-faint);
      font-size: 0.78rem;
      font-style: italic;
      margin: 2px 0 8px;
      min-height: 1.2em;
    }
    .level-line { display: flex; align-items: center; gap: 12px; }
    .xp-bar {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--text-faint) 18%, transparent);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 70%, transparent), var(--gold));
    }
    .xp-text {
      flex-shrink: 0;
      color: var(--text-dim);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Champion-Widgets */
    .champ-splash {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
    }
    .champ-splash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(var(--bg-rgb), 0.95) 0%, rgba(var(--bg-rgb), 0.35) 60%, rgba(var(--bg-rgb), 0.1) 100%);
    }
    .champ-over {
      position: relative;
      z-index: 1;
      margin-top: auto;
    }
    .champ-over .n {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.95rem;
    }
    .champ-over .s { color: var(--text-dim); font-size: 0.75rem; }
    .champ-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
      font-size: 0.85rem;
    }
    .champ-row:last-child { border-bottom: none; }
    .champ-row img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); }
    .champ-row .name { flex: 1; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .champ-row .g { color: var(--text-dim); font-size: 0.75rem; }

    /* Die Riot-Embleme haben sehr viel transparenten Rand -> Ausschnitt. */
    .emblem-box { overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .emblem-box img { width: 100%; height: 100%; object-fit: contain; transform: scale(3.4); }
    .emblem-box.big { width: 62%; max-width: 92px; aspect-ratio: 1; }
    .emblem-box.small { width: 72px; height: 72px; }
    .rank-row { display: flex; align-items: center; gap: 12px; }
    .rank-text { color: var(--text); font-family: 'Cinzel', Georgia, serif; font-size: 1.1rem; }
    .bio-text {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow: hidden;
    }
    .bio-text.empty { color: var(--text-faint); font-style: italic; }
    .bio-edit {
      width: 100%;
      flex: 1;
      box-sizing: border-box;
      resize: none;
      background: color-mix(in srgb, var(--input-bg) 70%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 0.88rem;
      padding: 6px 8px;
    }

    /* ----- Bearbeiten-Knopf unter der Flaeche ----- */
    .edit-toggle {
      display: block;
      margin: 14px auto 0;
      padding: 4px 8px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.9rem;
      font-style: italic;
      cursor: pointer;
    }
    .edit-toggle:hover { color: var(--gold); }
    body.editing .edit-toggle { display: none; }
    /* Im Bearbeitungsmodus passt die Flaeche immer zwischen die beiden
       Seitenleisten (je 20px Rand + 230px Breite + 20px Luft) - die Zellen
       skalieren ueber die Container-Einheiten mit. */
    body.editing .content { max-width: min(900px, calc(100vw - 540px)); padding: 0; }

    /* ----- Bearbeitungsmodus ----- */
    body.editing .widget { cursor: grab; user-select: none; }
    body.editing .widget.dragging { cursor: grabbing; opacity: 0.85; z-index: 5; border-color: var(--gold); }
    body.editing .widget.invalid { border-color: var(--red); box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 50%, transparent); }
    body.editing .widget.selected { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 45%, transparent); }
    .w-remove, .w-resize, .w-size {
      display: none;
      position: absolute;
      z-index: 3;
    }
    body.editing .w-remove, body.editing .w-resize { display: flex; }
    /* Groessen-Schild nur bei Hover/Ziehen, sonst verdeckt es Inhalt. */
    body.editing .widget:hover .w-size, body.editing .widget.dragging .w-size { display: flex; }
    .w-remove {
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--red);
      background: var(--bg);
      color: var(--red);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .w-resize {
      right: 4px;
      bottom: 4px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      border-right: 3px solid var(--gold);
      border-bottom: 3px solid var(--gold);
      border-radius: 0 0 6px 0;
      opacity: 0.8;
    }
    .w-size {
      left: 6px;
      bottom: 6px;
      padding: 0 6px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.65rem;
      line-height: 16px;
    }

    .side-panel {
      position: fixed;
      top: 90px;
      bottom: 24px;
      width: 230px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      font-family: Georgia, serif;
      transition: transform 0.22s ease, opacity 0.22s ease;
      opacity: 0;
      pointer-events: none;
    }
    .side-panel.left { left: 20px; transform: translateX(-30px); }
    .side-panel.right { right: 20px; transform: translateX(30px); }
    body.editing .side-panel { opacity: 1; transform: none; pointer-events: auto; }
    .side-panel h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .panel-scroll { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
    .panel-actions { display: flex; gap: 8px; margin-top: 12px; }
    .panel-actions button {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-save { border: 1px solid var(--gold); background: var(--gold); color: var(--bg); }
    .btn-cancel { border: 1px solid var(--border); background: transparent; color: var(--text-dim); }
    .btn-cancel:hover { color: var(--text); border-color: var(--border-hover); }
    .btn-reset {
      margin-top: 8px;
      border: none;
      background: none;
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .inv-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .inv-tab {
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .inv-tab.active { border-color: var(--gold); color: var(--gold); }
    .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .inv-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px 8px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      color: var(--text-dim);
      font-size: 0.72rem;
      text-align: center;
      cursor: pointer;
    }
    .inv-item:hover { border-color: var(--border-hover); color: var(--text); }
    .inv-item.equipped { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
    .inv-item .cos-border { width: 40px; height: 40px; }
    .inv-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .inv-sub {
      margin: 12px 0 6px;
      color: var(--text-faint);
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .inv-sub:first-child { margin-top: 0; }
    .inv-note { margin: 10px 0 0; color: var(--text-faint); font-size: 0.72rem; font-style: italic; }
    .inv-anim { display: block; color: var(--gold); font-size: 0.62rem; }
    .inv-item .mini-frame { width: 40px; height: 30px; }
    .inv-item .mini-theme { width: 34px; height: 34px; }
    .mini-frame.mini-none { border: 1px dashed var(--text-faint); }
    .inv-empty { color: var(--text-faint); font-size: 0.8rem; font-style: italic; line-height: 1.4; }

    .status {
      text-align: center;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }
    /* ----- v5.6.0: mehr Widgets, Ziehen aus der Seitenleiste ----- */
    .w-stats.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
    .identity.col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      gap: 8px;
      padding: 10px 14px;
    }
    .identity.col .id-main { width: 100%; }
    .identity.col .id-top { justify-content: center; }
    .identity.col .id-since { margin: 0 0 6px; }
    .col-coins { display: inline-block; margin-top: 8px; }
    .emblem-box.huge { width: 55%; aspect-ratio: 1; }
    .portrait-row { display: flex; gap: 8px; justify-content: space-around; }
    .portrait { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.7rem; color: var(--text-dim); min-width: 0; }
    .portrait img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); }
    .portrait.game.won img { border-color: var(--green); }
    .portrait.game.lost img { border-color: var(--red); }
    .portrait span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    .pool-strips { display: flex; height: 100%; }
    .pool-strips .strip {
      position: relative;
      flex: 1;
      background-size: cover;
      background-position: center 20%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .pool-strips .strip::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(var(--bg-rgb), 0.9), transparent 55%);
    }
    .pool-strips .strip span {
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.85rem;
    }
    .fav-select {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 6px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.78rem;
      padding: 3px 4px;
    }

    .widget.ghost {
      opacity: 0.8;
      border: 1.5px dashed var(--gold);
      pointer-events: none;
      z-index: 6;
    }
    .widget.ghost.invalid { border-color: var(--red); }
    .drag-chip {
      display: none;
      position: fixed;
      z-index: 100;
      padding: 4px 10px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 0.78rem;
      pointer-events: none;
      white-space: nowrap;
    }
    .add-group {
      margin: 10px 0 6px;
      color: var(--text-faint);
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .add-group:first-child { margin-top: 0; }
    .add-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 0.84rem;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .add-item:hover { border-color: var(--gold); }
    .add-item.disabled { opacity: 0.4; cursor: default; }
    .add-item.disabled:hover { border-color: color-mix(in srgb, var(--border) 70%, transparent); }
    .add-text { display: flex; flex-direction: column; min-width: 0; }
    .add-text small { color: var(--text-faint); font-size: 0.68rem; margin-top: 1px; }
    .mini-grid {
      flex-shrink: 0;
      display: grid;
      gap: 2px;
      width: 46px;
      justify-content: center;
    }
    .mini-grid i { background: color-mix(in srgb, var(--gold) 55%, transparent); border-radius: 2px; }
    .side-panel h3 .hint { vertical-align: 1px; }

    /* "?"-Hinweis */
    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.7rem;
      line-height: 1;
      font-style: normal;
    }
    .hint { position: relative; display: inline-flex; margin-left: 4px; cursor: help; outline: none; font-family: Georgia, serif; font-size: 0.75rem; letter-spacing: 0; font-weight: normal; }
    .hint:hover .info-icon, .hint:focus-within .info-icon { border-color: var(--gold); color: var(--gold); }
    .hint-pop {
      position: absolute;
      top: calc(100% + 8px);
      left: -10px;
      z-index: 40;
      width: 220px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      color: var(--text-dim);
      line-height: 1.45;
      text-transform: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
    }
    .hint:hover .hint-pop, .hint:focus-within .hint-pop { opacity: 1; visibility: visible; }
  </style>
</head>
<body>
  <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="Settings" aria-label="Settings">⚙</button>
  <button type="button" class="quit-btn" id="quitBtn" title="Quit completely" aria-label="Quit completely">⏻</button>
  <header class="site-header">
    <h1>League of Legends</h1>
    <p class="subtitle">Three-Trick-Pony</p>
  </header>

  <div class="content">
    <div class="canvas-wrap"><div class="canvas" id="canvas"></div></div>
    <button type="button" class="edit-toggle" id="editToggle">✎ Edit profile</button>
    <p class="status" id="status"></p>
  </div>

  <aside class="side-panel left" id="toolPanel" aria-label="Profile tools">
    <h3>Widgets <span class="hint" tabindex="0"><span class="info-icon">?</span><span class="hint-pop">Drag a widget from this list onto your profile. On the profile: drag to move, pull the corner to resize (each widget has its own sizes - bigger shows more), × removes. Empty spaces are fine.</span></span></h3>
    <div class="panel-scroll" id="addList"></div>
    <div class="panel-actions">
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="btn-save" id="saveBtn">Save</button>
    </div>
    <button type="button" class="btn-reset" id="resetLayoutBtn">Reset to default layout</button>
  </aside>

  <aside class="side-panel right" id="invPanel" aria-label="Cosmetics">
    <h3>Cosmetics</h3>
    <div class="inv-tabs" id="invTabs"></div>
    <div class="panel-scroll" id="invList"></div>
  </aside>

  <script>
    const DDRAGON_VERSION = '16.17.1';
    const COLS = 6;
    const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    const fmtNum = n => Number(n).toLocaleString('en-US');
    const fmtDate = iso => new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const esc = str => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    async function parseApiResponse(res) {
      const text = await res.text();
      try { return JSON.parse(text); } catch (e) { return { error: text || `HTTP ${res.status}` }; }
    }

    // ===== Daten =====
    const data = { account: null, stats: null, rank: null, champions: [] };

    // ===== Bausteine =====
    const RANK_ABBR = { IRON: 'Iron', BRONZE: 'Bronze', SILVER: 'Silver', GOLD: 'Gold', PLATINUM: 'Plat', EMERALD: 'Emerald', DIAMOND: 'Diamond', MASTER: 'Master', GRANDMASTER: 'GM', CHALLENGER: 'Challenger' };
    const APEX = new Set(['MASTER', 'GRANDMASTER', 'CHALLENGER']);
    const ROLE_NAMES = { TOP: 'Top', JUNGLE: 'Jungle', MIDDLE: 'Mid', BOTTOM: 'Bot', UTILITY: 'Support' };
    const emblemUrl = tier => `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${tier.toLowerCase()}.png`;
    const champIcon = id => `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/champion/${id}.png`;
    const champSplash = id => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${id}_0.jpg`;
    const tone = pct => (pct === null ? '' : pct >= 50 ? 'pos' : 'neg');
    const stat = (v, l, cls = '') => `<div class="w-stat"><span class="v ${cls}">${v}</span><span class="l">${l}</span></div>`;
    const big = (v, l, cls = '') => `<div class="w-body w-center"><div class="w-big ${cls}">${v}</div><div class="w-label">${l}</div></div>`;
    const title = t => `<div class="w-title">${t}</div>`;
    const bar = (pct, text) => `<div class="level-line"><div class="xp-bar"><div class="xp-bar-fill" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>${text ? `<span class="xp-text">${text}</span>` : ''}</div>`;
    const S = () => data.stats;
    const winrate = () => (S() && S().games ? Math.round((S().wins / S().games) * 100) : null);
    // Anzahl Stat-Kacheln je Groesse fuer die Listen-Widgets
    const statCount = w => (w.w >= 6 ? 5 : w.w >= 4 ? 4 : w.w);
    function statsWidget(name, all, w) {
      if (w.w === 1 && w.h === 1) return big(all[0].v, all[0].l, all[0].cls || '');
      const n = w.h >= 2 ? Math.min(4, all.length) : statCount(w);
      return `<div class="w-body">${title(name)}<div class="w-stats${w.h >= 2 ? ' grid2' : ''}">${all.slice(0, n).map(s => stat(s.v, s.l, s.cls || '')).join('')}</div></div>`;
    }
    function pool() {
      try { return JSON.parse(ls('ttp_selected_champs') || '[]').filter(c => c && c.id); } catch (e) { return []; }
    }

    // ===== Widget-Katalog =====
    // sizes: erlaubte [Breite, Hoehe] in Rasterzellen, erste = Standard beim
    // Hinzufuegen. Je groesser, desto mehr Infos (Nutzerdesign: wie iPhone-
    // Widgets, aber nur Groessen, die fuer das Widget Sinn ergeben).
    const WIDGETS = {
      identity: {
        group: 'Basics', name: 'Name & Level', desc: 'Always on your profile', fixed: true, sizes: [[6, 1], [4, 1], [3, 2]],
        render(w) {
          const s = S();
          const a = data.account;
          const lvl = s ? s.level : { level: 1, xpIntoLevel: 0, xpForNextLevel: 2000 };
          const border = (editState ? editState.border : (s && s.equipped && s.equipped.border)) || 'none';
          const icon = a && a.profileIconId != null ? `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/profileicon/${a.profileIconId}.png` : '';
          const col = w.h >= 2;
          return `<div class="w-body identity${col ? ' col' : ''}">
            <span class="cos-border id-frame cos-${border}"><img src="${icon}" alt="" onload="this.classList.add('loaded')"></span>
            <div class="id-main">
              <div class="id-top">
                <div class="id-name">${a ? esc(`${a.gameName}#${a.tagLine}`) : 'No summoner loaded yet'}</div>
                ${col ? '' : `<span class="coin-pill" title="Coins from the monthly pass">🪙 ${fmtNum(s ? s.coins : 0)}</span>`}
              </div>
              ${w.w >= 6 || col ? `<div class="id-since">${s && s.challenges.firstStarted ? `Pony since ${fmtDate(s.challenges.firstStarted)}` : ''}</div>` : ''}
              <div class="level-line" title="Profile level - keeps growing across all challenges">
                <span class="level-pill">Level ${lvl.level}</span>
                <div class="xp-bar"><div class="xp-bar-fill" style="width:${(lvl.xpIntoLevel / lvl.xpForNextLevel) * 100}%"></div></div>
                ${col ? '' : `<span class="xp-text">${fmtNum(lvl.xpIntoLevel)} / ${fmtNum(lvl.xpForNextLevel)} XP</span>`}
              </div>
              ${col ? `<span class="coin-pill col-coins">🪙 ${fmtNum(s ? s.coins : 0)}</span>` : ''}
            </div>
          </div>`;
        }
      },

      // ----- Stats -----
      challenges: {
        group: 'Stats', name: 'Challenges', desc: 'Started, goals, trophies', sizes: [[3, 1], [1, 1], [2, 1], [4, 1], [6, 1], [2, 2]],
        render(w) {
          const c = S() ? S().challenges : null;
          return statsWidget('Challenges', [
            { v: c ? c.started : '–', l: 'Started' },
            { v: c ? c.goalsReached : '–', l: 'Goals' },
            { v: c ? c.trophies : '–', l: 'Trophies' },
            { v: c && c.started ? `${c.bestTrophies} 🏆` : '–', l: 'Best' },
            { v: c ? c.platinum : '–', l: 'Platinum' }
          ], w);
        }
      },
      games: {
        group: 'Stats', name: 'Games', desc: 'Games, win rate, KDA, LP', sizes: [[3, 1], [1, 1], [2, 1], [4, 1], [6, 1], [2, 2]],
        render(w) {
          const d = S();
          const g = d ? d.games : 0;
          const wr = winrate();
          return statsWidget('Games', [
            { v: d ? g : '–', l: 'Games' },
            { v: wr === null ? '–' : `${wr}%`, l: 'Win rate', cls: tone(wr) },
            { v: g ? [d.kills, d.deaths, d.assists].map(n => (n / g).toFixed(1)).join('/') : '–', l: 'Avg KDA' },
            { v: d ? `+${fmtNum(d.lpGained)}` : '–', l: 'LP gained' },
            { v: d ? `${d.lpBankFills}×` : '–', l: 'LP Bank' }
          ], w);
        }
      },
      winrate: {
        group: 'Stats', name: 'Win Rate', desc: 'One big number', sizes: [[1, 1], [2, 1]],
        render(w) {
          const wr = winrate();
          if (w.w === 1) return big(wr === null ? '–' : `${wr}%`, 'Win rate', tone(wr));
          const d = S();
          return `<div class="w-body w-center"><div class="w-big ${tone(wr)}">${wr === null ? '–' : `${wr}%`}</div><div class="w-label">${d ? `${d.wins}W / ${d.games - d.wins}L` : ''} · Win rate</div></div>`;
        }
      },
      kda: {
        group: 'Stats', name: 'KDA', desc: 'Your KDA ratio', sizes: [[1, 1], [2, 1], [3, 1]],
        render(w) {
          const d = S();
          const g = d ? d.games : 0;
          const ratio = g ? ((d.kills + d.assists) / Math.max(1, d.deaths)).toFixed(2) : '–';
          if (w.w === 1) return big(ratio, 'KDA');
          const avg = n => (g ? (n / g).toFixed(1) : '–');
          if (w.w === 2) return `<div class="w-body w-center"><div class="w-big">${ratio}</div><div class="w-label">KDA · ${g ? `${avg(d.kills)} / ${avg(d.deaths)} / ${avg(d.assists)}` : 'no games'}</div></div>`;
          return `<div class="w-body">${title('KDA')}<div class="w-stats">${stat(ratio, 'Ratio')}${stat(avg(d ? d.kills : 0), 'Kills')}${stat(avg(d ? d.deaths : 0), 'Deaths')}${stat(avg(d ? d.assists : 0), 'Assists')}</div></div>`;
        }
      },
      kills: {
        group: 'Stats', name: 'Total Kills', desc: 'Kills (and assists)', sizes: [[1, 1], [2, 1]],
        render(w) {
          const d = S();
          if (w.w === 1) return big(d ? fmtNum(d.kills) : '–', 'Kills');
          return `<div class="w-body">${title('Takedowns')}<div class="w-stats">${stat(d ? fmtNum(d.kills) : '–', 'Kills')}${stat(d ? fmtNum(d.assists) : '–', 'Assists')}</div></div>`;
        }
      },
      streak: {
        group: 'Stats', name: 'Best Win Streak', desc: 'Your longest streak', sizes: [[1, 1]],
        render() { return big(S() ? `${S().bestWinStreak}🔥` : '–', 'Best streak'); }
      },
      onPlan: {
        group: 'Stats', name: 'On Plan', desc: 'Games on your pool', sizes: [[1, 1], [2, 1]],
        render(w) {
          const d = S();
          const pct = d && d.games ? Math.round((d.poolGames / d.games) * 100) : null;
          if (w.w === 1) return big(pct === null ? '–' : `${pct}%`, 'On plan');
          return `<div class="w-body">${title('On Plan')}${bar(pct || 0, pct === null ? 'no games' : `${pct}% pool games`)}</div>`;
        }
      },
      rank: {
        group: 'Stats', name: 'Current Rank', desc: 'Solo/Duo rank', sizes: [[2, 1], [1, 1], [2, 2]],
        render(w) {
          const r = data.rank;
          if (!r) return big('–', 'Unranked');
          const name = RANK_ABBR[r.tier] || r.tier;
          const text = APEX.has(r.tier) ? `${name} · ${r.leaguePoints} LP` : `${name} ${r.rank} · ${r.leaguePoints} LP`;
          if (w.w === 1) return `<div class="w-body w-center" title="${text}"><span class="emblem-box big"><img src="${emblemUrl(r.tier)}" alt=""></span><div class="w-label">${name} ${APEX.has(r.tier) ? '' : r.rank}</div></div>`;
          if (w.h >= 2) return `<div class="w-body w-center"><span class="emblem-box huge"><img src="${emblemUrl(r.tier)}" alt=""></span><div class="rank-text">${text}</div><div class="w-label">Solo / Duo</div></div>`;
          return `<div class="w-body"><div class="rank-row"><span class="emblem-box small"><img src="${emblemUrl(r.tier)}" alt=""></span><div><div class="rank-text">${text}</div><div class="w-label">Solo / Duo</div></div></div></div>`;
        }
      },

      // ----- Champions -----
      mostPlayed: {
        group: 'Champions', name: 'Most Played', desc: 'Your top champions', sizes: [[2, 2], [1, 1], [2, 1], [3, 1], [3, 2]],
        render(w) {
          const top = S() ? S().topChamps : [];
          if (!top.length) return `<div class="w-body w-center">${title('Most Played')}<div class="w-label">No games yet</div></div>`;
          const wrOf = c => Math.round((c.wins / c.games) * 100);
          const t = top[0];
          if (w.h === 1 && w.w >= 3) {
            return `<div class="w-body">${title('Most Played')}<div class="portrait-row">${top.map(c => `<div class="portrait"><img src="${champIcon(c.champId)}" alt=""><span class="${tone(wrOf(c))}">${wrOf(c)}%</span></div>`).join('')}</div></div>`;
          }
          if (w.h === 1 || top.length === 1) {
            return `<div class="champ-splash" style="background-image:url('${champSplash(t.champId)}')"></div>
              <div class="w-body"><div class="champ-over"><div class="n">${esc(t.name)}</div>${w.w > 1 || w.h > 1 ? `<div class="s">${t.games} ${t.games === 1 ? 'game' : 'games'} · ${wrOf(t)}% WR</div>` : ''}</div></div>`;
          }
          return `<div class="w-body" style="justify-content:flex-start">${title('Most Played')}${top.map(c => `<div class="champ-row">
            <img src="${champIcon(c.champId)}" alt=""><span class="name">${esc(c.name)}</span>
            <span class="g">${c.games}G · <span class="${tone(wrOf(c))}">${wrOf(c)}%</span></span></div>`).join('')}</div>`;
        }
      },
      pool: {
        group: 'Champions', name: 'Current Pool', desc: 'Your 3 ponies + role', sizes: [[3, 1], [1, 1], [2, 1], [3, 2]],
        render(w) {
          const champs = pool();
          const role = ROLE_NAMES[ls('ttp_pool_role')] || '';
          if (!champs.length) return big('–', 'No pool');
          if (w.w === 1) return big(role || '–', 'Main role');
          if (w.h >= 2) {
            return `<div class="pool-strips">${champs.map(c => `<div class="strip" style="background-image:url('${champSplash(c.id)}')"><span>${esc(c.name)}</span></div>`).join('')}</div>`;
          }
          return `<div class="w-body">${title(`Current Pool${role ? ` · ${role}` : ''}`)}<div class="portrait-row">${champs.map(c => `<div class="portrait"><img src="${champIcon(c.id)}" alt="">${w.w >= 3 ? `<span>${esc(c.name)}</span>` : ''}</div>`).join('')}</div></div>`;
        }
      },
      favChamp: {
        group: 'Champions', name: 'Favorite Champion', desc: 'Show off any champion', sizes: [[2, 2], [1, 1], [2, 1], [3, 2]],
        render(w) {
          const id = w.config && w.config.champId;
          const champ = data.champions.find(c => c.id === id);
          const picker = editState
            ? `<select class="fav-select" data-fav="${w.id}"><option value="">Pick a champion…</option>${data.champions.map(c => `<option value="${c.id}"${c.id === id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`
            : '';
          if (!champ) return `<div class="w-body w-center">${title('Favorite')}<div class="w-label">${editState ? '' : 'Not chosen yet'}</div>${picker}</div>`;
          return `<div class="champ-splash" style="background-image:url('${champSplash(champ.id)}')"></div>
            <div class="w-body"><div class="champ-over">${w.w > 1 || w.h > 1 ? '<div class="s">Favorite</div>' : ''}<div class="n">${esc(champ.name)}</div>${picker}</div></div>`;
        }
      },
      recentGames: {
        group: 'Champions', name: 'Recent Games', desc: 'Your last games', sizes: [[2, 2], [2, 1], [3, 1], [3, 2], [6, 1]],
        render(w) {
          const games = S() ? S().recentGames : [];
          if (!games.length) return `<div class="w-body w-center">${title('Recent Games')}<div class="w-label">No games yet</div></div>`;
          if (w.h === 1) {
            const n = w.w >= 6 ? 5 : w.w >= 3 ? 4 : 3;
            return `<div class="w-body">${title('Recent Games')}<div class="portrait-row">${games.slice(0, n).map(g => `<div class="portrait game ${g.win ? 'won' : 'lost'}" title="${esc(g.champName)} ${g.kills}/${g.deaths}/${g.assists}"><img src="${champIcon(g.champId)}" alt="">${w.w >= 6 ? `<span>${g.kills}/${g.deaths}/${g.assists}</span>` : ''}</div>`).join('')}</div></div>`;
          }
          return `<div class="w-body" style="justify-content:flex-start">${title('Recent Games')}${games.slice(0, 4).map(g => `<div class="champ-row">
            <img src="${champIcon(g.champId)}" alt=""><span class="name"><span class="${g.win ? 'pos' : 'neg'}">${g.win ? 'W' : 'L'}</span> ${esc(g.champName)}</span>
            <span class="g">${g.kills}/${g.deaths}/${g.assists}</span></div>`).join('')}</div>`;
        }
      },

      // ----- Progress -----
      level: {
        group: 'Progress', name: 'Level', desc: 'Your level', sizes: [[1, 1], [2, 1], [3, 1]],
        render(w) {
          const lvl = S() ? S().level : { level: 1, xpIntoLevel: 0, xpForNextLevel: 2000 };
          if (w.w === 1) return big(lvl.level, 'Level');
          return `<div class="w-body">${title(`Level ${lvl.level}`)}${bar((lvl.xpIntoLevel / lvl.xpForNextLevel) * 100, w.w >= 3 ? `${fmtNum(lvl.xpIntoLevel)} / ${fmtNum(lvl.xpForNextLevel)} XP` : '')}</div>`;
        }
      },
      totalXp: {
        group: 'Progress', name: 'Total XP', desc: 'All XP ever earned', sizes: [[1, 1], [2, 1]],
        render(w) {
          const xp = S() ? S().totalXp : 0;
          return big(w.w === 1 && xp >= 10000 ? `${Math.round(xp / 1000)}k` : fmtNum(xp), 'Total XP');
        }
      },
      pass: {
        group: 'Progress', name: 'Monthly Pass', desc: 'Your pass tier', sizes: [[1, 1], [2, 1], [3, 1]],
        render(w) {
          const p = S() ? S().pass : null;
          if (!p) return big('–', 'Pass');
          if (w.w === 1) return big(`${p.tier}`, `Tier / ${p.tiers}`);
          return `<div class="w-body">${title(`${p.label.split(' ')[0]} Pass · Tier ${p.tier}`)}${bar((p.tier / p.tiers) * 100, w.w >= 3 ? `${p.tier} / ${p.tiers}` : '')}</div>`;
        }
      },
      lpBank: {
        group: 'Progress', name: 'LP Bank', desc: 'LP towards the next fill', sizes: [[1, 1], [2, 1], [3, 1]],
        render(w) {
          const b = S() ? S().lpBank : { progress: 0, size: 100 };
          if (w.w === 1) return big(b.progress, `/ ${b.size} LP`);
          return `<div class="w-body">${title('LP Bank')}${bar((b.progress / b.size) * 100, `${b.progress} / ${b.size} LP`)}</div>`;
        }
      },
      coins: {
        group: 'Progress', name: 'Coins', desc: 'Your coin balance', sizes: [[1, 1]],
        render() { return big(S() ? fmtNum(S().coins) : '–', 'Coins 🪙'); }
      },
      trophies: {
        group: 'Progress', name: 'Trophies', desc: 'Trophies earned', sizes: [[1, 1], [2, 1], [3, 1]],
        render(w) {
          const c = S() ? S().challenges : null;
          if (w.w === 1) return big(c ? `${c.trophies}` : '–', 'Trophies 🏆');
          return `<div class="w-body">${title('Trophies')}<div class="w-stats">${stat(c ? c.trophies : '–', 'Earned')}${stat(c ? c.platinum : '–', 'Platinum')}${w.w >= 3 ? stat(c && c.started ? c.bestTrophies : '–', 'Best') : ''}</div></div>`;
        }
      },
      days: {
        group: 'Progress', name: 'Days as Challenger', desc: 'Since your first challenge', sizes: [[1, 1]],
        render() {
          const first = S() && S().challenges.firstStarted;
          const days = first ? Math.floor((Date.now() - new Date(first).getTime()) / 86400000) + 1 : null;
          return big(days === null ? '–' : days, days === 1 ? 'Day' : 'Days');
        }
      },

      // ----- Personal -----
      bio: {
        group: 'Personal', name: 'About me', desc: 'A short text', sizes: [[3, 1], [1, 1], [2, 1], [6, 1], [2, 2], [3, 2]],
        render(w) {
          const text = (w.config && w.config.text) || '';
          if (editState) {
            return `<div class="w-body" style="justify-content:flex-start">${w.w > 1 ? title('About me') : ''}<textarea class="bio-edit" maxlength="280" data-bio="${w.id}" placeholder="Write something…">${esc(text)}</textarea></div>`;
          }
          return `<div class="w-body" style="justify-content:flex-start">${w.w > 1 ? title('About me') : ''}<div class="bio-text${text ? '' : ' empty'}">${text ? esc(text) : 'Nothing here yet.'}</div></div>`;
        }
      }
    };
    const GROUPS = ['Basics', 'Stats', 'Champions', 'Progress', 'Personal'];

    const DEFAULT_LAYOUT = [
      { id: 'identity', type: 'identity', x: 0, y: 0, w: 6, h: 1 },
      { id: 'challenges', type: 'challenges', x: 0, y: 1, w: 3, h: 1 },
      { id: 'games', type: 'games', x: 3, y: 1, w: 3, h: 1 },
      { id: 'mostPlayed', type: 'mostPlayed', x: 0, y: 2, w: 2, h: 2 },
      { id: 'rank', type: 'rank', x: 2, y: 2, w: 2, h: 1 },
      { id: 'winrate', type: 'winrate', x: 4, y: 2, w: 1, h: 1 },
      { id: 'level', type: 'level', x: 5, y: 2, w: 1, h: 1 },
      { id: 'bio', type: 'bio', x: 2, y: 3, w: 3, h: 1, config: { text: '' } }
    ];

    let layout = DEFAULT_LAYOUT.map(w => ({ ...w }));
    // editState: null = Ansicht; sonst { snapshot (fuer Abbrechen), border }
    let editState = null;

    // ===== Raster-Logik =====
    function overlaps(a, b) {
      return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    }
    function fits(rect, ignoreId) {
      if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > COLS) return false;
      return layout.every(o => o.id === ignoreId || !overlaps(rect, o));
    }
    function rowCount() {
      const bottom = layout.reduce((m, w) => Math.max(m, w.y + w.h), 1);
      return editState ? bottom + 2 : bottom;
    }
    function setRows(min = 0) {
      canvas.style.gridTemplateRows = `repeat(${Math.max(rowCount(), min)}, var(--cell))`;
    }

    function widgetInner(w) {
      const def = WIDGETS[w.type];
      return `${def.render(w)}
        ${def.fixed ? '' : '<button type="button" class="w-remove" title="Remove widget" data-remove>×</button>'}
        ${def.sizes.length > 1 ? '<span class="w-resize" title="Drag to resize" data-resize></span>' : ''}
        <span class="w-size">${w.w}×${w.h}</span>`;
    }

    function render() {
      const rows = rowCount();
      let html = '';
      if (editState) {
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < COLS; x++) html += `<div class="slot" style="grid-column:${x + 1};grid-row:${y + 1}"></div>`;
        }
      }
      layout.forEach(w => {
        if (!WIDGETS[w.type]) return;
        html += `<div class="widget" data-id="${w.id}" style="grid-column:${w.x + 1} / span ${w.w};grid-row:${w.y + 1} / span ${w.h}">${widgetInner(w)}</div>`;
      });
      setRows();
      canvas.innerHTML = html;
      applyFrame();
      if (editState) renderPanels();
    }

    function cellStep() {
      const rect = canvas.getBoundingClientRect();
      return { rect, step: (rect.width - 12 * (COLS - 1)) / COLS + 12 };
    }

    // ===== Verschieben / Groesse aendern (vorhandene Widgets) =====
    let drag = null;
    canvas.addEventListener('pointerdown', e => {
      if (!editState) return;
      const el = e.target.closest('.widget');
      if (!el || el.classList.contains('ghost') || e.target.closest('[data-remove], textarea, select')) return;
      const w = layout.find(x => x.id === el.dataset.id);
      if (!w) return;
      e.preventDefault();
      drag = { mode: e.target.closest('[data-resize]') ? 'resize' : 'move', w, el, startX: e.clientX, startY: e.clientY, orig: { x: w.x, y: w.y, w: w.w, h: w.h }, ok: true };
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!drag || drag.mode === 'new') return;
      const { step } = cellStep();
      const o = drag.orig;
      let next;
      if (drag.mode === 'move') {
        next = { ...o, x: o.x + Math.round((e.clientX - drag.startX) / step), y: o.y + Math.round((e.clientY - drag.startY) / step) };
        next.x = Math.max(0, Math.min(COLS - o.w, next.x));
        next.y = Math.max(0, next.y);
      } else {
        // Naechste erlaubte Groesse zum Mauszeiger
        const wantW = o.w + (e.clientX - drag.startX) / step;
        const wantH = o.h + (e.clientY - drag.startY) / step;
        const best = WIDGETS[drag.w.type].sizes.reduce((b, s) => {
          const d = Math.hypot(s[0] - wantW, s[1] - wantH);
          return !b || d < b.d ? { s, d } : b;
        }, null).s;
        next = { ...o, w: best[0], h: best[1] };
        if (next.x + next.w > COLS) next.x = COLS - next.w;
        // Live-Vorschau: Inhalt sofort in der neuen Groesse zeigen, damit man
        // sieht, was dazukommt bzw. wegfaellt (nicht erst nach dem Loslassen).
        const key = `${next.w}x${next.h}`;
        if (drag.sizeKey !== key) {
          drag.sizeKey = key;
          drag.el.innerHTML = widgetInner({ ...drag.w, ...next });
        }
      }
      drag.ok = fits(next, drag.w.id);
      drag.next = next;
      drag.el.style.gridColumn = `${next.x + 1} / span ${next.w}`;
      drag.el.style.gridRow = `${next.y + 1} / span ${next.h}`;
      drag.el.classList.toggle('invalid', !drag.ok);
      setRows(next.y + next.h + 1);
    });
    function endDrag() {
      if (!drag || drag.mode === 'new') return;
      if (drag.next && drag.ok) Object.assign(drag.w, { x: drag.next.x, y: drag.next.y, w: drag.next.w, h: drag.next.h });
      drag = null;
      render();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // ===== Neues Widget aus der Seitenleiste ziehen =====
    const chip = document.createElement('div');
    chip.className = 'drag-chip';
    document.body.appendChild(chip);

    document.getElementById('addList').addEventListener('pointerdown', e => {
      const item = e.target.closest('[data-add]');
      if (!item || item.classList.contains('disabled')) return;
      e.preventDefault();
      const type = item.dataset.add;
      const [w, h] = WIDGETS[type].sizes[0];
      const ghost = document.createElement('div');
      ghost.className = 'widget ghost';
      ghost.innerHTML = WIDGETS[type].render({ id: '_ghost', type, w, h, config: {} });
      drag = { mode: 'new', type, w, h, ghost, ok: false, next: null };
      chip.textContent = `${WIDGETS[type].name} · ${w}×${h}`;
      chip.style.display = 'block';
      moveNew(e);
    });
    function moveNew(e) {
      chip.style.left = `${e.clientX + 14}px`;
      chip.style.top = `${e.clientY + 14}px`;
      const { rect, step } = cellStep();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top - step / 2 && e.clientY <= rect.bottom + step;
      if (!inside) {
        drag.ghost.remove();
        drag.ok = false;
        return;
      }
      const x = Math.max(0, Math.min(COLS - drag.w, Math.round((e.clientX - rect.left) / step - drag.w / 2)));
      const y = Math.max(0, Math.round((e.clientY - rect.top) / step - drag.h / 2));
      drag.next = { x, y, w: drag.w, h: drag.h };
      drag.ok = fits(drag.next, null);
      drag.ghost.style.gridColumn = `${x + 1} / span ${drag.w}`;
      drag.ghost.style.gridRow = `${y + 1} / span ${drag.h}`;
      drag.ghost.classList.toggle('invalid', !drag.ok);
      if (!drag.ghost.isConnected) canvas.appendChild(drag.ghost);
      setRows(y + drag.h + 1);
    }
    document.addEventListener('pointermove', e => { if (drag && drag.mode === 'new') moveNew(e); });
    document.addEventListener('pointerup', () => {
      if (!drag || drag.mode !== 'new') return;
      const { type, next, ok } = drag;
      drag.ghost.remove();
      chip.style.display = 'none';
      drag = null;
      if (ok && next) {
        layout.push({ id: type, type, ...next, config: type === 'bio' ? { text: '' } : {} });
      }
      render();
    });

    canvas.addEventListener('click', e => {
      if (!editState || !e.target.closest('[data-remove]')) return;
      const id = e.target.closest('.widget').dataset.id;
      layout = layout.filter(w => w.id !== id);
      render();
    });
    canvas.addEventListener('input', e => {
      const ta = e.target.closest('[data-bio]');
      if (!ta) return;
      const w = layout.find(x => x.id === ta.dataset.bio);
      if (w) w.config = { ...(w.config || {}), text: ta.value };
    });
    canvas.addEventListener('change', e => {
      const sel = e.target.closest('[data-fav]');
      if (!sel) return;
      const w = layout.find(x => x.id === sel.dataset.fav);
      if (w) w.config = { ...(w.config || {}), champId: sel.value };
      render();
    });

    // ===== Panels =====
    // Reihenfolge nach Nutzerwunsch: Themes (das Praegnanteste) zuerst.
    let invTab = 'theme';
    const INV_TABS = [
      { id: 'theme', label: 'Themes' },
      { id: 'border', label: 'Borders' },
      { id: 'frame', label: 'Frames' },
      { id: 'sticker', label: 'Stickers' }
    ];
    // Die 8 Grund-Themes hat jeder (seit v5.11.0 nur noch hier waehlbar,
    // nicht mehr in den Einstellungen); Farben fuer die Vorschau-Kreise.
    const BASE_THEMES = [
      { themeKey: 'classic', name: 'Classic', c: ['#0a1428', '#c8aa6e', '#785a28'] },
      { themeKey: 'graphite', name: 'Graphite', c: ['#18181b', '#b4b8c0', '#3f3f46'] },
      { themeKey: 'light', name: 'Light', c: ['#f4f0e6', '#8b6914', '#c9b892'] },
      { themeKey: 'hextech', name: 'Hextech', c: ['#071a1f', '#0ac8b9', '#0e4f57'] },
      { themeKey: 'arcane', name: 'Arcane', c: ['#150d26', '#b088ff', '#4a2f7a'] },
      { themeKey: 'noxus', name: 'Noxus', c: ['#170a0a', '#d1373f', '#6e1f1f'] },
      { themeKey: 'freljord', name: 'Freljord', c: ['#0d1b2a', '#e8935a', '#2c4a63'] },
      { themeKey: 'ionia', name: 'Ionia', c: ['#0f1f1a', '#ff8fb1', '#2c5245'] }
    ];

    function miniGrid([w, h]) {
      return `<span class="mini-grid" style="grid-template-columns:repeat(${w}, 9px);grid-template-rows:repeat(${h}, 9px)">${'<i></i>'.repeat(w * h)}</span>`;
    }

    function renderPanels() {
      const present = new Set(layout.map(w => w.type));
      document.getElementById('addList').innerHTML = GROUPS.map(group => {
        const items = Object.entries(WIDGETS).filter(([, def]) => def.group === group && !def.fixed);
        if (!items.length) return '';
        return `<div class="add-group">${group}</div>` + items.map(([type, def]) => `
          <div class="add-item${present.has(type) ? ' disabled' : ''}" data-add="${type}" title="${present.has(type) ? 'Already on your profile' : `Drag onto your profile · sizes ${def.sizes.map(s => s.join('×')).join(', ')}`}">
            ${miniGrid(def.sizes[0])}
            <span class="add-text">${def.name}<small>${present.has(type) ? 'On your profile' : def.desc}</small></span>
          </div>`).join('');
      }).join('');

      document.getElementById('invTabs').innerHTML = INV_TABS
        .map(t => `<button type="button" class="inv-tab${t.id === invTab ? ' active' : ''}" data-invtab="${t.id}">${t.label}</button>`).join('');
      const owned = S() ? S().owned : [];
      const list = document.getElementById('invList');
      if (invTab === 'border') {
        const items = [{ id: null, name: 'Default' }, ...owned.filter(c => c.type === 'border')];
        list.innerHTML = `<div class="inv-grid">${items.map(c => `
          <div class="inv-item${(c.id || 'none') === editState.border ? ' equipped' : ''}" data-equip="${c.id || 'none'}">
            <span class="cos-border cos-${c.id || 'none'}"><span class="cos-fill"></span></span>${esc(c.name)}
          </div>`).join('')}</div>`;
      } else if (invTab === 'frame') {
        const items = [{ id: null, name: 'No frame' }, ...owned.filter(c => c.type === 'frame')];
        const sel = owned.find(c => c.id === editState.frame);
        list.innerHTML = `<div class="inv-grid">${items.map(c => `
          <div class="inv-item${(c.id || 'none') === editState.frame ? ' equipped' : ''}" data-frame="${c.id || 'none'}">
            ${c.id ? `<span class="mini-frame mini-frame-${c.id}"></span>` : '<span class="mini-frame mini-none"></span>'}${esc(c.name)}
          </div>`).join('')}</div>` +
          (sel && sel.hasBackground
            ? `<label class="inv-toggle"><input type="checkbox" id="frameBgToggle"${editState.frameBg ? ' checked' : ''}> Show profile background</label>`
            : '');
      } else if (invTab === 'theme') {
        // Themes sind persoenlich (nur die eigene App), daher sofort aktiv
        // und nicht Teil von Speichern/Abbrechen.
        const passThemes = owned.filter(c => c.type === 'theme');
        const active = currentThemeKey();
        const item = c => `
          <div class="inv-item${c.themeKey === active ? ' equipped' : ''}" data-theme-key="${c.themeKey}">
            ${c.c ? `<span class="mini-theme" style="background:conic-gradient(${c.c[0]} 0 50%, ${c.c[1]} 50% 75%, ${c.c[2]} 75%);border:1px solid ${c.c[1]}"></span>` : `<span class="mini-theme mini-theme-${c.themeKey}"></span>`}${esc(c.name)}${c.animated ? '<small class="inv-anim">✦ animated</small>' : ''}
          </div>`;
        list.innerHTML =
          (passThemes.length ? `<div class="inv-sub">Monthly Pass</div><div class="inv-grid">${passThemes.map(item).join('')}</div>` : '') +
          `<div class="inv-sub">Basic</div><div class="inv-grid">${BASE_THEMES.map(item).join('')}</div>` +
          '<p class="inv-note">Only you see your theme.</p>';
      } else {
        list.innerHTML = '<p class="inv-empty">Coming soon.</p>';
      }
    }

    document.getElementById('invTabs').addEventListener('click', e => {
      const t = e.target.closest('[data-invtab]');
      if (!t) return;
      invTab = t.dataset.invtab;
      renderPanels();
    });
    function currentThemeKey() {
      try { return localStorage.getItem('ttp_theme') || 'classic'; } catch (e) { return 'classic'; }
    }
    document.getElementById('invList').addEventListener('click', e => {
      const b = e.target.closest('[data-equip]');
      const f = e.target.closest('[data-frame]');
      const t = e.target.closest('[data-theme-key]');
      if (b) { editState.border = b.dataset.equip; render(); }
      if (f) { editState.frame = f.dataset.frame; render(); }
      if (t) {
        const key = t.dataset.themeKey;
        try { localStorage.setItem('ttp_theme', key); } catch (err) {}
        if (key === 'classic') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', key);
        renderPanels();
      }
    });
    document.getElementById('invList').addEventListener('change', e => {
      if (e.target.id === 'frameBgToggle') { editState.frameBg = e.target.checked; applyFrame(); }
    });

    // ===== Profil-Rahmen um die Widget-Flaeche =====
    // Sichtbar fuer alle (anders als das Theme). Die Deko baut cosmetics-fx.js
    // (TTPCos.decorateFrame); fancy Rahmen spielen beim Oeffnen einmal ihr Intro.
    let introPlayed = false;
    let introUntil = 0; // Intro-Klasse ueberlebt Neu-Renders (Daten laden nach)
    function applyFrame() {
      const wrap = document.querySelector('.canvas-wrap');
      const eq = (S() && S().equipped) || {};
      const frameId = editState ? (editState.frame === 'none' ? null : editState.frame) : eq.frame;
      const bgOn = editState ? editState.frameBg : eq.frameBg !== false;
      const cos = frameId && S() ? S().owned.find(c => c.id === frameId) : null;
      wrap.querySelectorAll(':scope > .pframe-bg').forEach(n => n.remove());
      wrap.className = 'canvas-wrap' + (cos ? ` pframe pframe-${cos.id}` : '') + (Date.now() < introUntil ? ' intro' : '');
      const decoId = cos ? cos.id : '';
      if (window.TTPCos && (wrap.dataset.pfDeco !== decoId || (decoId && !wrap.querySelector(':scope > .pf-deco')))) {
        wrap.dataset.pfDeco = decoId;
        window.TTPCos.decorateFrame(wrap, decoId);
      }
      if (!cos) return;
      if (cos.hasBackground && bgOn) {
        const bg = document.createElement('div');
        bg.className = `pframe-bg bg-${cos.id}`;
        wrap.prepend(bg);
      }
      if (!introPlayed && !editState) {
        introPlayed = true;
        introUntil = Date.now() + 3000;
        wrap.classList.add('intro');
        setTimeout(() => wrap.classList.remove('intro'), 3000);
      }
    }

    // ===== Modus wechseln / Speichern =====
    async function loadChampionList() {
      if (data.champions.length) return;
      try {
        const res = await fetch('data/champions.json');
        const list = await res.json();
        data.champions = list.map(c => ({ id: c.id, name: c.name })).sort((a, b) => a.name.localeCompare(b.name));
      } catch (e) {}
    }

    async function enterEdit() {
      editState = {
        snapshot: JSON.parse(JSON.stringify(layout)),
        border: (S() && S().equipped && S().equipped.border) || 'none',
        frame: (S() && S().equipped && S().equipped.frame) || 'none',
        frameBg: !S() || !S().equipped || S().equipped.frameBg !== false
      };
      document.body.classList.add('editing');
      render();
      await loadChampionList();
      if (editState && !drag) render();
    }
    function leaveEdit() {
      editState = null;
      document.body.classList.remove('editing');
      render();
    }

    document.getElementById('editToggle').addEventListener('click', enterEdit);
    document.getElementById('cancelBtn').addEventListener('click', () => {
      layout = editState.snapshot;
      leaveEdit();
    });
    document.getElementById('resetLayoutBtn').addEventListener('click', () => {
      const bio = layout.find(w => w.type === 'bio');
      layout = DEFAULT_LAYOUT.map(w => (w.type === 'bio' && bio ? { ...w, config: bio.config } : { ...w }));
      render();
    });
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/profile/layout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ layout })
        });
        const out = await parseApiResponse(res);
        if (!res.ok) throw new Error(out.error || 'Unknown error');
        const eq = (S() && S().equipped) || {};
        const changes = [
          ['border', editState.border === 'none' ? null : editState.border, eq.border || null],
          ['frame', editState.frame === 'none' ? null : editState.frame, eq.frame || null],
          ['frameBg', editState.frameBg ? 'on' : 'off', eq.frameBg === false ? 'off' : 'on']
        ].filter(([, now, before]) => now !== before);
        for (const [type, id] of changes) {
          const r2 = await fetch('/api/cosmetics/equip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type, id })
          });
          const o2 = await parseApiResponse(r2);
          if (!r2.ok) throw new Error(o2.error || 'Unknown error');
          data.stats.equipped = o2.equipped;
        }
        statusEl.textContent = '';
        leaveEdit();
      } catch (err) {
        statusEl.textContent = `Could not save: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });

    // ===== Laden =====
    async function loadProfile() {
      render();
      const parts = ls('ttp_summoner_name').trim().split('#');
      let puuid = '';
      if (parts.length === 2 && parts[0] && parts[1]) {
        try {
          const res = await fetch(`/api/account?${new URLSearchParams({ gameName: parts[0], tagLine: parts[1] })}`);
          const account = await parseApiResponse(res);
          if (!res.ok) throw new Error(account.error || 'Could not find summoner.');
          data.account = account;
          puuid = account.puuid;
        } catch (e) {
          statusEl.textContent = `Could not load summoner: ${e.message}`;
        }
      } else {
        statusEl.textContent = 'No valid summoner set - please set one on the Setup page.';
      }

      try {
        const res = await fetch(`/api/profile-stats?${new URLSearchParams({ puuid })}`);
        const stats = await parseApiResponse(res);
        if (!res.ok) throw new Error(stats.error || 'Unknown error');
        data.stats = stats;
        if (Array.isArray(stats.profileLayout) && stats.profileLayout.length) {
          layout = stats.profileLayout.filter(w => WIDGETS[w.type]);
          if (!layout.some(w => w.type === 'identity')) layout.unshift({ ...DEFAULT_LAYOUT[0] });
        }
        if (layout.some(w => w.type === 'favChamp')) await loadChampionList();
      } catch (e) {
        statusEl.textContent = `Could not load profile stats: ${e.message}`;
      }
      if (!drag) render();

      if (puuid) {
        try {
          const res = await fetch(`/api/current-rank?${new URLSearchParams({ puuid })}`);
          const r = await parseApiResponse(res);
          if (res.ok) data.rank = r.current || null;
        } catch (e) {}
        if (!drag) render();
      }
    }
    loadProfile();

    document.getElementById('settingsGearBtn').addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });
    document.getElementById('quitBtn').addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });
  </script>
</body>
