<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roles &amp; Picks – Three-Trick-Pony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="update-indicator.js"></script>
  <script src="changelog.js"></script>
  <script src="role-chart.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .site-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .panel-heading {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      margin: 8px 0 0;
    }
    /* Karte im freien Bereich unter der Ueberschrift vertikal mittig (oben
       und unten gleich viel Luft); bei kleinem Fenster rueckt sie nach oben
       statt abgeschnitten zu werden. */
    .content {
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
      padding: 0 30px;
      margin: 20px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* Ueberschrift direkt ueber der Grafik statt oben im Seitenkopf
       (Nutzerwunsch) - wird zusammen mit der Karte vertikal zentriert. */
    .role-heading {
      text-align: center;
      margin: 0 0 12px;
    }
    .role-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 26px 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
      /* Platz fuer das fertige Diagramm schon beim Laden reservieren, damit
         nichts springt, sobald die Daten da sind. */
      min-height: 470px;
      box-sizing: border-box;
    }
    .role-status {
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.85rem;
      text-align: center;
      margin: 0;
      min-height: 1.4em;
    }

    /* ----- Balkendiagramm (siehe role-chart.js) ----- */
    .rc-empty {
      color: var(--text-dim);
      font-family: Georgia, serif;
      text-align: center;
      margin: 60px 0;
    }
    .rc-legend {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .rc-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .rc-grid {
      display: grid;
      grid-template-columns: 34px repeat(4, minmax(0, 1fr));
      column-gap: 22px;
    }
    .rc-axis, .rc-plot {
      position: relative;
      height: 250px;
    }
    .rc-plot {
      grid-column: 2 / 6;
    }
    /* Innenflaeche: oben 22px frei fuer die Zahlen ueber dem hoechsten Balken */
    .rc-area {
      position: absolute;
      inset: 22px 0 0 0;
    }
    .rc-bars {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 22px;
    }
    .rc-tick {
      position: absolute;
      right: 0;
      transform: translateY(50%);
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.72rem;
    }
    .rc-gridline {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
    }
    .rc-col {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 100%;
    }
    .rc-bar {
      position: relative;
      width: min(64%, 84px);
      display: flex;
      flex-direction: column;
      border-radius: 5px 5px 0 0;
      transition: height 0.35s ease;
    }
    /* Ueber dem Balken: Anzahl Spiele (und das WR-Schild, falls der Balken
       zu niedrig dafuer ist) */
    .rc-bar-top {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-bottom: 4px;
    }
    .rc-bar-empty {
      height: 0;
    }
    .rc-count {
      white-space: nowrap;
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 0.85rem;
      font-weight: bold;
    }
    /* WR-Schild auf der Naht zwischen Wins und Losses */
    .rc-wr-anchor {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      line-height: 0;
    }
    .rc-wr {
      display: inline-block;
      box-sizing: border-box;
      height: 18px;
      line-height: 16px;
      padding: 0 6px;
      border-radius: 9px;
      border: 1px solid currentColor;
      background: var(--input-bg);
      font-family: Georgia, serif;
      font-size: 0.7rem;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }
    .rc-wr-pos { color: var(--green); }
    .rc-wr-neg { color: var(--red); }
    .rc-wr-even { color: var(--text); }
    .rc-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      color: var(--input-bg);
      font-family: Georgia, serif;
      font-size: 0.72rem;
      font-weight: bold;
    }
    .rc-seg span {
      white-space: nowrap;
    }
    .rc-win { background: var(--green); }
    .rc-loss { background: var(--red); }
    .rc-seg:first-of-type { border-radius: 5px 5px 0 0; }
    .rc-xlabel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: -1px;
    }
    .rc-xlabel strong {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .rc-xlabel span {
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.75rem;
      font-style: italic;
    }
    /* Eigenes Kaestchen pro Spalte - klare Trennung zur Nachbarspalte */
    .rc-champ-col {
      position: relative;
      align-self: start;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--input-bg) 55%, transparent);
    }
    .rc-champs {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rc-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      margin-top: 8px;
      padding: 4px 0 0;
      background: none;
      border: none;
      border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.76rem;
      font-style: italic;
      cursor: pointer;
    }
    .rc-more-btn:hover {
      color: var(--gold);
    }
    .rc-more-arrow {
      font-style: normal;
      font-size: 0.95rem;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .rc-champ-col.open .rc-more-arrow {
      transform: rotate(180deg);
    }
    /* Aufgeklapptes Feld: haengt direkt unter dem Kaestchen, gleicher
       Zeilenstil, deutlich abgesetzt; legt sich UEBER die Seite (keine
       Layout-Verschiebung). Max. 10 Zeilen, dann scrollbar. */
    .rc-more-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: -1px;
      right: -1px;
      z-index: 20;
      box-sizing: border-box;
      max-height: calc(10 * 28px + 16px);
      overflow-y: auto;
      padding: 8px 10px;
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      background: var(--input-bg);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      /* Zu: display:none statt nur unsichtbar - ein unsichtbares, absolut
         positioniertes Feld zaehlt sonst trotzdem zur Seitenhoehe und macht
         die Seite scrollbar. */
      display: none;
    }
    .rc-champ-col.open .rc-more-panel {
      display: block;
      animation: rc-panel-in 0.15s ease;
    }
    .rc-champ-col.up .rc-more-panel {
      top: auto;
      bottom: calc(100% + 6px);
    }
    @keyframes rc-panel-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rc-champ {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-family: Georgia, serif;
      font-size: 0.8rem;
    }
    .rc-champ img, .rc-champ-noicon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .rc-champ-name {
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .rc-champ-rec {
      margin-left: auto;
      flex-shrink: 0;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .rc-champ-rec em {
      font-style: normal;
      color: var(--text-faint);
      font-size: 0.72rem;
    }
    .rc-champ-none, .rc-champ-more {
      color: var(--text-faint);
      font-family: Georgia, serif;
      font-size: 0.78rem;
      text-align: center;
    }
    .rc-champ-more {
      cursor: help;
      font-style: italic;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="overview.html" title="Back to Overview" aria-label="Back to Overview">←</a>
  <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="Settings" aria-label="Settings">⚙</button>
  <button type="button" class="quit-btn" id="quitBtn" title="Quit completely" aria-label="Quit completely">⏻</button>
  <header class="site-header">
    <h1>League of Legends</h1>
    <p class="subtitle">Three-Trick-Pony</p>
  </header>

  <div class="content">
    <h2 class="panel-heading role-heading">Roles &amp; Picks</h2>
    <div class="role-card">
      <p class="role-status" id="roleStatus">Loading …</p>
      <div id="roleChart"></div>
    </div>
  </div>

  <script>
    const DDRAGON_VERSION = '16.17.1';
    const statusEl = document.getElementById('roleStatus');
    const chartEl = document.getElementById('roleChart');

    function championIconUrl(id) {
      return `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/champion/${id}.png`;
    }

    async function parseApiResponse(res) {
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error(`Server did not return a valid response (status ${res.status}).`);
      }
      return res.json();
    }

    // Gleicher Match-Scan wie die Overview (/api/summary-batch) - Matches
    // liegen dort schon im Cache, deshalb schnell.
    async function loadRoleStats() {
      const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
      const summonerName = ls('ttp_summoner_name').trim();
      const since = ls('ttp_challenge_start');
      const mainRole = ls('ttp_pool_role');
      const secondRole = ls('ttp_pool_second_role');
      let champions = [];
      try { champions = JSON.parse(ls('ttp_selected_champs') || '[]'); } catch (e) {}

      if (!since) { statusEl.textContent = 'Start a challenge on the Champion Selection page first.'; return; }
      const parts = summonerName.split('#');
      if (parts.length !== 2 || !parts[0] || !parts[1]) { statusEl.textContent = 'No valid summoner set - please set one on the Champion Selection page.'; return; }
      if (!champions.length) { statusEl.textContent = 'No champion pool set yet.'; return; }

      try {
        statusEl.textContent = 'Loading …';
        const accountRes = await fetch(`/api/account?${new URLSearchParams({ gameName: parts[0], tagLine: parts[1] })}`);
        const account = await parseApiResponse(accountRes);
        if (!accountRes.ok) throw new Error(account.error || 'Could not find summoner.');

        const startRes = await fetch('/api/summary-batch/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            puuid: account.puuid,
            champions: champions.filter(c => c.key).map(c => ({ key: c.key, role: c.role || '' })),
            since,
            mainRole,
            secondRole
          })
        });
        const startData = await parseApiResponse(startRes);
        if (!startRes.ok) throw new Error(startData.error || 'Unknown error');

        let result = null;
        while (!result) {
          const res = await fetch(`/api/summary-batch/status/${startData.jobId}`);
          const status = await parseApiResponse(res);
          if (!res.ok || status.status === 'error') throw new Error(status.error || 'Unknown error');
          if (status.status === 'done') { result = status.result; break; }
          statusEl.textContent = status.total > 0 ? `Scanning matches … (${status.processed}/${status.total})` : 'Searching matches …';
          await new Promise(r => setTimeout(r, 600));
        }

        const total = result.overall ? result.overall.totalGames : 0;
        statusEl.textContent = `${total} ranked game(s) since ${new Date(since).toLocaleDateString('en-GB')}`;
        TTPRoleChart.renderFull(chartEl, result.roleStats, { mainRole, secondRole, iconUrl: championIconUrl });
      } catch (e) {
        statusEl.textContent = `Could not load role stats: ${e.message}`;
      }
    }
    loadRoleStats();

    const settingsGearBtn = document.getElementById('settingsGearBtn');
    settingsGearBtn.addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });

    const quitBtn = document.getElementById('quitBtn');
    quitBtn.addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });
  </script>
</body>
</html>
