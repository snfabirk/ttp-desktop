<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Role Balance – Three-Trick-Pony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="update-indicator.js"></script>
  <script src="changelog.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel-heading {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      margin: 8px 0 0;
    }
    .content {
      width: 100%;
      max-width: 700px;
      box-sizing: border-box;
      padding: 0 30px;
      margin: 30px 0 60px;
      text-align: center;
    }
    .placeholder-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 30px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
    }
    .placeholder-card .placeholder-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 14px;
    }
    .placeholder-card p {
      color: var(--text-dim);
      font-family: Georgia, serif;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="overview.html" title="Back to Overview" aria-label="Back to Overview">←</a>
  <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="Settings" aria-label="Settings">⚙</button>
  <button type="button" class="quit-btn" id="quitBtn" title="Quit completely" aria-label="Quit completely">⏻</button>
  <header class="site-header">
    <h1>League of Legends</h1>
    <p class="subtitle">Three-Trick-Pony</p>
    <h2 class="panel-heading">Role Balance</h2>
  </header>

  <div class="content">
    <div class="placeholder-card">
      <span class="placeholder-icon">🚧</span>
      <p>This page is still under construction - detailed Main/Second/Fill role stats are coming here soon.</p>
    </div>
  </div>

  <script>
    const settingsGearBtn = document.getElementById('settingsGearBtn');
    settingsGearBtn.addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });

    const quitBtn = document.getElementById('quitBtn');
    quitBtn.addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });
  </script>
</body>
</html>
