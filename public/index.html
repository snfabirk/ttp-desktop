  <script>
    // Bei App-Start (Electron laedt immer diese Seite zuerst) direkt zur
    // Overview springen, wenn schon eine Challenge laeuft - statt erst die
    // (dann ohnehin komplett gelockte) Champion-Auswahl zu zeigen. Der
    // sessionStorage-Flag sorgt dafuer, dass das NUR beim allerersten Laden
    // dieses Fenster-Sessions passiert: klickt man spaeter bewusst ueber den
    // Nav-Link von der Overview-Seite zurueck hierher (z.B. um den API Key
    // zu erneuern oder die Challenge zurueckzusetzen), wird nicht erneut
    // weitergeleitet. sessionStorage ist leer bei jedem echten App-Neustart,
    // aber erhalten bei Navigation innerhalb derselben laufenden Session.
    try {
      if (!sessionStorage.getItem('ttp_startup_redirect_done')) {
        sessionStorage.setItem('ttp_startup_redirect_done', '1');
        if (localStorage.getItem('ttp_challenge_start')) {
          location.replace('overview.html');
        }
      }
    } catch (e) {}
  </script>

      display: grid;
      grid-template-columns: 420px 420px;
      grid-template-areas:
        "summoner  champ"

        "gobtn     gobtn";

      margin: 30px 0 40px;

    .champ-picker { grid-area: champ; }
    .selection-list { grid-area: list; }

          "champ"
          "checklist"
          "list"

  <script>
    const DDRAGON_VERSION = '16.17.1';
    const MAX_CHAMPS = 3;
    const STORAGE_KEY = 'ttp_selected_champs';
    const STORAGE_KEY_SUMMONER = 'ttp_summoner_name';
    const STORAGE_KEY_CHALLENGE_START = 'ttp_challenge_start';
    const summonerInput = document.getElementById('summonerInput');
    const challengeNotStarted = document.getElementById('challengeNotStarted');
    const challengeStarted = document.getElementById('challengeStarted');
    const startChallengeBtn = document.getElementById('startChallengeBtn');
    const resetChallengeBtn = document.getElementById('resetChallengeBtn');
    const challengeStartError = document.getElementById('challengeStartError');
    const challengeStartedAt = document.getElementById('challengeStartedAt');
    const challengeTimer = document.getElementById('challengeTimer');
    const challengeRankRow = document.getElementById('challengeRankRow');
    const settingsGearBtn = document.getElementById('settingsGearBtn');
    const select = document.getElementById('champSelect');
    const icon = document.getElementById('champIcon');
    const nameLabel = document.getElementById('champName');
    const selectionCards = document.getElementById('selectionCards');
    const selectionError = document.getElementById('selectionError');
    const toOverviewBtn = document.getElementById('toOverviewBtn');
    const champSearchInput = document.getElementById('champSearchInput');
    const checklistSummoner = document.getElementById('checklistSummoner');
    const checklistChamps = document.getElementById('checklistChamps');
    const checklistRoles = document.getElementById('checklistRoles');
    const champSuggestions = document.getElementById('champSuggestions');
    const champPickerLockedNote = document.getElementById('champPickerLockedNote');
    let selectedChamps = [];
    let allChampions = [];
    let championKeyById = {};

    async function loadChampionKeys() {
      try {
        const res = await fetch('data/champions.json');
        const list = await res.json();
        allChampions = list;
        championKeyById = Object.fromEntries(list.map(c => [c.id, c.key]));
      } catch (e) {
        allChampions = [];
        championKeyById = {};
      }
    }

    function saveSelection() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedChamps));
      } catch (e) {
        // localStorage nicht verfügbar (z. B. privater Modus) - Auswahl bleibt nur für diese Sitzung erhalten
      }
    }

    function loadSelection() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          selectedChamps = JSON.parse(stored);
        }
      } catch (e) {
        selectedChamps = [];
      }
    }

    function hideError() {
      selectionError.textContent = '';
      selectionError.classList.remove('visible');
    }

    function showError(message) {
      selectionError.textContent = message;
      selectionError.classList.add('visible');
    }

    function setChecklistItem(el, done) {
      el.classList.toggle('done', done);
      el.querySelector('.checklist-mark').textContent = done ? '✓' : '○';
    }

    // Gleiche Name#Tag-Pruefung wie beim tatsaechlichen Laden (siehe
    // overview.html performLoad()) - rein zur Anzeige, keine Validierung mit
    // Server-Roundtrip.
    function updateChecklist() {
      const summonerOk = /^[^#]+#[^#]+$/.test(summonerInput.value.trim());
      const champsOk = selectedChamps.length >= 1 && selectedChamps.length <= MAX_CHAMPS;
      const rolesOk = selectedChamps.length > 0 && selectedChamps.every(c => !!c.role);
      setChecklistItem(checklistSummoner, summonerOk);
      setChecklistItem(checklistChamps, champsOk);
      setChecklistItem(checklistRoles, rolesOk);

      // Die Checkliste waere wirkungslos, wenn man auch ohne alle 3 Punkte
      // starten koennte - deshalb bleibt Start Challenge gesperrt, bis
      // Summoner, Champions UND Rollen vollstaendig gesetzt sind. Nur
      // relevant, solange noch keine Challenge laeuft (danach ist der
      // Button ohnehin ausgeblendet).
      if (!isChallengeLocked()) {
        startChallengeBtn.disabled = !(summonerOk && champsOk && rolesOk);
      }
    }

    function championIconUrl(id) {
      return `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/champion/${id}.png`;
    }

    async function parseApiResponse(res) {
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error(
          `Server did not return a valid response (status ${res.status}). ` +
          `Is the server still running? Please check the server terminal window.`
        );
      }
      return res.json();
    }

    function saveSummonerName() {
      try {
        localStorage.setItem(STORAGE_KEY_SUMMONER, summonerInput.value);
      } catch (e) {
        // localStorage nicht verfügbar - Name bleibt nur für diese Sitzung erhalten
      }
    }

    function loadSummonerName() {
      try {
        return localStorage.getItem(STORAGE_KEY_SUMMONER) || summonerInput.value;
      } catch (e) {
        return summonerInput.value;
      }
    }

    function saveChallengeStart(iso) {
      try {
        if (iso) localStorage.setItem(STORAGE_KEY_CHALLENGE_START, iso);
        else localStorage.removeItem(STORAGE_KEY_CHALLENGE_START);
      } catch (e) {
        // localStorage nicht verfügbar - Challenge-Start bleibt nur für diese Sitzung erhalten
      }
    }

    function loadChallengeStart() {
      try {
        return localStorage.getItem(STORAGE_KEY_CHALLENGE_START) || '';
      } catch (e) {
        return '';
      }
    }

    function formatDateTimeEU(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    let challengeTimerId = null;

    function startChallengeTimer(startIso) {
      const startMs = new Date(startIso).getTime();
      function tick() {
        const totalSeconds = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        challengeTimer.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }
      tick();
      if (challengeTimerId) clearInterval(challengeTimerId);
      challengeTimerId = setInterval(tick, 1000);
    }

    function stopChallengeTimer() {
      if (challengeTimerId) {
        clearInterval(challengeTimerId);
        challengeTimerId = null;
      }
    }

    function formatRankText(current) {
      if (!current) return 'Unranked or no Solo/Duo entry found.';
      const apex = new Set(['MASTER', 'GRANDMASTER', 'CHALLENGER']);
      const tierLabel = current.tier.charAt(0) + current.tier.slice(1).toLowerCase();
      const divisionText = apex.has(current.tier) ? '' : ` ${current.rank}`;
      return `Current rank: ${tierLabel}${divisionText} - ${current.leaguePoints} LP`;
    }

    async function refreshCurrentRank(puuid) {
      challengeRankRow.textContent = 'Loading current rank…';
      try {
        const res = await fetch(`/api/current-rank?${new URLSearchParams({ puuid })}`);
        const data = await parseApiResponse(res);
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        challengeRankRow.textContent = formatRankText(data.current);
      } catch (e) {
        challengeRankRow.textContent = `Rank unavailable: ${e.message}`;
      }
    }

    // Loest Namen#Tag zu einer puuid auf - wird sowohl beim Challenge-Start
    // als auch beim Aktualisieren des aktuellen Rangs gebraucht.
    async function resolvePuuid() {
      const raw = summonerInput.value.trim();
      const parts = raw.split('#');
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        throw new Error('Please enter your summoner name as Name#Tag first (e.g. Luckshot#796).');
      }
      const [gameName, tagLine] = parts;
      const res = await fetch(`/api/account?${new URLSearchParams({ gameName, tagLine })}`);
      const data = await parseApiResponse(res);
      if (!res.ok) throw new Error(data.error || 'Unknown error');
      return data.puuid;
    }

    // Der Champion-Pool wird beim Challenge-Start festgelegt und bleibt es
    // dann fuer die Dauer der Challenge - sonst waere das LP/Rang-Tracking
    // pro Champion nicht mehr vergleichbar. Erst ein Reset gibt ihn frei.
    function isChallengeLocked() {
      return !!loadChallengeStart();
    }

    function updateChampionLockState() {
      const locked = isChallengeLocked();
      champSearchInput.disabled = locked;
      select.disabled = locked;
      summonerInput.disabled = locked;
      champPickerLockedNote.style.display = locked ? '' : 'none';
      renderSelection();
    }

    function renderChallengeState() {
      const startIso = loadChallengeStart();
      if (startIso) {
        challengeNotStarted.style.display = 'none';
        challengeStarted.style.display = '';
        challengeStartedAt.textContent = `Started ${formatDateTimeEU(startIso)}`;
        startChallengeTimer(startIso);
      } else {
        challengeNotStarted.style.display = '';
        challengeStarted.style.display = 'none';
        stopChallengeTimer();
      }
      updateChampionLockState();
      // Aktueller Rang wird immer angezeigt, unabhaengig davon ob schon eine
      // Challenge laeuft - dafuer braucht es keinen gestarteten Timer.
      resolvePuuid()
        .then(puuid => refreshCurrentRank(puuid))
        .catch(e => { challengeRankRow.textContent = `Rank unavailable: ${e.message}`; });
    }

    startChallengeBtn.addEventListener('click', async () => {
      challengeStartError.textContent = '';
      challengeStartError.classList.remove('visible');

      // Champion-Pool ist nach dem Start gesperrt (siehe isChallengeLocked) -
      // ohne mindestens 1 Champion vorher gaebe es keine Moeglichkeit mehr,
      // ueberhaupt einen zu waehlen.
      if (selectedChamps.length === 0) {
        challengeStartError.textContent = 'Select at least 1 champion before starting the challenge.';
        challengeStartError.classList.add('visible');
        return;
      }
      if (selectedChamps.some(c => !c.role)) {
        challengeStartError.textContent = 'Assign a role to every selected champion before starting the challenge.';
        challengeStartError.classList.add('visible');
        return;
      }

      startChallengeBtn.disabled = true;
      startChallengeBtn.textContent = 'Starting…';
      try {
        const puuid = await resolvePuuid();
        const res = await fetch('/api/challenge/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ puuid })
        });
        const data = await parseApiResponse(res);
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        saveChallengeStart(new Date(data.timestamp).toISOString());
        renderChallengeState();
      } catch (e) {
        challengeStartError.textContent = e.message;
        challengeStartError.classList.add('visible');
      } finally {
        startChallengeBtn.disabled = false;
        startChallengeBtn.textContent = 'Start Challenge';
      }
    });

    resetChallengeBtn.addEventListener('click', () => {
      const ok = confirm('Reset the challenge? This clears the start time and timer (your champion pool and match data stay).');
      // Electron/Chromium-Eigenheit: nach einem nativen confirm()-Dialog
      // verliert das Fenster manchmal den echten OS-Tastaturfokus - Dropdowns
      // wirken dann noch bedienbar, Text-Eingabefelder aber nicht mehr, bis
      // das Fenster ihn zurueckbekommt. window.focus() im Renderer reicht
      // dafuer nicht zuverlaessig, daher ueber den Hauptprozess (main-preload.js).
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      saveChallengeStart(null);
      renderChallengeState();
    });

    settingsGearBtn.addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });

    const quitBtn = document.getElementById('quitBtn');
    quitBtn.addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });

    summonerInput.addEventListener('change', saveSummonerName);
    summonerInput.addEventListener('input', () => {
      saveSummonerName();
      updateChecklist();
    });

    const ROLE_OPTIONS = [
      { value: '', label: 'Any Role' },
      { value: 'TOP', label: 'Top' },
      { value: 'JUNGLE', label: 'Jungle' },
      { value: 'MIDDLE', label: 'Mid' },
      { value: 'BOTTOM', label: 'Bottom' },
      { value: 'UTILITY', label: 'Support' }
    ];

    function renderSelection() {
      selectionCards.innerHTML = '';
      selectedChamps.forEach(champ => {
        const card = document.createElement('div');
        card.className = 'champ-card';

        const img = document.createElement('img');
        img.src = championIconUrl(champ.id);
        img.alt = champ.name;

        const info = document.createElement('div');
        info.className = 'champ-card-info';

        const name = document.createElement('span');
        name.textContent = champ.name;

        const roleSelect = document.createElement('select');
        roleSelect.className = 'role-select';
        roleSelect.disabled = isChallengeLocked();
        ROLE_OPTIONS.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.label;
          if ((champ.role || '') === opt.value) option.selected = true;
          roleSelect.appendChild(option);
        });
        roleSelect.addEventListener('change', () => {
          champ.role = roleSelect.value;
          saveSelection();
          updateChecklist();
        });

        info.appendChild(name);
        info.appendChild(roleSelect);

        card.appendChild(img);
        card.appendChild(info);

        // Nach Challenge-Start ist der Champion-Pool fix - kein Entfernen
        // mehr moeglich (siehe isChallengeLocked()).
        if (!isChallengeLocked()) {
          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-btn';
          removeBtn.textContent = '✕';
          removeBtn.setAttribute('aria-label', `Remove ${champ.name}`);
          removeBtn.addEventListener('click', () => {
            const index = selectedChamps.findIndex(c => c.id === champ.id);
            if (index !== -1) {
              selectedChamps.splice(index, 1);
              hideError();
              saveSelection();
              renderSelection();
            }
          });
          card.appendChild(removeBtn);
        }

        selectionCards.appendChild(card);
      });

      for (let i = selectedChamps.length; i < MAX_CHAMPS; i++) {
        const placeholder = document.createElement('div');
        placeholder.className = 'champ-card placeholder';
        selectionCards.appendChild(placeholder);
      }

      updateChecklist();
    }

    function pickChampion(id, name) {
      if (!id) {
        icon.style.display = 'none';
        nameLabel.textContent = '';
        hideError();
        return;
      }
      icon.src = championIconUrl(id);
      icon.alt = name;
      icon.style.display = 'block';
      nameLabel.textContent = name;
      select.value = id;

      if (selectedChamps.some(c => c.id === id)) {
        hideError();
        return;
      }

      if (isChallengeLocked()) {
        showError('Champions are locked for this challenge. Reset the challenge to change your pool.');
        select.value = '';
        icon.style.display = 'none';
        nameLabel.textContent = '';
        return;
      }

      if (selectedChamps.length >= MAX_CHAMPS) {
        showError(`You can select a maximum of ${MAX_CHAMPS} champions.`);
        select.value = '';
        icon.style.display = 'none';
        nameLabel.textContent = '';
        return;
      }

      selectedChamps.push({ id, name, key: championKeyById[id] || null, role: '' });
      hideError();
      saveSelection();
      renderSelection();
    }

    select.addEventListener('change', () => {
      const id = select.value;
      const name = select.options[select.selectedIndex].text;
      pickChampion(id, name);
    });

    function hideChampSuggestions() {
      champSuggestions.hidden = true;
      champSuggestions.innerHTML = '';
    }

    function showChampSuggestions(term) {
      const matches = allChampions
        .filter(c => c.name.toLowerCase().startsWith(term))
        .slice(0, 8);

      champSuggestions.innerHTML = '';

      if (matches.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'suggestion-empty';
        empty.textContent = 'No champion found.';
        champSuggestions.appendChild(empty);
      } else {
        matches.forEach(c => {
          const item = document.createElement('div');
          item.className = 'suggestion-item';

          const img = document.createElement('img');
          img.src = championIconUrl(c.id);
          img.alt = c.name;

          const name = document.createElement('span');
          name.textContent = c.name;

          item.appendChild(img);
          item.appendChild(name);
          item.addEventListener('click', () => {
            champSearchInput.value = c.name;
            hideChampSuggestions();
            pickChampion(c.id, c.name);
          });
          champSuggestions.appendChild(item);
        });
      }

      champSuggestions.hidden = false;
    }

    champSearchInput.addEventListener('input', () => {
      const term = champSearchInput.value.trim().toLowerCase();
      if (!term) {
        hideChampSuggestions();
        return;
      }
      showChampSuggestions(term);
    });

    champSearchInput.addEventListener('focus', () => {
      const term = champSearchInput.value.trim().toLowerCase();
      if (term) showChampSuggestions(term);
    });

    document.addEventListener('click', (e) => {
      if (!champSearchInput.contains(e.target) && !champSuggestions.contains(e.target)) {
        hideChampSuggestions();
      }
    });

    champSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideChampSuggestions();
    });

    toOverviewBtn.addEventListener('click', (e) => {
      if (selectedChamps.length === 0) {
        e.preventDefault();
        showError('Please select at least one champion before going to the overview.');
      }
    });

    summonerInput.value = loadSummonerName();
    // sicherstellen, dass der aktuell angezeigte Wert auch wirklich gespeichert
    // ist - sonst bleibt ein unveraenderter Platzhalter-Wert (z.B. der
    // vorausgefuellte Default) nie im localStorage und Seite 2 sieht "leer".
    saveSummonerName();

    renderChallengeState();

    loadChampionKeys().then(() => {
      loadSelection();
      renderSelection();
    });
  </script>
</body>
</html>
