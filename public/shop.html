<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop – Three-Trick-Pony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Spiegel:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cosmetics.css">
<script src="theme.js"></script>
<script src="nav.js"></script>
<script src="update-indicator.js"></script>
<script src="changelog.js"></script>
<style>
  /* Shop (v5.13.0, provisorisch): rotierende Angebote (taeglich 3, woechentlich
     2 Highlights) + kleines Gluecksrad (einmal pro Tag gratis). Artikel und
     Preise sind Platzhalter - noch nichts kaufbar. */
  body { display: flex; flex-direction: column; align-items: center; }
  .site-header { text-align: center; padding: 30px 30px 0; }
  .panel-heading.centered { color: var(--gold); text-align: center; margin: 14px 0 0; }
  .shop {
    width: 100%;
    max-width: 1180px;
    box-sizing: border-box;
    padding: 0 30px;
    margin: 18px 0 30px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 24px;
    align-items: stretch;
  }
  /* Nutzerwunsch: unten buendig - keine Spalte haengt tiefer als die andere */
  .shop > .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .shop > .col > .shop-card:last-child { flex: 1; display: flex; flex-direction: column; }
  /* Angebots-Kacheln wachsen mit, statt leeren Platz darunter zu lassen */
  .shop > .col > .shop-card:last-child > .offers { flex: 1; }
  /* links teilen sich beide Karten den Extra-Platz (sonst wird nur "Daily" riesig) */
  .shop > div.col > .shop-card { flex: 1; display: flex; flex-direction: column; }
  .shop > div.col > .shop-card > .offers { flex: 1; }
  .offer { justify-content: center; }
  .shop-card {
    background: var(--panel-bg);
    backdrop-filter: blur(12px) saturate(1.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px 18px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
  }
  .shop-card + .shop-card { margin-top: 0; }
  .sc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sc-head h3 { margin: 0; color: var(--gold); font-family: 'Cinzel', Georgia, serif; font-size: 1.05rem; letter-spacing: 1px; }
  .sc-reset { color: var(--text-faint); font-style: italic; font-size: 0.8rem; }
  .coin-balance {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 12px; border: 1px solid var(--border); border-radius: 14px;
    color: var(--gold); font-family: 'Cinzel', Georgia, serif; font-size: 0.95rem;
  }
  .offers { display: grid; gap: 14px; }
  .offers.weekly { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .offers.daily { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .offer {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: color-mix(in srgb, var(--input-bg) 55%, transparent);
    text-align: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .offer:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .weekly .offer { padding: 22px 14px 16px; }
  .offer-tag {
    position: absolute; top: 8px; left: 8px;
    padding: 1px 7px; border-radius: 8px;
    font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-faint); border: 1px solid var(--border);
  }
  .offer-tag.rar-basic { border-color: var(--rar-basic); }
  .offer-tag.rar-refined { border-color: var(--rar-refined); }
  .offer-tag.rar-fancy { border-color: var(--rar-fancy); }
  .offer-tag.rar-animated { border-color: var(--rar-animated); }
  .offer-tag.rar-animatedplus { border-color: var(--rar-animatedplus); }
  .offer.rar-animatedplus { border-color: color-mix(in srgb, var(--rar-animatedplus) 70%, var(--border)); animation: offerCrimson 2.6s linear infinite; }
  @keyframes offerCrimson { 0%, 100% { box-shadow: 0 0 18px rgba(224, 20, 60, .35); } 8% { box-shadow: 0 0 30px rgba(255, 42, 82, .6); } 11% { box-shadow: 0 0 10px rgba(160, 12, 36, .25); } 14% { box-shadow: 0 0 24px rgba(255, 42, 82, .5); } 57% { box-shadow: 0 0 32px rgba(255, 42, 82, .6); } 60% { box-shadow: 0 0 10px rgba(160, 12, 36, .25); } }
  html.fx-off .offer.rar-animatedplus, html.fx-paused .offer.rar-animatedplus { animation-play-state: paused; }
  .offer .dev-choice { position: absolute; top: 8px; right: 8px; }
  .offer.rar-fancy { border-color: color-mix(in srgb, var(--rar-fancy) 45%, var(--border)); }
  .offer.rar-animated { border-color: color-mix(in srgb, var(--rar-animated) 55%, var(--border)); box-shadow: 0 0 18px color-mix(in srgb, var(--rar-animated) 18%, transparent); }
  .offer-from { color: var(--text-faint); font-size: 0.68rem; font-style: italic; }
  .offers-empty { grid-column: 1 / -1; color: var(--text-faint); font-style: italic; text-align: center; padding: 18px 0; }
  .offer-name { font-family: 'Cinzel', Georgia, serif; color: var(--text); font-size: 0.95rem; letter-spacing: 0.5px; }
  .offer-type { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
  .offer-buy {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 14px;
    border: 1px solid var(--gold); background: transparent;
    color: var(--text); font-family: inherit; font-size: 0.85rem;
    cursor: pointer;
  }
  .offer-buy:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
  /* Gutschein (30+5): eigener Knopf unter dem Preis */
  .offer-voucher {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 12px; border-radius: 12px;
    border: 1px dashed var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent);
    color: var(--gold); font-family: inherit; font-size: 0.75rem; cursor: pointer;
  }
  .offer-voucher:hover, .offer-voucher.confirm { background: color-mix(in srgb, var(--gold) 22%, transparent); }
  .offer-buy.confirm { background: var(--gold); color: var(--bg); }
  .offer-buy.confirm b { color: var(--bg); }
  .offer-buy:disabled { cursor: default; border-color: var(--border); color: var(--text-faint); background: transparent; }
  .offer-buy s { color: var(--text-faint); font-size: .75rem; }
  .offer.owned { opacity: .75; }
  .offer-msg { font-size: .72rem; color: var(--gold); min-height: 1em; }
  /* Vorschau-Bereich gleich hoch, egal ob Border, Rahmen oder Theme */
  .offer-pv { height: 96px; display: flex; align-items: center; justify-content: center; }
  .weekly .offer-pv { height: 124px; }
  .offer-pv .cos-border { width: 56px; height: 56px; }
  .weekly .offer-pv .cos-border { width: 72px; height: 72px; }
  .offer-pv .pv-frame-live { position: relative; width: 104px; height: 62px; border-radius: 10px; background: rgba(255,255,255,.04); }
  .weekly .offer-pv .pv-frame-live { width: 140px; height: 84px; }
  .offer-pv .pv-frame-big { background: none; }
  .offer-pv .pv-frame-big:has(.pframe-frame-shop-kraken) { top: -12px; }
  .offer-pv:has(.cos-border-dev-optic) { padding-top: 14px; box-sizing: border-box; }
  .offer-pv .pv-frame-big > .pframe { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 24px; background: rgba(255,255,255,.04); }
  .offer-pv .mini-theme { width: 72px; height: 72px; border-radius: 50%; }
  .offer-pv canvas.theme-pv { width: 120px; height: 72px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); }
  .weekly .offer-pv canvas.theme-pv { width: 170px; height: 100px; }
  .weekly .offer-pv .mini-theme { width: 96px; height: 96px; }
  .offer-buy b { color: var(--gold); font-weight: normal; }
  .offer-soon { font-size: 0.68rem; color: var(--text-faint); letter-spacing: 1px; text-transform: uppercase; }
  /* Vorschauen der Platzhalter-Artikel */
  .pv { flex-shrink: 0; }
  .pv-border { width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--a), var(--b), var(--a), var(--b), var(--a)); padding: 5px; box-sizing: border-box; }
  .pv-border::after { content: ''; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--input-bg); }
  .pv-frame { width: 82px; height: 60px; border-radius: 8px; border: 3px solid var(--a); box-shadow: inset 0 0 0 2px var(--b), 0 0 10px color-mix(in srgb, var(--a) 40%, transparent); background: color-mix(in srgb, var(--b) 60%, transparent); box-sizing: border-box; }
  .pv-theme { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--b) 0 55%, var(--a) 55% 100%); border: 1px solid var(--a); box-sizing: border-box; }
  .weekly .pv-border, .weekly .pv-theme { width: 84px; height: 84px; }
  .weekly .pv-frame { width: 108px; height: 78px; }
  .pv.fancy, .pv.animated { box-shadow: 0 0 16px color-mix(in srgb, var(--a) 55%, transparent); }
  .weekly .offer .cos-border { width: 84px !important; height: 84px !important; }

  /* ----- Gluecksrad ----- */
  .wheel-card { text-align: center; }
  .wheel-small { width: 200px; height: 200px; margin: 4px auto 10px; cursor: pointer; transition: transform 0.15s ease; }
  .wheel-small:hover { transform: scale(1.03); }
  .wheel-status { color: var(--text-dim); font-size: 0.85rem; min-height: 1.3em; }
  .wheel-status.free { color: var(--gold); }
  .wheel-svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .wheel-svg .seg { stroke: color-mix(in srgb, var(--bg) 70%, black); stroke-width: 1.5; }
  .wheel-svg .seg.a { fill: var(--gold); }
  .wheel-svg .seg.b { fill: color-mix(in srgb, var(--gold) 35%, var(--bg)); }
  .wheel-svg .lbl { font-family: 'Cinzel', Georgia, serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
  .wheel-svg .lbl.a { fill: var(--bg); }
  .wheel-svg .lbl.b { fill: var(--text); }
  .wheel-svg .rim { fill: none; stroke: var(--gold); stroke-width: 4; }
  .wheel-svg .hub { fill: var(--bg); stroke: var(--gold); stroke-width: 3; }
  .wheel-svg .pointer { fill: var(--text); stroke: var(--bg); stroke-width: 1.5; }
  /* (privat) */
  .wheel-svg.sep .seg { fill: #ffeb00; stroke: #000; }
  .wheel-svg.sep .rim { stroke: #000; }
  .wheel-svg.sep .hub { fill: #000; stroke: #000; }
  .wheel-svg.sep .lbl { fill: #000; }

  /* Gross-Ansicht: Rad zoomt in die Bildschirmmitte */
  .wheel-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0, 0, 0, 0);
    backdrop-filter: blur(0px);
    transition: background 0.35s ease, backdrop-filter 0.35s ease;
  }
  .wheel-overlay.open { background: rgba(0, 0, 0, 0.62); backdrop-filter: blur(3px); }
  .wheel-big {
    position: fixed; z-index: 501;
    transition: left 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .wheel-big .wheel-rot { width: 100%; height: 100%; }
  .wheel-big-ui {
    position: fixed; left: 50%; z-index: 502; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; transition: opacity 0.25s ease 0.25s;
    pointer-events: none;
  }
  .wheel-big-ui.show { opacity: 1; pointer-events: auto; }
  .spin-btn {
    padding: 9px 30px; border-radius: 20px;
    border: 1px solid var(--gold); background: var(--gold); color: var(--bg);
    font-family: 'Cinzel', Georgia, serif; font-size: 1rem; letter-spacing: 1px; cursor: pointer;
  }
  .spin-btn:disabled { background: transparent; color: var(--text-faint); border-color: var(--border); cursor: default; }
  .spin-result { font-family: 'Cinzel', Georgia, serif; color: var(--gold); font-size: 1.3rem; min-height: 1.6em; text-shadow: 0 0 14px color-mix(in srgb, var(--gold) 50%, transparent); }
  .spin-hint { color: var(--text-faint); font-size: 0.78rem; }

  /* "?" mit Preisen und Wahrscheinlichkeiten */
  .info-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); color: var(--text-dim); font-size: 0.75rem; line-height: 1; flex-shrink: 0; }
  .hint { position: relative; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; margin-right: 14px; color: var(--text-faint); font-family: Georgia, serif; font-size: 0.8rem; font-style: italic; font-weight: normal; letter-spacing: 0; text-transform: none; cursor: help; outline: none; }
  .hint:hover, .hint:focus-within { color: var(--gold); }
  .hint:hover .info-icon, .hint:focus-within .info-icon { border-color: var(--gold); color: var(--gold); }
  .hint-pop {
    position: absolute; top: calc(100% + 8px); right: -10px; z-index: 30; width: 360px; font-style: normal;
    padding: 12px 16px; color: var(--text-dim); line-height: 1.45; text-align: left;
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    opacity: 0; visibility: hidden; transition: opacity 0.12s ease;
  }
  .hint:hover .hint-pop, .hint:focus-within .hint-pop { opacity: 1; visibility: visible; }
  .shop-card:has(.hint:hover, .hint:focus-within) { position: relative; z-index: 40; }
  .hint-pop h4 { margin: 10px 0 6px; color: var(--gold); font-family: 'Cinzel', Georgia, serif; font-size: 0.78rem; letter-spacing: 1px; }
  .hint-pop h4:first-child { margin-top: 0; }
  .hint-pop table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  .hint-pop th, .hint-pop td { padding: 3px 4px; text-align: right; }
  .hint-pop th:first-child, .hint-pop td:first-child { text-align: left; }
  .hint-pop th { color: var(--text-faint); font-weight: normal; }
  .hint-pop tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .hint-pop p { margin: 8px 0 0; font-size: 0.72rem; color: var(--text-faint); }
  .hint-pop p b { color: var(--text-dim); font-weight: normal; }
  .hint-pop .rates-intro { margin: -2px 0 6px; }
  .hint-pop table.rates { margin-top: 2px; }
  .hint-pop table.rates th:first-child { text-align: left; }
  /* ----- Consumables: 2 Tagesplaetze + Buff-Leiste ----- */
  .goods { display: grid; gap: 10px; }
  .good {
    display: grid; grid-template-columns: 38px 1fr; gap: 4px 12px; align-items: center; height: 128px; box-sizing: border-box; align-content: center;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: color-mix(in srgb, var(--input-bg) 55%, transparent); text-align: left;
  }
  .good-icon { grid-row: span 2; font-size: 1.6rem; text-align: center; }
  .good-name { font-family: 'Cinzel', Georgia, serif; color: var(--text); font-size: 0.88rem; letter-spacing: 0.5px; }
  .good-desc { color: var(--text-dim); font-size: 0.75rem; line-height: 1.35; }
  .good-buy {
    grid-column: 1 / -1; justify-self: stretch; margin-top: 6px;
    padding: 5px 12px; border-radius: 14px; border: 1px solid var(--gold); background: transparent;
    color: var(--gold); font-family: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .good-buy:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
  .good-buy.confirm { background: var(--gold); color: var(--bg); }
  .good-buy:disabled { border-color: var(--border); color: var(--text-faint); background: transparent; cursor: default; }
  .good.empty { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-style: italic; font-size: 0.8rem; border-style: dashed; }
  .good.sold { opacity: 0.6; }
  .good-msg { grid-column: 1 / -1; color: var(--gold); font-size: 0.78rem; min-height: 0; }
  .buffs-head { margin: 14px 0 6px; color: var(--text-faint); font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; }
  .buffs { display: flex; flex-direction: column; gap: 6px; }
  .buff {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border)); background: color-mix(in srgb, var(--gold) 8%, transparent);
    font-size: 0.78rem; color: var(--text);
  }
  .buff small { color: var(--text-dim); }
  .buff .buff-time { margin-left: auto; color: var(--text-faint); font-size: 0.72rem; white-space: nowrap; }
  .buff { height: 32px; box-sizing: border-box; }
  .buff { position: relative; }
  .buff-x {
    display: none; margin-left: 4px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text-faint); font-family: inherit; font-size: 0.72rem; cursor: pointer; white-space: nowrap;
  }
  .buff:hover .buff-x, .buff-x.confirm { display: inline-block; }
  .voucher-head { margin: 14px 0 6px; color: var(--text-faint); font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; }
  .voucher {
    display: flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 5px 10px; border-radius: 8px;
    border: 1px dashed var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent);
    font-size: 0.78rem; color: var(--gold);
  }
  .voucher .buff-time { margin-left: auto; color: var(--text-faint); font-size: 0.72rem; white-space: nowrap; }
  .buff:hover .buff-time:has(+ .buff-x) { display: none; }
  .buff-x:hover { color: var(--red); border-color: var(--red); }
  .buff-x.confirm { color: var(--bg); background: var(--red); border-color: var(--red); }
  .buff-x:disabled { cursor: default; color: var(--text-faint); border-color: var(--border); background: transparent; }
  .buff.free { justify-content: center; border-style: dashed; border-color: var(--border); background: transparent; color: var(--text-faint); font-style: italic; font-size: 0.74rem; }
  /* Try It On: Auswahl */
  .pick-overlay { position: fixed; inset: 0; z-index: 600; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; }
  .pick-box { width: min(520px, 92vw); max-height: 80vh; overflow: auto; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
  .pick-box h3 { margin: 0 0 4px; color: var(--gold); font-family: 'Cinzel', Georgia, serif; font-size: 1rem; }
  .pick-box p { margin: 0 0 12px; color: var(--text-dim); font-size: 0.8rem; }
  .pick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .pick-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-dim); font-family: inherit; font-size: 0.75rem; cursor: pointer; }
  .pick-item:hover { border-color: var(--gold); color: var(--text); }
  .pick-item .cos-border { width: 40px; height: 40px; }
  .pick-item .mini-frame { width: 44px; height: 32px; }
  .pick-item .mini-theme { width: 36px; height: 36px; }
  .pick-cancel { margin-top: 14px; padding: 5px 16px; border-radius: 14px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: inherit; cursor: pointer; }
  /* Hover-Vorschau: das eigene Profil mit dem Artikel */
  .pv-pop { position: fixed; z-index: 700; width: 320px; height: 200px; border-radius: 14px; overflow: visible; pointer-events: none;
    box-shadow: 0 14px 40px rgba(0,0,0,.55); border: 1px solid var(--border); opacity: 0; transform: translateY(6px); transition: opacity .15s ease, transform .15s ease; }
  .pv-pop.show { opacity: 1; transform: none; }
  .pv-pop .pv-bg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 14px; }
  .pv-pop .pv-board { position: absolute; left: 34px; right: 34px; top: 30px; bottom: 30px; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .pv-pop .pv-card { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 9px; border: 1px solid; }
  .pv-pop .pv-card .cos-border { width: 46px; height: 46px; flex-shrink: 0; }
  .pv-pop .pv-card b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: .85rem; letter-spacing: .5px; }
  .pv-pop .pv-card small { font-size: .7rem; }
  .pv-pop .pv-row { display: flex; gap: 8px; flex: 1; }
  .pv-pop .pv-row span { flex: 1; border-radius: 8px; border: 1px solid; }
  /* Theme-Vorschau: Mini-App mit echter Szene */
  .pv-pop.theme { width: 460px; height: 270px; overflow: hidden; }
  .pv-pop.theme .pv-label { bottom: 6px; z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .pv-app { position: absolute; inset: 0; padding: 12px 16px; box-sizing: border-box; }
  .pv-app .nav { display: flex; gap: 3px; width: max-content; padding: 2px; border-radius: 10px; border: 1px solid; }
  .pv-app .nav i { font-style: normal; font-family: 'Cinzel', Georgia, serif; font-size: .5rem; padding: 2px 6px; border-radius: 8px; }
  .pv-app h5 { margin: 8px 0 0; text-align: center; font-family: 'Cinzel', Georgia, serif; font-size: 1.05rem; letter-spacing: 1.5px; }
  .pv-app .sub { text-align: center; font-size: .5rem; letter-spacing: 3px; font-style: italic; opacity: .8; }
  .pv-app .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .pv-app .box { border-radius: 7px; border: 1px solid; padding: 6px 8px; font-size: .55rem; backdrop-filter: blur(4px); }
  .pv-app .box b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: .58rem; margin-bottom: 3px; }
  .pv-app .box div { display: flex; justify-content: space-between; padding: 1px 0; }
  .pv-app .box div.who { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
  .pv-app .who .cos-border { width: 22px; height: 22px; }
  .pv-pop .pv-label { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: .72rem; color: var(--text-dim); font-style: italic; }
  .shop-note { color: var(--text-faint); font-size: 0.78rem; text-align: center; margin-top: 12px; font-style: italic; }
  /* (privat) - unsichtbar, Mauszeiger bleibt normal */
  .corner-spot { position: fixed; left: 0; bottom: 0; width: 64px; height: 64px; z-index: 50; cursor: default; background: transparent; }

  @media (max-width: 1000px) {
    .shop { grid-template-columns: minmax(0, 1fr); }
    .offers.daily { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
  <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="Settings" aria-label="Settings">⚙</button>
  <button type="button" class="quit-btn" id="quitBtn" title="Quit completely" aria-label="Quit completely">⏻</button>
  <header class="site-header">
    <h1>League of Legends</h1>
    <p class="subtitle">Three-Trick-Pony</p>
    <h2 class="panel-heading centered">Shop</h2>
  </header>

  <div class="shop">
    <div class="col">
      <section class="shop-card">
        <div class="sc-head"><h3>Weekly Highlights</h3><span class="hint" tabindex="0">Prices &amp; rates <span class="info-icon">?</span><span class="hint-pop" id="shopHelp"></span></span><span class="sc-reset" id="weeklyReset"></span></div>
        <div class="offers weekly" id="weeklyOffers"></div>
      </section>
      <section class="shop-card">
        <div class="sc-head"><h3>Daily Offers</h3><span class="sc-reset" id="dailyReset"></span></div>
        <div class="offers daily" id="dailyOffers"></div>
      </section>
    </div>
    <aside class="col">
      <section class="shop-card wheel-card">
        <div class="sc-head"><h3>Lucky Wheel</h3><span class="coin-balance" id="coinBalance">🪙 –</span></div>
        <div class="wheel-small" id="wheelSmall" title="Open the wheel"></div>
        <div class="wheel-status" id="wheelStatus"></div>
      </section>
      <section class="shop-card">
        <div class="sc-head"><h3>Daily Goods</h3><span class="sc-reset" id="goodsReset"></span></div>
        <div class="goods" id="goods"></div>
        <div class="buffs-head">Active buffs <span id="buffCount"></span></div>
        <div class="buffs" id="buffs"></div>
        <div id="voucherSlot"></div>
      </section>
    </aside>
  </div>

  <div class="corner-spot" id="cornerSpot" aria-hidden="true"></div>

  <script>
    const fmtNum = n => Number(n || 0).toLocaleString('en-US');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const TYPE_LABEL = { border: 'Border', frame: 'Profile frame', theme: 'Theme' };
    const RARITY_LABEL = { basic: 'Basic', refined: 'Refined', fancy: 'Fancy', animated: 'Animated', animatedplus: 'Animated+' };
    let shop = null;

    function until(iso) {
      const ms = Math.max(0, new Date(iso) - Date.now());
      const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
      return d ? `${d}d ${h}h` : `${h}h ${m}m`;
    }

    // Vorschau: Pass-Cosmetics zeigen ihr echtes Aussehen, Platzhalter einen Farbverlauf
    // Vorschau: Borders und Rahmen werden live gezeichnet (cosmetics-fx.js /
    // shop-cosmetics.js), Themes als Farbkreis
    const ICON = 'https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/29.png';
    const BIG_FRAME_PV = { 'frame-shop-kraken': 3.4, 'frame-shop-phoenix': 3.4, 'frame-shop-dragon': 2.4, 'frame-dev-netrunner': 2.6, 'frame-shop-vines': 2.3 };
    function previewHtml(o) {
      let inner;
      if (o.type === 'border') inner = `<span class="cos-border cos-${o.id}"><img src="${ICON}" alt=""></span>`;
      else if (o.type === 'frame' && BIG_FRAME_PV[o.id]) {
        // Grosse Rahmen (Kreatur ragt weit ueber den Rand): in Originalgroesse
        // zeichnen und verkleinert einpassen, sonst ueberdecken sie die Karte
        const k = BIG_FRAME_PV[o.id];
        inner = `<span class="pv-frame-live pv-frame-big"><span class="pframe pframe-${o.id}" data-pv-frame="${o.id}" style="width:${k * 100}%;height:${k * 100}%;transform:scale(${1 / k})"></span></span>`;
      }
      else if (o.type === 'frame') inner = `<span class="pv-frame-live pframe pframe-${o.id}" data-pv-frame="${o.id}"></span>`;
      else inner = `<canvas class="mini-theme theme-pv" data-theme-pv="${o.themeKey}"></canvas>`;
      return `<div class="offer-pv">${inner}</div>`;
    }
    function decorateFramePreviews() {
      document.querySelectorAll('[data-theme-pv]').forEach(cv => { if (!cv.dataset.done && window.TTPThemePreview && window.TTPThemePreview(cv.dataset.themePv, cv)) cv.dataset.done = '1'; });
      document.querySelectorAll('[data-pv-frame]').forEach(el => {
        if (el.dataset.done || !window.TTPCos) return;
        el.dataset.done = '1'; window.TTPCos.decorateFrame(el, el.dataset.pvFrame);
      });
    }
    setInterval(decorateFramePreviews, 500);
    const buyConfirm = new Set();
    const buyMsg = {};
    function priceLabel(o) {
      if (!o.price) return '<b>Free</b>';
      if (shop.couponActive) return `🪙 <s>${fmtNum(o.price)}</s> <b>${fmtNum(Math.round(o.price * 0.8))}</b>`;
      return `🪙 <b>${fmtNum(o.price)}</b>`;
    }
    // Gutschein: nur Refined/Fancy, nur solange er laeuft
    const voucherOk = o => shop.voucher && !o.owned && shop.voucher.rarities.includes(o.rarity);
    function voucherBtn(o) {
      if (!voucherOk(o)) return '';
      const c = buyConfirm.has('v:' + o.id);
      return `<button type="button" class="offer-voucher${c ? ' confirm' : ''}" data-voucher="${o.id}">${c ? 'Use your voucher on this?' : '🎫 Free with voucher'}</button>`;
    }
    function offerHtml(o) {
      const eff = shop.couponActive ? Math.round(o.price * 0.8) : o.price;
      const btn = o.owned
        ? '<button type="button" class="offer-buy" disabled>✓ Owned</button>'
        : shop.coins < eff
          ? `<button type="button" class="offer-buy" disabled title="Not enough coins">${priceLabel(o)}</button>`
          : `<button type="button" class="offer-buy${buyConfirm.has(o.id) ? ' confirm' : ''}" data-buy="${o.id}">${buyConfirm.has(o.id) ? `Buy for 🪙 <b>${fmtNum(eff)}</b>?` : priceLabel(o)}</button>`;
      return `<div class="offer rar-${o.rarity}${o.owned ? ' owned' : ''}" data-id="${o.id}">
        <span class="offer-tag rar rar-${o.rarity}">${RARITY_LABEL[o.rarity] || o.rarity}</span>
        ${previewHtml(o)}
        <span class="offer-name">${esc(o.name)}</span>
        <span class="offer-type">${TYPE_LABEL[o.type] || o.type}</span>
        ${o.devChoice ? '<span class="dev-choice" title="A homage to one of the developer\'s favourite games">Developer\'s Choice</span>' : ''}
        ${o.fromPass ? `<span class="offer-from">from the ${esc(o.fromPass)}</span>` : ''}
        ${btn}
        ${voucherBtn(o)}
        <span class="offer-msg">${buyMsg[o.id] ? esc(buyMsg[o.id]) : ''}</span>
      </div>`;
    }
    const offersHtml = list => list.length ? list.map(offerHtml).join('') : '<div class="offers-empty">You already own everything that could show up here.</div>';

    // ----- Gluecksrad (SVG) -----
    function wheelSvg(segments) {
      const n = segments.length, R = 100, cx = 110, cy = 110;
      const pt = (a, r) => [cx + Math.sin(a) * r, cy - Math.cos(a) * r];
      let segs = '';
      segments.forEach((s, i) => {
        const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, am = (a0 + a1) / 2;
        const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [lx, ly] = pt(am, R * 0.68);
        const k = i % 2 ? 'b' : 'a';
        segs += `<path class="seg ${k}" d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"/>` +
          `<text class="lbl ${k}" x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" transform="rotate(${(am * 180 / Math.PI).toFixed(1)} ${lx.toFixed(2)} ${ly.toFixed(2)})">${esc(s.label)}</text>`;
      });
      return `<svg class="wheel-svg${sepOn() ? ' sep' : ''}" viewBox="0 0 220 230">
        <g class="wheel-rot" style="transform-origin:110px 110px">${segs}<circle class="rim" cx="110" cy="110" r="${R}"/></g>
        <circle class="hub" cx="110" cy="110" r="14"/>
        <path class="pointer" d="M110 22 L101 2 L119 2 Z"/>
      </svg>`;
    }

    function renderWheelSmall() {
      document.getElementById('wheelSmall').innerHTML = wheelSvg(shop.wheel.segments);
      document.querySelector('#wheelSmall .wheel-rot').style.transform = `rotate(${rotation}deg)`;
      const st = document.getElementById('wheelStatus');
      st.className = 'wheel-status' + (shop.wheel.canSpin ? ' free' : '');
      st.textContent = shop.wheel.canSpin ? 'Free spin available!' : `Next free spin in ${until(shop.wheel.nextSpinAt)}`;
    }

    // "?" - Preise nach Seltenheit + Grund-Wahrscheinlichkeiten pro Angebotsplatz
    function renderHelp() {
      if (!shop.prices || !shop.odds) return;
      const R = ['basic', 'refined', 'fancy', 'animated', 'animatedplus'];
      const price = v => v ? fmtNum(v) : 'Free';
      const pct = (w, r) => { const sum = Object.values(w).reduce((a, b) => a + b, 0); if (!w[r]) return '–'; const v = w[r] / sum * 100; return `${v < 1 ? v.toFixed(1) : Math.round(v)}%`; };
      // Zwei klar getrennte Tabellen (Nutzer las die Rates-Spalten sonst als
      // Frame/Theme): Spalten heissen ausdruecklich "Daily offer" / "Weekly highlight".
      document.getElementById('shopHelp').innerHTML =
        `<h4>Prices</h4><table><tr><th></th><th>Border</th><th>Frame</th><th>Theme</th></tr>` +
        R.map(r => `<tr><td class="rar rar-${r}">${RARITY_LABEL[r]}</td><td>${price(shop.prices[r].border)}</td><td>${price(shop.prices[r].frame)}</td><td>${price(shop.prices[r].theme)}</td></tr>`).join('') +
        `</table><h4>Rates</h4><p class="rates-intro">Chance for each single offer - borders, frames and themes alike.</p>` +
        `<table class="rates"><tr><th>Rarity</th><th>Daily offer</th><th>Weekly highlight</th></tr>` +
        R.map(r => `<tr><td class="rar rar-${r}">${RARITY_LABEL[r]}</td><td>${pct(shop.odds.daily, r)}</td><td>${pct(shop.odds.weekly, r)}</td></tr>`).join('') +
        `</table><p>On top of that, each offer has its own chance to be a cosmetic from an <b>earlier monthly pass</b> (any type - border, frame or theme): ` +
        `<b>${Math.round(shop.odds.pastPass.daily * 100)}%</b> per daily offer, <b>${Math.round(shop.odds.pastPass.weekly * 100)}%</b> per weekly highlight. ` +
        `It costs the same as any other cosmetic of its rarity, and only shows up while you are still missing some.</p>` +
        `<p>Your shop never offers you something you already own.</p>`;
    }

    // ----- Hover-Vorschau: so saehe dein Profil mit dem Artikel aus -----
    // Farben der Themes, die im Shop auftauchen koennen (Shop + alte Paesse)
    const PALETTE = {
      abyss: ['#03111c', '#3fd0c9', '#e2f4f6', '#12455a'], neon: ['#0b0816', '#ff4fb8', '#f2e9ff', '#3a2458'],
      starfall: ['#0a0f2a', '#ffd86b', '#e8ecff', '#2c3a6e'], koi: ['#1b1c1f', '#e0303a', '#f2f2f2', '#5a5d63'],
      desert: ['#2a1424', '#ffb35c', '#f6ece4', '#7a4a2a'], forest: ['#0a1a12', '#7ee08a', '#eaf6ec', '#2c5a38'],
      hallows: ['#0f0e10', '#ff7a18', '#ece6e0', '#3d3530'], haunted: ['#0b0a10', '#ff8a2a', '#efe9f5', '#3a2d45'],
      magmaplus: ['#0d0604', '#ff8a3a', '#f6e8dc', '#5a2a14'], magma: ['#0d0604', '#ff8a3a', '#f6e8dc', '#5a2a14'], cyberpunk: ['#07080c', '#e8d43a', '#e8ecf2', '#3a3a22'], aurora: ['#050a12', '#6ef0b4', '#e8f4f8', '#23485a'], lanterns: ['#120c1e', '#ffb560', '#fbefe4', '#6a3a3a'], skyisles: ['#1a2448', '#ffd27a', '#fdf6ea', '#5a6aa0'], cherry: ['#120c2a', '#ffb0cc', '#f6eef6', '#5a3a6a'], arctic: ['#16213a', '#9ad8ff', '#f2f8fc', '#3a6a8a']
    };
    const me = { icon: ICON, name: 'You', level: 1, border: 'none', frame: null };
    (async () => {
      try { const st = await (await fetch('/api/profile-stats')).json(); me.level = (st.level && st.level.level) || me.level; me.border = (st.equipped && st.equipped.border) || 'none'; me.frame = st.equipped && st.equipped.frame; } catch (e) {}
      const parts = (ls('ttp_summoner_name') || '').trim().split('#');
      if (parts.length === 2 && parts[0]) {
        me.name = parts[0];
        try { const a = await (await fetch(`/api/account?${new URLSearchParams({ gameName: parts[0], tagLine: parts[1] })}`)).json(); if (a.profileIconId != null) me.icon = `https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/${a.profileIconId}.png`; } catch (e) {}
      }
    })();
    let pop = null, popTimer = null, lastPopHiddenAt = 0;
    let stopLive = null;
    function hidePreview() { clearTimeout(popTimer); if (stopLive) { stopLive(); stopLive = null; } if (pop) { const p = pop; pop = null; lastPopHiddenAt = performance.now(); p.classList.remove('show'); setTimeout(() => p.remove(), 160); } }
    // Themes: kleine App-Ansicht mit laufender Szene statt Profil-Ausschnitt
    function themePreviewHtml(o, bg, accent, text, line) {
      const tile = `background:color-mix(in srgb, ${bg} 62%, transparent);border-color:${line};color:${text}`;
      return `<canvas class="pv-bg"></canvas>
        <div class="pv-app">
          <div class="nav" style="border-color:${line};background:color-mix(in srgb, ${bg} 60%, transparent)"><i style="background:${accent};color:${bg}">Overview</i><i style="color:${text}">Profile</i><i style="color:${text}">Pass</i><i style="color:${text}">Shop</i></div>
          <h5 style="color:${accent};text-shadow:0 0 12px color-mix(in srgb, ${accent} 50%, transparent)">League of Legends</h5>
          <div class="sub" style="color:${text}">THREE-TRICK-PONY</div>
          <div class="cols">
            <div class="box" style="${tile}"><div class="who"><span class="cos-border cos-${me.border}"><img src="${me.icon}" alt=""></span><b style="color:${accent};margin:0">${esc(me.name)}</b></div></div>
            <div class="box" style="${tile}"><b style="color:${accent}">Today</b><div><span>First Win</span><span style="color:${accent}">+400 XP</span></div><div><span>Grinder</span><span style="color:${accent}">+250 XP</span></div></div>
          </div>
        </div>
        <div class="pv-label">The whole app in ${esc(o.name)}</div>`;
    }
    function showPreview(offerEl, o) {
      hidePreview();
      const theme = o.type === 'theme' ? o.themeKey : null;
      const border = o.type === 'border' ? o.id : me.border;
      const frame = o.type === 'frame' ? o.id : me.frame;
      const cs = getComputedStyle(document.documentElement);
      const [bg, accent, text, line] = theme && PALETTE[theme] ? PALETTE[theme] : ['--bg', '--gold', '--text', '--border'].map(v => cs.getPropertyValue(v).trim());
      const tile = `background:color-mix(in srgb, ${bg} 70%, transparent);border-color:${line}`;
      const el = document.createElement('div');
      el.className = 'pv-pop' + (theme ? ' theme' : '');
      el.dataset.for = o.id;
      el.style.background = bg;
      if (theme) el.innerHTML = themePreviewHtml(o, bg, accent, text, line);
      else el.innerHTML = `
        <div class="pv-board${frame ? ` pframe pframe-${frame}` : ''}">
          <div class="pv-card" style="${tile};color:${text}">
            <span class="cos-border cos-${border}"><img src="${me.icon}" alt=""></span>
            <span><b style="color:${accent}">${esc(me.name)}</b><small style="color:${text};opacity:.75">Level ${me.level}</small></span>
          </div>
          <div class="pv-row"><span style="${tile}"></span><span style="${tile}"></span></div>
        </div>
        <div class="pv-label">Your profile with ${esc(o.name)}</div>`;
      document.body.appendChild(el);
      const r = offerEl.getBoundingClientRect();
      const pw = theme ? 460 : 320, ph = theme ? 270 : 200;
      let left = r.left + r.width / 2 - pw / 2, top = r.top - ph - 34;
      if (top < 70) top = r.bottom + 14;
      if (top + ph > innerHeight - 10) top = Math.max(10, innerHeight - ph - 10);
      left = Math.max(12, Math.min(innerWidth - pw - 12, left));
      Object.assign(el.style, { left: `${left}px`, top: `${top}px` });
      if (theme && window.TTPThemePreviewLive) stopLive = window.TTPThemePreviewLive(theme, el.querySelector('.pv-bg'));
      const board = el.querySelector('.pv-board');
      if (frame && board && window.TTPCos) window.TTPCos.decorateFrame(board, frame);
      pop = el;
      requestAnimationFrame(() => el.classList.add('show'));
    }
    document.querySelector('.shop').addEventListener('mouseover', e => {
      const offerEl = e.target.closest('.offer');
      if (!offerEl || (pop && pop.dataset.for === offerEl.dataset.id)) return;
      const o = [...shop.daily, ...shop.weekly].find(x => x.id === offerEl.dataset.id);
      if (!o) return;
      clearTimeout(popTimer);
      // Von Vorschau zu Vorschau springen: sofort statt erneut 250 ms warten
      const warm = pop || performance.now() - lastPopHiddenAt < 400;
      popTimer = setTimeout(() => showPreview(offerEl, o), warm ? 0 : 250);
    });
    document.querySelector('.shop').addEventListener('mouseout', e => {
      const offerEl = e.target.closest('.offer');
      if (offerEl && !offerEl.contains(e.relatedTarget)) hidePreview();
    });

    // ----- Kaufen: zwei Klicks (Preis -> "Buy for ...?") -----
    document.querySelector('.shop').addEventListener('click', async e => {
      const v = e.target.closest('[data-voucher]');
      if (v) {
        const id = v.dataset.voucher, key = 'v:' + id;
        if (!buyConfirm.has(key)) {
          buyConfirm.clear(); buyConfirm.add(key); render();
          setTimeout(() => { if (buyConfirm.delete(key)) render(); }, 4000);
          return;
        }
        buyConfirm.clear();
        let r;
        try { r = await (await fetch('/api/shop/buy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, voucher: true }) })).json(); } catch (err) { r = { ok: false, error: 'Could not reach the app server.' }; }
        buyMsg[id] = r.ok ? "It's yours - voucher used! Equip it in your profile." : (r.error || 'Something went wrong.');
        await load();
        return;
      }
      const b = e.target.closest('[data-buy]');
      if (!b) return;
      const id = b.dataset.buy;
      if (!buyConfirm.has(id)) {
        buyConfirm.clear(); buyConfirm.add(id); render();
        setTimeout(() => { if (buyConfirm.delete(id)) render(); }, 4000);
        return;
      }
      buyConfirm.clear();
      let r;
      try { r = await (await fetch('/api/shop/buy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })).json(); } catch (err) { r = { ok: false, error: 'Could not reach the app server.' }; }
      buyMsg[id] = r.ok ? `It's yours!${r.usedCoupon ? ' (coupon used)' : ''} Equip it in your profile.` : (r.error || 'Something went wrong.');
      await load();
    });

    // ----- Consumables -----
    function ls(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function progressionContext() {
      let champions = [];
      try { champions = JSON.parse(ls('ttp_selected_champs') || '[]'); } catch (e) {}
      return { role: ls('ttp_pool_role') || '', champions: JSON.stringify(champions.map(c => ({ id: c.id, name: c.name }))) };
    }
    const confirming = new Set();
    const goodMsg = {};
    function renderGoods() {
      document.getElementById('goodsReset').textContent = `new in ${until(shop.consumablesResetAt)}`;
      document.getElementById('goods').innerHTML = (shop.consumables || [null, null]).map((g, i) => {
        if (!g) return '<div class="good empty">The merchant has nothing here today.</div>';
        const label = g.sold ? 'Used' : g.unavailable ? g.unavailable : confirming.has(i) ? `Use now? 🪙 ${fmtNum(g.price)}` : `Buy & use · 🪙 ${fmtNum(g.price)}`;
        const disabled = g.sold || !!g.unavailable || shop.coins < g.price;
        return `<div class="good${g.sold ? ' sold' : ''}">
          <span class="good-icon">${g.icon}</span>
          <span class="good-name">${esc(g.name)}</span>
          <span class="good-desc">${esc(g.desc)}</span>
          <button type="button" class="good-buy${confirming.has(i) ? ' confirm' : ''}" data-slot="${i}"${disabled ? ' disabled' : ''}>${!g.sold && !g.unavailable && shop.coins < g.price ? 'Not enough coins' : label}</button>
          ${goodMsg[i] ? `<span class="good-msg">${esc(goodMsg[i])}</span>` : ''}
        </div>`;
      }).join('');
      // Immer 3 Buff-Plaetze (max. 3 gleichzeitig - "man muss smart sein")
      const buffs = shop.buffs || [];
      const max = shop.maxBuffs || 3;
      document.getElementById('buffCount').textContent = `${buffs.length} / ${max}`;
      document.getElementById('buffs').innerHTML = Array.from({ length: max }, (_, i) => {
        const b = buffs[i];
        return b
          ? `<div class="buff"><span>${esc(b.label)}${b.detail ? ` <small>· ${esc(b.detail)}</small>` : ''}</span><span class="buff-time">⏳ ${until(b.expiresAt)}</span>${discardBtn(b)}</div>`
          : '<div class="buff free">Free slot</div>';
      }).join('');
      document.getElementById('voucherSlot').innerHTML = shop.voucher
        ? `<div class="voucher-head">Voucher</div><div class="voucher" title="From pass step 30+5: one free Refined or Fancy item from your current offers">🎫 Free Refined or Fancy item<span class="buff-time">⏳ ${until(shop.voucher.expiresAt)}</span></div>`
        : '';
    }

    // Buff entfernen: Notausgang ohne Erstattung, danach 24 h Pause
    let confirmDiscard = null;
    function discardBtn(b) {
      if (shop.discardAvailableAt) return `<button type="button" class="buff-x" disabled title="You can remove a buff again in ${until(shop.discardAvailableAt)}">✕ in ${until(shop.discardAvailableAt)}</button>`;
      const c = confirmDiscard === b.kind;
      return `<button type="button" class="buff-x${c ? ' confirm' : ''}" data-discard="${b.kind}" title="Remove this buff - the coins are lost, and you can only do this once every 24 hours">${c ? 'Remove? Coins are lost' : '✕'}</button>`;
    }
    document.getElementById('buffs').addEventListener('click', async e => {
      const b = e.target.closest('[data-discard]');
      if (!b || b.disabled) return;
      const kind = b.dataset.discard;
      if (confirmDiscard !== kind) {
        confirmDiscard = kind;
        renderGoods();
        setTimeout(() => { if (confirmDiscard === kind) { confirmDiscard = null; renderGoods(); } }, 4000);
        return;
      }
      confirmDiscard = null;
      try { await fetch('/api/shop/buff/discard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind }) }); } catch (err) {}
      await load();
    });

    async function buyGood(slot, choice) {
      let result;
      try {
        const res = await fetch('/api/shop/consumable', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot, choice, ...progressionContext() })
        });
        result = await res.json();
      } catch (e) { result = { ok: false, error: 'Could not reach the app server.' }; }
      if (!result.ok) { goodMsg[slot] = result.error || 'Something went wrong.'; renderGoods(); return; }
      // Probe-Cosmetic gleich anlegen ("anprobieren")
      if (result.id === 'try_on' && result.cosmetic) {
        const c = result.cosmetic;
        if (c.type === 'theme') {
          try { localStorage.setItem('ttp_theme', c.themeKey); } catch (e) {}
          document.documentElement.setAttribute('data-theme', c.themeKey);
        } else {
          try { await fetch('/api/cosmetics/equip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: c.type, id: c.id }) }); } catch (e) {}
        }
        goodMsg[slot] = `${c.name} is yours for 24 hours - already equipped.`;
      } else if (result.id === 'mystery' && result.cosmetic) {
        goodMsg[slot] = `You got ${result.cosmetic.name}! It's in your collection.`;
      } else {
        goodMsg[slot] = 'Done!';
      }
      await load();
    }

    function openTryOn(slot) {
      const opts = shop.tryOn || [];
      const ov = document.createElement('div');
      ov.className = 'pick-overlay';
      const prev = c => c.type === 'border' ? `<span class="cos-border cos-${c.id}"><span class="cos-fill"></span></span>`
        : c.type === 'frame' ? `<span class="mini-frame mini-frame-${c.id}"></span>` : `<span class="mini-theme mini-theme-${c.themeKey}"></span>`;
      ov.innerHTML = `<div class="pick-box"><h3>Try It On</h3><p>Pick something you don't own yet - it's yours for 24 hours.</p>
        <div class="pick-grid">${opts.map(c => `<button type="button" class="pick-item" data-pick="${c.id}">${prev(c)}${esc(c.name)}<small class="rar rar-${c.rarity}">${RARITY_LABEL[c.rarity] || ''}</small></button>`).join('')}</div>
        <button type="button" class="pick-cancel">Cancel</button></div>`;
      document.body.appendChild(ov);
      ov.addEventListener('click', e => {
        const p = e.target.closest('[data-pick]');
        if (p) { ov.remove(); buyGood(slot, p.dataset.pick); return; }
        if (e.target === ov || e.target.closest('.pick-cancel')) ov.remove();
      });
    }

    document.getElementById('goods').addEventListener('click', e => {
      const b = e.target.closest('.good-buy');
      if (!b || b.disabled) return;
      const slot = Number(b.dataset.slot);
      // Zwei Klicks: erst "Use now?", dann kaufen (sofort eingesetzt, nicht aufhebbar)
      if (!confirming.has(slot)) {
        confirming.add(slot);
        renderGoods();
        setTimeout(() => { if (confirming.delete(slot)) renderGoods(); }, 4000);
        return;
      }
      confirming.delete(slot);
      const good = shop.consumables[slot];
      if (good && good.id === 'try_on') openTryOn(slot);
      else buyGood(slot);
    });

    function render() {
      renderHelp();
      renderGoods();
      document.getElementById('coinBalance').textContent = `🪙 ${fmtNum(shop.coins)}`;
      document.getElementById('weeklyOffers').innerHTML = offersHtml(shop.weekly);
      document.getElementById('dailyOffers').innerHTML = offersHtml(shop.daily);
      document.getElementById('weeklyReset').textContent = `new in ${until(shop.weeklyResetAt)}`;
      document.getElementById('dailyReset').textContent = `new in ${until(shop.dailyResetAt)}`;
      renderWheelSmall();
    }

    // shop-scenes-2.js laedt evtl. erst nach dem Shop - kurz nachfassen
    function warmThemes(keys, tries = 0) {
      if (window.TTPThemeLiveWarm) window.TTPThemeLiveWarm(keys);
      else if (tries < 20) setTimeout(() => warmThemes(keys, tries + 1), 250);
    }
    async function load() {
      try {
        const res = await fetch('/api/shop');
        shop = await res.json();
        // Heute schon gedreht: das Rad steht auf dem gewonnenen Feld
        if (shop.wheel.todayIndex != null) {
          const segDeg = 360 / shop.wheel.segments.length;
          rotation = 360 - (shop.wheel.todayIndex * segDeg + segDeg / 2);
        }
        render();
        warmThemes([...shop.daily, ...shop.weekly].filter(o => o.type === 'theme').map(o => o.themeKey));
      } catch (e) {
        document.getElementById('wheelStatus').textContent = 'Shop could not be loaded.';
      }
    }

    // ----- Gross-Ansicht: Klick aufs Rad -> zoomt in die Mitte, dort drehen -----
    let big = null;
    let rotation = 0; // aktuelle Drehung des Rads (bleibt nach dem Dreh dort stehen)
    let spinning = false;

    function bigRect() {
      const s = Math.min(innerWidth, innerHeight) * 0.62;
      return { left: (innerWidth - s) / 2, top: (innerHeight - s) / 2 - 40, width: s, height: s };
    }
    const place = (el, r) => Object.assign(el.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });

    function openWheel() {
      if (big || !shop) return;
      const small = document.getElementById('wheelSmall');
      const from = small.getBoundingClientRect();
      const overlay = document.createElement('div');
      overlay.className = 'wheel-overlay';
      const wheel = document.createElement('div');
      wheel.className = 'wheel-big';
      wheel.innerHTML = wheelSvg(shop.wheel.segments);
      wheel.querySelector('.wheel-rot').style.transform = `rotate(${rotation}deg)`;
      const ui = document.createElement('div');
      ui.className = 'wheel-big-ui';
      ui.innerHTML = `<div class="spin-result" id="spinResult"></div>
        <button type="button" class="spin-btn" id="spinBtn"${shop.wheel.canSpin ? '' : ' disabled'}>${shop.wheel.canSpin ? 'Spin' : 'Spun today'}</button>
        <div class="spin-hint">${shop.wheel.canSpin ? 'One free spin per day' : `Next free spin in ${until(shop.wheel.nextSpinAt)}`}</div>`;
      document.body.append(overlay, wheel, ui);
      place(wheel, from);
      small.style.visibility = 'hidden';
      big = { overlay, wheel, ui, small };
      requestAnimationFrame(() => requestAnimationFrame(() => {
        overlay.classList.add('open');
        const to = bigRect();
        place(wheel, to);
        ui.style.top = `${to.top + to.height + 14}px`;
        ui.classList.add('show');
      }));
      overlay.addEventListener('click', closeWheel);
      ui.querySelector('#spinBtn').addEventListener('click', spin);
    }

    function closeWheel() {
      if (!big || spinning) return;
      const { overlay, wheel, ui, small } = big;
      overlay.classList.remove('open');
      ui.classList.remove('show');
      place(wheel, small.getBoundingClientRect());
      big = null;
      setTimeout(() => {
        overlay.remove(); wheel.remove(); ui.remove();
        small.style.visibility = '';
        renderWheelSmall();
      }, 460);
    }

    async function spin() {
      if (!big || spinning || !shop.wheel.canSpin) return;
      spinning = true;
      const btn = big.ui.querySelector('#spinBtn');
      btn.disabled = true;
      let result;
      try {
        const res = await fetch('/api/shop/spin', { method: 'POST' });
        result = await res.json();
      } catch (e) { result = { ok: false, error: 'Could not reach the app server.' }; }
      if (!result.ok) {
        big.ui.querySelector('#spinResult').textContent = result.error || 'Spin failed.';
        spinning = false;
        return;
      }
      // Ziel: Mitte des gewonnenen Felds unter den Zeiger (oben), 6 volle Runden
      const n = shop.wheel.segments.length, segDeg = 360 / n;
      const jitter = (Math.random() - 0.5) * segDeg * 0.6;
      const target = 360 - (result.index * segDeg + segDeg / 2) + jitter;
      rotation = rotation - (rotation % 360) + 360 * 6 + target;
      const rot = big.wheel.querySelector('.wheel-rot');
      rot.style.transition = 'transform 4.6s cubic-bezier(0.12, 0.7, 0.12, 1)';
      rot.style.transform = `rotate(${rotation}deg)`;
      setTimeout(() => {
        shop.coins = result.totalCoins;
        shop.wheel.canSpin = false;
        document.getElementById('coinBalance').textContent = `🪙 ${fmtNum(shop.coins)}`;
        if (big) {
          big.ui.querySelector('#spinResult').textContent = `+${fmtNum(result.coins)} coins`;
          btn.textContent = 'Spun today';
          big.ui.querySelector('.spin-hint').textContent = `Next free spin in ${until(shop.wheel.nextSpinAt)}`;
        }
        spinning = false;
      }, 4700);
    }

    document.getElementById('wheelSmall').addEventListener('click', openWheel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeWheel(); });
    window.addEventListener('resize', () => { if (big) place(big.wheel, bigRect()); });

    // (privat)
    const SEP_KEY = 'ttp_wheel_sep';
    function sepOn() { try { return localStorage.getItem(SEP_KEY) === '1'; } catch (e) { return false; } }
    let cornerClicks = 0, cornerT = null;
    document.getElementById('cornerSpot').addEventListener('click', () => {
      cornerClicks++;
      clearTimeout(cornerT);
      cornerT = setTimeout(() => { cornerClicks = 0; }, 2500);
      if (cornerClicks < 13) return;
      cornerClicks = 0;
      try { localStorage.setItem(SEP_KEY, sepOn() ? '0' : '1'); } catch (e) {}
      document.querySelectorAll('.wheel-svg').forEach(s => s.classList.toggle('sep', sepOn()));
    });

    load();
    setInterval(() => { if (shop && !big) render(); }, 60000);

    document.getElementById('settingsGearBtn').addEventListener('click', () => {
      if (window.ttpMain) window.ttpMain.openSettings();
    });
    document.getElementById('quitBtn').addEventListener('click', () => {
      const ok = confirm('Quit Three-Trick-Pony completely? It will no longer run in the background (no more update checks or LP tracking until you start it again).');
      if (window.ttpMain) window.ttpMain.restoreFocus();
      if (!ok) return;
      if (window.ttpMain) window.ttpMain.quitApp();
    });
  </script>
</body>
</html>
