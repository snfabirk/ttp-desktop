<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sky Isles - Fancy shop theme (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): Shop-Theme "Sky Isles" (Fancy, bewegt, ohne
     Easter Egg). Goldene Stunde ueber einem Wolkenmeer:
     - Shader: Himmel Tiefblau -> Gold, tiefe Sonne mit Lichtstrahlen, drei Wolkenschichten
       mit Parallaxe (Oberkante sonnenbeschienen, Schattenseite lavendel), schwebende
       Inseln (Fels mit Lichtkante zur Sonne, Grasdecke mit Baeumchen, Wasserfall mit
       Gischt), hintere Inseln im Dunst
     - Overlay: Vogelschwaerme ziehen ab und zu vorbei
     Pausiert, wenn das Fenster nicht sichtbar ist. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --panel-bg: rgba(22, 28, 58, .5); --border: #5a6aa0; --accent: #ffd27a; --text: #fdf6ea; --text-dim: #c8cce0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2448; color: var(--text); font-family: Georgia, serif; }
  #gl, #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #fx { pointer-events: none; }
  .stage { position: relative; z-index: 2; pointer-events: none; }
  .stage > * { pointer-events: auto; }
  .nav { position: fixed; top: 18px; left: 24px; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel-bg); backdrop-filter: blur(10px); z-index: 3; }
  .nav span { padding: 5px 11px; border-radius: 14px; font-family: 'Cinzel', serif; font-size: .78rem; color: var(--text-dim); }
  .nav span.on { background: linear-gradient(180deg, #ffe4a0, #f0a850); color: #2a1a06; }
  header { text-align: center; padding-top: 34px; }
  h1 { margin: 0; font-family: 'Cinzel', serif; font-weight: 900; font-size: 3rem; letter-spacing: 3px; background: linear-gradient(180deg, #fff2c8 0%, #ffd27a 50%, #e89a40 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(30, 30, 80, .5)); }
  .subtitle { margin: 6px 0 0; color: var(--text-dim); font-style: italic; letter-spacing: 6px; text-transform: uppercase; }
  .wrap { max-width: 1000px; margin: 34px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 0 30px; }
  .card { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; box-shadow: 0 6px 24px rgba(10, 10, 40, .4), inset 0 1px 0 rgba(255, 230, 170, .18); }
  .card h3 { margin: 0 0 8px; color: var(--accent); font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(90, 106, 160, .45); font-size: .9rem; }
  .row:last-child { border-bottom: none; }
  .xp { color: var(--accent); }
  .muted { color: var(--text-dim); font-size: .9rem; }
  .tag { display: inline-block; margin-bottom: 8px; padding: 1px 8px; border: 1px dashed #7a86b0; border-radius: 9px; color: #9aa4c8; font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div class="nav"><span class="on">⌂ Overview</span><span>Profile</span><span>Challenge</span><span>Pass</span><span>Trophies</span><span>Shop</span></div>
<div class="stage">
  <header><h1>League of Legends</h1><p class="subtitle">Three-Trick-Pony</p></header>
  <div class="wrap">
    <div><span class="tag">Shop theme · Fancy</span>
      <div class="card"><h3>Today</h3>
        <div class="row"><span>First Win of the Day</span><span class="xp">+400 XP</span></div>
        <div class="row"><span>Champion of the Day</span><span class="xp">+500 XP</span></div>
        <div class="row"><span>In the Thick of It</span><span class="xp">+300 XP</span></div>
      </div></div>
    <div><span class="tag">Readability check</span>
      <div class="card"><h3>Last game</h3>
        <div class="row"><span>Ekko · Jungle</span><span class="xp">Victory</span></div>
        <div class="row"><span>KDA</span><span>8 / 2 / 11</span></div>
        <div class="muted" style="margin-top:8px">+725 XP · LP Bank 64 / 100</div>
      </div></div>
  </div>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float T;
const vec2 SUN = vec2(-.42, -.06);
float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n2(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * n2(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= .5; } return s; }
// bauschige Kuppeln (Kumulus-Oberkante): Halbkreise mit zufaelliger Groesse
float domes(float x, float seed) {
  float c = floor(x), h = 0.;
  for (int k = -1; k <= 1; k++) { float ck = c + float(k), r = .55 + .45 * h21(vec2(ck, seed)), cx = ck + .5 + (h21(vec2(ck, seed + 1.)) - .5) * .5, d = (x - cx) / r; h = max(h, sqrt(max(0., 1. - d * d)) * r); }
  return h;
}
vec3 skyBase(vec2 p) {
  vec3 col = mix(vec3(1., .74, .42), vec3(.95, .6, .55), smoothstep(-.2, .05, p.y));
  col = mix(col, vec3(.48, .48, .78), smoothstep(0., .25, p.y));
  return mix(col, vec3(.1, .16, .42), smoothstep(.2, .55, p.y));
}
vec3 skyCol(vec2 p) {
  vec3 col = skyBase(p);
  vec2 d = p - SUN; float l = length(d);
  col += vec3(1., .8, .45) * exp(-l * 3.) * .85 + vec3(1., .96, .82) * smoothstep(.045, .035, l);
  col += vec3(1., .85, .55) * pow(n2(vec2(atan(d.y, d.x) * 9., T * .04)), 3.) * exp(-l * 1.6) * .35 * smoothstep(.04, .1, l);
  col = mix(col, col + vec3(.25, .16, .12), smoothstep(.6, .8, fbm(vec2(p.x * 1.2 + T * .006, p.y * 5.))) * smoothstep(.05, .3, p.y) * .5);
  return col;
}
void island(vec2 p, vec2 c, float w, float dep, float seed, float far, inout vec3 col) {
  c.y += sin(T * .35 + seed) * .006;
  float u = (p.x - c.x) / w;
  if (abs(u) > 1.) return;
  float top = c.y + .012 * (1. - u * u) + .005 * n2(vec2(p.x * 40., seed));
  float crowns = .03 * w / .17 * domes(p.x / w * 9., seed + 4.) * smoothstep(.95, .6, abs(u + .1));
  float bot = c.y - dep * pow(max(0., 1. - u * u), .8) - .03 * (fbm(vec2(p.x * 26., seed)) - .5) - .02 * pow(max(0., 1. - abs(u * 3. - .4)), 3.);
  if (p.y > top + crowns || p.y < bot) return;
  float sunSide = smoothstep(.5, -1., u);
  float hgt = clamp((top - p.y) / max(top - bot, .001), 0., 1.);
  vec3 c2;
  if (p.y > top) {                                   // Baumkronen
    float lit = smoothstep(.3, -.6, u) * .7 + .3 * n2(vec2(p.x * 200., p.y * 200.));
    c2 = mix(vec3(.12, .24, .14), vec3(.5, .62, .26), lit);
  } else if (p.y > top - .007) {                     // Grasnarbe
    c2 = mix(vec3(.22, .4, .18), vec3(.66, .7, .3), sunSide);
  } else {                                           // Fels: Gesteinsschichten, Sonnenseite warm, Unterseite dunkel
    float strata = .5 + .5 * sin(p.y * 160. + fbm(vec2(p.x * 12., seed)) * 6.);
    vec3 rock = mix(vec3(.34, .24, .3), vec3(.5, .36, .34), strata * .6 + .4 * fbm(vec2(p.x * 30., p.y * 40.) + seed));
    rock = mix(rock, rock * vec3(1.6, 1.3, 1.) + vec3(.12, .06, .0), sunSide * (1. - hgt) * .9);
    rock *= mix(1., .45, smoothstep(.3, 1., hgt));
    float edgeL = c.x - w * pow(max(0., 1. - pow(hgt, 1.25)), .5);
    rock += vec3(1., .7, .4) * smoothstep(.012, 0., abs(p.x - edgeL)) * .45 * (1. - hgt);
    c2 = rock;
  }
  col = mix(c2, skyBase(p) * vec3(.95, .9, 1.), far * .55);
}
void fall(vec2 p, vec2 c, float w, float seed, float far, inout vec3 col) {
  // Wasserfall: ohne harte Grenzen - Breite, Deckkraft und Schleier laufen weich aus
  c.y += sin(T * .35 + seed) * .006;
  float fx = c.x + w * .5, drop = c.y - p.y;
  if (drop < -.004) return;
  float spread = 1. + drop * 2.2, wd = (.004 + w * .022) * spread;
  float dx = abs(p.x - fx + sin(p.y * 30. + seed) * .0015);
  float s = smoothstep(wd, wd * .2, dx) * smoothstep(-.004, .01, drop);
  float streak = .5 + .5 * n2(vec2((p.x - fx) * 260. / spread, p.y * 22. + T * 5.));
  float fade = exp(-drop * 3.5);                                   // wird nach unten duenner und loest sich auf
  vec3 wc = mix(vec3(.95, .97, 1.), skyBase(p), far * .5);
  col = mix(col, wc, s * (.35 + .5 * streak) * fade);
  col += vec3(.9, .92, 1.) * exp(-dx / (wd * 1.6)) * .06 * fade * smoothstep(-.004, .02, drop);   // zarter Schleier, weich
}
// Wolkenfeld: weiches Maximum aus Bauschen-Kreisen und dem Wolkenkoerper unten -> keine Naehte zwischen Bauschen
float cloudF(vec2 q, float fk, float cs, float base) {
  float cell = floor(q.x / cs), kk = cs * .07, acc = exp(clamp((base - q.y) / kk, -30., 30.));
  for (int j = -2; j <= 2; j++) for (int row = 0; row < 3; row++) {
    float cj = cell + float(j), fr = float(row);
    float rnd = h21(vec2(cj, fk * 13. + fr * 7.)), rnd2 = h21(vec2(cj + 31., fk * 5. + fr));
    vec2 cc = vec2((cj + .5 + fr * .5 + (rnd2 - .5) * .6) * cs, base + cs * (.2 + .35 * rnd) - fr * cs * .55);
    float r = cs * (.5 + .5 * rnd) * (1. - fr * .1);
    acc += exp(clamp((r - length(q - cc)) / kk, -30., 30.));
  }
  return log(acc) * kk;
}
void main() {
  vec2 p = (gl_FragCoord.xy - .5 * R) / R.y;
  vec3 col = skyCol(p);
  island(p, vec2(.62, .06), .07, .06, 3., 1., col);
  island(p, vec2(-.02, .13), .05, .05, 9., 1., col);
  for (int k = 0; k < 3; k++) {
    float fk = float(k), sp = .008 + fk * .014;
    // Kumulus: Feld aus Bauschen, Normale aus dem Feldgradienten (weich ueber alle Bausche hinweg)
    float cs = .065 + fk * .032, base = -.25 - fk * .085, ex = p.x + T * sp;
    vec2 q = vec2(ex, p.y);
    float f = cloudF(q, fk, cs, base);
    float m = smoothstep(-.003, .003, f);
    if (m > .001) {
      float e = .002;
      vec2 grad = vec2(cloudF(q + vec2(e, 0.), fk, cs, base) - f, cloudF(q + vec2(0., e), fk, cs, base) - f) / e;
      vec2 nrm = -grad / max(length(grad), .0001);
      vec2 L = normalize(vec2(-.75, .65));
      float tex = fbm(vec2(ex * (14. + fk * 4.), p.y * 16. + fk * 3.));
      float edgeK = 1. - smoothstep(0., cs * .45, f);                         // nahe der Oberflaeche: gerichtetes Licht
      float lit = mix(.38 + .12 * tex, clamp(dot(nrm, L) * .65 + .45, 0., 1.), edgeK);
      lit *= .88 + .25 * tex;
      vec3 shade = mix(vec3(.44, .38, .64), vec3(.64, .55, .76), tex);
      vec3 cloud = mix(shade, vec3(1., .86, .64), lit);
      cloud += vec3(1., .92, .8) * smoothstep(.007, 0., f) * max(dot(nrm, L), 0.) * .45;   // Silberrand
      cloud *= 1. - smoothstep(0., .14, base - p.y) * .25;
      cloud = mix(cloud, skyBase(vec2(p.x, base + .08)), .5 - fk * .22);
      col = mix(col, cloud, m);
    }
    if (k == 0) {
      island(p, vec2(-.68, .16), .17, .2, 1., 0., col); fall(p, vec2(-.68, .16), .17, 1., 0., col);
      island(p, vec2(.52, -.02), .12, .14, 5., .25, col); fall(p, vec2(.52, -.02), .12, 5., .25, col);
    }
  }
  col *= mix(1., .8, smoothstep(.15, .5, p.y));
  col *= 1. - .2 * dot(p * vec2(.9 / (R.x / R.y) * 1.6, 1.), p * vec2(.9 / (R.x / R.y) * 1.6, 1.));
  col = 1. - exp(-col * 1.4);
  gl_FragColor = vec4(pow(col, vec3(1.05)), 1.);
}
</script>
<script>
const rand = (a, b) => a + Math.random() * (b - a);
const glc = document.getElementById('gl'), gl = glc.getContext('webgl', { antialias: false });
const fx = document.getElementById('fx'), cx = fx.getContext('2d');
let W = 0, H = 0, D = 1;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T');
const GLS = .8;
function resize() {
  D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  glc.width = Math.round(W * GLS); glc.height = Math.round(H * GLS); gl.viewport(0, 0, glc.width, glc.height);
  fx.width = W * D; fx.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0);
}
addEventListener('resize', resize); resize();
// Vogelschwaerme: V-Formation, Fluegelschlag, ziehen von rechts nach links
let flocks = [], nextFlock = 2;
function spawnFlock() { const n = 5 + (Math.random() * 6 | 0), y = rand(H * .2, H * .55), s = rand(.6, 1.3), birds = [];
  for (let k = 0; k < n; k++) { const row = Math.ceil(k / 2), side = k % 2 ? 1 : -1; birds.push({ dx: row * 16 * s, dy: side * row * 9 * s + rand(-2, 2), ph: rand(0, 6) }); }
  flocks.push({ x: W + 40, y, s, v: rand(28, 45) * s, birds }); }
let running = false;
function frame(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000); frame.last = now; const t = now / 1000;
  gl.uniform2f(uR, glc.width, glc.height); gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3);
  cx.clearRect(0, 0, W, H);
  nextFlock -= dt; if (nextFlock <= 0) { nextFlock = rand(7, 14); spawnFlock(); }
  flocks = flocks.filter(f => f.x > -300);
  flocks.forEach(f => {
    f.x -= f.v * dt; f.y += Math.sin(t * .5) * 3 * dt;
    cx.strokeStyle = `rgba(40, 36, 70, ${.55 + .2 * f.s})`; cx.lineWidth = 1.3 * f.s; cx.lineCap = 'round';
    f.birds.forEach(b => { const x = f.x + b.dx, y = f.y + b.dy, flap = Math.sin(t * 9 + b.ph) * 4 * f.s, ww = 6 * f.s;
      cx.beginPath(); cx.moveTo(x - ww, y - flap); cx.quadraticCurveTo(x - ww * .4, y - flap * .3 - 1, x, y); cx.quadraticCurveTo(x + ww * .4, y - flap * .3 - 1, x + ww, y - flap); cx.stroke(); });
  });
  requestAnimationFrame(frame);
}
function setRunning(on) { if (on === running) return; running = on; if (on) { frame.last = 0; requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
setRunning(!document.hidden);
</script>
</body>
</html>
