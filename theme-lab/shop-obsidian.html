<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Obsidian Crown - Animated shop border (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): Shop-Border "Obsidian Crown"
     (Animated). Schwebende Splitter aus Vulkanglas umkreisen das Bild in zwei
     gegenlaeufigen Bahnen, jeder Splitter dreht sich und blitzt auf, wenn ein
     Lichtstreifen ueber ihn wandert; darunter glimmen Magma-Adern im Ring.
     Easter Egg: 5x aufs grosse Bild -> die Splitter ziehen sich zusammen, der
     Ring zerspringt in einer lila Schockwelle und setzt sich neu zusammen. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a1428; color: #f0e6d2; font-family: Georgia, serif; overflow: hidden; }
  .stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  h1 { margin: 0; font-family: 'Cinzel', serif; color: #c8aa6e; letter-spacing: 3px; }
  .row { display: flex; align-items: center; gap: 70px; }
  .card { display: flex; align-items: center; gap: 30px; padding: 26px 36px; border: 1px solid #785a28; border-radius: 12px; background: rgba(10, 20, 40, .6); }
  .name { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #c8aa6e; }
  .muted { color: #a09b8c; }
  .obs { position: relative; flex-shrink: 0; }
  .obs img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .obs canvas { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; pointer-events: none; }
  .label { text-align: center; color: #6f6a5e; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px; }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #6f6a5e; font-size: 13px; border: 1px solid #3a3020; border-radius: 14px; padding: 6px 14px; }
</style>
</head>
<body>
<div class="stage">
  <h1>Obsidian Crown</h1>
  <div class="card">
    <div class="obs" id="big" style="width:120px;height:120px"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" onerror="this.src='https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Evelynn.png'" alt=""><canvas></canvas></div>
    <div><div class="name">LUCKSHOT#796</div><div class="muted">Pony since 09.10.2026 · Level 17</div></div>
  </div>
  <div class="row">
    <div><div class="obs" style="width:86px;height:86px"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><canvas></canvas></div><div class="label">Profile</div></div>
    <div><div class="obs" style="width:40px;height:40px"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><canvas></canvas></div><div class="label">Overview card</div></div>
    <div><div class="obs" style="width:22px;height:22px"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><canvas></canvas></div><div class="label">Pass tile</div></div>
  </div>
</div>
<div class="hint">psst... obsidian is glass. glass breaks. click the big one a few times</div>

<script>
const rand = (a, b) => a + Math.random() * (b - a);
const DPR = Math.min(2, devicePixelRatio || 1);

function makeShard(R, k, n, orbit) {
  // unregelmaessiges, laengliches Splitter-Polygon
  const L = R * rand(.22, .34) * (orbit ? .8 : 1), Wd = L * rand(.35, .55);
  const pts = [[L, 0], [L * .2, -Wd * rand(.7, 1)], [-L * rand(.6, .9), -Wd * rand(.2, .5)], [-L, Wd * rand(.1, .3)], [-L * .1, Wd * rand(.7, 1)]];
  return { pts, base: k / n * Math.PI * 2 + rand(-.08, .08), rad: R * (orbit ? 1.42 : 1.15) + rand(-1, 1) * R * .04, spin: rand(-1.2, 1.2), rot: rand(0, 6.28), bob: rand(0, 6.28), orbit, dx: 0, dy: 0, vx: 0, vy: 0 };
}

const rings = [...document.querySelectorAll('.obs')].map(el => {
  // das grosse Bild bekommt eine viel groessere Zeichenflaeche, damit die
  // Splitter beim Zerspringen weit wegfliegen koennen statt abgeschnitten zu werden
  const big = el.id === 'big', S = el.offsetWidth, C = S * (big ? 6 : 2), cv = el.querySelector('canvas');
  if (big) Object.assign(cv.style, { left: '-250%', top: '-250%', width: '600%', height: '600%' });
  cv.width = C * DPR; cv.height = C * DPR; const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = S / 2, small = S < 50;
  const nIn = small ? 10 : 16, inner = Array.from({ length: nIn }, (_, k) => makeShard(R, k, nIn, false));
  const outer = small ? [] : Array.from({ length: 7 }, (_, k) => makeShard(R, k, 7, true));
  return { el, c, C, R, small, shards: [...inner, ...outer], burst: null };
});

function drawShard(c, s, x, y, ang, light, R, heat, t) {
  // Glas-Look: zwei Facetten (Licht/Schatten), innere lila Brechung, scharfe
  // Kante mit Randlicht, Glanzstreifen, Funkeln wenn das Licht drueberwandert
  const P = s.pts, k = Math.max(.6, R * .012);
  const amb = .25 + .15 * Math.sin(t * 2 + s.bob);          // leises Grundschimmern
  const L = Math.min(1, light + amb * .15);
  c.save(); c.translate(x, y); c.rotate(ang);
  const path = new Path2D(); P.forEach(([px, py], i) => i ? path.lineTo(px, py) : path.moveTo(px, py)); path.closePath();
  // Leuchten um den Splitter (lila Bloom)
  if (L > .3) { c.save(); c.globalCompositeOperation = 'lighter'; c.shadowColor = `rgba(180, 100, 255, ${L})`; c.shadowBlur = R * .35 * L; c.fillStyle = `rgba(120, 60, 220, ${.25 * L})`; c.fill(path); c.restore(); }
  // Grundkoerper: tiefes Lila-Schwarz
  const base = c.createLinearGradient(P[3][0], P[3][1], P[0][0], P[0][1]);
  base.addColorStop(0, '#030107'); base.addColorStop(.5, `rgb(${22 + 60 * L}, ${6 + 20 * L}, ${44 + 110 * L})`); base.addColorStop(1, '#08040f');
  c.fillStyle = base; c.fill(path);
  // Facette 1 (zum Licht gekippt): heller, lila
  c.save(); c.clip(path);
  c.beginPath(); c.moveTo(P[0][0], P[0][1]); c.lineTo(P[1][0], P[1][1]); c.lineTo(P[2][0], P[2][1]); c.lineTo(0, 0); c.closePath();
  const f1 = c.createLinearGradient(P[1][0], P[1][1], 0, 0);
  f1.addColorStop(0, `rgba(${120 + 110 * L}, ${40 + 120 * L}, 255, ${.18 + .6 * L})`); f1.addColorStop(1, `rgba(70, 20, 150, ${.05 + .25 * L})`);
  c.fillStyle = f1; c.fill();
  // Facette 2: dunkler, mit innerer Brechung (Magenta-Schimmer)
  c.beginPath(); c.moveTo(0, 0); c.lineTo(P[2][0], P[2][1]); c.lineTo(P[3][0], P[3][1]); c.lineTo(P[4][0], P[4][1]); c.closePath();
  const f2 = c.createRadialGradient(P[3][0] * .4, P[3][1] * .4, 0, 0, 0, R * .3);
  f2.addColorStop(0, `rgba(220, 60, 255, ${.1 + .35 * L})`); f2.addColorStop(1, 'rgba(20, 8, 40, 0)');
  c.fillStyle = f2; c.fill();
  // Glanzstreifen quer ueber den Splitter (wandert mit der Drehung)
  const gx = Math.sin(t * 1.3 + s.bob) * R * .12;
  const gl = c.createLinearGradient(gx - R * .03, -R * .2, gx + R * .03, R * .2);
  gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(.45, 'rgba(255,255,255,0)'); gl.addColorStop(.5, `rgba(250, 225, 255, ${.08 + .7 * L})`); gl.addColorStop(.55, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gl; c.fillRect(-R * .5, -R * .5, R, R);
  c.restore();
  // Facettenkante + scharfes Randlicht
  c.strokeStyle = `rgba(200, 150, 255, ${.15 + .55 * L})`; c.lineWidth = k * .8; c.beginPath(); c.moveTo(P[2][0], P[2][1]); c.lineTo(0, 0); c.lineTo(P[0][0], P[0][1]); c.stroke();
  c.strokeStyle = `rgba(${150 + 100 * L}, ${70 + 150 * L}, 255, ${.45 + .55 * L})`; c.lineWidth = k; c.stroke(path);
  // Magma-Ritze
  if (heat > .05) { c.strokeStyle = `rgba(255, ${90 + 80 * heat}, 40, ${heat * .8})`; c.lineWidth = k * .8; c.beginPath(); c.moveTo(P[2][0] * .5, P[2][1] * .5); c.lineTo(P[0][0] * .6, P[0][1] * .2); c.stroke(); }
  // Funkeln an der Spitze, wenn das Licht trifft
  if (light > .55) {
    const a = (light - .55) / .45, sx = P[0][0] * .9, sy = P[0][1] * .9, sz = R * .1 * a;
    c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(255, 245, 255, ${a})`; c.lineWidth = k;
    c.beginPath(); c.moveTo(sx - sz, sy); c.lineTo(sx + sz, sy); c.moveTo(sx, sy - sz); c.lineTo(sx, sy + sz); c.stroke();
    c.fillStyle = `rgba(255, 255, 255, ${a})`; c.beginPath(); c.arc(sx, sy, k * 1.2, 0, 7); c.fill(); c.restore();
  }
  c.restore();
}

function drawRing(r, t, dt) {
  const { c, C, R } = r;
  c.clearRect(0, 0, C, C); c.save(); c.translate(C / 2, C / 2);
  const b = r.burst;
  // Phasen Easter Egg: 0-.7 zusammenziehen + gluehen, .7 Explosion, .7-2.2 fliegen, 2.2-3.4 zurueck
  let pull = 0, heatBoost = 0;
  if (b) {
    b.t += dt;
    if (b.t < .7) { pull = b.t / .7; heatBoost = pull; }
    else if (!b.blown) { b.blown = true; r.shards.forEach(s => { const a = s.base + t * (s.orbit ? -.25 : .35); const sp = rand(.9, 1.6) * R * 8; s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; }); }
    if (b.t > 3.6) r.burst = null;
  }
  // dunkler Glutschein + Magma-Adern im Grundring
  const heat = .35 + .25 * Math.sin(t * 1.7) + heatBoost * .8;
  const halo = c.createRadialGradient(0, 0, R * .9, 0, 0, R * 1.6);
  halo.addColorStop(0, `rgba(140, 60, 220, ${.22 + .2 * heatBoost})`); halo.addColorStop(1, 'rgba(140, 60, 220, 0)');
  c.fillStyle = halo; c.beginPath(); c.arc(0, 0, R * 1.6, 0, 7); c.fill();
  c.strokeStyle = '#0a0710'; c.lineWidth = R * .14; c.beginPath(); c.arc(0, 0, R * 1.06, 0, 7); c.stroke();
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 9; k++) {
    const a0 = k / 9 * 6.283 + t * .15, a1 = a0 + .35 + .2 * Math.sin(t + k);
    c.strokeStyle = `rgba(255, ${80 + 60 * Math.sin(t * 2 + k)}, 30, ${heat * (.4 + .3 * Math.sin(t * 3 + k * 2))})`; c.lineWidth = Math.max(.8, R * .025);
    c.beginPath(); for (let j = 0; j <= 6; j++) { const a = a0 + (a1 - a0) * j / 6, rr = R * 1.06 + Math.sin(j * 2.3 + k) * R * .035; j ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.stroke();
  }
  c.restore();
  // Lichtstreifen wandert ueber die Splitter
  const sweep = (t * .8) % (Math.PI * 2);
  r.shards.forEach(s => {
    const a = s.base + t * (s.orbit ? -.25 : .35);
    let x = Math.cos(a) * s.rad * (1 - pull * .25), y = Math.sin(a) * s.rad * (1 - pull * .25) + Math.sin(t * 1.5 + s.bob) * R * .03;
    if (b && b.blown) {
      if (b.t < 2.2) { s.dx += s.vx * dt; s.dy += s.vy * dt; s.vx *= .93; s.vy *= .93; }
      else { const u = Math.min(1, (b.t - 2.2) / 1.2), e = u * u * (3 - 2 * u); s.dx *= (1 - e * .25); s.dy *= (1 - e * .25); if (u >= 1) { s.dx = 0; s.dy = 0; } }
      x += s.dx; y += s.dy;
    }
    const d = Math.abs(((a - sweep + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    const light = Math.max(0, 1 - d / .8) + (b && b.t < .9 ? pull * .5 : 0);
    s.rot += s.spin * dt * (b && b.blown && b.t < 2.2 ? 6 : 1);
    drawShard(c, s, x, y, s.rot + a, Math.min(1, light), R, heat * .7, t);
  });
  // Schockwelle beim Zerspringen
  if (b && b.blown && b.t < 1.6) {
    const u = (b.t - .7) / .9;
    c.strokeStyle = `rgba(190, 130, 255, ${Math.max(0, 1 - u)})`; c.lineWidth = R * .06 * (1 - u) + 1;
    c.beginPath(); c.arc(0, 0, R * (1.1 + u * 1.8), 0, 7); c.stroke();
    c.fillStyle = `rgba(230, 200, 255, ${Math.max(0, .5 - u)})`; c.beginPath(); c.arc(0, 0, R * 1.05, 0, 7); c.arc(0, 0, R * .98, 0, 7, true); c.fill('evenodd');
  }
  c.restore();
  r.el.querySelector('img').style.filter = b && b.t < .9 ? `brightness(${1 + pull * .3}) hue-rotate(${pull * -20}deg)` : '';
}

let clicks = 0, reset = null;
document.getElementById('big').addEventListener('click', () => {
  const r = rings[0]; if (r.burst) return;
  clicks++; clearTimeout(reset); reset = setTimeout(() => { clicks = 0; }, 3000);
  if (clicks >= 5) { clicks = 0; r.burst = { t: 0, blown: false }; r.shards.forEach(s => { s.dx = 0; s.dy = 0; }); }
});

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; rings.forEach(r => drawRing(r, now / 1000, dt)); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
