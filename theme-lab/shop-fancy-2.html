<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fancy shop cosmetics 2 (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): die neuen Fancy-Shop-Cosmetics.
     Fancy = bewegt und mit Effekten, ohne Easter Egg.
     Borders: Hextech Prism (facettierte Kristalle, wandernde Lichtbrechung mit
     Regenbogen-Glanz, Goldring, schwebende Splitter), Bubble Ring (Seifenblasen
     mit schillerndem Duennfilm-Rand, wabern, platzen ab und zu und wachsen nach).
     Rahmen: Runic Vines (Ranken mit Blaettern laufen um die Karte, Lichtpulse
     wandern durch die Ranken und lassen eingeritzte Runensteine aufleuchten,
     Sporen schweben). -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a1428; color: #f0e6d2; font-family: Georgia, serif; }
  body { padding: 24px 40px 40px; }
  h1 { margin: 0 0 4px; text-align: center; font-family: 'Cinzel', serif; color: #c8aa6e; letter-spacing: 3px; font-size: 1.6rem; }
  h2 { margin: 26px 0 12px; font-family: 'Cinzel', serif; color: #b26bff; font-size: 1rem; letter-spacing: 2px; text-align: center; }
  .grid { display: flex; justify-content: center; gap: 70px; flex-wrap: wrap; }
  .item { text-align: center; }
  .item b { display: block; margin-top: 10px; font-family: 'Cinzel', serif; color: #f0e6d2; font-size: .95rem; }
  .item small { color: #a09b8c; font-size: .75rem; }
  .border { position: relative; width: 120px; height: 120px; margin: 60px auto 40px; }
  .border img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .border canvas { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; pointer-events: none; }
  .frame { position: relative; width: 420px; height: 230px; margin: 40px 40px 34px; }
  .frame .inner { position: absolute; inset: 0; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-sizing: border-box; background: rgba(10, 22, 16, .7); }
  .frame .inner span { border-radius: 8px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
  .frame .inner span:first-child { grid-column: span 2; }
  .frame canvas { position: absolute; left: -50px; top: -50px; pointer-events: none; }
</style>
</head>
<body>
<h1>Fancy · Shop Cosmetics II</h1>
<h2>Borders</h2>
<div class="grid">
  <div class="item"><div class="border" data-kind="prism"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><canvas></canvas></div><b>Hextech Prism</b><small>Border · Fancy</small></div>
  <div class="item"><div class="border" data-kind="bubble"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><canvas></canvas></div><b>Bubble Ring</b><small>Border · Fancy</small></div>
</div>
<h2>Profile frame</h2>
<div class="grid">
  <div class="item"><div class="frame" data-kind="vines"><div class="inner"><span></span><span></span><span></span></div><canvas></canvas></div><b>Runic Vines</b><small>Frame · Fancy</small></div>
</div>

<script>
const rand = (a, b) => a + Math.random() * (b - a);
const DPR = Math.min(2, devicePixelRatio || 1);
function setup(cv, w, h) { cv.width = w * DPR; cv.height = h * DPR; cv.style.width = w + 'px'; cv.style.height = h + 'px'; const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return c; }
const draws = [];

// ======================= BORDERS =======================
document.querySelectorAll('.border').forEach(el => {
  const S = el.offsetWidth, C = S * 2, R = S / 2, kind = el.dataset.kind;
  const c = setup(el.querySelector('canvas'), C, C);

  if (kind === 'prism') {
    // ---------- Hextech Prism v2: ein Hextech-Geraet statt Kristallkranz ----------
    // Messingring mit Zahnkranz (dreht langsam), darin eine Energierinne, durch die
    // blaue Hextech-Energie fliesst; oben ein grosser Hexkern in Messingfassung
    // (pulsiert, Lichtbrechung), an drei Stellen Kristall-Kondensatoren, zwischen
    // denen ab und zu Lichtboegen springen; ein Hexgitter-Hologramm flackert auf.
    const hexPath = (x, y, r, rot) => { c.beginPath(); for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; k ? c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); };
    const brass = (x0, y0, x1, y1) => { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#f8e3a4'); g.addColorStop(.35, '#b8862e'); g.addColorStop(.6, '#f0cf7c'); g.addColorStop(1, '#6a4612'); return g; };
    const caps = [Math.PI * 1.5 + 2.1, Math.PI * 1.5, Math.PI * 1.5 - 2.1]; // unten rechts, oben (Kern), unten links
    let arc = null, nextArc = 1, holo = 0, nextHolo = 3;
    const jag = (ax, ay, bx, by, n, amp) => { const pts = [[ax, ay]]; for (let k = 1; k < n; k++) { const u = k / n; pts.push([ax + (bx - ax) * u + rand(-amp, amp), ay + (by - ay) * u + rand(-amp, amp)]); } pts.push([bx, by]); return pts; };
    draws.push((t, dt) => {
      c.clearRect(0, 0, C, C); c.save(); c.translate(C / 2, C / 2);
      const pulse = .5 + .5 * Math.sin(t * 2.2);
      const halo = c.createRadialGradient(0, 0, R * .95, 0, 0, R * 1.6); halo.addColorStop(0, `rgba(70, 190, 255, ${.22 + .1 * pulse})`); halo.addColorStop(1, 'rgba(70, 190, 255, 0)');
      c.fillStyle = halo; c.beginPath(); c.arc(0, 0, R * 1.6, 0, 7); c.fill();
      // Zahnkranz aussen (dreht langsam)
      c.save(); c.rotate(t * .12);
      c.fillStyle = brass(-R, -R, R, R);
      c.beginPath();
      for (let k = 0; k < 36; k++) { const a0 = k / 36 * Math.PI * 2, a1 = a0 + Math.PI / 36; c.arc(0, 0, R * 1.25, a0, a1); c.arc(0, 0, R * 1.19, a1, a1 + Math.PI / 36); }
      c.closePath(); c.arc(0, 0, R * 1.12, 0, 7, true); c.fill('evenodd');
      c.strokeStyle = 'rgba(60, 36, 8, .55)'; c.lineWidth = .8; c.stroke();
      c.restore();
      // Messing-Grundring + Energierinne
      c.lineWidth = R * .13; c.strokeStyle = brass(-R, R, R, -R); c.beginPath(); c.arc(0, 0, R * 1.07, 0, 7); c.stroke();
      c.lineWidth = R * .05; c.strokeStyle = '#08121c'; c.beginPath(); c.arc(0, 0, R * 1.07, 0, 7); c.stroke();
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) { // drei Energiepakete fliessen durch die Rinne
        const a = t * 1.6 + k * 2.094;
        for (let s2 = 0; s2 < 14; s2++) { const aa = a - s2 * .045; c.strokeStyle = `rgba(110, 220, 255, ${(1 - s2 / 14) * .8})`; c.lineWidth = R * .035; c.beginPath(); c.arc(0, 0, R * 1.07, aa - .05, aa); c.stroke(); }
      }
      c.strokeStyle = `rgba(80, 190, 255, ${.25 + .2 * pulse})`; c.lineWidth = R * .02; c.beginPath(); c.arc(0, 0, R * 1.07, 0, 7); c.stroke();
      c.restore();
      // Nieten
      c.fillStyle = '#f6dc94'; for (let k = 0; k < 12; k++) { const a = k / 12 * 6.28 + .26; c.beginPath(); c.arc(Math.cos(a) * R * 1.01, Math.sin(a) * R * 1.01, R * .022, 0, 7); c.fill(); }
      // Kristall-Kondensatoren in Messing-Klauen
      const capPos = caps.map(a => [Math.cos(a) * R * 1.07, Math.sin(a) * R * 1.07, a]);
      capPos.slice(0, 3).forEach(([x, y, a], k) => {
        if (k === 1) return; // oben sitzt der Hexkern, dort kein Kondensator
        c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2);
        c.fillStyle = brass(-R * .1, 0, R * .1, 0);
        c.beginPath(); c.moveTo(-R * .11, R * .02); c.lineTo(-R * .07, -R * .16); c.lineTo(-R * .03, -R * .02); c.lineTo(R * .03, -R * .02); c.lineTo(R * .07, -R * .16); c.lineTo(R * .11, R * .02); c.closePath(); c.fill();
        const cg = c.createLinearGradient(-R * .05, 0, R * .05, 0); cg.addColorStop(0, '#9ee8ff'); cg.addColorStop(.5, '#2a8ad0'); cg.addColorStop(1, '#bff4ff');
        c.fillStyle = cg; c.beginPath(); c.moveTo(0, -R * .2); c.lineTo(R * .05, -R * .08); c.lineTo(R * .035, R * .01); c.lineTo(-R * .035, R * .01); c.lineTo(-R * .05, -R * .08); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(230, 250, 255, .8)'; c.lineWidth = .7; c.stroke();
        c.restore();
      });
      // Lichtboegen zwischen Kondensatoren und Kern
      nextArc -= dt;
      const coreX = 0, coreY = -R * 1.12;
      if (nextArc <= 0) { nextArc = rand(1.2, 2.6); const from = capPos[Math.random() < .5 ? 0 : 2]; arc = { life: .35, a: [from[0] + Math.cos(from[2]) * R * .12, from[1] + Math.sin(from[2]) * R * .12] }; }
      if (arc) {
        arc.life -= dt; if (arc.life <= 0) arc = null; else {
          const pts = jag(arc.a[0], arc.a[1], coreX, coreY, 9, R * .07);
          c.save(); c.globalCompositeOperation = 'lighter'; c.lineJoin = 'round';
          [[R * .06, 'rgba(80, 180, 255, .35)'], [R * .02, 'rgba(220, 245, 255, .95)']].forEach(([w, col]) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); });
          c.restore();
        }
      }
      // Hexkern oben: Messingfassung, facettierter Kristall, pulsierendes Licht
      c.save(); c.translate(coreX, coreY);
      c.fillStyle = brass(-R * .3, -R * .3, R * .3, R * .3); hexPath(0, 0, R * .27, Math.PI / 6); c.fill();
      c.strokeStyle = 'rgba(60, 36, 8, .6)'; c.lineWidth = 1; c.stroke();
      const core = c.createRadialGradient(-R * .05, -R * .06, 0, 0, 0, R * .2); core.addColorStop(0, '#f0fdff'); core.addColorStop(.35, `rgba(120, 220, 255, 1)`); core.addColorStop(1, '#0c5a9a');
      c.fillStyle = core; hexPath(0, 0, R * .19, Math.PI / 6); c.fill();
      c.strokeStyle = 'rgba(220, 250, 255, .55)'; c.lineWidth = .7; // Facetten
      for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * R * .19, Math.sin(a) * R * .19); c.stroke(); }
      c.globalCompositeOperation = 'lighter';
      const cg2 = c.createRadialGradient(0, 0, 0, 0, 0, R * .5); cg2.addColorStop(0, `rgba(120, 220, 255, ${.35 + .35 * pulse + (arc ? .3 : 0)})`); cg2.addColorStop(1, 'rgba(120, 220, 255, 0)');
      c.fillStyle = cg2; c.beginPath(); c.arc(0, 0, R * .5, 0, 7); c.fill();
      // Lichtbrechung: kurze Regenbogen-Strahlen, die langsam rotieren
      ['255, 80, 110', '255, 210, 80', '90, 255, 150', '90, 170, 255', '200, 110, 255'].forEach((col, ci) => {
        const a = t * .4 + ci * .12 - Math.PI / 2; c.strokeStyle = `rgba(${col}, ${.18 + .15 * pulse})`; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(Math.cos(a) * R * .2, Math.sin(a) * R * .2); c.lineTo(Math.cos(a) * R * .45, Math.sin(a) * R * .45); c.stroke();
      });
      c.restore();
      // Hexgitter-Hologramm, das ab und zu ueber den Ring flackert
      nextHolo -= dt; if (nextHolo <= 0) { nextHolo = rand(3, 6); holo = 1; }
      if (holo > 0) {
        holo = Math.max(0, holo - dt * .8);
        c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(110, 220, 255, ${holo * .35 * (Math.random() < .85 ? 1 : .3)})`; c.lineWidth = .7;
        const hr = R * .09;
        for (let q = -8; q <= 8; q++) for (let r = -8; r <= 8; r++) {
          const x = hr * 1.5 * q, y = hr * Math.sqrt(3) * (r + q / 2), d = Math.hypot(x, y);
          if (d < R * 1.3 || d > R * 1.55) continue;
          hexPath(x, y, hr * .92, 0); c.stroke();
        }
        c.restore();
      }
      c.restore();
    });
  }

  if (kind === 'bubble') {
    // ---------- Bubble Ring ----------
    const bubbles = [];
    const spawn = (a, grow) => ({ a, r: rand(1.08, 1.4), s: rand(.09, .2), g: grow ? 0 : 1, ph: rand(0, 6), v: rand(.08, .16), hue: rand(0, 360), pop: 0 });
    for (let k = 0; k < 16; k++) bubbles.push(spawn(k / 16 * 6.28 + rand(-.15, .15), false));
    const drops = [];
    let nextPop = 1.5;
    draws.push((t, dt) => {
      c.clearRect(0, 0, C, C); c.save(); c.translate(C / 2, C / 2);
      // feiner Perlmutt-Ring direkt am Bild
      const pr = c.createConicGradient ? c.createConicGradient(t * .3, 0, 0) : null;
      if (pr) { ['#ffd6f0', '#d6f0ff', '#e0ffe8', '#fff3d0', '#ffd6f0'].forEach((col, i) => pr.addColorStop(i / 4, col)); c.strokeStyle = pr; } else c.strokeStyle = '#e8f0ff';
      c.lineWidth = R * .05; c.beginPath(); c.arc(0, 0, R * 1.02, 0, 7); c.stroke();
      nextPop -= dt;
      if (nextPop <= 0) { nextPop = rand(1.8, 3.5); const live = bubbles.filter(b => b.g >= 1 && !b.pop); if (live.length) live[Math.random() * live.length | 0].pop = .001; }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.a += b.v * dt * .3; b.g = Math.min(1, b.g + dt * .6);
        const x = Math.cos(b.a) * R * b.r + Math.sin(t * .9 + b.ph) * R * .03, y = Math.sin(b.a) * R * b.r + Math.cos(t * .7 + b.ph) * R * .03;
        const rr = R * b.s * (b.g < 1 ? b.g * b.g * (3 - 2 * b.g) : 1);
        if (b.pop) {
          b.pop += dt * 4;
          if (b.pop < .01 + dt * 4) for (let k = 0; k < 8; k++) { const a = k / 8 * 6.28; drops.push({ x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr, vx: Math.cos(a) * rand(20, 45), vy: Math.sin(a) * rand(20, 45), life: 1 }); }
          c.strokeStyle = `rgba(230, 240, 255, ${Math.max(0, 1 - b.pop) * .7})`; c.lineWidth = 1; c.beginPath(); c.arc(x, y, rr * (1 + b.pop * .6), 0, 7); c.stroke();
          if (b.pop >= 1) { bubbles[i] = spawn(b.a, true); }
          continue;
        }
        const wob = 1 + Math.sin(t * 3 + b.ph) * .04;
        c.save(); c.translate(x, y); c.scale(wob, 2 - wob);
        // Koerper: fast durchsichtig, Rand dichter
        const body = c.createRadialGradient(0, 0, rr * .6, 0, 0, rr); body.addColorStop(0, 'rgba(200, 225, 255, .03)'); body.addColorStop(1, 'rgba(200, 225, 255, .16)');
        c.fillStyle = body; c.beginPath(); c.arc(0, 0, rr, 0, 7); c.fill();
        // schillernder Duennfilm-Rand (Farben wandern)
        if (c.createConicGradient) {
          const film = c.createConicGradient(t * .8 + b.ph, 0, 0), h = b.hue + t * 40;
          for (let k = 0; k <= 6; k++) film.addColorStop(k / 6, `hsla(${(h + k * 60) % 360}, 90%, 72%, .75)`);
          c.strokeStyle = film;
        } else c.strokeStyle = 'rgba(220, 230, 255, .7)';
        c.lineWidth = Math.max(1, rr * .12); c.beginPath(); c.arc(0, 0, rr * .94, 0, 7); c.stroke();
        // Glanzlichter: grosser Bogen oben links, kleiner Punkt unten rechts
        c.strokeStyle = 'rgba(255, 255, 255, .85)'; c.lineWidth = Math.max(1, rr * .12); c.lineCap = 'round';
        c.beginPath(); c.arc(0, 0, rr * .68, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
        c.fillStyle = 'rgba(255, 255, 255, .7)'; c.beginPath(); c.arc(rr * .42, rr * .42, rr * .1, 0, 7); c.fill();
        c.restore();
      }
      for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.life -= dt * 2.2; if (d.life <= 0) { drops.splice(i, 1); continue; } d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 40 * dt; c.fillStyle = `rgba(220, 235, 255, ${d.life * .8})`; c.beginPath(); c.arc(d.x, d.y, 1, 0, 7); c.fill(); }
      c.restore();
    });
  }
});

// ======================= FRAME: Runic Vines =======================
document.querySelectorAll('.frame').forEach(el => {
  const P = 50, BW = el.offsetWidth, BH = el.offsetHeight, CW = BW + P * 2, CH = BH + P * 2;
  const c = setup(el.querySelector('canvas'), CW, CH);
  // Umlaufbahn (abgerundetes Rechteck um die Karte)
  const per = []; let len = 0;
  { const o = 4, r = 18, x0 = P - o, y0 = P - o, x1 = P + BW + o, y1 = P + BH + o;
    const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= 8; i++) { const a = a0 + (a1 - a0) * i / 8; per.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
    const line = (ax, ay, bx, by) => { const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 6); for (let i = 0; i <= n; i++) per.push([ax + (bx - ax) * i / n, ay + (by - ay) * i / n]); };
    line(x0 + r, y0, x1 - r, y0); arc(x1 - r, y0 + r, -Math.PI / 2, 0); line(x1, y0 + r, x1, y1 - r); arc(x1 - r, y1 - r, 0, Math.PI / 2);
    line(x1 - r, y1, x0 + r, y1); arc(x0 + r, y1 - r, Math.PI / 2, Math.PI); line(x0, y1 - r, x0, y0 + r); arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);
    per.forEach((p, i) => { if (i) len += Math.hypot(p[0] - per[i - 1][0], p[1] - per[i - 1][1]); p.len = len; }); }
  const at = d => { d = ((d % len) + len) % len; for (let i = 1; i < per.length; i++) if (per[i].len >= d) { const a = per[i - 1], b = per[i], u = (d - a.len) / (b.len - a.len || 1); return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])]; } return [per[0][0], per[0][1], 0]; };
  // zwei Ranken, die sich umeinander winden
  // Windungen so gewaehlt, dass sie genau einmal herum aufgehen (sonst Knick am Startpunkt)
  const TW = Math.round(len * .06 / (Math.PI * 2)) * Math.PI * 2 / len;
  const vine = (d, k, t) => { const [x, y, a] = at(d), off = Math.sin(d * TW + k * Math.PI + t * .4) * 6; return [x - Math.sin(a) * off, y + Math.cos(a) * off, a]; };
  // Efeu: Blaetter mit drei bis fuenf Lappen in verschiedenen Groessen/Gruentoenen, Ranken mit Rankenkringeln
  const leaves = Array.from({ length: 44 }, (_, i) => ({ d: i / 44 * len + rand(-6, 6), k: i % 2, side: Math.random() < .5 ? -1 : 1, s: rand(4.5, 9.5), ph: rand(0, 6), hue: rand(-12, 14), lobes: Math.random() < .6 ? 5 : 3, tilt: rand(-.4, .4) }));
  const curls = Array.from({ length: 9 }, () => ({ d: rand(0, len), k: Math.random() < .5 ? 0 : 1, side: Math.random() < .5 ? -1 : 1, s: rand(5, 8), ph: rand(0, 6) }));
  // Efeublatt (Spitze zeigt in +x), Laenge ~ 2*s
  function ivy(s, lobes) {
    c.beginPath(); c.moveTo(0, 0);
    if (lobes === 5) {
      c.bezierCurveTo(-s * .1, -s * .55, s * .25, -s * 1.0, s * .55, -s * .75);   // unterer Lappen links
      c.bezierCurveTo(s * .7, -s * .95, s * 1.05, -s * .85, s * 1.15, -s * .45);   // Seitenlappen
      c.bezierCurveTo(s * 1.4, -s * .4, s * 1.85, -s * .2, s * 2.05, 0);            // Spitze
      c.bezierCurveTo(s * 1.85, s * .2, s * 1.4, s * .4, s * 1.15, s * .45);
      c.bezierCurveTo(s * 1.05, s * .85, s * .7, s * .95, s * .55, s * .75);
      c.bezierCurveTo(s * .25, s * 1.0, -s * .1, s * .55, 0, 0);
    } else {
      c.bezierCurveTo(s * .1, -s * .8, s * .9, -s * .9, s * 1.2, -s * .4);
      c.bezierCurveTo(s * 1.5, -s * .3, s * 1.9, -s * .15, s * 2.05, 0);
      c.bezierCurveTo(s * 1.9, s * .15, s * 1.5, s * .3, s * 1.2, s * .4);
      c.bezierCurveTo(s * .9, s * .9, s * .1, s * .8, 0, 0);
    }
    c.closePath();
  }

  // Runensteine: vier Ecken + Mitte der langen Seiten
  const runeAt = [0.0, .125, .25, .375, .5, .625, .75, .875].map(f => {
    // die Ecken liegen bei den Boegen; Position ueber die Laenge der Bahn verteilt
    return { d: f * len + len * .06, glow: 0, glyph: (Math.random() * 6) | 0 };
  });
  const GLYPHS = [ // einfache Runenzeichen (Strichlisten in -1..1)
    [[[0, -1], [0, 1]], [[0, -.5], [.6, -1]], [[0, 0], [.6, -.5]]],
    [[[0, -1], [0, 1]], [[0, -1], [.6, -.4]], [[.6, -.4], [0, .2]]],
    [[[-.5, -1], [.5, 1]], [[.5, -1], [-.5, 1]]],
    [[[0, -1], [0, 1]], [[-.6, -.3], [.6, .3]]],
    [[[-.4, -1], [-.4, 1]], [[.4, -1], [.4, 1]], [[-.4, -.2], [.4, .4]]],
    [[[0, -1], [.6, 0]], [[.6, 0], [0, 1]], [[0, -1], [0, 1]]],
  ];
  const pulses = [], spores = Array.from({ length: 14 }, () => ({ d: rand(0, len), off: rand(-26, 26), ph: rand(0, 6), v: rand(4, 10) }));
  let nextPulse = .5;
  draws.push((t, dt) => {
    c.clearRect(0, 0, CW, CH);
    // Ranken: holzige Staengel mit wechselnder Dicke, plastisch (Schatten, Koerper, Glanzkante, Rinde)
    for (let k = 0; k < 2; k++) {
      const pts = []; for (let d = 0; d <= len; d += 3) pts.push(vine(d, k, t));
      const thick = d => 2.6 + 1.3 * Math.sin(d * .021 + k * 2) + .6 * Math.sin(d * .07 + k);
      const pass = (ox, oy, wMul, col) => {
        for (let q = 1; q < pts.length; q++) { const d = q * 3, [ax, ay] = pts[q - 1], [bx, by] = pts[q];
          c.strokeStyle = col; c.lineWidth = Math.max(.5, thick(d) * wMul); c.lineCap = 'round'; c.beginPath(); c.moveTo(ax + ox, ay + oy); c.lineTo(bx + ox, by + oy); c.stroke(); }
      };
      pass(1.2, 1.6, 1.1, 'rgba(0, 0, 0, .45)');       // Schlagschatten
      pass(0, 0, 1, '#3a2c1a');                         // Rinde dunkel
      pass(-.4, -.5, .62, '#5e4a2c');                   // Koerper
      pass(-.8, -1, .22, 'rgba(170, 150, 100, .55)');   // Glanzkante
      // Rindenkerben
      c.strokeStyle = 'rgba(25, 16, 8, .7)'; c.lineWidth = .7;
      for (let q = 4; q < pts.length; q += 5) { const [x, y, a] = pts[q], w = thick(q * 3) * .45; c.beginPath(); c.moveTo(x - Math.sin(a) * w + Math.cos(a) * 1.2, y + Math.cos(a) * w + Math.sin(a) * 1.2); c.lineTo(x + Math.sin(a) * w * .3, y - Math.cos(a) * w * .3); c.stroke(); }
    }
    // Rankenkringel
    curls.forEach(cu => {
      const [x, y, a] = vine(cu.d, cu.k, t); const sway = Math.sin(t * 1.3 + cu.ph) * .2;
      c.save(); c.translate(x, y); c.rotate(a + cu.side * 1.2 + sway);
      c.strokeStyle = '#6a8a3a'; c.lineWidth = .9; c.beginPath();
      for (let q = 0; q <= 40; q++) { const u = q / 40, r = cu.s * (1 - u * .85), th = u * Math.PI * 3.2; const px = u * cu.s * 1.6 + Math.cos(th) * r * .5, py = cu.side * Math.sin(th) * r * .5; q ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.stroke(); c.restore();
    });
    // Efeublaetter: Stiel, Schatten, Verlauf, Adern, wiegen sich leicht
    leaves.forEach(l => {
      const [x, y, a] = vine(l.d, l.k, t), sw = Math.sin(t * 1.4 + l.ph) * .18, ang = a + l.side * (Math.PI / 2.4) + sw + l.tilt;
      c.save(); c.translate(x, y); c.rotate(ang);
      c.strokeStyle = '#4a5a24'; c.lineWidth = .9; c.beginPath(); c.moveTo(0, 0); c.lineTo(l.s * .5, 0); c.stroke();
      c.translate(l.s * .45, 0);
      c.save(); c.translate(1.5, 1.8); ivy(l.s, l.lobes); c.fillStyle = 'rgba(0, 0, 0, .35)'; c.fill(); c.restore();
      ivy(l.s, l.lobes);
      const lg = c.createLinearGradient(0, -l.s, l.s * 2, l.s);
      lg.addColorStop(0, `hsl(${100 + l.hue}, 45%, 34%)`); lg.addColorStop(.55, `hsl(${108 + l.hue}, 50%, 26%)`); lg.addColorStop(1, `hsl(${115 + l.hue}, 55%, 17%)`);
      c.fillStyle = lg; c.fill();
      c.strokeStyle = 'rgba(20, 40, 12, .7)'; c.lineWidth = .6; c.stroke();
      c.strokeStyle = 'rgba(200, 225, 160, .45)'; c.lineWidth = .55; c.beginPath();
      c.moveTo(0, 0); c.lineTo(l.s * 1.9, 0);
      if (l.lobes === 5) { c.moveTo(l.s * .2, 0); c.lineTo(l.s * .9, -l.s * .55); c.moveTo(l.s * .2, 0); c.lineTo(l.s * .9, l.s * .55); }
      c.moveTo(l.s * .1, 0); c.lineTo(l.s * .45, -l.s * .5); c.moveTo(l.s * .1, 0); c.lineTo(l.s * .45, l.s * .5);
      c.stroke();
      c.fillStyle = 'rgba(255, 255, 255, .08)'; c.beginPath(); c.ellipse(l.s * .9, -l.s * .25, l.s * .5, l.s * .18, -.3, 0, 7); c.fill(); // Glanz
      c.restore();
    });
    // Lichtpulse laufen durch die Ranken
    nextPulse -= dt; if (nextPulse <= 0) { nextPulse = rand(.9, 1.8); pulses.push({ d: rand(0, len), k: Math.random() < .5 ? 0 : 1, v: rand(60, 95), life: rand(2.5, 4) }); }
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i]; p.d += p.v * dt; p.life -= dt; if (p.life <= 0) { pulses.splice(i, 1); continue; }
      const fade = Math.min(1, p.life);
      for (let k = 0; k < 8; k++) { const [x, y] = vine(p.d - k * 5, p.k, t); c.fillStyle = `rgba(120, 255, 200, ${(1 - k / 8) * .5 * fade})`; c.beginPath(); c.arc(x, y, 3.2 - k * .3, 0, 7); c.fill(); }
      runeAt.forEach(r => { const dd = ((p.d - r.d) % len + len) % len; if (dd < 6) r.glow = 1; });
    }
    c.restore();
    // Runensteine
    runeAt.forEach(r => {
      r.glow = Math.max(0, r.glow - dt * .5);
      const [x, y] = at(r.d);
      c.save(); c.translate(x, y);
      const st = c.createRadialGradient(-3, -3, 1, 0, 0, 12); st.addColorStop(0, '#6a7068'); st.addColorStop(1, '#2a2e2a');
      c.fillStyle = st; c.beginPath(); c.moveTo(-9, -11); c.lineTo(8, -12); c.lineTo(11, 9); c.lineTo(-10, 11); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(0, 0, 0, .5)'; c.lineWidth = 1; c.stroke();
      const g = .25 + .75 * r.glow;
      if (r.glow > .02) { const h = c.createRadialGradient(0, 0, 0, 0, 0, 22); h.addColorStop(0, `rgba(120, 255, 200, ${.45 * r.glow})`); h.addColorStop(1, 'rgba(120, 255, 200, 0)'); c.fillStyle = h; c.beginPath(); c.arc(0, 0, 22, 0, 7); c.fill(); }
      c.strokeStyle = `rgba(${120 + 100 * r.glow | 0}, 255, ${200 + 40 * r.glow | 0}, ${g})`; c.lineWidth = 1.6; c.lineCap = 'round';
      c.shadowColor = '#78ffc8'; c.shadowBlur = 8 * r.glow;
      GLYPHS[r.glyph].forEach(([[ax, ay], [bx, by]]) => { c.beginPath(); c.moveTo(ax * 6, ay * 7); c.lineTo(bx * 6, by * 7); c.stroke(); });
      c.shadowBlur = 0; c.restore();
    });
    // Sporen schweben um die Ranken
    spores.forEach(s => {
      s.d += s.v * dt; const [x, y, a] = at(s.d), o = s.off + Math.sin(t + s.ph) * 6, px = x - Math.sin(a) * o, py = y + Math.cos(a) * o;
      const tw = .4 + .6 * Math.abs(Math.sin(t * 2 + s.ph));
      c.fillStyle = `rgba(190, 255, 170, ${tw * .8})`; c.beginPath(); c.arc(px, py, 1.3, 0, 7); c.fill();
      c.fillStyle = `rgba(190, 255, 170, ${tw * .15})`; c.beginPath(); c.arc(px, py, 4, 0, 7); c.fill();
    });
  });
});

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; draws.forEach(d => d(now / 1000, dt)); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
