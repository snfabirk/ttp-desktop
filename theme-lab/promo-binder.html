<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo Binder - Theme Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Promo Binder (Entwurf v2, 2026-11-27, Nutzer):
     - kleiner Binder: links Promo-Packs (je genau 1 Promo), rechts 4x4 - je 2x2
       Promos (einzelne Full Arts) ergeben ein grosses Bild
     - Klick: die vorhandenen Karten des Bildes kommen zusammen nach vorn (80 %
       der normalen Zoomgroesse, v2: 60 %) und tilten als EINE Einheit; Klick auf eine
       davon = Einzelansicht in normaler Zoomgroesse (wie Album: 340 px breit)
     - echte Dicke wie bei den Full Arts: Mittelebene + Figur aus je mehreren
       abgedunkelten, per feMorphology verbreiterten Schichten (Slabs) */
  :root { --gold: #c8aa6e; --gold-hi: #f0d9a0; --text: #e8e2d0; --faint: #8a8aa0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #18203a, #070a14 70%); color: var(--text); font-family: Georgia, serif; overflow: hidden; }
  h1 { font-family: Cinzel, Georgia, serif; font-weight: 400; letter-spacing: 3px; color: var(--gold); text-align: center; margin: 16px 0 4px; font-size: 1.25rem; }
  .sub { text-align: center; color: var(--faint); font-size: .78rem; margin-bottom: 12px; }
  .demo-bar { position: fixed; bottom: 12px; right: 14px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; display: flex; gap: 6px; z-index: 5; }
  .demo-bar button { background: #141a30; color: var(--gold); border: 1px solid #3a3550; border-radius: 6px; padding: 5px 10px; font-family: Georgia, serif; font-size: .72rem; cursor: pointer; }
  .demo-bar button:hover, .demo-bar button.on { border-color: var(--gold); }
  .demo-bar button.on { background: #2a2440; }

  /* ---------- Binder (klein) ---------- */
  .binder { position: relative; margin: 0 auto; width: min(900px, 94vw); height: min(600px, 80vh); display: grid; grid-template-columns: 1fr 1.3fr;
    padding: 14px; border-radius: 18px; background: linear-gradient(135deg, #2a1d14, #1a120c 60%, #2a1d14); box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 2px #3a2a1a, inset 0 0 40px rgba(0,0,0,.6); }
  .page { position: relative; background: linear-gradient(180deg, #141a2c, #0e1322); border: 1px solid #2a3048; box-shadow: inset 0 0 30px rgba(0,0,0,.5); padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .page.left { border-radius: 10px 4px 4px 10px; gap: 18px; }
  .page.right { border-radius: 4px 10px 10px 4px; }
  .rings { position: absolute; left: calc(14px + (100% - 28px) * (1 / 2.3)); top: 0; bottom: 0; width: 0; z-index: 3; pointer-events: none; }
  .rings i { position: absolute; left: -11px; width: 22px; height: 9px; border-radius: 5px; background: linear-gradient(#e8e8f0, #8a8a9a 60%, #4a4a58); box-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .page-title { font-family: Cinzel, Georgia, serif; color: var(--gold); letter-spacing: 3px; font-size: .95rem; }
  .page-note { color: var(--faint); font-size: .72rem; text-align: center; max-width: 250px; line-height: 1.45; }

  /* ---------- Promo-Pack ---------- */
  .pack-wrap { position: relative; width: 140px; height: 200px; cursor: pointer; perspective: 600px; }
  .pack-wrap.empty { cursor: default; filter: grayscale(.8) brightness(.55); }
  .pack { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; transition: transform .25s ease;
    background: linear-gradient(160deg, #1a1208, #050403 55%, #1a1208); box-shadow: 0 14px 30px rgba(0,0,0,.6), 0 0 0 2px #8a6a2a, 0 0 0 3px #2a1d0a; }
  .pack-wrap:not(.empty):hover .pack { transform: rotateX(6deg) rotateY(-8deg) translateY(-4px); }
  .pack .crimp { position: absolute; left: 0; right: 0; height: 14px; background: repeating-linear-gradient(90deg, #6a5020 0 4px, #3a2a10 4px 8px); }
  .pack .crimp.t { top: 0; } .pack .crimp.b { bottom: 0; }
  .pack .foil { position: absolute; inset: 14px 0; background: repeating-linear-gradient(60deg, transparent 0 9px, rgba(240,217,160,.08) 9px 11px); }
  .pack .star { position: absolute; left: 50%; top: 40%; width: 80px; height: 80px; transform: translate(-50%, -50%); }
  .pack .ptitle { position: absolute; left: 0; right: 0; top: 66%; text-align: center; font-family: Cinzel, Georgia, serif; font-weight: 700; letter-spacing: 4px; color: var(--gold-hi); font-size: .95rem; text-shadow: 0 0 12px rgba(240,200,120,.5); }
  .pack .psub { position: absolute; left: 0; right: 0; top: 77%; text-align: center; font-size: .6rem; letter-spacing: 2px; color: #b89a5a; }
  .pack .glint { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,240,200,.28) 50%, transparent 65%); background-size: 300% 100%; animation: glint 3.6s linear infinite; }
  .pack-count { position: absolute; top: -10px; right: -10px; z-index: 4; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: linear-gradient(#f0d9a0, #b08a3a); color: #1a1208; font-family: Cinzel, Georgia, serif; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .pack-wrap.empty .pack-count { display: none; }
  @keyframes glint { from { background-position: 150% 0; } to { background-position: -150% 0; } }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(2deg); } }
  .pack-wrap.opening .pack { animation: shake .45s ease; }

  /* ---------- Raster ---------- */
  .grid { position: relative; display: grid; grid-template-columns: repeat(4, var(--cw)); grid-template-rows: repeat(4, var(--ch)); gap: 4px; --cw: 74px; --ch: calc(var(--cw) * 1.4); }
  .grid .cell { position: relative; border-radius: 6px; }
  .grid .cell:nth-child(4n+2) { margin-right: 10px; }
  .grid .cell:nth-child(n+5):nth-child(-n+8) { margin-bottom: 10px; }
  .cell.empty { border: 1px dashed rgba(200,170,110,.22); background: rgba(255,255,255,.015); }
  .cell.empty::after { content: '?'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(200,170,110,.25); font-family: Cinzel, Georgia, serif; font-size: 1.1rem; }
  .cell.future { border: 1px dashed rgba(138,138,160,.14); }
  .future-note { position: absolute; color: var(--faint); font-size: .6rem; text-align: center; letter-spacing: 1px; pointer-events: none; }
  .cell .promo { cursor: pointer; transition: transform .2s ease; }
  .cell .promo:hover { transform: translateY(-3px) scale(1.05); }
  .cell.hidden-src .promo { opacity: 0; }

  /* ---------- Promo-Karte (Full Art) ---------- */
  .promo { position: absolute; inset: 0; container-type: inline-size; transform-style: preserve-3d; border-radius: 7cqw; }
  .promo .p-scene { position: absolute; inset: 0; border-radius: 7cqw; overflow: hidden; border: 1.6cqw solid transparent;
    background: #0b1020 padding-box, linear-gradient(135deg, #fff4cc, #c8aa6e 25%, #7a5a20 45%, #f0d9a0 60%, #b08a3a 80%, #fff4cc) border-box; box-shadow: 0 0 6cqw rgba(240,200,120,.25); }
  .promo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .promo .p-foil { position: absolute; inset: 0; pointer-events: none; opacity: .1;
    background: repeating-linear-gradient(60deg, transparent 0 5cqw, rgba(255,255,255,.5) 5cqw 6cqw), linear-gradient(115deg, #ff9ad5, #ffe08a 20%, #9dffb0 40%, #8fd8ff 60%, #c49bff 80%, #ff9ad5);
    background-size: auto, 400cqw 100%; animation: foil 8s linear infinite; }
  .promo .p-glint { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.26) 50%, transparent 62%); background-size: 300cqw 100%; animation: pglint 4.5s linear infinite; }
  .promo .p-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  /* Ebenen: gleicher Ausschnitt wie die Szene, in der 3D-Kette angehoben.
     Slabs = dunkle, verbreiterte Kopien darunter -> sichtbare Seitenkante */
  .promo .ly { position: absolute; inset: 1.6cqw; pointer-events: none; }
  .promo .ly svg { overflow: hidden; border-radius: 5.6cqw; }
  /* Glatte Kanten beim Kippen (Nutzer v6.18.0: Einzelansicht pixelig): jede 3D-Ebene
     wird als eigene Textur gezeichnet; liegt die sichtbare Kante genau auf deren Rand,
     glaettet Chrome sie nicht. Ein transparenter Outline-Rand vergroessert die Textur,
     die Kante liegt innen und wird geglaettet. */
  .promo .p-scene, .promo .ly, .promo .p-stamp, .promo .p-label { outline: 1px solid transparent; backface-visibility: hidden; }
  /* Am Kartenrand sind Figur und Mittelebene abgeschnitten; die Dicke-Schichten stapelten
     sich dort beim starken Kippen (Einzelansicht) zu einer stufigen Wand. Schichten + Schatten
     laufen zum Rand hin aus - die Vorderseite bleibt scharf. */
  .promo .ly.slab, .promo .ly.sh { -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent), linear-gradient(180deg, transparent, #000 5%, #000 95%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .promo .ly.pop { transform: translateZ(calc(var(--lift, 0px) + var(--i, 0) * var(--step, 0px))) scale(var(--comp, 1)); transition: transform .35s ease-out; }
  .promo .ly.mid { transform: translateZ(calc(var(--lift, 0px) * .45 + var(--i, 0) * var(--step, 0px) * .6)) scale(calc(1 - (1 - var(--comp, 1)) * .45)); transition: transform .35s ease-out; }
  .promo .ly.slab { filter: brightness(var(--shade, .5)) saturate(1.15) contrast(1.1); }
  /* Leuchten/Partikel (.ns) haben keine Dicke und keinen Schatten - sonst werden
     aus halbtransparenten Glows dunkle Scheiben und aus Flocken graue Kaestchen */
  .promo .ly.slab .ns, .promo .ly.sh .ns { display: none; }
  .promo .ly.sh { transform: translate(2.5cqw, 4cqw); filter: brightness(0) blur(2cqw); opacity: .45; }
  .promo .ly.sh.mid-sh { transform: translate(1.4cqw, 2.2cqw); filter: brightness(0) blur(1.4cqw); opacity: .4; }
  .promo .p-label { position: absolute; left: 0; right: 0; bottom: 4.5cqw; text-align: center; transform: translateZ(calc(var(--lift, 0px) + var(--step, 0px) * 14)) scale(var(--comp, 1)); transition: transform .35s ease-out; }
  .promo .p-label b { display: block; font-family: Cinzel, Georgia, serif; font-weight: 700; color: #fff; font-size: 9.5cqw; letter-spacing: .3cqw; text-shadow: 0 .5cqw 3cqw #000, 0 0 6cqw rgba(0,0,0,.9); }
  .promo .p-label span { display: flex; justify-content: space-between; padding: 0 7cqw; margin-top: 1.5cqw; font-size: 5.6cqw; font-weight: bold; letter-spacing: .6cqw; text-shadow: 0 .4cqw 2cqw #000; }
  .promo .p-label span em { font-style: normal; background: linear-gradient(90deg, #fff4cc, #f0d9a0, #ffe9b0); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .promo .p-stamp { position: absolute; top: 5cqw; right: 5cqw; padding: 1.4cqw 3cqw; border-radius: 3cqw; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 5.4cqw; letter-spacing: .8cqw; color: #1a1208;
    background: linear-gradient(135deg, #fff4cc, #c8aa6e 45%, #f0d9a0); box-shadow: 0 .8cqw 2cqw rgba(0,0,0,.6); transform: translateZ(calc(var(--lift, 0px) + var(--step, 0px) * 14)) scale(var(--comp, 1)); transition: transform .35s ease-out; }
  @keyframes foil { from { background-position: 0 0, 0 0; } to { background-position: 0 0, -400cqw 0; } }
  @keyframes pglint { from { background-position: 150cqw 0; } to { background-position: -150cqw 0; } }
  .a-flicker { animation: flicker 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes flicker { 0%, 100% { transform: scale(1, 1); opacity: 1; } 30% { transform: scale(.92, 1.08); opacity: .9; } 60% { transform: scale(1.05, .94); opacity: 1; } }
  .a-twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .a-twinkle.d1 { animation-delay: .6s; } .a-twinkle.d2 { animation-delay: 1.2s; } .a-twinkle.d3 { animation-delay: 1.8s; }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  .a-drift { animation: drift 9s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-6px); opacity: 1; } }

  /* ---------- Zoom ---------- */
  #ov { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #ov .dim { position: absolute; inset: 0; background: rgba(4,6,14,.86); opacity: 0; transition: opacity .35s ease; }
  #ov.open { pointer-events: auto; }
  #ov.open .dim { opacity: 1; }
  #stage { position: absolute; inset: 0; }
  #group { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .1s linear; }
  #group.resting { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
  #group .z { position: absolute; transform-style: preserve-3d; transition: left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease; cursor: pointer; }
  #group .z.away { opacity: 0; pointer-events: none; }
  .hint { position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; color: var(--faint); font-size: .78rem; z-index: 21; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #ov.open ~ .hint { opacity: 1; }
  .new-badge { position: absolute; top: -5%; left: 50%; transform: translateX(-50%) translateZ(80px); font-family: Cinzel, Georgia, serif; font-weight: 700; letter-spacing: 3px; color: #1a1208; background: linear-gradient(#fff4cc, #c8aa6e); padding: 4px 14px; border-radius: 12px; font-size: .9rem; box-shadow: 0 4px 12px rgba(0,0,0,.5); white-space: nowrap; }
</style>
</head>
<body>
<h1>PROMO BINDER</h1>
<div class="sub">Theme Lab draft v2 · click a promo · click one again to inspect it alone · click the dark area / Esc to go back</div>
<div class="demo-bar"><span hidden><span>Hall:</span><button data-var="pantheon:A">A Temple</button><button data-var="pantheon:B">B Colosseum</button><button data-var="pantheon:C">C Celestial</button><span style="color:#8a8aa0;font-size:.72rem;align-self:center;margin-left:8px">Climb:</span><button data-var="climb:A">A Night</button><button data-var="climb:B">B Sunrise</button><button data-var="climb:C">C Tower</button></span><button id="resetBtn">Reset demo</button><button id="allBtn">Unlock all</button></div>

<div class="binder">
  <div class="page left">
    <div class="page-title">PROMO PACKS</div>
    <div class="pack-wrap" id="packWrap">
      <div class="pack">
        <div class="crimp t"></div><div class="crimp b"></div><div class="foil"></div>
        <svg class="star" viewBox="-50 -50 100 100">
          <defs><linearGradient id="pkStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4cc"/><stop offset=".5" stop-color="#c8aa6e"/><stop offset="1" stop-color="#7a5a20"/></linearGradient>
            <radialGradient id="pkGlow"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient></defs>
          <circle r="48" fill="url(#pkGlow)"/>
          <path d="M0 -40 L11 -12 L40 -12 L17 6 L25 36 L0 18 L-25 36 L-17 6 L-40 -12 L-11 -12 Z" fill="url(#pkStar)" stroke="#2a1d0a" stroke-width="2"/>
          <path d="M0 -26 L6 -9 L0 6 L-6 -9 Z" fill="#fff8e0" opacity=".55"/>
        </svg>
        <div class="ptitle">PROMO</div><div class="psub">1 PROMO INSIDE</div>
        <div class="glint"></div>
      </div>
      <div class="pack-count" id="packCount">1</div>
    </div>
    <div class="page-note" id="packNote"></div>
  </div>
  <div class="page right"><div class="grid" id="grid"></div></div>
  <div class="rings"><i style="top:14%"></i><i style="top:38%"></i><i style="top:62%"></i><i style="top:86%"></i></div>
</div>

<div id="ov"><div class="dim"></div><div id="stage"><div id="group"></div></div></div>
<div class="hint">Move the mouse to tilt · click a promo to inspect it alone · click outside to go back</div>

<script>
(function () {
  // ===================== Bausteine (Bild = 240x336 = 2x2 Karten a 120x168) =====================
  const HEAD = 'M42 4 L48 15 L54 3 L60 18 C74 20 86 30 90 48 C93 62 92 80 92 96 L48 96 C50 84 52 72 50 62 C40 64 28 74 16 75 C8 75 4 69 6 62 C10 52 26 36 37 22 Z';
  const MANE = 'M60 18 L66 9 L69 20 L77 13 L79 26 L87 22 L87 35 L95 35 L91 47 L99 51 L93 59 L99 67 L93 73 L97 81 L92 85 L92 96 C92 80 93 62 90 48 C86 30 74 20 60 18 Z';
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const f1 = n => (+n).toFixed(1);
  const lg = (id, stops, x2 = 0, y2 = 1, x1 = 0, y1 = 0) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, cx = .5, cy = .5, r = .5) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</radialGradient>`;
  const glow = (x, y, r, id) => `<circle class="ns" cx="${x}" cy="${y}" r="${r}" fill="url(#${id})"/>`;
  const stars = (n, y0, y1, x0 = 0, x1 = 240, tw = 0) => { let s = ''; for (let i = 0; i < n; i++) { const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0), r = .25 + rnd() * .8; s += `<circle${tw && i % 5 === 0 ? ` class="a-twinkle d${i % 4}"` : ''} cx="${f1(x)}" cy="${f1(y)}" r="${r.toFixed(2)}" fill="#fff" opacity="${(.35 + rnd() * .6).toFixed(2)}"/>`; } return s; };
  const spark = (x, y, s = 1, c = '#fff8e0', cls = '') => `<g class="ns" transform="translate(${x} ${y}) scale(${s})"><path class="${cls}" d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="${c}"/></g>`;
  // Pony-Bueste (Schachfigur-Kopf), Kopf-Box 0..100 x 0..96; extra = Zubehoer in Kopf-Koordinaten
  function bust(x, y, s, { body, shade, mane, rim = 'rgba(255,220,160,.55)', eye = 'carved', id, extra = '', under = '', flip = false }) {
    const eyes = {
      carved: `<path d="M31 33 Q36 30 41 33" stroke="${shade}" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".9"/><path d="M30 37 Q36 35 42 37" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none"/>`,
      open: '<ellipse cx="36" cy="33" rx="4" ry="4.6" fill="#1a1410"/><circle cx="37.3" cy="31.6" r="1.4" fill="#fff"/>',
      happy: '<path d="M31 34 Q36 28 41 34" stroke="#1a1410" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    };
    const t = flip ? `translate(${x + 100 * s} ${y}) scale(${-s} ${s})` : `translate(${x} ${y}) scale(${s})`;
    return `<g transform="${t}"><defs>${lg(id, [[0, body], [.55, body], [1, shade]], 1, 1)}${lg(id + 'm', [[0, mane], [1, shade]], 1, 1)}</defs>${under}
      <path d="${HEAD}" fill="url(#${id})" stroke="rgba(0,0,0,.45)" stroke-width="1.6"/>
      <path d="M48 96 C50 84 52 72 50 62 C40 64 28 74 16 75 C10 75 6 71 6 66 C14 70 30 66 42 58 C50 54 56 60 56 70 C56 80 54 90 54 96 Z" fill="${shade}" opacity=".35"/>
      <path d="${MANE}" fill="url(#${id}m)" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/>
      <path d="M66 12 L70 22 M78 16 L80 28 M88 26 L88 36 M94 40 L91 48 M96 56 L93 60 M95 70 L93 74" stroke="rgba(255,255,255,.22)" stroke-width="1.2"/>
      <path d="M60 18 C74 20 86 30 90 48 C93 62 92 80 92 96" stroke="${rim}" stroke-width="2.4" fill="none"/>
      <path d="M14 66 C22 70 30 68 36 64" stroke="rgba(0,0,0,.28)" stroke-width="1.6" fill="none"/>
      <path d="M44 14 C50 30 56 40 70 50" stroke="rgba(255,255,255,.3)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="13" cy="64" rx="2.2" ry="1.6" fill="rgba(0,0,0,.5)"/>${eyes[eye]}${extra}</g>`;
  }
  const coinDefs = `${lg('cG', [[0, '#fff6c0'], [.45, '#f4c440'], [1, '#a8700e']], 1, 1)}${lg('cE', [[0, '#c08a1a'], [1, '#6a4208']])}`;
  const coin = (x, y, r = 4, tilt = .45) => `<ellipse cx="${f1(x)}" cy="${f1(y + r * tilt * .4)}" rx="${r}" ry="${f1(r * tilt)}" fill="url(#cE)"/><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${r}" ry="${f1(r * tilt)}" fill="url(#cG)" stroke="#6a4208" stroke-width=".5"/><ellipse cx="${f1(x - r * .25)}" cy="${f1(y - r * tilt * .25)}" rx="${f1(r * .35)}" ry="${f1(r * tilt * .25)}" fill="#fffbe0" opacity=".6"/>`;

  // ---------- Hall C: Himmlisch ----------
  function hallC() {
    seed = 37;

    const softCloud = (x, y, s, o) => `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><ellipse rx="30" ry="8" fill="#fff"/><ellipse cx="-12" cy="-5" rx="14" ry="8" fill="#fff"/><ellipse cx="10" cy="-7" rx="16" ry="10" fill="#fff"/></g>`;

    const cloudP = (cx, cy, w) => { let o = ''; for (let i = 0; i < 7; i++) { const x = cx - w / 2 + (i + .5) * w / 7, r = w / 7 * (1.1 + (i % 2) * .35); o += `<circle cx="${f1(x)}" cy="${f1(cy - r * .4)}" r="${f1(r)}" fill="url(#ceCloud)"/>`; } return `<ellipse cx="${cx}" cy="${cy}" rx="${w / 2 + 6}" ry="9" fill="url(#ceCloud)"/>${o}<ellipse cx="${cx}" cy="${cy + 5}" rx="${w / 2}" ry="4" fill="#c8b8e0" opacity=".5"/>`; };
    let beads = ''; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; beads += `<circle cx="${f1(120 + Math.cos(a) * 66)}" cy="${f1(168 + Math.sin(a) * 66)}" r="1.8" fill="#fff4cc"/>`; }

      <circle cx="120" cy="168" r="66" fill="none" stroke="url(#ceRing)" stroke-width="6"/><circle cx="120" cy="168" r="58" fill="none" stroke="#fff4cc" stroke-width="1.2" opacity=".8"/>${beads}
      ${cloudP(52, 116, 92)}${cloudP(188, 116, 92)}${cloudP(62, 290, 108)}${cloudP(180, 290, 104)}
      <path d="M-6 336 V318 C20 306 44 314 70 308 C100 300 130 314 160 306 C190 300 220 310 246 304 V336 Z" fill="url(#ceCloud)"/>`;

      ${halo(190, 40)}${bust(156, 44, .66, { body: '#a8f0d0', shade: '#2a7a64', mane: '#1e5a48', rim: 'rgba(255,240,200,.85)', id: 'ceB', under: elderHorns('ceBh') })}

      ${bust(24, 204, .8, { body: '#fff3c0', shade: '#c08a1a', mane: '#d8a030', rim: 'rgba(255,255,240,.9)', id: 'ceC' })}
      ${glow(182, 238, 40, 'ceGlow')}
      <path d="M166 250 L168 230 L176 240 L182 224 L188 240 L196 230 L198 250 Z" fill="url(#cG)" stroke="#6a4208" stroke-width="1.4"/><rect x="165" y="249" width="34" height="7" rx="1.6" fill="url(#cG)" stroke="#6a4208" stroke-width="1"/>

    return { scene, mid, pop };
  }

  // ---------- Climb B: Sonnenaufgang mit Gebetsfahnen ----------
  function climbB() {
    seed = 61;

      <path d="M-10 226 L30 206 L60 218 L100 200 L140 220 L190 204 L250 222 V260 H-10 Z" fill="#6a3a6a" opacity=".8"/>

    const FLAGS = 'M100 270 C140 284 170 270 192 248 C214 222 212 160 198 118 C186 82 120 70 82 42';

  // ---------- Climb C: Der Turm ----------
  function climbC() {

      <path d="M34 86 V40" stroke="#3a2a1a" stroke-width="1.8"/><path d="M34 40 C24 36 18 44 10 42 L12 56 C20 58 26 50 34 54 Z" fill="url(#spFlag)" stroke="#6a4a10" stroke-width=".8"/>
      ${rail(30, 90, 86)}

      ${bust(38, 222, .42, { flip: true, body: '#ecc890', shade: '#b07d18', mane: '#7a4a20', rim: 'rgba(255,240,200,.7)', eye: 'happy', id: 'spP2' })}${rail(34, 90, 262)}
      ${glow(208, 228, 20, 'spLamp')}<rect x="204" y="226" width="8" height="10" rx="1.6" fill="#ffd88a" stroke="#5a3a1a" stroke-width="1"/><path d="M208 220 V226" stroke="#3a2a1a" stroke-width="1"/>
      ${bust(162, 208, .42, { body: '#dcb47e', shade: '#9a6a28', mane: '#5a3418', rim: 'rgba(255,220,150,.75)', eye: 'open', id: 'spP3' })}${rail(150, 212, 248)}
      ${spark(180, 20, .7, '#fff8e0', 'a-twinkle')}${spark(66, 140, .5, '#fff8e0', 'a-twinkle d2')}${spark(220, 170, .6, '#fff8e0', 'a-twinkle d1')}`;

  // EIN goldenes Seil verbindet alle vier Ponys ueber alle Fugen hinweg
  const ROPE = 'M48 290 C96 312 150 304 184 274 C214 246 220 170 196 124 C176 92 120 104 92 86 C76 76 66 70 56 64';
  const climbRope = () => `<defs>${lg('clRope', [[0, '#f8d890'], [1, '#a8701e']], 1, 1)}</defs>
    <path d="${ROPE}" stroke="#3a2208" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="${ROPE}" stroke="url(#clRope)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="${ROPE}" stroke="#fff4d0" stroke-width="2.6" fill="none" stroke-dasharray="1.2 3" opacity=".55"/>
    ${[[48, 290], [184, 274], [196, 124], [56, 64]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#c8d0e0" stroke="#3a4050" stroke-width=".8"/>`).join('')}`;
  const MOTIFS = [
    { id: 'pantheon', title: 'Hall of Gods', scene: hallScene(), mid: hallMid(), pops: Array(4).fill(hallPop), names: ['Riot God', 'Elder God', 'Ultimate God', 'Hall of Gods'], cells: [0, 1, 4, 5] },
    { id: 'hoard', title: "Dragon's Hoard", scene: hoardScene(), mid: hoardMid(), pops: Array(4).fill(hoardPop), names: ['500 LP', '1,000 LP', '2,000 LP', '5,000 LP'], cells: [2, 3, 6, 7] },
    { id: 'climb', title: 'The Climb', scene: climbScene(), mid: climbMid(), pops: climbPops.map(fn => () => climbRope() + fn()), names: ['Majestic', 'Hard', 'Easy', 'Normal'], cells: [8, 9, 12, 13] }
  ];
  const NUMS = { pantheon: [1, 2, 3, 4], hoard: [5, 6, 7, 8], climb: [12, 11, 9, 10] };

  // ===================== Karte =====================
  const POP_SLABS = 12, MID_SLABS = 6;
  let uid = 0;
  const popCache = {};
  // slabs: Anzahl Dicke-Schichten der Figur (Mittelebene anteilig). Einzelansicht
  // nutzt mehr, duennere Schichten - sonst sieht man beim starken Kippen die Stufen.
  function card(m, slot, { flat = false, slabs = POP_SLABS } = {}) {
    const midSlabs = Math.max(MID_SLABS, Math.round(slabs * MID_SLABS / POP_SLABS));
    const vx = (slot % 2) * 120, vy = Math.floor(slot / 2) * 168;
    const key = m.id + slot;
    if (!popCache[key]) popCache[key] = m.pops[slot]();
    const pop = popCache[key];
    const svg = (c, inset = 0) => `<svg viewBox="${vx + inset} ${vy + inset} ${120 - inset * 2} ${168 - inset * 2}" preserveAspectRatio="xMidYMid slice">${c}</svg>`;
    // Dicke-Schicht = Seitenwand: Inhalt weichzeichnen (sonst ergeben die Umrisslinien
    // jeder Kopie Nadelstreifen), Kontur ueber die Alpha-Kurve wieder scharf (Nutzer v6.18.0)
    const dil = (c, r) => { const id = `dl${++uid}`; return `<defs><filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feMorphology operator="dilate" radius="${r}"/><feGaussianBlur stdDeviation=".9"/><feComponentTransfer><feFuncA type="linear" slope="4" intercept="-2"/></feComponentTransfer></filter></defs><g filter="url(#${id})">${c}</g>`; };
    let layers = '';
    if (flat) {
      layers = `<div class="ly mid">${svg(m.mid, 1.6)}</div><div class="ly pop">${svg(pop, 1.6)}</div>`;
    } else {
      layers += `<div class="ly sh mid-sh">${svg(m.mid, 1.6)}</div>`;
      for (let k = 0; k < midSlabs; k++) layers += `<div class="ly mid slab" style="--i:${(k * MID_SLABS / midSlabs).toFixed(3)};--shade:${(.3 + k / midSlabs * .25).toFixed(2)}">${svg(dil(m.mid, .6), 1.6)}</div>`;
      layers += `<div class="ly mid" style="--i:${MID_SLABS}">${svg(m.mid, 1.6)}</div>`;
      layers += `<div class="ly sh">${svg(pop, 1.6)}</div>`;
      for (let k = 0; k < slabs; k++) layers += `<div class="ly pop slab" style="--i:${(k * POP_SLABS / slabs).toFixed(3)};--shade:${(.28 + k / slabs * .3).toFixed(2)}">${svg(dil(pop, .8), 1.6)}</div>`;
      layers += `<div class="ly pop" style="--i:${POP_SLABS}">${svg(pop, 1.6)}</div>`;
    }
    return `<div class="promo" data-m="${m.id}" data-s="${slot}">
      <div class="p-scene">${svg(m.scene)}<div class="p-foil"></div><div class="p-glint"></div><div class="p-shade"></div></div>
      ${layers}
      <div class="p-stamp">PROMO</div>
      <div class="p-label"><b>${m.names[slot]}</b><span><em>${m.title.toUpperCase()}</em><em>P${String(NUMS[m.id][slot]).padStart(2, '0')}</em></span></div>
    </div>`;
  }
  // Tiefe wie stickers.js tiltTo: Hologramm-Abstand ~30 % der Kartenbreite,
  // Schichtabstand ~1 %, Perspektive ~3 Kartenbreiten (hier fuer die Gruppe)
  function depth(z, w, P) {
    const lift = w * .3;
    z.style.setProperty('--lift', `${lift.toFixed(1)}px`);
    z.style.setProperty('--step', `${(w * .0095).toFixed(2)}px`);
    z.style.setProperty('--comp', ((P - lift) / P).toFixed(4));
  }

  // ===================== Zustand (Demo) =====================
  const DEMO = { pantheon: [0, 2], hoard: [0, 1], climb: [0, 1, 2, 3] };
  const PACKS_DEMO = [{ m: 'hoard', s: 2 }];
  let owned, packs;
  const motif = id => MOTIFS.find(m => m.id === id);
  const grid = document.getElementById('grid');
  function render() {
    let html = '';
    for (let i = 0; i < 16; i++) {
      const m = MOTIFS.find(x => x.cells.includes(i));
      if (!m) { html += `<div class="cell future" data-i="${i}"></div>`; continue; }
      const slot = m.cells.indexOf(i);
      html += owned[m.id].includes(slot) ? `<div class="cell" data-i="${i}">${card(m, slot, { flat: true })}</div>` : `<div class="cell empty" data-i="${i}"></div>`;
    }
    grid.innerHTML = html;
    const a = grid.querySelector('[data-i="10"]'), b = grid.querySelector('[data-i="15"]');
    const n = document.createElement('div'); n.className = 'future-note'; n.textContent = 'MORE PROMOS LATER';
    Object.assign(n.style, { left: `${a.offsetLeft}px`, top: `${(a.offsetTop + b.offsetTop + b.offsetHeight) / 2 - 6}px`, width: `${b.offsetLeft + b.offsetWidth - a.offsetLeft}px` });
    grid.appendChild(n);
    const pw = document.getElementById('packWrap');
    pw.classList.toggle('empty', !packs.length);
    document.getElementById('packCount').textContent = packs.length;
    document.getElementById('packNote').textContent = packs.length ? 'Earned by completing something special. Every pack holds exactly one promo - click to open.' : 'No promo packs right now - complete an Arena God, collect LP or clear a challenge to earn one.';
  }

  // ===================== Zoom =====================
  // Groessen (Nutzer): Einzelansicht = normaler Album-Zoom (340 px breit),
  // 4er-Gruppe = 60 % davon pro Karte (Nutzer: 80 % war zu gross); bei kleinen Fenstern proportional kleiner.
  const ov = document.getElementById('ov'), group = document.getElementById('group');
  let view = null;
  const GAP = 8;
  function singleW() { return Math.min(340, innerWidth * .7, innerHeight * .8 / 1.4); }
  function groupW() { return Math.min(singleW() * .6, (innerHeight * .86 - GAP) / 2 / 1.4); }
  const P = () => groupW() * 2 * 2.2;
  const cellRect = (m, slot) => grid.querySelector(`[data-i="${m.cells[slot]}"]`).getBoundingClientRect();
  const place = (el, r) => Object.assign(el.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  function groupRect(slot) {
    const w = groupW(), h = w * 1.4;
    const x0 = (innerWidth - (w * 2 + GAP)) / 2, y0 = (innerHeight - (h * 2 + GAP)) / 2;
    return { left: x0 + (slot % 2) * (w + GAP), top: y0 + Math.floor(slot / 2) * (h + GAP), width: w, height: h };
  }
  function singleRect() { const w = singleW(), h = w * 1.4; return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h }; }
  function applyDepth() { const p = P(); document.getElementById('stage').style.perspective = `${p}px`; view && view.items.forEach(it => depth(it.el, parseFloat(it.el.style.width), p)); }
  function flatDepth(el) { el.style.setProperty('--lift', '0px'); el.style.setProperty('--step', '0px'); el.style.setProperty('--comp', '1'); }
  function openGroup(m) {
    group.innerHTML = '';
    view = { m, items: [], single: null };
    for (const slot of owned[m.id].slice().sort()) {
      const z = document.createElement('div'); z.className = 'z'; z.dataset.s = slot;
      z.innerHTML = card(m, slot); flatDepth(z);
      place(z, cellRect(m, slot)); group.appendChild(z);
      view.items.push({ slot, el: z });
      grid.querySelector(`[data-i="${m.cells[slot]}"]`).classList.add('hidden-src');
    }
    ov.classList.add('open');
    void group.offsetWidth;
    view.items.forEach(it => place(it.el, groupRect(it.slot)));
    setTimeout(applyDepth, 80);
  }
  function toGroup() { view.single = null; view.items.forEach(it => { it.el.classList.remove('away'); place(it.el, groupRect(it.slot)); }); setTimeout(applyDepth, 80); }
  function toSingle(slot) { view.single = slot; view.items.forEach(it => { if (it.slot === slot) place(it.el, singleRect()); else it.el.classList.add('away'); }); setTimeout(applyDepth, 80); }
  function close() {
    if (!view) return;
    const v = view; view = null;
    group.classList.add('resting'); group.style.transform = '';
    v.items.forEach(it => { it.el.classList.remove('away'); flatDepth(it.el); place(it.el, cellRect(v.m, it.slot)); });
    ov.classList.remove('open');
    setTimeout(() => { group.innerHTML = ''; group.classList.remove('resting'); grid.querySelectorAll('.hidden-src').forEach(c => c.classList.remove('hidden-src')); }, 520);
  }
  grid.addEventListener('click', e => { const p = e.target.closest('.promo'); if (p && !view) openGroup(motif(p.dataset.m)); });
  ov.addEventListener('click', e => {
    if (!view || view.fresh) return;
    const z = e.target.closest('.z');
    if (z && view.single == null) { toSingle(+z.dataset.s); return; }
    if (z) return;
    if (view.single != null) toGroup(); else close();
  });
  addEventListener('keydown', e => { if (e.key !== 'Escape' || !view || view.fresh) return; if (view.single != null) toGroup(); else close(); });
  // Gruppe/Einzelkarte als EINE Einheit zur Maus hin kippen (mehr Spielraum als v1)
  addEventListener('mousemove', e => {
    if (!view) return;
    group.classList.remove('resting');
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    const [ry, rx] = view.single != null ? [48, 40] : [36, 30];
    group.style.transform = `rotateY(${(x * ry).toFixed(2)}deg) rotateX(${(-y * rx).toFixed(2)}deg)`;
  });
  document.addEventListener('mouseleave', () => { if (view) { group.classList.add('resting'); group.style.transform = ''; } });
  addEventListener('resize', () => { if (view && !view.fresh) { if (view.single != null) toSingle(view.single); else toGroup(); } render(); });

  // ===================== Promo-Pack oeffnen =====================
  const packWrap = document.getElementById('packWrap');
  packWrap.addEventListener('click', () => {
    if (!packs.length || view || packWrap.classList.contains('opening')) return;
    const p = packs.shift(), m = motif(p.m);
    packWrap.classList.add('opening');
    setTimeout(() => {
      packWrap.classList.remove('opening');
      const pr = packWrap.getBoundingClientRect();
      group.innerHTML = '';
      const z = document.createElement('div'); z.className = 'z'; z.dataset.s = p.s;
      z.innerHTML = card(m, p.s) + '<div class="new-badge">NEW PROMO</div>'; flatDepth(z);
      place(z, { left: pr.left + pr.width * .15, top: pr.top + pr.height * .1, width: pr.width * .7, height: pr.width * .7 * 1.4 });
      group.appendChild(z);
      ov.classList.add('open');
      view = { m, items: [{ slot: p.s, el: z }], single: p.s, fresh: true };
      void z.offsetWidth;
      place(z, singleRect()); setTimeout(applyDepth, 80);
      document.getElementById('packCount').textContent = packs.length;
      packWrap.classList.toggle('empty', !packs.length);
    }, 460);
  });
  // frisch gezogen: Klick -> fliegt in ihren Platz im Raster
  ov.addEventListener('click', () => {
    if (!view || !view.fresh) return;
    const v = view; view = null;
    owned[v.m.id].push(v.items[0].slot);
    const z = v.items[0].el; z.querySelector('.new-badge')?.remove();
    group.classList.add('resting'); group.style.transform = ''; flatDepth(z);
    place(z, grid.querySelector(`[data-i="${v.m.cells[v.items[0].slot]}"]`).getBoundingClientRect());
    ov.classList.remove('open');
    setTimeout(() => { group.innerHTML = ''; group.classList.remove('resting'); render(); }, 520);
  });

  function reset() { owned = JSON.parse(JSON.stringify(DEMO)); packs = PACKS_DEMO.slice(); render(); }
  document.getElementById('resetBtn').onclick = reset;
  const unlockAll = () => { owned = {}; MOTIFS.forEach(m => { owned[m.id] = [0, 1, 2, 3]; }); packs = []; render(); };
  document.getElementById('allBtn').onclick = unlockAll;
  // Varianten umschalten (Theme-Lab-Vergleich): Hall A/B/C, Climb A/B/C
  const VARIANTS = {
    pantheon: { A: () => ({ scene: hallScene(), mid: hallMid(), pops: Array(4).fill(hallPop) }), B: () => { const v = hallB(); return { scene: v.scene, mid: v.mid, pops: Array(4).fill(v.pop) }; }, C: () => { const v = hallC(); return { scene: v.scene, mid: v.mid, pops: Array(4).fill(v.pop) }; } },
    climb: { A: () => ({ scene: climbScene(), mid: climbMid(), pops: climbPops.map(fn => () => climbRope() + fn()) }), B: () => { const v = climbB(); return { scene: v.scene, mid: v.mid, pops: Array(4).fill(v.pop) }; }, C: () => { const v = climbC(); return { scene: v.scene, mid: v.mid, pops: Array(4).fill(v.pop) }; } }
  };
  const chosen = { pantheon: 'A', climb: 'C' }; // Nutzer 2026-11-27: Hall A Temple, Climb C Tower
  const varBtns = [...document.querySelectorAll('[data-var]')];
  const markVars = () => varBtns.forEach(b => { const [m, v] = b.dataset.var.split(':'); b.classList.toggle('on', chosen[m] === v); });
  varBtns.forEach(b => b.onclick = () => {
    const [id, v] = b.dataset.var.split(':');
    chosen[id] = v; markVars();
    const m = motif(id); Object.assign(m, VARIANTS[id][v]()); for (let i = 0; i < 4; i++) delete popCache[id + i];
    const reopen = view && view.m.id === id && !view.fresh;
    if (view) { group.innerHTML = ''; ov.classList.remove('open'); view = null; grid.querySelectorAll('.hidden-src').forEach(c => c.classList.remove('hidden-src')); }
    render();
    if (reopen) openGroup(m);
  });
  markVars();
  Object.assign(motif('climb'), VARIANTS.climb.C()); render();

  // Vorschau startet mit allem freigeschaltet (Nutzer) - 'Reset demo' zeigt Luecken + Pack
  unlockAll();
})();
</script>
</body>
</html>
