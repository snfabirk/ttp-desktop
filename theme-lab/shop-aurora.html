<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aurora - Fancy shop theme (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): Shop-Theme "Aurora" (Fancy, bewegt, ohne
     Easter Egg). Polarnacht ueber einem zugefrorenen See, als leichter WebGL-Shader:
     - drei Nordlicht-Vorhaenge: scharfe gruene Unterkante, nach oben ausfransende
       Strahlen, oben violett-pink, falten sich langsam
     - Sternenhimmel mit Funkeln und feiner Milchstrasse
     - zwei Bergketten mit Schnee, der das Nordlicht gruen spiegelt; Dunst dazwischen
     - spiegelnder See mit leichten Wellen, Fichten-Silhouetten an den Seiten
     - leichter Schneefall mit Tiefenunschaerfe (2D-Overlay)
     Pausiert, wenn das Fenster nicht sichtbar ist. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --panel-bg: rgba(8, 16, 26, .55); --border: #23485a; --accent: #6ef0b4; --accent2: #c79cff; --text: #e8f4f8; --text-dim: #9ab8c4; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a12; color: var(--text); font-family: Georgia, serif; }
  #gl, #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #fx { pointer-events: none; }
  .stage { position: relative; z-index: 2; pointer-events: none; }
  .stage > * { pointer-events: auto; }
  .nav { position: fixed; top: 18px; left: 24px; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel-bg); backdrop-filter: blur(10px); z-index: 3; }
  .nav span { padding: 5px 11px; border-radius: 14px; font-family: 'Cinzel', serif; font-size: .78rem; color: var(--text-dim); }
  .nav span.on { background: linear-gradient(135deg, #7ff5c0, #5ad0d8 60%, #b49cff); color: #04121a; }
  header { text-align: center; padding-top: 34px; }
  h1 { margin: 0; font-family: 'Cinzel', serif; font-weight: 900; font-size: 3rem; letter-spacing: 3px; background: linear-gradient(100deg, #8ff7c8 0%, #6ee0e0 45%, #c8a4ff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 18px rgba(110, 240, 180, .3)); }
  .subtitle { margin: 6px 0 0; color: var(--text-dim); font-style: italic; letter-spacing: 6px; text-transform: uppercase; }
  .wrap { max-width: 1000px; margin: 34px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 0 30px; }
  .card { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; box-shadow: 0 6px 24px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(140, 255, 210, .12); }
  .card h3 { margin: 0 0 8px; color: var(--accent); font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(35, 72, 90, .6); font-size: .9rem; }
  .row:last-child { border-bottom: none; }
  .xp { color: var(--accent); }
  .muted { color: var(--text-dim); font-size: .9rem; }
  .tag { display: inline-block; margin-bottom: 8px; padding: 1px 8px; border: 1px dashed #3a6a7a; border-radius: 9px; color: #5a8a9a; font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div class="nav"><span class="on">⌂ Overview</span><span>Profile</span><span>Challenge</span><span>Pass</span><span>Trophies</span><span>Shop</span></div>
<div class="stage">
  <header><h1>League of Legends</h1><p class="subtitle">Three-Trick-Pony</p></header>
  <div class="wrap">
    <div><span class="tag">Shop theme · Fancy</span>
      <div class="card"><h3>Today</h3>
        <div class="row"><span>First Win of the Day</span><span class="xp">+400 XP</span></div>
        <div class="row"><span>Champion of the Day</span><span class="xp">+500 XP</span></div>
        <div class="row"><span>In the Thick of It</span><span class="xp">+300 XP</span></div>
      </div></div>
    <div><span class="tag">Readability check</span>
      <div class="card"><h3>Last game</h3>
        <div class="row"><span>Ekko · Jungle</span><span class="xp">Victory</span></div>
        <div class="row"><span>KDA</span><span>8 / 2 / 11</span></div>
        <div class="muted" style="margin-top:8px">+725 XP · LP Bank 64 / 100</div>
      </div></div>
  </div>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float T;
const float YH = -.24;   // Seeufer
float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n2(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * n2(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= .5; } return s; }

vec3 aurora(vec2 p) {
  vec3 acc = vec3(0.);
  for (int i = 0; i < 3; i++) {
    float fi = float(i), x = p.x * (1. + fi * .35) + fi * 3.7;
    float curve = -.02 + fi * .08 + .12 * sin(x * .9 + T * .06 + fi * 1.7) + .1 * fbm(vec2(x * 1.2 + T * .035, fi * 5.));
    float d = p.y - curve;
    if (d > -.01) {
      float fold = fbm(vec2(x * 2.6, T * .08 + fi));
      float rays = .25 + .75 * pow(n2(vec2(x * 46. + fold * 7., T * .25 + fi * 9.)), 2.4) + .2 * n2(vec2(x * 12. + fold * 3., fi));
      float fall = exp(-max(d, 0.) * (5.5 - fi)) * smoothstep(-.01, .012, d);
      float band = smoothstep(.15, .75, fbm(vec2(x * .9 - T * .05, fi * 3. + 1.)));
      vec3 c = mix(vec3(.12, 1., .55), vec3(.25, .85, .95), smoothstep(.02, .1, d));
      c = mix(c, vec3(.8, .3, .95), smoothstep(.1, .28, d));
      acc += c * rays * fall * band * (1.1 - fi * .3);
    }
  }
  return acc;
}
float ridge(float x, float far) {
  float big = pow(1. - abs(n2(vec2(x * (far > .5 ? 3.4 : 2.4), far * 7.)) * 2. - 1.), 1.8);
  float small = pow(1. - abs(n2(vec2(x * 9., far * 3. + 1.)) * 2. - 1.), 2.);
  return YH + (far > .5 ? .05 : .055) + (far > .5 ? .15 : .09) * big + .03 * small + .02 * fbm(vec2(x * 18., far));
}
vec3 sky(vec2 p) {
  vec3 col = mix(vec3(.02, .07, .1), vec3(.01, .015, .04), smoothstep(YH, .5, p.y));
  // Sterne + Milchstrasse
  vec2 g = p * 140.; vec2 id = floor(g), f = fract(g) - .5;
  float r = h21(id); if (r > .985) { float tw = .55 + .45 * sin(T * (1. + r * 3.) + r * 40.); col += vec3(.85, .9, 1.) * smoothstep(.12, 0., length(f)) * tw * (r - .985) * 60.; }
  float mw = exp(-pow((p.y - .25 - p.x * .35) * 3.2, 2.)) * fbm(p * 6.);
  col += vec3(.25, .3, .45) * mw * .25;
  col += aurora(p) * .9;
  col += vec3(.04, .2, .15) * exp(-(p.y - YH) * 5.) * .55;   // gruenes Leuchten ueber dem Horizont
  // Berge: hinten (Dunst, heller) und vorn (dunkel), Schnee nimmt das Nordlicht auf
  vec3 auroraTint = vec3(.15, .55, .4) * (.4 + .6 * smoothstep(-.3, .3, sin(p.x * 1.2 + T * .06)));
  for (int k = 0; k < 2; k++) {
    float far = k == 0 ? 1. : 0.;
    float top = ridge(p.x, far);
    if (p.y < top) {
      // Schnee nur auf den Gipfeln, mit Rinnen; Licht aus 2D-Relief statt Hangrichtung (keine Streifen)
      float snowline = YH + (far > .5 ? .135 : .1) + .03 * fbm(vec2(p.x * 5., far * 3.));
      float gully = fbm(vec2(p.x * 26., p.y * 7. + far * 4.));
      float snow = smoothstep(snowline - .01, snowline + .02, p.y + (gully - .5) * .05);
      vec2 rp = p * vec2(9., 11.) + far * 5.;
      float hc = fbm(rp), lit = clamp(.5 + (hc - fbm(rp + vec2(.08, -.05))) * 9., 0., 1.);
      vec3 rock = mix(vec3(.02, .035, .05), vec3(.045, .07, .09), far) * (.7 + .6 * lit);
      vec3 snowC = mix(vec3(.18, .25, .32), vec3(.5, .62, .7), lit) + auroraTint * .55;
      vec3 m = mix(rock, snowC * (far > .5 ? .6 : .9), snow);
      m = mix(m, vec3(.05, .12, .15), far * .5);                                  // Dunst auf der hinteren Kette
      m *= .75 + .25 * smoothstep(0., .08, top - p.y + .02);                       // Grat leicht abgesetzt
      col = m;
    }
  }
  return col;
}
float pines(vec2 p) { // Fichten-Silhouetten an den Raendern
  float a = R.x / R.y * .5, m = 0.;
  for (int i = 0; i < 7; i++) {
    float fi = float(i), side = mod(fi, 2.) < .5 ? -1. : 1.;
    float tx = side * (a - .03 - fi * .045 - h21(vec2(fi, 2.)) * .03), base = YH - .03 - h21(vec2(fi, 5.)) * .08;
    float top = base + .24 + h21(vec2(fi, 9.)) * .14 - fi * .02;
    if (p.y < top && p.y > base - .4) {
      float h = top - p.y;
      float w = h * .22 * (.55 + .45 * fract(h * 13. + fi * .3)) + .004;
      m = max(m, smoothstep(w, w - .003, abs(p.x - tx + sin(h * 40. + fi) * .003)));
    }
  }
  return m;
}
void main() {
  vec2 p = (gl_FragCoord.xy - .5 * R) / R.y;
  vec3 col;
  if (p.y > YH) col = sky(p);
  else {
    // See: gespiegelter Himmel, leichte Wellen, dunkler + kuehler; Eis-Glanzstreifen
    float d = YH - p.y;
    vec2 q = vec2(p.x + (n2(vec2(p.x * 4., p.y * 90. + T * .6)) - .5) * .012 * (.3 + d * 3.), 2. * YH - p.y);
    col = sky(q) * vec3(.55, .65, .7) * (.85 - d * .8);
    col += vec3(.1, .2, .22) * smoothstep(.9, 1., n2(vec2(p.x * 3., p.y * 160.))) * .15;
    col = mix(col, vec3(.02, .04, .06), smoothstep(.0, .3, d) * .4);
  }
  float pm = pines(p);
  col = mix(col, vec3(.008, .015, .02) + aurora(p * vec2(1., .6)) * .02, pm);
  // Lesbarkeit oben + Vignette + leichte Tonkurve
  col *= mix(1., .7, smoothstep(.15, .5, p.y));
  col *= 1. - .35 * dot(p * vec2(.8 / (R.x / R.y) * 1.6, 1.), p * vec2(.8 / (R.x / R.y) * 1.6, 1.));
  col = 1. - exp(-col * 1.6);
  gl_FragColor = vec4(pow(col, vec3(.92)), 1.);
}
</script>
<script>
const rand = (a, b) => a + Math.random() * (b - a);
const glc = document.getElementById('gl'), gl = glc.getContext('webgl', { antialias: false });
const fx = document.getElementById('fx'), cx = fx.getContext('2d');
let W = 0, H = 0, D = 1;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T');
const GLS = .8;
function resize() {
  D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  glc.width = Math.round(W * GLS); glc.height = Math.round(H * GLS); gl.viewport(0, 0, glc.width, glc.height);
  fx.width = W * D; fx.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0);
}
addEventListener('resize', resize); resize();
// Schneefall: viele kleine scharfe Flocken + wenige grosse unscharfe im Vordergrund
const flakes = Array.from({ length: 140 }, () => newFlake(true));
function newFlake(anyY) { const fore = Math.random() < .08, d = fore ? rand(2, 3.2) : rand(.3, 1.2); return { x: rand(0, W), y: anyY ? rand(0, H) : -10, d, fore, ph: rand(0, 6), vy: rand(10, 18) * d }; }
let running = false;
function frame(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000); frame.last = now; const t = now / 1000;
  gl.uniform2f(uR, glc.width, glc.height); gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3);
  cx.clearRect(0, 0, W, H);
  flakes.forEach((f, i) => {
    f.y += f.vy * dt; f.x += Math.sin(t * .6 + f.ph) * 8 * f.d * dt + 4 * dt;
    if (f.y > H + 10 || f.x > W + 10) flakes[i] = newFlake(false);
    if (f.fore) { const r = 3.5 * f.d, g = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r); g.addColorStop(0, 'rgba(230, 245, 255, .22)'); g.addColorStop(1, 'rgba(230, 245, 255, 0)'); cx.fillStyle = g; cx.beginPath(); cx.arc(f.x, f.y, r, 0, 7); cx.fill(); }
    else { cx.fillStyle = `rgba(230, 245, 255, ${.35 + .35 * f.d / 1.2})`; cx.beginPath(); cx.arc(f.x, f.y, .5 + .9 * f.d, 0, 7); cx.fill(); }
  });
  requestAnimationFrame(frame);
}
function setRunning(on) { if (on === running) return; running = on; if (on) { frame.last = 0; requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
setRunning(!document.hidden);
</script>
</body>
</html>
