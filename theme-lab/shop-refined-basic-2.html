<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refined + Basic shop cosmetics II (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): die neuen Refined- und Basic-
     Shop-Cosmetics. Refined = schoen gestaltet, aber STEHEND (keine Animation).
     Basic = schlicht und gratis.
     Refined: Themes Cherry Blossom Night, Arctic Shore - Borders Pearl Ring,
     Sunburst Ring - Rahmen Stained Glass, Circuit Board.
     Basic: Border Bronze Ring - Rahmen Linen, Night. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a1428; color: #f0e6d2; font-family: Georgia, serif; }
  body { padding: 20px 40px 40px; }
  h1 { margin: 0; text-align: center; font-family: 'Cinzel', serif; color: #c8aa6e; letter-spacing: 3px; font-size: 1.5rem; }
  h2 { margin: 22px 0 10px; font-family: 'Cinzel', serif; font-size: .95rem; letter-spacing: 2px; text-align: center; }
  h2.refined { color: #4fa3ff; } h2.basic { color: #9aa0a6; }
  .grid { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  .item { text-align: center; }
  .item b { display: block; margin-top: 8px; font-family: 'Cinzel', serif; font-size: .85rem; }
  .item small { color: #a09b8c; font-size: .7rem; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<h1>Refined + Basic · Shop Cosmetics II</h1>
<h2 class="refined">Refined · Themes</h2><div class="grid" id="rThemes"></div>
<h2 class="refined">Refined · Borders</h2><div class="grid" id="rBorders"></div>
<h2 class="refined">Refined · Profile frames</h2><div class="grid" id="rFrames"></div>
<h2 class="basic">Basic</h2><div class="grid" id="basic"></div>

<script>
const DPR = Math.min(2, devicePixelRatio || 1);
const img = new Image(); img.crossOrigin = 'anonymous';
img.src = 'https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png';
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function card(host, name, sub, w, h) {
  const d = document.createElement('div'); d.className = 'item';
  const cv = document.createElement('canvas'); cv.width = w * DPR; cv.height = h * DPR; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  d.append(cv); d.insertAdjacentHTML('beforeend', `<b>${name}</b><small>${sub}</small>`);
  document.getElementById(host).append(d);
  const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return c;
}
// Band zwischen zwei abgerundeten Rechtecken als Clip (rr beginnt jedes Mal einen neuen Pfad, daher Path2D)
const bandClip = (c, x0, y0, W2, H2, b, r0, r1) => { const p2 = new Path2D(), add = (x, y, w, h, r) => { p2.moveTo(x + r, y); p2.arcTo(x + w, y, x + w, y + h, r); p2.arcTo(x + w, y + h, x, y + h, r); p2.arcTo(x, y + h, x, y, r); p2.arcTo(x, y, x + w, y, r); p2.closePath(); }; add(x0, y0, W2, H2, r0); add(x0 + b, y0 + b, W2 - b * 2, H2 - b * 2, r1); c.clip(p2, 'evenodd'); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

// ================= Themes (stehende Szene + Beispielbox) =================
const THEMES = [
  { name: 'Cherry Blossom Night', accent: '#ffb0cc', panel: 'rgba(24, 14, 38, .55)', bd: '#5a3a6a', draw(c, W, H) {
    const r = seeded(31);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#120c2a'); g.addColorStop(.6, '#2a1a48'); g.addColorStop(1, '#3a2450');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let k = 0; k < 60; k++) { c.fillStyle = `rgba(255, 245, 255, ${.3 + r() * .6})`; c.beginPath(); c.arc(r() * W, r() * H * .6, r() * .9 + .2, 0, 7); c.fill(); }
    // Mond mit Hof
    const mx = W * .74, my = H * .3;
    const halo = c.createRadialGradient(mx, my, 20, mx, my, 90); halo.addColorStop(0, 'rgba(255, 220, 240, .28)'); halo.addColorStop(1, 'rgba(255, 220, 240, 0)');
    c.fillStyle = halo; c.fillRect(0, 0, W, H);
    const mg = c.createRadialGradient(mx - 6, my - 6, 2, mx, my, 26); mg.addColorStop(0, '#fffaf4'); mg.addColorStop(1, '#f2d8e4');
    c.fillStyle = mg; c.beginPath(); c.arc(mx, my, 26, 0, 7); c.fill();
    c.fillStyle = 'rgba(200, 170, 190, .35)'; [[-8, -4, 5], [6, 6, 4], [9, -9, 3]].forEach(([dx, dy, rr2]) => { c.beginPath(); c.arc(mx + dx, my + dy, rr2, 0, 7); c.fill(); });
    // ferne Huegel mit Pagode
    c.fillStyle = '#1e1436'; c.beginPath(); c.moveTo(0, H * .78); for (let x = 0; x <= W; x += 10) c.lineTo(x, H * .74 + Math.sin(x * .015) * 10 + Math.sin(x * .04) * 4); c.lineTo(W, H); c.lineTo(0, H); c.fill();
    const px = W * .3, py = H * .72; c.fillStyle = '#160e2a';
    for (let k = 0; k < 3; k++) { const w = 26 - k * 6, y = py - k * 14; c.fillRect(px - w * .35, y - 10, w * .7, 10); c.beginPath(); c.moveTo(px - w * .7, y - 8); c.quadraticCurveTo(px, y - 18, px + w * .7, y - 8); c.lineTo(px + w * .5, y - 12); c.lineTo(px - w * .5, y - 12); c.fill(); }
    c.fillRect(px - 1, py - 52, 2, 10);
    c.fillStyle = 'rgba(255, 200, 120, .9)'; c.fillRect(px - 3, py - 8, 2, 3); c.fillRect(px + 2, py - 22, 2, 3);
    // Wasser mit Mondspiegelung
    c.fillStyle = '#140c26'; c.fillRect(0, H * .84, W, H * .16);
    for (let k = 0; k < 9; k++) { const y = H * .86 + k * 3.5, w = 30 - k * 2.5; c.fillStyle = `rgba(255, 225, 240, ${.5 - k * .045})`; c.fillRect(mx - w / 2 + Math.sin(k * 2) * 4, y, w, 1.2); }
    // Kirschbaum: Ast von links oben, Bluetenwolken
    const branch = (x0, y0, x1, y1, w) => { c.strokeStyle = '#1a0e1a'; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2, Math.min(y0, y1) - 10, x1, y1); c.stroke(); };
    branch(-10, H * .1, W * .42, H * .26, 7); branch(W * .14, H * .17, W * .26, H * .42, 4); branch(W * .3, H * .22, W * .5, H * .12, 3); branch(W * .06, H * .14, W * .1, -5, 4);
    const blossoms = (cx, cy, n, rad) => { for (let k = 0; k < n; k++) { const a = r() * 6.28, d = r() * rad, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .7, s = 2 + r() * 2.5;
      c.fillStyle = r() < .5 ? '#ffc8dc' : r() < .5 ? '#ff9ec2' : '#ffe4ee';
      for (let p = 0; p < 5; p++) { const pa = p / 5 * 6.28 + a; c.beginPath(); c.ellipse(x + Math.cos(pa) * s * .7, y + Math.sin(pa) * s * .7, s * .6, s * .4, pa, 0, 7); c.fill(); }
      c.fillStyle = '#c8406a'; c.beginPath(); c.arc(x, y, s * .25, 0, 7); c.fill(); } };
    [[W * .1, H * .12, 40, 30], [W * .26, H * .2, 45, 34], [W * .42, H * .25, 30, 24], [W * .25, H * .42, 26, 20], [W * .5, H * .12, 24, 20], [W * .05, H * .02, 26, 24]].forEach(([x, y, n, rad]) => blossoms(x, y, n, rad));
    // fallende Bluetenblaetter (stehend)
    for (let k = 0; k < 26; k++) { const x = r() * W, y = H * (.2 + r() * .7); c.save(); c.translate(x, y); c.rotate(r() * 6.28); c.fillStyle = `rgba(255, 190, 215, ${.5 + r() * .4})`; c.beginPath(); c.ellipse(0, 0, 3, 1.6, 0, 0, 7); c.fill(); c.restore(); }
    // Laterne rechts unten
    const lx = W * .9, ly = H * .7; const lg = c.createRadialGradient(lx, ly, 2, lx, ly, 34); lg.addColorStop(0, 'rgba(255, 190, 110, .45)'); lg.addColorStop(1, 'rgba(255, 190, 110, 0)');
    c.fillStyle = lg; c.beginPath(); c.arc(lx, ly, 34, 0, 7); c.fill();
    c.fillStyle = '#1a1020'; c.fillRect(lx - 2, ly + 8, 4, 40); c.fillRect(lx - 9, ly - 12, 18, 3);
    c.fillStyle = '#ffcf8a'; c.fillRect(lx - 6, ly - 9, 12, 16); c.fillStyle = '#1a1020'; c.fillRect(lx - 7, ly + 7, 14, 3);
  } },
  { name: 'Arctic Shore', accent: '#9ad8ff', panel: 'rgba(14, 30, 48, .5)', bd: '#3a6a8a', draw(c, W, H) {
    const r = seeded(47);
    const g = c.createLinearGradient(0, 0, 0, H * .6); g.addColorStop(0, '#5a6aa8'); g.addColorStop(.55, '#c8a0c0'); g.addColorStop(1, '#f6d0b8');
    c.fillStyle = g; c.fillRect(0, 0, W, H * .6);
    // tiefe Sonne knapp am Horizont
    const sun = c.createRadialGradient(W * .62, H * .58, 2, W * .62, H * .58, 70); sun.addColorStop(0, 'rgba(255, 240, 220, .95)'); sun.addColorStop(.15, 'rgba(255, 220, 200, .6)'); sun.addColorStop(1, 'rgba(255, 210, 200, 0)');
    c.fillStyle = sun; c.fillRect(0, 0, W, H * .6);
    // ferne Gletscherberge
    c.fillStyle = '#9aa8cc'; c.beginPath(); c.moveTo(0, H * .6); [[0, .5], [.08, .44], [.16, .52], [.25, .4], [.34, .5], [.42, .47], [.5, .56], [.8, .55], [.86, .45], [.93, .5], [1, .46], [1, .6]].forEach(([x, y]) => c.lineTo(W * x, H * y)); c.fill();
    c.fillStyle = 'rgba(255, 255, 255, .55)'; c.beginPath(); c.moveTo(W * .25, H * .4); c.lineTo(W * .29, H * .45); c.lineTo(W * .27, H * .44); c.lineTo(W * .22, H * .44); c.fill();
    // Meer
    const sea = c.createLinearGradient(0, H * .6, 0, H); sea.addColorStop(0, '#8a94bc'); sea.addColorStop(1, '#2a3a5e'); c.fillStyle = sea; c.fillRect(0, H * .6, W, H * .4);
    c.fillStyle = 'rgba(255, 230, 215, .5)'; for (let k = 0; k < 10; k++) { const w = 40 - k * 3; c.fillRect(W * .62 - w / 2 + Math.sin(k * 3) * 5, H * .62 + k * 3.2, w, 1.2); }
    // Eisberge mit Licht- und Schattenseite + Spiegelung
    const berg = (x, base, w, h) => {
      const top = [x + w * .45, base - h], L = [x, base], Rt = [x + w, base], mid = [x + w * .6, base - h * .45];
      c.fillStyle = '#eef6ff'; c.beginPath(); c.moveTo(...L); c.lineTo(...top); c.lineTo(...mid); c.lineTo(x + w * .55, base); c.fill();
      c.fillStyle = '#9ab8d8'; c.beginPath(); c.moveTo(...top); c.lineTo(...Rt); c.lineTo(x + w * .55, base); c.lineTo(...mid); c.fill();
      c.strokeStyle = 'rgba(255, 255, 255, .8)'; c.lineWidth = 1; c.beginPath(); c.moveTo(...L); c.lineTo(...top); c.stroke();
      c.fillStyle = 'rgba(120, 180, 220, .35)'; c.beginPath(); c.moveTo(x + w * .1, base); c.lineTo(x + w * .45, base + h * .45); c.lineTo(x + w * .9, base); c.fill();
    };
    berg(W * .08, H * .7, 70, 40); berg(W * .78, H * .68, 50, 26); berg(W * .5, H * .66, 30, 14);
    // Ufer mit Schnee und Steinen vorn
    c.fillStyle = '#e8f0fa'; c.beginPath(); c.moveTo(0, H); c.lineTo(0, H * .86); for (let x = 0; x <= W; x += 12) c.lineTo(x, H * .88 + Math.sin(x * .03) * 4 + r() * 2); c.lineTo(W, H); c.fill();
    c.fillStyle = 'rgba(150, 180, 220, .5)'; for (let x = 0; x <= W; x += 30) { c.beginPath(); c.ellipse(x + r() * 10, H * .95, 14, 2, 0, 0, 7); c.fill(); }
    for (let k = 0; k < 6; k++) { const x = r() * W, y = H * (.88 + r() * .08); c.fillStyle = '#3a4a62'; c.beginPath(); c.ellipse(x, y, 6 + r() * 6, 3 + r() * 2, 0, Math.PI, 0); c.fill(); c.fillStyle = '#f4f8ff'; c.beginPath(); c.ellipse(x, y - 2, 5 + r() * 4, 1.6, 0, Math.PI, 0); c.fill(); }
  } }
];
THEMES.forEach(th => {
  const W = 420, H = 230, c = card('rThemes', th.name, 'Theme · Refined', W, H);
  th.draw(c, W, H);
  rr(c, W / 2 - 110, H / 2 - 42, 220, 84, 10); c.fillStyle = th.panel; c.fill(); c.strokeStyle = th.bd; c.lineWidth = 1; c.stroke();
  c.font = '700 13px Cinzel, serif'; c.fillStyle = th.accent; c.fillText('TODAY', W / 2 - 96, H / 2 - 18);
  c.font = '12px Georgia'; c.fillStyle = '#f2ece4'; c.fillText('First Win of the Day', W / 2 - 96, H / 2 + 4); c.fillText('Champion of the Day', W / 2 - 96, H / 2 + 24);
  c.fillStyle = th.accent; c.textAlign = 'right'; c.fillText('+400 XP', W / 2 + 96, H / 2 + 4); c.fillText('+500 XP', W / 2 + 96, H / 2 + 24); c.textAlign = 'left';
});

// ================= Borders =================
function borderCard(host, name, sub, deco) {
  const S = 160, c = card(host, name, sub, S, S), R = 46;
  const go = () => { c.clearRect(0, 0, S, S); c.save(); c.translate(S / 2, S / 2); deco(c, R, 'under'); c.save(); c.beginPath(); c.arc(0, 0, R, 0, 7); c.clip(); c.drawImage(img, -R, -R, R * 2, R * 2); c.restore(); deco(c, R, 'over'); c.restore(); };
  if (img.complete) go(); else img.addEventListener('load', go);
}
const ring = (c, r, w, stops) => { const g = c.createLinearGradient(-r, -r, r, r); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); c.strokeStyle = g; c.lineWidth = w; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke(); };
const pearl = (c, x, y, r) => {
  c.fillStyle = 'rgba(0, 0, 0, .3)'; c.beginPath(); c.arc(x + r * .25, y + r * .3, r, 0, 7); c.fill();
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#f4eef0'); g.addColorStop(.75, '#d8cdd6'); g.addColorStop(1, '#a89aa8');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  const ir = c.createLinearGradient(x - r, y + r, x + r, y - r); ir.addColorStop(0, 'rgba(255, 190, 220, .3)'); ir.addColorStop(.5, 'rgba(190, 230, 255, .2)'); ir.addColorStop(1, 'rgba(255, 240, 200, .25)');
  c.fillStyle = ir; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.fillStyle = 'rgba(255, 255, 255, .95)'; c.beginPath(); c.ellipse(x - r * .35, y - r * .4, r * .28, r * .18, -.6, 0, 7); c.fill();
};
const REFINED_BORDERS = [
  ['Pearl Ring', (c, R, p) => { if (p !== 'over') return;
    ring(c, R * 1.04, 2, ['#f2d68a', '#a8762a', '#f2d68a']);
    const N = 26; for (let k = 0; k < N; k++) { const a = k / N * Math.PI * 2 - Math.PI / 2, big = k % 2 === 0, rad = big ? 5.4 : 3.6; pearl(c, Math.cos(a) * R * 1.15, Math.sin(a) * R * 1.15, rad); }
    // Anhaenger unten: Tropfenperle an Goldfassung
    c.fillStyle = '#d6a848'; c.beginPath(); c.arc(0, R * 1.32, 3, 0, 7); c.fill();
    c.save(); c.translate(0, R * 1.48); c.scale(1, 1.25); pearl(c, 0, 0, 7); c.restore();
  }],
  ['Sunburst Ring', (c, R, p) => {
    if (p === 'under') { // Strahlen hinter dem Bild
      const N = 32; for (let k = 0; k < N; k++) { const a = k / N * Math.PI * 2, long = k % 2 === 0, L = R * (long ? 1.62 : 1.38), wd = long ? .07 : .05;
        const g = c.createLinearGradient(0, 0, Math.cos(a) * L, Math.sin(a) * L); g.addColorStop(.55, '#ffe08a'); g.addColorStop(1, long ? '#c8862a' : '#a86a1e');
        c.fillStyle = g; c.beginPath(); c.moveTo(Math.cos(a - wd) * R, Math.sin(a - wd) * R); c.lineTo(Math.cos(a) * L, Math.sin(a) * L); c.lineTo(Math.cos(a + wd) * R, Math.sin(a + wd) * R); c.fill();
        c.strokeStyle = 'rgba(255, 245, 210, .6)'; c.lineWidth = .6; c.beginPath(); c.moveTo(Math.cos(a) * R, Math.sin(a) * R); c.lineTo(Math.cos(a) * L, Math.sin(a) * L); c.stroke(); }
      return; }
    ring(c, R * 1.06, 8, ['#fff2b8', '#d89a2e', '#fff0b0', '#9a6418']);
    ring(c, R * 1.13, 1.2, ['#fff6d0', '#c8862a']);
    c.fillStyle = '#fff6d6'; for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2 + Math.PI / 16; c.beginPath(); c.arc(Math.cos(a) * R * 1.06, Math.sin(a) * R * 1.06, 1.3, 0, 7); c.fill(); }
  }]
];
REFINED_BORDERS.forEach(([n, d]) => borderCard('rBorders', n, 'Border · Refined', d));

// ================= Rahmen =================
function frameCard(host, name, sub, deco) {
  const W = 300, H = 180, P = 22, c = card(host, name, sub, W, H), w = W - P * 2, h = H - P * 2;
  rr(c, P, P, w, h, 12); c.fillStyle = 'rgba(10, 20, 40, .7)'; c.fill();
  c.fillStyle = 'rgba(255,255,255,.05)'; c.strokeStyle = 'rgba(255,255,255,.08)';
  [[P + 12, P + 12, w - 24, 46], [P + 12, P + 66, (w - 32) / 2, h - 78], [P + 20 + (w - 32) / 2, P + 66, (w - 32) / 2, h - 78]].forEach(b => { rr(c, ...b, 7); c.fill(); c.stroke(); });
  deco(c, P, P, w, h);
}
const REFINED_FRAMES = [
  ['Stained Glass', (c, x, y, w, h) => {
    // Glasband aus Scheiben in Edelsteinfarben, Bleiruten dazwischen, Rosetten an den Ecken
    const r = seeded(5), cols = ['#c8203a', '#2a5ad0', '#e8b020', '#1a9a6a', '#7a2ab0', '#e0602a'];
    const band = 12, o = 6;
    const pane = pts => { const col = cols[(r() * cols.length) | 0]; c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.closePath();
      const cx2 = pts.reduce((s2, q) => s2 + q[0], 0) / pts.length, cy2 = pts.reduce((s2, q) => s2 + q[1], 0) / pts.length;
      const g = c.createRadialGradient(cx2 - 3, cy2 - 3, 1, cx2, cy2, 16); g.addColorStop(0, '#ffffffaa'); g.addColorStop(.25, col); g.addColorStop(1, col + 'cc');
      c.fillStyle = g; c.fill(); c.strokeStyle = '#1a1a1e'; c.lineWidth = 2.2; c.stroke(); };
    const x0 = x - o - band, y0 = y - o - band, x1 = x + w + o + band, y1 = y + h + o + band;
    const edge = (ax, ay, bx, by, inX, inY, n) => { for (let k = 0; k < n; k++) { const u0 = k / n, u1 = (k + 1) / n, um = (u0 + u1) / 2 + (r() - .5) * .3 / n;
      const p = u => [ax + (bx - ax) * u, ay + (by - ay) * u];
      const [a0x, a0y] = p(u0), [a1x, a1y] = p(u1), [mx, my] = p(um);
      pane([[a0x, a0y], [mx, my], [mx + inX * band, my + inY * band], [a0x + inX * band, a0y + inY * band]]);
      pane([[mx, my], [a1x, a1y], [a1x + inX * band, a1y + inY * band], [mx + inX * band, my + inY * band]]); } };
    edge(x0 + band * 2, y0, x1 - band * 2, y0, 0, 1, 7); edge(x0 + band * 2, y1 - band, x1 - band * 2, y1 - band, 0, 1, 7);
    edge(x0, y0 + band * 2, x0, y1 - band * 2, 1, 0, 4); edge(x1 - band, y0 + band * 2, x1 - band, y1 - band * 2, 1, 0, 4);
    // Rosetten an den Ecken
    [[x0 + band, y0 + band], [x1 - band, y0 + band], [x1 - band, y1 - band], [x0 + band, y1 - band]].forEach(([cx2, cy2]) => {
      for (let k = 0; k < 8; k++) { const a0 = k / 8 * 6.28, a1 = (k + 1) / 8 * 6.28; pane([[cx2, cy2], [cx2 + Math.cos(a0) * band * 1.4, cy2 + Math.sin(a0) * band * 1.4], [cx2 + Math.cos(a1) * band * 1.4, cy2 + Math.sin(a1) * band * 1.4]]); }
      c.fillStyle = '#ffe08a'; c.beginPath(); c.arc(cx2, cy2, 3.5, 0, 7); c.fill(); c.strokeStyle = '#1a1a1e'; c.lineWidth = 1.6; c.stroke();
      c.strokeStyle = '#1a1a1e'; c.lineWidth = 2.6; c.beginPath(); c.arc(cx2, cy2, band * 1.4, 0, 7); c.stroke(); });
    c.strokeStyle = '#2a2a30'; c.lineWidth = 2; rr(c, x0, y0, x1 - x0, y1 - y0, 6); c.stroke(); rr(c, x0 + band, y0 + band, x1 - x0 - band * 2, y1 - y0 - band * 2, 4); c.stroke();
  }],
  ['Circuit Board', (c, x, y, w, h) => {
    // gruene Platine als Band, Kupferbahnen mit Loetpunkten, Chips an den Ecken, Goldkontakte unten
    const r = seeded(77), b = 12, x0 = x - 8 - b, y0 = y - 8 - b, W2 = w + 16 + b * 2, H2 = h + 16 + b * 2;
    c.save(); bandClip(c, x0, y0, W2, H2, b, 10, 6);
    const pcb = c.createLinearGradient(x0, y0, x0 + W2, y0 + H2); pcb.addColorStop(0, '#0e5a32'); pcb.addColorStop(1, '#0a3e24'); c.fillStyle = pcb; c.fillRect(x0, y0, W2, H2);
    c.strokeStyle = 'rgba(255, 255, 255, .04)'; c.lineWidth = 1; for (let k = 0; k < W2 + H2; k += 4) { c.beginPath(); c.moveTo(x0 + k, y0); c.lineTo(x0 + k - H2, y0 + H2); c.stroke(); }
    // Bahnen entlang des Bands mit 45-Grad-Knicken
    const trace = (pts) => { c.strokeStyle = '#c88a3a'; c.lineWidth = 1.4; c.lineJoin = 'round'; c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke();
      [pts[0], pts[pts.length - 1]].forEach(([px, py]) => { c.fillStyle = '#e8b060'; c.beginPath(); c.arc(px, py, 2.2, 0, 7); c.fill(); c.fillStyle = '#0a3e24'; c.beginPath(); c.arc(px, py, .9, 0, 7); c.fill(); }); };
    for (let k = 0; k < 7; k++) { const sx = x0 + 34 + k * (W2 - 68) / 6, l1 = y0 + 3 + (k % 3) * 3; trace([[sx, l1], [sx + 12, l1], [sx + 16, l1 + 4], [sx + 26, l1 + 4]]); trace([[sx + 4, y0 + H2 - 3 - (k % 3) * 3], [sx + 20, y0 + H2 - 3 - (k % 3) * 3], [sx + 24, y0 + H2 - 7]]); }
    for (let k = 0; k < 4; k++) { const sy = y0 + 32 + k * (H2 - 64) / 3; trace([[x0 + 4, sy], [x0 + 4, sy + 10], [x0 + 8, sy + 14], [x0 + 8, sy + 20]]); trace([[x0 + W2 - 4, sy + 4], [x0 + W2 - 4, sy + 18], [x0 + W2 - 8, sy + 22]]); }
    c.restore();
    // Chips an den Ecken
    [[x0 + 3, y0 + 3], [x0 + W2 - 27, y0 + 3], [x0 + W2 - 27, y0 + H2 - 27], [x0 + 3, y0 + H2 - 27]].forEach(([cx2, cy2]) => {
      c.fillStyle = '#c8ccd2'; for (let k = 0; k < 4; k++) { c.fillRect(cx2 + 5 + k * 4, cy2 - 1, 2, 3); c.fillRect(cx2 + 5 + k * 4, cy2 + 22, 2, 3); c.fillRect(cx2 - 1, cy2 + 5 + k * 4, 3, 2); c.fillRect(cx2 + 22, cy2 + 5 + k * 4, 3, 2); }
      const g = c.createLinearGradient(cx2, cy2, cx2 + 24, cy2 + 24); g.addColorStop(0, '#2a2a30'); g.addColorStop(1, '#121216'); c.fillStyle = g; rr(c, cx2 + 1, cy2 + 1, 22, 22, 2); c.fill();
      c.fillStyle = 'rgba(255, 255, 255, .25)'; c.beginPath(); c.arc(cx2 + 6, cy2 + 6, 1.5, 0, 7); c.fill();
      c.fillStyle = 'rgba(255, 255, 255, .35)'; c.font = '5px monospace'; c.fillText('TTP', cx2 + 6, cy2 + 15); });
    // Goldkontakte unten mittig
    for (let k = 0; k < 9; k++) { const g = c.createLinearGradient(0, y0 + H2 - 9, 0, y0 + H2); g.addColorStop(0, '#f6d27a'); g.addColorStop(1, '#a8762a'); c.fillStyle = g; c.fillRect(x0 + W2 / 2 - 40 + k * 9, y0 + H2 - 10, 6, 9); }
    // gruene LED oben
    const lx = x0 + W2 / 2, ly = y0 + 6; const lg = c.createRadialGradient(lx, ly, 0, lx, ly, 10); lg.addColorStop(0, 'rgba(120, 255, 140, .8)'); lg.addColorStop(1, 'rgba(120, 255, 140, 0)'); c.fillStyle = lg; c.beginPath(); c.arc(lx, ly, 10, 0, 7); c.fill();
    c.fillStyle = '#d8ffe0'; c.fillRect(lx - 3, ly - 2, 6, 4);
  }]
];
REFINED_FRAMES.forEach(([n, d]) => frameCard('rFrames', n, 'Frame · Refined', d));

// ================= Basic =================
borderCard('basic', 'Bronze Ring', 'Border · Basic', (c, R, p) => { if (p !== 'over') return; ring(c, R * 1.05, 6, ['#e8b878', '#8a5428', '#d8a060', '#6a3a18']); });
frameCard('basic', 'Linen Frame', 'Frame · Basic', (c, x, y, w, h) => {
  // gewebte Leinenkante: Band mit feinem Kreuzmuster
  const b = 8, x0 = x - 4 - b, y0 = y - 4 - b, W2 = w + 8 + b * 2, H2 = h + 8 + b * 2;
  c.save(); bandClip(c, x0, y0, W2, H2, b, 10, 6);
  c.fillStyle = '#d8ccb4'; c.fillRect(x0, y0, W2, H2);
  c.strokeStyle = 'rgba(120, 100, 70, .25)'; c.lineWidth = 1;
  for (let k = 0; k < W2; k += 2) { c.beginPath(); c.moveTo(x0 + k, y0); c.lineTo(x0 + k, y0 + H2); c.stroke(); }
  c.strokeStyle = 'rgba(255, 255, 255, .25)'; for (let k = 0; k < H2; k += 2) { c.beginPath(); c.moveTo(x0, y0 + k); c.lineTo(x0 + W2, y0 + k); c.stroke(); }
  c.restore();
  c.strokeStyle = 'rgba(140, 120, 90, .7)'; c.lineWidth = 1; c.setLineDash([3, 2]); rr(c, x0 + 3, y0 + 3, W2 - 6, H2 - 6, 8); c.stroke(); c.setLineDash([]);
});
frameCard('basic', 'Night Frame', 'Frame · Basic', (c, x, y, w, h) => {
  c.strokeStyle = '#1e2a4a'; c.lineWidth = 6; rr(c, x - 3, y - 3, w + 6, h + 6, 13); c.stroke();
  c.strokeStyle = 'rgba(140, 160, 220, .35)'; c.lineWidth = 1; rr(c, x - 7, y - 7, w + 14, h + 14, 16); c.stroke();
  const r = seeded(13); c.fillStyle = '#e8ecff';
  for (let k = 0; k < 9; k++) { const u = r(), side = (r() * 4) | 0; const [sx, sy] = side === 0 ? [x + u * w, y - 3] : side === 1 ? [x + w + 3, y + u * h] : side === 2 ? [x + u * w, y + h + 3] : [x - 3, y + u * h]; c.beginPath(); c.arc(sx, sy, .7 + r() * .8, 0, 7); c.fill(); }
});
