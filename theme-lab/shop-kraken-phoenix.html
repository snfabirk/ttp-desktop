<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kraken + Phoenix - Animated frames (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): zwei neue Animated-Profilrahmen.
     Kraken: Tentakel winden sich aus den unteren Ecken um die Karte (Saugnaepfe innen,
       Wellenbewegung, eingerollte Spitzen, Tropfen); unten mittig lugt ein Auge hervor,
       blinzelt und folgt der Maus. Easter Egg: Auge anklicken -> die Tentakel quetschen
       die Karte (Beben), das Auge verengt sich, dann spritzt eine Tintenwolke.
     Phoenix: Feuervogel oben mittig, Flammenfluegel entlang der Oberkante, Flammenschweif
       laeuft um den Rahmen, Glut steigt auf. Easter Egg: Phoenix anklicken -> er lodert
       auf, verbrennt zu Asche (Ascheflocken, Rahmen erlischt), ein Glutnest glimmt unten,
       eine Flamme steigt auf und er wird mit einem Feuerring wiedergeboren. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #142034 0%, #070b14 70%); color: #eef0ff; font-family: Georgia, serif; overflow: hidden; }
  .stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 120px; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #kraken + .label { margin-top: 70px; }
  .board { position: relative; width: 600px; padding: 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-radius: 16px; background: rgba(14, 18, 34, .6); }
  .w { background: rgba(12, 16, 30, .8); border: 1px solid #2c3450; border-radius: 10px; padding: 10px 12px; min-height: 56px; }
  .w.wide { grid-column: span 3; min-height: 48px; display: flex; align-items: center; gap: 14px; }
  .w h4 { margin: 0 0 4px; color: #a8b4d8; font-family: 'Cinzel', serif; font-size: .72rem; }
  .ava { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #8a90b0; }
  .name { position: relative; z-index: 5; font-family: 'Cinzel', serif; font-size: 1.05rem; text-shadow: 0 0 6px #0a0e1a, 0 0 12px #0a0e1a; }
  .big { font-family: 'Cinzel', serif; font-size: 1.15rem; }
  canvas.fx { position: absolute; pointer-events: none; z-index: 4; }
  .hit { position: absolute; z-index: 6; border-radius: 50%; cursor: pointer; }
  .label { font-family: 'Cinzel', serif; color: #c8cce8; letter-spacing: 2px; }
  .label small { display: block; text-align: center; color: #8a90b0; font-family: Georgia, serif; letter-spacing: 0; font-size: .78rem; }
</style>
</head>
<body>
<div class="stage">
  <div class="row"><div class="board" id="kraken"><div class="w wide"><img class="ava" src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><span class="name">LUCKSHOT#796</span></div><div class="w"><h4>Games</h4><div class="big">142</div></div><div class="w"><h4>Rank</h4><div class="big">Gold II</div></div><div class="w"><h4>Trophies</h4><div class="big">9 / 21</div></div><canvas class="fx"></canvas><div class="hit"></div></div>
    <div class="label">Kraken<small>Frame · Animated — something is watching from below</small></div></div>
  <div class="row"><div class="board" id="phoenix"><div class="w wide"><img class="ava" src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" alt=""><span class="name">LUCKSHOT#796</span></div><div class="w"><h4>Games</h4><div class="big">142</div></div><div class="w"><h4>Rank</h4><div class="big">Gold II</div></div><div class="w"><h4>Trophies</h4><div class="big">9 / 21</div></div><canvas class="fx"></canvas><div class="hit"></div></div>
    <div class="label">Phoenix<small>Frame · Animated — touch the firebird</small></div></div>
</div>
<script>
const DPR = Math.min(2, devicePixelRatio || 1), rand = (a, b) => a + Math.random() * (b - a), P = 110;
let mouse = [0, 0]; addEventListener('mousemove', e => { mouse = [e.clientX, e.clientY]; });
function setupBoard(board) {
  const cv = board.querySelector('canvas'), c = cv.getContext('2d');
  const BW = board.offsetWidth, BH = board.offsetHeight;
  cv.width = (BW + P * 2) * DPR; cv.height = (BH + P * 2) * DPR; cv.style.width = BW + P * 2 + 'px'; cv.style.height = BH + P * 2 + 'px'; cv.style.left = -P + 'px'; cv.style.top = -P + 'px';
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Umlaufbahn im Uhrzeigersinn ab oben links; at(d) -> [x, y, Winkel]; aussen = (sin a, -cos a)
  const o = 3, r = 16, x0 = P - o, y0 = P - o, x1 = P + BW + o, y1 = P + BH + o, per = [];
  const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= 10; i++) { const a = a0 + (a1 - a0) * i / 10; per.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  const line = (ax, ay, bx, by) => { const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 6); for (let i = 0; i <= n; i++) per.push([ax + (bx - ax) * i / n, ay + (by - ay) * i / n]); };
  line(x0 + r, y0, x1 - r, y0); arc(x1 - r, y0 + r, -Math.PI / 2, 0); line(x1, y0 + r, x1, y1 - r); arc(x1 - r, y1 - r, 0, Math.PI / 2);
  line(x1 - r, y1, x0 + r, y1); arc(x0 + r, y1 - r, Math.PI / 2, Math.PI); line(x0, y1 - r, x0, y0 + r); arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);
  let len = 0; per.forEach((p, i) => { if (i) len += Math.hypot(p[0] - per[i - 1][0], p[1] - per[i - 1][1]); p.len = len; });
  const at = d => { d = ((d % len) + len) % len; for (let i = 1; i < per.length; i++) if (per[i].len >= d) { const a = per[i - 1], b = per[i], u = (d - a.len) / (b.len - a.len || 1); return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])]; } return [per[0][0], per[0][1], 0]; };
  // Strecken-Marken: Ecke unten rechts / unten links / oben Mitte
  const topLen = (x1 - x0 - 2 * r), sideLen = (y1 - y0 - 2 * r), q = Math.PI * r / 2;
  const marks = { topMid: topLen / 2, br: topLen + q + sideLen + q / 2, bl: topLen + q + sideLen + q + topLen + q / 2, bottomMid: topLen + q + sideLen + q + topLen / 2 };
  return { board, c, BW, BH, at, len, marks, x0, y0, x1, y1, hit: board.querySelector('.hit') };
}

// ============================ KRAKEN ============================
// v2 (Nutzer: v1 wirkte wie ein Alien-Oktopus): dunkles Seeungeheuer, das aus dem Meer
// unter der Karte auftaucht - meergruen-graue Haut mit Seepocken und Narben, cremefarbene
// Saugnaepfe, massiger Kopf mit zwei boesen Augen unter schweren Brauenwuelsten, Wasser mit
// Gischt; die kurzen Arme tauchen ins Wasser.
(() => {
  const B = setupBoard(document.getElementById('kraken')), { c, BW, BH, at, len, marks } = B;
  const tents = [
    { d0: marks.bottomMid + 30, dir: 1, L: len * .37, w: 21, ph: 0 },
    { d0: marks.bottomMid - 30, dir: -1, L: len * .39, w: 21, ph: 3.1 },
    { d0: marks.bottomMid + 14, dir: 1, L: len * .15, w: 15, ph: 1.7, peel: 1 },
    { d0: marks.bottomMid - 14, dir: -1, L: len * .13, w: 14, ph: 4.4, peel: 1 }
  ];
  // feste Seepocken/Narben je Tentakel (Position entlang s, Seite)
  tents.forEach(T => { T.barn = Array.from({ length: 16 }, () => ({ s: Math.random() * .85, side: Math.random() * .7 + .1, r: Math.random() * 1.6 + .9 })); T.scar = Math.random() * .6 + .1; });
  const drops = [], ink = [], splash = [];
  let egg = null, blink = 0, nextBlink = 3;
  const water = P + BH + 22, head = { x: P + BW / 2, y: water + 12 };
  Object.assign(B.hit.style, { left: `${BW / 2 - 70}px`, top: `${BH - 14}px`, width: '140px', height: '52px' });
  B.hit.addEventListener('click', () => { if (!egg) egg = { t: 0, inked: false }; });
  function tentacle(T, t, squeeze) {
    const N = 130, pts = [];
    for (let i = 0; i <= N; i++) {
      const s2 = i / N, [x, y, a] = at(T.d0 + T.dir * s2 * T.L), nx = Math.sin(a), ny = -Math.cos(a);
      const off = 9 + (T.peel ? s2 * s2 * 40 : 0) + Math.sin(t * 1.2 - s2 * 6 + T.ph) * 9 * s2 + Math.sin(t * 2.1 - s2 * 11 + T.ph) * 3 * s2 - squeeze * 9 * s2;
      pts.push({ x: x + nx * off, y: y + ny * off, a: a + (T.dir < 0 ? Math.PI : 0), s: s2 });
    }
    const last = pts[pts.length - 1], cd = T.dir, ca = last.a, cr = 8 + Math.sin(t * 1.1 + T.ph) * 2 - squeeze * 3;
    const ccx = last.x + Math.cos(ca - cd * Math.PI / 2) * cr, ccy = last.y + Math.sin(ca - cd * Math.PI / 2) * cr;
    for (let k = 1; k <= 14; k++) { const u = k / 14, ang = ca + cd * Math.PI / 2 + cd * u * Math.PI * 1.5, rr = cr * (1 - u * .6); pts.push({ x: ccx + Math.cos(ang) * rr, y: ccy + Math.sin(ang) * rr, s: 1 + u * .2 }); }
    const W = s2 => T.w * (1 + squeeze * .25) * Math.max(.12, 1 - s2 * .82);
    const L = [], Rr = [];
    pts.forEach((p, i) => { const q = pts[Math.min(pts.length - 1, i + 1)], pr = pts[Math.max(0, i - 1)], ang = Math.atan2(q.y - pr.y, q.x - pr.x), nx = -Math.sin(ang), ny = Math.cos(ang), w = W(p.s); L.push([p.x + nx * w, p.y + ny * w]); Rr.push([p.x - nx * w, p.y - ny * w]); p.n = [nx, ny]; p.w = w; });
    const body = new Path2D(); L.forEach(([x, y], i) => i ? body.lineTo(x, y) : body.moveTo(x, y)); for (let i = Rr.length - 1; i >= 0; i--) body.lineTo(...Rr[i]); body.closePath();
    c.save(); c.shadowColor = 'rgba(0, 0, 0, .6)'; c.shadowBlur = 9; c.shadowOffsetY = 3;
    c.fillStyle = '#1e302e'; c.fill(body); c.restore();
    c.save(); c.clip(body);
    // Koerper rund schattieren: Oberseite heller (nasser Glanz), Unterseite cremefarben
    c.lineCap = 'round';
    [[.0, '#2e4a44', 1.5], [-.35, '#4a6a5c', .9], [-.6, 'rgba(160, 200, 180, .35)', .25]].forEach(([shift, col, wm]) => {
      c.strokeStyle = col; for (let i = 1; i < pts.length; i++) { const a2 = pts[i - 1], b2 = pts[i]; c.lineWidth = Math.max(.5, b2.w * wm); c.beginPath(); c.moveTo(a2.x + a2.n[0] * a2.w * shift, a2.y + a2.n[1] * a2.w * shift); c.lineTo(b2.x + b2.n[0] * b2.w * shift, b2.y + b2.n[1] * b2.w * shift); c.stroke(); } });
    c.strokeStyle = '#cdbf9c'; c.lineWidth = 3.5; c.beginPath(); Rr.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
    // Seepocken (kleine Kegel mit Loch) und eine helle Narbe
    T.barn.forEach(b => { const p = pts[Math.round(b.s * 130)]; if (!p) return; const bx = p.x + p.n[0] * p.w * b.side, by = p.y + p.n[1] * p.w * b.side, br = b.r * (p.w / T.w + .4);
      c.fillStyle = '#b8b4a0'; c.beginPath(); c.arc(bx, by, br, 0, 7); c.fill(); c.fillStyle = '#3a3a30'; c.beginPath(); c.arc(bx, by, br * .4, 0, 7); c.fill(); });
    const sp = pts[Math.round(T.scar * 130)]; c.strokeStyle = 'rgba(200, 210, 190, .4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(sp.x + sp.n[0] * sp.w * .8, sp.y + sp.n[1] * sp.w * .8); c.lineTo(sp.x + sp.n[0] * sp.w * .1 + 6, sp.y + sp.n[1] * sp.w * .1 + 2); c.stroke();
    c.restore();
    pts.forEach((p, i) => { if (i % 6 || p.s > 1.05) return; const sx = p.x - p.n[0] * p.w * .6, sy = p.y - p.n[1] * p.w * .6, sr = Math.max(.8, p.w * .3);
      c.fillStyle = '#e6dcc0'; c.beginPath(); c.arc(sx, sy, sr, 0, 7); c.fill(); c.fillStyle = '#7a6a50'; c.beginPath(); c.arc(sx, sy, sr * .45, 0, 7); c.fill(); });
    return pts;
  }
  function drawHead(t, squeeze) {
    const { x, y } = head;
    // massiger Kopf: breite Kuppel mit Hautfalten, nur zur Haelfte ueber Wasser
    const g = c.createRadialGradient(x - 10, y - 40, 6, x, y, 80); g.addColorStop(0, '#4a6a5c'); g.addColorStop(.55, '#253a36'); g.addColorStop(1, '#0e1a1a');
    c.fillStyle = g; c.beginPath(); c.ellipse(x, y + 4, 100, 58, 0, Math.PI, 0); c.fill();
    c.strokeStyle = 'rgba(10, 20, 20, .5)'; c.lineWidth = 1.2;
    for (let k = 0; k < 4; k++) { c.beginPath(); c.ellipse(x, y + 6, 84 - k * 16, 46 - k * 10, 0, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
    [[-40, -18], [44, -14], [-12, -36], [20, -32]].forEach(([dx, dy]) => { c.fillStyle = '#b8b4a0'; c.beginPath(); c.arc(x + dx, y + dy, 2, 0, 7); c.fill(); });
    // Augen: zwei, unter schweren Brauenwuelsten, Blick folgt der Maus
    nextBlink -= 1 / 60; if (nextBlink <= 0) { blink = 1; nextBlink = rand(3, 6); } blink = Math.max(0, blink - .1);
    const rect = B.board.getBoundingClientRect();
    for (const side of [-1, 1]) {
      const ex = x + side * 30, ey = y - 22;
      const open = (1 - Math.sin(blink * Math.PI)) * (1 - .5 * squeeze);
      let lx = mouse[0] - (rect.left - P + ex), ly = mouse[1] - (rect.top - P + ey); const ll = Math.hypot(lx, ly) || 1; lx = lx / ll * Math.min(3.5, ll / 30); ly = ly / ll * Math.min(2, ll / 30);
      const glow = c.createRadialGradient(ex, ey, 0, ex, ey, 22); glow.addColorStop(0, `rgba(200, 255, 120, ${.25 + .25 * squeeze})`); glow.addColorStop(1, 'rgba(200, 255, 120, 0)');
      c.fillStyle = glow; c.beginPath(); c.arc(ex, ey, 22, 0, 7); c.fill();
      c.save(); c.beginPath(); c.ellipse(ex, ey, 11, 7 * open + .4, side * .18, 0, 7); c.clip();
      const ir = c.createRadialGradient(ex + lx, ey + ly, 1, ex + lx, ey + ly, 10); ir.addColorStop(0, '#f6ff9a'); ir.addColorStop(.55, '#b8c828'); ir.addColorStop(1, '#3a4a08');
      c.fillStyle = ir; c.fillRect(ex - 12, ey - 8, 24, 16);
      c.fillStyle = '#050805'; c.beginPath(); c.ellipse(ex + lx, ey + ly, 5 - 2 * squeeze, 1.3, 0, 0, 7); c.fill();
      c.restore();
      // Brauenwulst: dunkler Bogen, nach innen abfallend = boeser Blick
      c.fillStyle = '#16262a'; c.beginPath(); c.moveTo(ex - side * 16, ey - 13); c.quadraticCurveTo(ex, ey - 15, ex + side * 15, ey - 4 - squeeze * 3); c.lineTo(ex + side * 13, ey - 1 - squeeze * 3); c.quadraticCurveTo(ex, ey - 9, ex - side * 15, ey - 8); c.fill();
    }
  }
  function drawWater(t, squeeze) {
    const top = water, H2 = BH + P * 2;
    const wave = x => top + Math.sin(x * .05 + t * 1.6) * 2 + Math.sin(x * .021 - t * 1.1) * 2.5;
    c.beginPath(); c.moveTo(0, H2); for (let x = 0; x <= BW + P * 2; x += 6) c.lineTo(x, wave(x)); c.lineTo(BW + P * 2, H2); c.closePath();
    const g = c.createLinearGradient(0, top, 0, H2); g.addColorStop(0, 'rgba(20, 60, 70, .92)'); g.addColorStop(1, 'rgba(6, 16, 26, 0)');
    c.fillStyle = g; c.fill();
    // Gischt an der Wasserlinie, staerker am Kopf
    c.strokeStyle = 'rgba(210, 235, 240, .7)'; c.lineWidth = 1.4; c.beginPath(); for (let x = P - 30; x <= P + BW + 30; x += 6) { const y = wave(x); x === P - 30 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
    for (let k = 0; k < 18; k++) { const fx = head.x + Math.sin(k * 2.3 + t * .7) * 70, fy = wave(fx) + Math.sin(k + t * 3) * 1.5; c.fillStyle = `rgba(230, 245, 250, ${.35 + .25 * Math.sin(t * 4 + k)})`; c.beginPath(); c.ellipse(fx, fy, 4 + (k % 3) * 2, 1.2, 0, 0, 7); c.fill(); }
  }
  B.draw = (t, dt) => {
    c.clearRect(0, 0, BW + P * 2, BH + P * 2);
    let squeeze = 0;
    if (egg) { egg.t += dt; const e = egg.t; squeeze = e < .5 ? e / .5 : e < 1.6 ? 1 : Math.max(0, 1 - (e - 1.6) / .5);
      B.board.style.transform = e < 1.6 ? `translate(${rand(-1.5, 1.5) * squeeze}px, ${rand(-1.5, 1.5) * squeeze}px) scale(${1 - squeeze * .012})` : '';
      if (e > .2 && e < 1.5 && Math.random() < .5) for (let k = 0; k < 3; k++) splash.push({ x: head.x + rand(-90, 90), y: water, vx: rand(-40, 40), vy: -rand(80, 200), life: 1 });
      if (e > 1.4 && !egg.inked) { egg.inked = true; for (let k = 0; k < 80; k++) { const a = -Math.PI / 2 + rand(-1.6, 1.6), v = rand(120, 420); ink.push({ x: head.x, y: head.y - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(10, 30), life: 1 }); } }
      if (e > 4.5 && !ink.length) { egg = null; B.board.style.transform = ''; } }
    tents.forEach(T => { const pts = tentacle(T, t, squeeze);
      if (Math.random() < dt * .6) { const p = pts[(Math.random() * pts.length * .8) | 0]; if (p.y < water) drops.push({ x: p.x, y: p.y + p.w, vy: 0, life: 1 }); } });
    drawHead(t, squeeze);
    drawWater(t, squeeze);
    for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.vy += 300 * dt; d.y += d.vy * dt; d.life -= dt * .8; if (d.life <= 0 || d.y > water) { drops.splice(i, 1); continue; } c.fillStyle = `rgba(170, 215, 225, ${d.life * .7})`; c.beginPath(); c.ellipse(d.x, d.y, 1.3, 2.4, 0, 0, 7); c.fill(); }
    for (let i = splash.length - 1; i >= 0; i--) { const d = splash[i]; d.vy += 420 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt * .9; if (d.life <= 0 || (d.vy > 0 && d.y > water)) { splash.splice(i, 1); continue; } c.fillStyle = `rgba(220, 240, 245, ${d.life})`; c.beginPath(); c.arc(d.x, d.y, 1.8, 0, 7); c.fill(); }
    for (let i = ink.length - 1; i >= 0; i--) { const k = ink[i]; k.life -= dt * .35; if (k.life <= 0) { ink.splice(i, 1); continue; } k.vx *= .94; k.vy *= .94; k.vy += 8 * dt; k.x += k.vx * dt; k.y += k.vy * dt; k.r += dt * 18;
      const g = c.createRadialGradient(k.x, k.y, 0, k.x, k.y, k.r); g.addColorStop(0, `rgba(6, 10, 14, ${.85 * k.life})`); g.addColorStop(.7, `rgba(12, 20, 26, ${.5 * k.life})`); g.addColorStop(1, 'rgba(12, 20, 26, 0)');
      c.fillStyle = g; c.beginPath(); c.arc(k.x, k.y, k.r, 0, 7); c.fill(); }
  };
  window.KR = B;
})();

// ============================ PHOENIX ============================
(() => {
  const B = setupBoard(document.getElementById('phoenix')), { c, BW, BH, at, len, marks } = B;
  const embers = [], ash = [];
  let egg = null;
  const home = { x: P + BW / 2, y: P - 22 };
  Object.assign(B.hit.style, { left: `${BW / 2 - 40}px`, top: '-70px', width: '80px', height: '74px' });
  B.hit.addEventListener('click', () => { if (!egg) egg = { t: 0 }; });
  // Flammenform (Spitze zeigt in Richtung ang), Farbe nach Hitze 0..1
  function flame(x, y, ang, L, w, t, ph, heat, alpha) {
    const fl = Math.sin(t * 11 + ph) * .12 + Math.sin(t * 7 + ph * 2) * .08;
    c.save(); c.translate(x, y); c.rotate(ang);
    const g = c.createLinearGradient(0, 0, L, 0);
    g.addColorStop(0, `rgba(255, ${200 + 55 * heat | 0}, ${120 + 120 * heat | 0}, ${alpha})`); g.addColorStop(.45, `rgba(255, ${120 + 60 * heat | 0}, 30, ${alpha * .9})`); g.addColorStop(1, 'rgba(220, 40, 10, 0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(0, -w); c.quadraticCurveTo(L * .5, -w * (1 + fl), L * (1 + fl * .3), fl * w * 2); c.quadraticCurveTo(L * .5, w * (1 - fl), 0, w); c.closePath(); c.fill();
    c.restore();
  }
  function bird(t, s, heat, alpha) {
    const { x, y } = home, flap = Math.sin(t * 2.2) * .12;
    c.save(); c.globalCompositeOperation = 'lighter';
    // Fluegel: zwei Faecher aus Flammenfedern entlang der Oberkante
    for (const side of [-1, 1]) for (let k = 0; k < 11; k++) {
      const u = k / 10, ang = (side < 0 ? Math.PI : 0) + side * (-.55 + u * .62 + flap * (1 - u)), L = (34 + u * 46) * s, w = (6 - u * 2) * s;
      const sx = x + side * (6 + u * 26) * s, sy = y + 4 - u * 4 * s;
      flame(sx, sy, ang, L, w, t, k * 1.3 + side, heat, alpha * (.75 + .25 * (1 - u)));
    }
    // Schwanzfedern nach unten-seitlich, ueber die Karte hinweg kurz
    for (let k = 0; k < 5; k++) flame(x + (k - 2) * 4 * s, y + 8 * s, Math.PI / 2 + (k - 2) * .35, 26 * s, 4 * s, t, k * 2.1, heat, alpha * .7);
    // Koerper (gluehender Kern)
    const bg = c.createRadialGradient(x, y, 1, x, y + 2, 16 * s); bg.addColorStop(0, `rgba(255, 250, 220, ${alpha})`); bg.addColorStop(.4, `rgba(255, 190, 70, ${alpha})`); bg.addColorStop(1, 'rgba(255, 80, 10, 0)');
    c.fillStyle = bg; c.beginPath(); c.ellipse(x, y + 3 * s, 11 * s, 15 * s, 0, 0, 7); c.fill();
    // Hals: geschwungen nach oben, Kopf hoch erhoben im Profil (blickt nach rechts)
    const hx = x + 9 * s, hy = y - 22 * s + Math.sin(t * 1.4) * 1.2 * s;
    const ng = c.createLinearGradient(x, y, hx, hy); ng.addColorStop(0, `rgba(255, 200, 90, ${alpha})`); ng.addColorStop(1, `rgba(255, 235, 170, ${alpha})`);
    c.fillStyle = ng; c.beginPath(); c.moveTo(x - 5 * s, y - 4 * s); c.quadraticCurveTo(x - 4 * s, hy + 2 * s, hx - 4 * s, hy - 2 * s); c.lineTo(hx + 3 * s, hy + 3 * s); c.quadraticCurveTo(x + 6 * s, y - 8 * s, x + 6 * s, y); c.closePath(); c.fill();
    // lange, nach hinten wehende Federkrone (hinter dem Kopf)
    for (let k = 0; k < 7; k++) { const ang = -2.05 - k * .14 + Math.sin(t * 2 + k) * .06; flame(hx - 2 * s, hy - 2 * s, ang, (22 + k * 5) * s, (2.6 - k * .2) * s, t, k * 2.7, heat, alpha * (.95 - k * .08)); }
    c.restore();
    const S = s * 1.4;
    // Kopf: keilfoermig, scharfe Kontur, gluehende Federn
    c.save(); c.globalAlpha = alpha;
    const hg = c.createLinearGradient(hx - 6 * S, hy - 6 * S, hx + 8 * S, hy + 6 * S); hg.addColorStop(0, '#fff6d0'); hg.addColorStop(.6, '#ffc050'); hg.addColorStop(1, '#ff7a20');
    c.shadowColor = '#ffb040'; c.shadowBlur = 14 * S;
    c.fillStyle = hg; c.beginPath(); c.moveTo(hx - 8 * S, hy + 2 * S); c.bezierCurveTo(hx - 9 * S, hy - 7 * S, hx - 2 * S, hy - 10 * S, hx + 4 * S, hy - 8.5 * S); c.quadraticCurveTo(hx + 9 * S, hy - 7 * S, hx + 10 * S, hy - 3.5 * S); c.lineTo(hx + 8 * S, hy + 1 * S); c.quadraticCurveTo(hx + 2 * S, hy + 5 * S, hx - 8 * S, hy + 2 * S); c.fill();
    c.shadowBlur = 0;
    // Hakenschnabel: oben gebogen, golden mit dunkler Spitze
    const bk = c.createLinearGradient(hx + 8 * S, hy - 4 * S, hx + 17 * S, hy + 2 * S); bk.addColorStop(0, '#ffe28a'); bk.addColorStop(1, '#8a3a08');
    c.fillStyle = bk; c.beginPath(); c.moveTo(hx + 8 * S, hy - 4.5 * S); c.quadraticCurveTo(hx + 15 * S, hy - 5 * S, hx + 17 * S, hy + 2 * S); c.quadraticCurveTo(hx + 13 * S, hy - 1 * S, hx + 9 * S, hy - .5 * S); c.lineTo(hx + 12 * S, hy + .5 * S); c.lineTo(hx + 7 * S, hy + 1 * S); c.closePath(); c.fill();
    // Auge: schmal, weiss-gluehend, mit Brauenkante = entschlossener Blick
    c.shadowColor = '#ffffff'; c.shadowBlur = 8 * S;
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(hx + 1 * S, hy - 3.2 * S); c.quadraticCurveTo(hx + 4 * S, hy - 5 * S, hx + 7 * S, hy - 3.6 * S); c.quadraticCurveTo(hx + 4 * S, hy - 2.2 * S, hx + 1 * S, hy - 3.2 * S); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = 'rgba(190, 70, 10, .8)'; c.lineWidth = .9 * S; c.beginPath(); c.moveTo(hx + .5 * S, hy - 6 * S); c.quadraticCurveTo(hx + 5 * S, hy - 6.4 * S, hx + 8.5 * S, hy - 4.4 * S); c.stroke();
    c.restore();
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 4; k++) flame(hx - 4 * S + k * 1.5 * S, hy + 3 * S, Math.PI / 2 + .9 + k * .15, (9 + k * 2) * S, 1.6 * S, t, k * 4.1, heat, alpha * .7);   // Kehlfedern
    c.restore();
  }
  B.draw = (t, dt) => {
    c.clearRect(0, 0, BW + P * 2, BH + P * 2);
    let scale = 1.55, heat = .4 + .2 * Math.sin(t * 1.7), alpha = 1, trail = 1, nest = 0;
    if (egg) {
      const e = egg.t += dt;
      if (e < .8) { scale = 1.55 + e * .5; heat = .5 + e; }                                              // lodert auf
      else if (e < 1.8) { const u = (e - .8); scale = 1.95 - u * .5; alpha = 1 - u; trail = 1 - u; heat = 1;    // verbrennt
        if (Math.random() < .9) for (let k = 0; k < 3; k++) ash.push({ x: home.x + rand(-40, 40), y: home.y + rand(-15, 10), vx: rand(-15, 15), vy: rand(10, 40), life: 1, rot: rand(0, 6) }); }
      else if (e < 3.4) { alpha = 0; trail = 0; nest = Math.min(1, (e - 1.8) / .4); }                    // Glutnest
      else if (e < 4.4) { alpha = 0; trail = 0; nest = 1 - (e - 3.4); egg.rise = (e - 3.4); }        // Flamme steigt auf
      else if (e < 5.4) { const u = e - 4.4; scale = .4 + u * 1.15; alpha = u; trail = u; heat = 1; egg.ring = u; }   // Wiedergeburt
      else egg = null;
    }
    // brennender Rahmen: gluehende Grundlinie + dichte, nach oben zuengelnde Flammen (vom Vogel aus nach unten schwaecher)
    if (trail > 0) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.shadowColor = 'rgba(255, 120, 30, .9)'; c.shadowBlur = 14;
      c.strokeStyle = `rgba(255, 140, 40, ${.55 * trail})`; c.lineWidth = 2.2; c.beginPath();
      for (let i = 0; i <= 200; i++) { const [x, y] = at(i / 200 * len); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.closePath(); c.stroke();
      c.shadowBlur = 0;
      for (let i = 0; i < 150; i++) {
        const d = i / 150 * len, [x, y] = at(d), distTop = Math.min(Math.abs(d - marks.topMid), len - Math.abs(d - marks.topMid)) / (len / 2);
        const strength = (1 - distTop * .55) * trail, sway = Math.sin(t * 3 + i * .7) * .25;
        const h = (8 + 12 * (.5 + .5 * Math.sin(t * 7 + i * 1.9))) * strength;
        flame(x, y + 1, -Math.PI / 2 + sway, h, 2.6, t, i * 1.3, .35 * (1 - distTop), .5 * strength);
      }
      c.restore();
    }
    // Glut steigt auf
    if (trail > .2 && Math.random() < dt * 22) { const [x, y] = at(rand(0, len)); embers.push({ x, y, vx: rand(-6, 6), vy: rand(-30, -12), life: 1 }); }
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) { const e = embers[i]; e.life -= dt * .7; if (e.life <= 0) { embers.splice(i, 1); continue; } e.x += (e.vx + Math.sin(t * 3 + i) * 8) * dt; e.y += e.vy * dt; c.fillStyle = `rgba(255, ${150 + 80 * e.life | 0}, 60, ${e.life})`; c.beginPath(); c.arc(e.x, e.y, 1.2, 0, 7); c.fill(); }
    c.restore();
    // Asche
    for (let i = ash.length - 1; i >= 0; i--) { const a = ash[i]; a.life -= dt * .35; a.vy += 20 * dt; a.x += (a.vx + Math.sin(t * 2 + i) * 10) * dt; a.y += a.vy * dt; a.rot += dt * 2; if (a.life <= 0 || a.y > P + BH + 30) { ash.splice(i, 1); continue; }
      c.save(); c.translate(a.x, a.y); c.rotate(a.rot); c.fillStyle = `rgba(150, 140, 135, ${a.life * .8})`; c.fillRect(-2, -1, 4, 2); c.restore(); }
    // Glutnest unten mittig
    if (nest > 0) { const nx = P + BW / 2, ny = P + BH + 18; const g = c.createRadialGradient(nx, ny, 0, nx, ny, 40); g.addColorStop(0, `rgba(255, 150, 40, ${.8 * nest * (.7 + .3 * Math.sin(t * 8))})`); g.addColorStop(1, 'rgba(255, 60, 10, 0)');
      c.fillStyle = g; c.beginPath(); c.arc(nx, ny, 40, 0, 7); c.fill(); c.fillStyle = `rgba(90, 80, 76, ${nest})`; c.beginPath(); c.ellipse(nx, ny + 4, 24, 6, 0, 0, 7); c.fill(); }
    if (egg && egg.rise !== undefined && egg.t < 4.4) { const u = egg.rise, x = P + BW / 2, y = P + BH + 18 + (home.y - P - BH - 18) * u;
      c.save(); c.globalCompositeOperation = 'lighter'; flame(x, y + 10, -Math.PI / 2, 30, 7, t, 0, 1, 1); const g = c.createRadialGradient(x, y, 0, x, y, 24); g.addColorStop(0, 'rgba(255, 220, 140, .9)'); g.addColorStop(1, 'rgba(255, 100, 20, 0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 24, 0, 7); c.fill(); c.restore(); }
    if (egg && egg.ring !== undefined) { const u = egg.ring; c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(255, 180, 70, ${1 - u})`; c.lineWidth = 4 * (1 - u) + 1; c.beginPath(); c.arc(home.x, home.y, 20 + u * 160, 0, 7); c.stroke(); c.restore(); }
    if (alpha > 0) bird(t, scale, Math.min(1, heat), alpha);
  };
  window.PH = B;
})();

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; window.KR.draw(now / 1000, dt); window.PH.draw(now / 1000, dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
