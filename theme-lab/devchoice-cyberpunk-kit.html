<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Overdrive Kit - Developer's Choice (Theme Lab)</title>
<!-- Theme Lab: Developer's Choice #1 Kit (Hommage Cyberpunk 2077) - passend zum
     Theme die animierte Border "Optic Scan" und der animierte Rahmen "Netrunner
     HUD". Rot + Cyan, Gelb nur als Akzent.
     Border-Easter-Egg: 5x aufs Profilbild -> Scan: Fadenkreuz rastet ein,
       Analyse-Daten tippen sich aus ("THREAT LEVEL: LEGENDARY").
     Rahmen-Easter-Egg: den blinkenden Chip unten rechts anklicken -> System-
       Ueberlastung: Rahmen glitcht rot, Warnung, dann Neustart-Sequenz. -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --red: #ff4a4a; --cyan: #5ef0f0; --yellow: #e8d43a; --text: #e8ecf2; --dim: #8c97a8; }
  html, body { margin: 0; height: 100%; background: #07080c; color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 120%, rgba(255, 74, 74, .12), transparent 60%), #07080c; }
  .bgscene { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; z-index: 0; }
  .stage { position: relative; z-index: 1; pointer-events: none; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 6px; color: var(--yellow); text-transform: uppercase; }
  .board, .label { pointer-events: auto; }
  .board { position: relative; width: 760px; padding: 22px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .w { backdrop-filter: blur(6px); background: rgba(10, 12, 18, .72); border: 1px solid rgba(94, 240, 240, .2); padding: 12px 14px; min-height: 84px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .w h4 { margin: 0 0 6px; color: var(--yellow); letter-spacing: 2px; text-transform: uppercase; font-size: .85rem; }
  .w .big { font-size: 1.6rem; font-weight: 700; }
  .w .muted { color: var(--dim); font-size: .85rem; font-family: 'Share Tech Mono', monospace; }
  .w.wide { grid-column: span 3; display: flex; align-items: center; gap: 30px; min-height: 0; padding: 18px 24px; }
  .name { font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; color: var(--yellow); }
  /* Border */
  .optic { position: relative; width: 96px; height: 96px; flex-shrink: 0; cursor: default; }
  .optic img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .optic canvas { position: absolute; left: -100%; top: -100%; width: 300%; height: 300%; pointer-events: none; }
  .scan-out:empty { display: none; }
  .scan-out { position: absolute; left: 360px; top: -4px; padding: 8px 12px; z-index: 3; background: rgba(6, 8, 12, .92); border: 1px solid rgba(94, 240, 240, .4); border-left: 3px solid var(--yellow); width: 260px; font-family: 'Share Tech Mono', monospace; font-size: .78rem; color: var(--cyan); white-space: pre; pointer-events: none; text-shadow: 0 0 6px rgba(94, 240, 240, .6); }
  .scan-out b { color: var(--yellow); font-weight: normal; }
  .scan-out i { color: var(--red); font-style: normal; }
  /* Rahmen */
  .chip-hit { position: absolute; z-index: 5; pointer-events: auto; cursor: pointer; }
  canvas.hud { position: absolute; left: -60px; top: -60px; pointer-events: none; }
  .label { color: var(--dim); font-size: .8rem; letter-spacing: 2px; text-transform: uppercase; font-family: 'Share Tech Mono', monospace; }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 14px; border: 1px solid rgba(255, 74, 74, .35); padding: 6px 14px; }
</style>
</head>
<body>
<iframe class="bgscene" src="devchoice-cyberpunk.html?bg" title=""></iframe>
<div class="stage">
  <h1>Neon Overdrive · Kit</h1>
  <div class="board" id="board">
    <div class="w wide">
      <div class="optic" id="optic"><img src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" onerror="this.src='https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Evelynn.png'" alt=""><canvas></canvas><div class="scan-out" id="scanOut"></div></div>
      <div><div class="name">LUCKSHOT#796</div><div class="muted">Pony since 09.10.2026 · Level 17</div></div>
    </div>
    <div class="w"><h4>Games</h4><div class="big">142</div><div class="muted">58% WR</div></div>
    <div class="w"><h4>Rank</h4><div class="big">Gold II</div><div class="muted">40 LP</div></div>
    <div class="w"><h4>Trophies</h4><div class="big">9 / 21</div><div class="muted">+2 this week</div></div>
    <canvas class="hud" id="hud"></canvas>
    <div class="chip-hit" id="chipHit"></div>
  </div>
  <div class="label">Border: Optic Scan · Frame: Netrunner HUD</div>
</div>
<div class="hint">psst... click the picture a few times · and that chip in the corner is blinking for a reason</div>

<script>
const D = Math.min(2, devicePixelRatio || 1), rand = (a, b) => a + Math.random() * (b - a);
const RED = '255, 74, 74', CYAN = '94, 240, 240', YEL = '232, 212, 58';

// ===================== Border: Optic Scan =====================
const optic = document.getElementById('optic'), oc = optic.querySelector('canvas'), ox = oc.getContext('2d');
const OS = optic.offsetWidth, OC = OS * 3; oc.width = OC * D; oc.height = OC * D; ox.setTransform(D, 0, 0, D, 0, 0);
let scan = null, oClicks = 0, oReset = null;
function drawOptic(t, dt) {
  const R = OS / 2; ox.clearRect(0, 0, OC, OC); ox.save(); ox.translate(OC / 2, OC / 2);
  const lock = scan ? Math.min(1, scan.t / .8) : 0;
  // Grundring: dunkel mit rotem Rand
  ox.strokeStyle = '#0c0e14'; ox.lineWidth = R * .16; ox.beginPath(); ox.arc(0, 0, R * 1.08, 0, 7); ox.stroke();
  ox.strokeStyle = `rgba(${YEL}, .9)`; ox.lineWidth = 1.5; ox.beginPath(); ox.arc(0, 0, R * 1.0, 0, 7); ox.stroke();
  // segmentierter Ring, dreht sich in Stufen (wie ein Objektiv, das fokussiert)
  const step = Math.floor(t * 1.5) * .35 + Math.min(1, (t * 1.5) % 1 * 4) * .35;
  ox.save(); ox.rotate(step + lock * 2);
  for (let k = 0; k < 12; k++) { const a0 = k / 12 * 6.283 + .04, a1 = a0 + 6.283 / 12 - .14; ox.strokeStyle = k % 3 === 0 ? `rgba(${RED}, .8)` : `rgba(${YEL}, .8)`; ox.lineWidth = R * .07; ox.beginPath(); ox.arc(0, 0, R * 1.16, a0, a1); ox.stroke(); }
  ox.restore();
  // feine Skala aussen, gegenlaeufig
  ox.save(); ox.rotate(-t * .25);
  ox.strokeStyle = `rgba(${CYAN}, .55)`; ox.lineWidth = 1;
  for (let k = 0; k < 60; k++) { const a = k / 60 * 6.283, l = k % 5 === 0 ? R * .09 : R * .04; ox.beginPath(); ox.moveTo(Math.cos(a) * R * 1.27, Math.sin(a) * R * 1.27); ox.lineTo(Math.cos(a) * (R * 1.27 + l), Math.sin(a) * (R * 1.27 + l)); ox.stroke(); }
  ox.restore();
  // Scan-Strahl laeuft im Kreis
  const sa = t * 2.2;
  const sg = ox.createRadialGradient(0, 0, R, 0, 0, R * 1.4);
  sg.addColorStop(0, `rgba(${CYAN}, .0)`); sg.addColorStop(.5, `rgba(${CYAN}, .35)`); sg.addColorStop(1, `rgba(${CYAN}, 0)`);
  ox.fillStyle = sg; ox.beginPath(); ox.moveTo(0, 0); ox.arc(0, 0, R * 1.4, sa, sa + .35); ox.closePath(); ox.fill();
  // Datenpunkte am Rand blinken
  for (let k = 0; k < 4; k++) { const a = k * 1.57 + .78; if (Math.sin(t * 5 + k * 2) > .3) { ox.fillStyle = `rgba(${CYAN}, .9)`; ox.fillRect(Math.cos(a) * R * 1.42 - 2, Math.sin(a) * R * 1.42 - 2, 4, 4); } }
  // Easter Egg: Fadenkreuz rastet ein
  if (scan) {
    scan.t += dt; const s = scan.t;
    const sz = R * (2.4 - 1.3 * lock);
    ox.strokeStyle = `rgba(${RED}, ${.9 * Math.min(1, s * 3)})`; ox.lineWidth = 2;
    [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([a, b]) => { ox.beginPath(); ox.moveTo(a * sz, b * sz * .6); ox.lineTo(a * sz, b * sz); ox.lineTo(a * sz * .6, b * sz); ox.stroke(); });
    if (lock >= 1) { ox.strokeStyle = `rgba(${YEL}, ${.5 + .5 * Math.sin(s * 12)})`; ox.beginPath(); ox.moveTo(-R * .25, 0); ox.lineTo(R * .25, 0); ox.moveTo(0, -R * .25); ox.lineTo(0, R * .25); ox.stroke(); }
    if (s > 5.5) { scan = null; document.getElementById('scanOut').textContent = ''; }
  }
  ox.restore();
}
const SCAN_LINES = [['SCANNING', 'b'], ['NAME .......... LUCKSHOT', ''], ['ROLE .......... JUNGLE', ''], ['CYBERWARE ..... NONE DETECTED', ''], ['STREET CRED ... 17', ''], ['THREAT LEVEL .. ', 'i', 'LEGENDARY']];
async function runScan() {
  const out = document.getElementById('scanOut'); out.innerHTML = '';
  await new Promise(r => setTimeout(r, 800));
  for (const [line, cls, extra] of SCAN_LINES) {
    if (!scan) return;
    let txt = ''; for (const ch of line) { txt += ch; out.innerHTML = out.innerHTML.replace(/<span class="cur">.*<\/span>$/, '') ; out.innerHTML = prev + (cls === 'b' ? `<b>${txt}</b>` : txt) + '<span class="cur">_</span>'; await new Promise(r => setTimeout(r, 14)); }
    prev += (cls === 'b' ? `<b>${line}</b>` : line) + (extra ? `<i>${extra}</i>` : '') + '\n'; out.innerHTML = prev;
    await new Promise(r => setTimeout(r, 120));
  }
}
let prev = '';
optic.addEventListener('click', () => {
  if (scan) return; oClicks++; clearTimeout(oReset); oReset = setTimeout(() => { oClicks = 0; }, 3000);
  if (oClicks >= 5) { oClicks = 0; scan = { t: 0 }; prev = ''; runScan(); }
});

// ===================== Rahmen: Netrunner HUD =====================
const board = document.getElementById('board'), hc = document.getElementById('hud'), hx = hc.getContext('2d');
const P = 60; let BW = 0, BH = 0;
function sizeHud() { BW = board.offsetWidth; BH = board.offsetHeight; hc.width = (BW + P * 2) * D; hc.height = (BH + P * 2) * D; hc.style.width = BW + P * 2 + 'px'; hc.style.height = BH + P * 2 + 'px'; hx.setTransform(D, 0, 0, D, 0, 0); }
sizeHud(); addEventListener('resize', sizeHud);
const streamL = Array.from({ length: 14 }, () => ''), hexs = () => Array.from({ length: 4 }, () => Math.floor(Math.random() * 256).toString(16).toUpperCase().padStart(2, '0')).join(' ');
let nextStream = 0, over = null;
function drawHud(t, dt) {
  const W2 = BW + P * 2, H2 = BH + P * 2, x0 = P, y0 = P, x1 = P + BW, y1 = P + BH;
  hx.clearRect(0, 0, W2, H2);
  const ov = over ? over.t : -1, alarm = ov >= 0 && ov < 2.2, reboot = ov >= 2.2;
  const main = alarm ? RED : YEL, acc = alarm ? RED : CYAN;
  const jit = alarm ? rand(-4, 4) : 0;
  hx.save(); hx.translate(jit, 0);
  // abgeschraegte Hauptkontur (oben rechts + unten links Fasen)
  const cut = 22;
  const drawEdge = (a) => { hx.beginPath(); hx.moveTo(x0, y0); hx.lineTo(x1 - cut, y0); hx.lineTo(x1, y0 + cut); hx.lineTo(x1, y1); hx.lineTo(x0 + cut, y1); hx.lineTo(x0, y1 - cut); hx.closePath(); hx.strokeStyle = `rgba(${main}, ${a})`; hx.stroke(); };
  let bootA = 1;
  if (reboot) bootA = Math.min(1, (ov - 2.2) / 1.2);
  hx.lineWidth = 1.5; hx.shadowColor = `rgba(${main}, .8)`; hx.shadowBlur = alarm ? 18 : 8; drawEdge(.85 * (reboot ? (Math.random() < .3 ? .2 : bootA) : 1)); hx.shadowBlur = 0;
  // Eck-Klammern in Cyan
  hx.strokeStyle = `rgba(${acc}, .9)`; hx.lineWidth = 3;
  [[x0 - 8, y0 - 8, 1, 1], [x1 + 8, y1 + 8, -1, -1]].forEach(([x, y, sx, sy]) => { hx.beginPath(); hx.moveTo(x, y + sy * 34); hx.lineTo(x, y); hx.lineTo(x + sx * 34, y); hx.stroke(); });
  // gelbe Akzentlinie oben links (wie die Karten)
  hx.fillStyle = `rgba(${RED}, .9)`; hx.fillRect(x0 + 40, y0 - 4, 70, 2);
  // Pulse laufen die obere und untere Kante entlang
  for (let k = 0; k < 2; k++) { const u = ((t * .35 + k * .5) % 1); const px = x0 + u * (BW - cut); const g = hx.createLinearGradient(px - 80, 0, px, 0); g.addColorStop(0, `rgba(${acc}, 0)`); g.addColorStop(1, `rgba(${acc}, .9)`); hx.fillStyle = g; hx.fillRect(px - 80, k ? y1 - 1 : y0 - 1, 80, 2); }
  // Datenstrom links ausserhalb (Hex-Codes scrollen nach oben)
  nextStream -= dt; if (nextStream <= 0) { streamL.shift(); streamL.push(hexs()); nextStream = alarm ? .03 : .25; }
  hx.font = '10px "Share Tech Mono", monospace'; hx.textAlign = 'right';
  streamL.forEach((s, i) => { hx.fillStyle = `rgba(${alarm ? RED : CYAN}, ${(i / streamL.length) * .7 * bootA})`; hx.fillText(s, x0 - 12, y0 + 30 + i * 13); });
  // rechts: kleine Balken-Anzeigen (Netzlast)
  hx.textAlign = 'left';
  for (let k = 0; k < 6; k++) { const v = alarm ? rand(.7, 1) : .3 + .25 * Math.sin(t * 1.3 + k * 1.1) + .15 * Math.sin(t * 3.7 + k); hx.fillStyle = `rgba(${k > 3 || alarm ? RED : CYAN}, .55 * ${bootA})`; hx.fillStyle = `rgba(${k > 3 || alarm ? RED : CYAN}, ${.6 * bootA})`; hx.fillRect(x1 + 14, y0 + 40 + k * 12, Math.max(2, v * 34), 6); }
  hx.fillStyle = `rgba(${CYAN}, ${.7 * bootA})`; hx.fillText(alarm ? 'NET LOAD 999%' : `NET LOAD ${Math.round(40 + 20 * Math.sin(t))}%`, x1 + 14, y0 + 30);
  // Chip unten rechts (Easter Egg)
  const cxp = x1 - 6, cyp = y1 + 18, blink = Math.sin(t * 4) > 0;
  hx.fillStyle = '#0c0e14'; hx.fillRect(cxp - 22, cyp - 8, 30, 16);
  hx.strokeStyle = `rgba(${YEL}, .8)`; hx.lineWidth = 1; hx.strokeRect(cxp - 22, cyp - 8, 30, 16);
  for (let k = 0; k < 4; k++) { hx.fillStyle = `rgba(${YEL}, .6)`; hx.fillRect(cxp - 19 + k * 7, cyp + 8, 2, 4); hx.fillRect(cxp - 19 + k * 7, cyp - 12, 2, 4); }
  hx.fillStyle = `rgba(${RED}, ${blink ? 1 : .25})`; hx.beginPath(); hx.arc(cxp, cyp, 3, 0, 7); hx.fill();
  chip = { x: cxp - 26, y: cyp - 14, w: 38, h: 28 };
  Object.assign(chipHit.style, { left: `${chip.x - P}px`, top: `${chip.y - P}px`, width: `${chip.w}px`, height: `${chip.h}px` });
  // Easter Egg: Ueberlastung -> Warnung -> Neustart
  if (over) {
    over.t += dt; const o = over.t;
    if (o < 2.2) {
      // rote Glitch-Balken ueber dem Rahmen + Warnung
      for (let k = 0; k < 8; k++) { hx.fillStyle = `rgba(${RED}, ${rand(.05, .25)})`; hx.fillRect(rand(x0, x1 - 100), rand(y0, y1), rand(40, 200), rand(2, 8)); }
      if (Math.sin(o * 14) > -.3) {
        hx.font = 'bold 28px Rajdhani, sans-serif'; hx.textAlign = 'center';
        hx.fillStyle = `rgba(${RED}, .95)`; hx.shadowColor = `rgba(${RED}, 1)`; hx.shadowBlur = 20;
        hx.fillText('SYSTEM OVERLOAD', (x0 + x1) / 2, y0 - 18); hx.shadowBlur = 0;
      }
      board.style.filter = `drop-shadow(${rand(-3, 3)}px 0 rgba(255,74,74,.8)) drop-shadow(${rand(-3, 3)}px 0 rgba(94,240,240,.6))`;
      board.style.opacity = Math.random() < .1 ? .4 : 1;
    } else {
      board.style.filter = ''; board.style.opacity = 1;
      const msg = o < 3 ? 'REBOOTING' + '.'.repeat(1 + Math.floor(o * 4) % 3) : 'SYSTEM ONLINE';
      hx.font = '14px "Share Tech Mono", monospace'; hx.textAlign = 'center'; hx.fillStyle = `rgba(${o < 3 ? YEL : CYAN}, ${o > 4 ? Math.max(0, 1 - (o - 4) / .8) : 1})`;
      hx.fillText(msg, (x0 + x1) / 2, y0 - 16);
      if (o > 4.8) over = null;
    }
  }
  hx.restore();
}
let chip = null;
const chipHit = document.getElementById('chipHit');
chipHit.addEventListener('click', () => { if (!over) over = { t: 0 }; });

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; drawOptic(now / 1000, dt); drawHud(now / 1000, dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
