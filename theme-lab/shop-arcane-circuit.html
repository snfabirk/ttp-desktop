<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcane Circuit - Animated shop frame (Theme Lab)</title>
<!-- Theme Lab (nicht im Installationspaket): Shop-Profilrahmen "Arcane
     Circuit" (Animated). Hextech-Leiterbahnen um die Widget-Flaeche,
     Energieimpulse laufen die Bahnen entlang, Runen leuchten auf, wenn ein
     Impuls vorbeikommt, Hextech-Kristalle in den Ecken. Easter Egg: alle vier
     Eckkristalle anklicken -> Ueberladung, die Energie stroemt in die Mitte und
     ein Hextech-Siegel erscheint hinter dem Profil. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #071a1f; color: #e6f7f6; font-family: Georgia, serif; overflow: hidden; }
  .stage { height: 100%; display: flex; align-items: center; justify-content: center; }
  .board-wrap { position: relative; }
  .board { position: relative; width: 760px; padding: 18px; border-radius: 16px; background: linear-gradient(160deg, rgba(10, 40, 48, .55), rgba(4, 18, 22, .7)); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; z-index: 1; }
  .w { background: rgba(7, 26, 31, .75); border: 1px solid #0e4f57; border-radius: 10px; padding: 12px 14px; min-height: 90px; }
  .w.wide { grid-column: span 3; display: flex; align-items: center; gap: 18px; min-height: 0; }
  .w h4 { margin: 0 0 6px; font-family: 'Cinzel', serif; color: #0ac8b9; font-size: .82rem; letter-spacing: 1px; }
  .big { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #e6f7f6; }
  .muted { color: #8fb8b5; font-size: .85rem; }
  .ava { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #0ac8b9; object-fit: cover; }
  .name { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #0ac8b9; }
  canvas.frame { position: absolute; left: -80px; top: -80px; pointer-events: none; z-index: 2; }
  canvas.seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
  .label { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); font-family: 'Cinzel', serif; color: #0ac8b9; letter-spacing: 3px; }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #4f7f7c; font-size: 13px; border: 1px solid #0e4f57; border-radius: 14px; padding: 6px 14px; }
</style>
</head>
<body>
<div class="label">Arcane Circuit</div>
<div class="stage">
  <div class="board-wrap" id="wrap">
    <canvas class="seal" id="seal"></canvas>
    <div class="board" id="board">
      <div class="w wide"><img class="ava" src="https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/4644.png" onerror="this.src='https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Evelynn.png'" alt=""><div><div class="name">LUCKSHOT#796</div><div class="muted">Pony since 09.10.2026 · Level 17</div></div></div>
      <div class="w"><h4>Games</h4><div class="big">142</div><div class="muted">58% win rate</div></div>
      <div class="w"><h4>Rank</h4><div class="big">Gold II</div><div class="muted">40 LP</div></div>
      <div class="w"><h4>Trophies</h4><div class="big">9 / 21</div><div class="muted">2 this week</div></div>
    </div>
    <canvas class="frame" id="frame"></canvas>
  </div>
</div>
<div class="hint">psst... the four crystals hold more power than they show</div>

<script>
const rand = (a, b) => a + Math.random() * (b - a);
const board = document.getElementById('board'), fc = document.getElementById('frame'), fx = fc.getContext('2d');
const sealCv = document.getElementById('seal'), sx = sealCv.getContext('2d');
// Rand gross genug, dass das Leuchten der Eckkristalle nie abgeschnitten wird
const PAD = 80, DPR = Math.min(2, devicePixelRatio || 1);
let W = 0, H = 0, perim = [], perimLen = 0, branches = [], runes = [];

function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Hauptbahn: abgerundetes Rechteck knapp ausserhalb der Flaeche, als Punktliste
function layout() {
  const bw = board.offsetWidth, bh = board.offsetHeight;
  W = bw + PAD * 2; H = bh + PAD * 2;
  fc.width = W * DPR; fc.height = H * DPR; fc.style.width = W + 'px'; fc.style.height = H + 'px';
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const S = Math.max(bw, bh) * 1.25;
  sealCv.width = S * DPR; sealCv.height = S * DPR; sealCv.style.width = S + 'px'; sealCv.style.height = S + 'px';
  sx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const o = 9, r = 22, x0 = PAD - o, y0 = PAD - o, x1 = PAD + bw + o, y1 = PAD + bh + o;
  perim = [];
  const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= 8; i++) { const a = a0 + (a1 - a0) * i / 8; perim.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  perim.push([x0 + r, y0]); perim.push([x1 - r, y0]); arc(x1 - r, y0 + r, -Math.PI / 2, 0);
  perim.push([x1, y1 - r]); arc(x1 - r, y1 - r, 0, Math.PI / 2);
  perim.push([x0 + r, y1]); arc(x0 + r, y1 - r, Math.PI / 2, Math.PI);
  perim.push([x0, y0 + r]); arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);
  // Laengen fuer Impulse
  perimLen = 0; perim.forEach((p, i) => { if (i) perimLen += Math.hypot(p[0] - perim[i - 1][0], p[1] - perim[i - 1][1]); p.len = perimLen; });
  // Seitenbahnen: kurze rechtwinklige Leiterbahnen nach aussen mit Lot-Punkt
  const rr = seeded(5); branches = [];
  const addEdge = (ax, ay, bx, by, nx, ny, count) => {
    for (let k = 0; k < count; k++) {
      const u = .1 + rr() * .8, px = ax + (bx - ax) * u, py = ay + (by - ay) * u;
      const out = 8 + rr() * 16, jog = (rr() - .5) * 30;
      branches.push([[px, py], [px + nx * out, py + ny * out], [px + nx * out + (ny !== 0 ? jog : 0), py + ny * out + (nx !== 0 ? jog : 0)]]);
    }
  };
  addEdge(x0 + r, y0, x1 - r, y0, 0, -1, 9); addEdge(x0 + r, y1, x1 - r, y1, 0, 1, 9);
  addEdge(x0, y0 + r, x0, y1 - r, -1, 0, 4); addEdge(x1, y0 + r, x1, y1 - r, 1, 0, 4);
  // Runen oben und unten auf der Bahn
  runes = [];
  for (let k = 0; k < 14; k++) { const u = (k + .5) / 14; runes.push({ x: x0 + r + (x1 - x0 - 2 * r) * u, y: y0, top: true, seed: Math.floor(rr() * 1e6), glow: 0 }); runes.push({ x: x0 + r + (x1 - x0 - 2 * r) * u, y: y1, top: false, seed: Math.floor(rr() * 1e6), glow: 0 }); }
  crystals = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map((c, i) => ({ x: c[0], y: c[1], lit: 0, clicked: false, i }));
}
let crystals = [];

function pointAt(d) {
  d = ((d % perimLen) + perimLen) % perimLen;
  for (let i = 1; i < perim.length; i++) if (perim[i].len >= d) { const a = perim[i - 1], b = perim[i], u = (d - a.len) / (b.len - a.len || 1); return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }
  return perim[0];
}

// kleine Rune: 3-4 Striche aus einem festen Zufall
function drawRune(x, y, seed, a) {
  const r = seeded(seed); fx.save(); fx.translate(x, y);
  fx.strokeStyle = `rgba(120, 255, 240, ${a})`; fx.lineWidth = 1.2; fx.shadowColor = '#0ac8b9'; fx.shadowBlur = 8 * a;
  fx.beginPath();
  for (let k = 0; k < 3; k++) { const x0 = (r() - .5) * 8, y0 = (r() - .5) * 8; fx.moveTo(x0, y0); fx.lineTo(x0 + (r() - .5) * 8, y0 + (r() - .5) * 8); }
  fx.stroke(); fx.restore();
}

function drawCrystal(c, t, power) {
  const s = 11 + 3 * c.lit;
  fx.save(); fx.translate(c.x, c.y); fx.rotate(Math.PI / 6);
  const glow = fx.createRadialGradient(0, 0, 0, 0, 0, s * 3);
  glow.addColorStop(0, `rgba(80, 230, 255, ${.35 + .25 * Math.sin(t * 2 + c.i) + .4 * c.lit + .3 * power})`); glow.addColorStop(1, 'rgba(80, 230, 255, 0)');
  fx.fillStyle = glow; fx.beginPath(); fx.arc(0, 0, s * 3, 0, 7); fx.fill();
  // Fassung (goldener Sechseckrahmen)
  const hex = rr => { fx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; fx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); } fx.closePath(); };
  hex(s + 4); fx.fillStyle = '#7a5a20'; fx.fill(); fx.strokeStyle = '#d6b36a'; fx.lineWidth = 1.5; fx.stroke();
  // Kristall mit Facetten
  hex(s); const g = fx.createLinearGradient(-s, -s, s, s); g.addColorStop(0, '#bff8ff'); g.addColorStop(.45, '#2cc8e8'); g.addColorStop(1, '#0a4f7a');
  fx.fillStyle = g; fx.fill();
  fx.strokeStyle = 'rgba(255,255,255,.5)'; fx.lineWidth = .8; fx.beginPath(); for (let k = 0; k < 6; k += 2) { const a = k * Math.PI / 3; fx.moveTo(0, 0); fx.lineTo(Math.cos(a) * s, Math.sin(a) * s); } fx.stroke();
  fx.restore();
}

const pulses = Array.from({ length: 5 }, (_, i) => ({ d: i * 300, v: rand(110, 170) * (i % 2 ? -1 : 1), hue: i % 2 ? 'teal' : 'gold' }));
let egg = null;

function frame(now) {
  const t = now / 1000, dt = Math.min(.05, t - (frame.last || t)); frame.last = t;
  fx.clearRect(0, 0, W, H);
  const power = egg ? Math.max(0, 1 - Math.abs(egg.t - 1.2) / 1.2) : 0;

  // Leiterbahnen
  fx.lineJoin = 'round'; fx.lineCap = 'round';
  fx.strokeStyle = `rgba(214, 179, 106, ${.55 + .3 * power})`; fx.lineWidth = 1.6;
  fx.beginPath(); perim.forEach(([x, y], i) => i ? fx.lineTo(x, y) : fx.moveTo(x, y)); fx.closePath(); fx.stroke();
  fx.strokeStyle = `rgba(10, 200, 185, ${.35 + .4 * power})`; fx.lineWidth = 1;
  branches.forEach(b => { fx.beginPath(); b.forEach(([x, y], i) => i ? fx.lineTo(x, y) : fx.moveTo(x, y)); fx.stroke(); const [ex, ey] = b[b.length - 1]; fx.fillStyle = `rgba(120, 255, 240, ${.5 + .5 * power})`; fx.beginPath(); fx.arc(ex, ey, 2, 0, 7); fx.fill(); });

  // Impulse mit Schweif; Runen leuchten auf, wenn einer vorbeikommt
  fx.save(); fx.globalCompositeOperation = 'lighter';
  pulses.forEach(p => {
    p.d += p.v * dt * (1 + 3 * power);
    for (let k = 0; k < 14; k++) {
      const [x, y] = pointAt(p.d - Math.sign(p.v) * k * 5);
      const a = (1 - k / 14) * (p.hue === 'teal' ? .9 : .8);
      fx.fillStyle = p.hue === 'teal' ? `rgba(90, 255, 235, ${a})` : `rgba(255, 215, 130, ${a})`;
      fx.beginPath(); fx.arc(x, y, 2.6 - k * .14, 0, 7); fx.fill();
    }
    const [hx, hy] = pointAt(p.d);
    runes.forEach(rn => { if (Math.hypot(rn.x - hx, rn.y - hy) < 26) rn.glow = 1; });
  });
  fx.restore();
  runes.forEach(rn => { rn.glow = Math.max(power, rn.glow - dt * 1.2); drawRune(rn.x, rn.y + (rn.top ? -11 : 11), rn.seed, .25 + .75 * rn.glow); });
  crystals.forEach(c => { c.lit = Math.max(c.clicked ? .8 : 0, c.lit - dt); drawCrystal(c, t, power); });

  drawEgg(dt, t);
  requestAnimationFrame(frame);
}

// ----- Easter Egg: alle vier Kristalle anklicken -> Ueberladung + Hextech-Siegel -----
document.addEventListener('click', e => {
  if (egg) return;
  const r = fc.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const c = crystals.find(c => Math.hypot(c.x - x, c.y - y) < 20);
  if (!c) return;
  c.clicked = true; c.lit = 1;
  clearTimeout(c.reset); c.reset = setTimeout(() => { c.clicked = false; }, 6000);
  if (crystals.every(k => k.clicked)) { egg = { t: 0 }; crystals.forEach(k => { k.clicked = false; clearTimeout(k.reset); }); }
});

function drawEgg(dt, t) {
  const S = sealCv.width / DPR;
  sx.clearRect(0, 0, S, S);
  if (!egg) return;
  egg.t += dt;
  const e = egg.t;
  // Energie stroemt von den Kristallen zur Mitte
  if (e < 1.2) {
    fx.save(); fx.globalCompositeOperation = 'lighter';
    crystals.forEach(c => {
      for (let k = 0; k < 10; k++) {
        const u = Math.min(1, e / 1.0 + k * .03) % 1;
        const x = c.x + (W / 2 - c.x) * u, y = c.y + (H / 2 - c.y) * u;
        fx.fillStyle = `rgba(120, 255, 240, ${.6 * (1 - k / 10)})`; fx.beginPath(); fx.arc(x, y, 3 - k * .2, 0, 7); fx.fill();
      }
    });
    fx.restore();
  }
  // Siegel hinter der Flaeche: Ringe, Sechseck, Runenkranz - dreht sich, dann verglueht es
  const a = e < 1 ? 0 : e < 1.6 ? (e - 1) / .6 : e < 4 ? 1 : Math.max(0, 1 - (e - 4) / 1.2);
  if (a > 0) {
    sx.save(); sx.translate(S / 2, S / 2); sx.globalCompositeOperation = 'lighter';
    const R = S * .44;
    const glow = sx.createRadialGradient(0, 0, 0, 0, 0, R * 1.1);
    glow.addColorStop(0, `rgba(10, 200, 185, ${.35 * a})`); glow.addColorStop(1, 'rgba(10, 200, 185, 0)');
    sx.fillStyle = glow; sx.beginPath(); sx.arc(0, 0, R * 1.1, 0, 7); sx.fill();
    sx.strokeStyle = `rgba(120, 255, 240, ${.7 * a})`; sx.shadowColor = '#0ac8b9'; sx.shadowBlur = 16;
    sx.lineWidth = 2; sx.beginPath(); sx.arc(0, 0, R, 0, 7); sx.stroke();
    sx.lineWidth = 1; sx.beginPath(); sx.arc(0, 0, R * .9, 0, 7); sx.stroke();
    sx.save(); sx.rotate(t * .4);
    sx.strokeStyle = `rgba(214, 179, 106, ${.8 * a})`; sx.lineWidth = 2;
    sx.beginPath(); for (let k = 0; k <= 6; k++) { const ang = k * Math.PI / 3; sx[k ? 'lineTo' : 'moveTo'](Math.cos(ang) * R * .8, Math.sin(ang) * R * .8); } sx.stroke();
    sx.beginPath(); for (let k = 0; k <= 6; k++) { const ang = k * Math.PI / 3 + Math.PI / 6; sx[k ? 'lineTo' : 'moveTo'](Math.cos(ang) * R * .55, Math.sin(ang) * R * .55); } sx.stroke();
    sx.restore();
    sx.save(); sx.rotate(-t * .25);
    sx.fillStyle = `rgba(120, 255, 240, ${.8 * a})`; sx.font = `${Math.round(R * .07)}px serif`; sx.textAlign = 'center';
    const glyphs = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
    for (let k = 0; k < 24; k++) { sx.save(); sx.rotate(k / 24 * Math.PI * 2); sx.fillText(glyphs[k], 0, -R * .95 + R * .02); sx.restore(); }
    sx.restore();
    sx.restore();
  }
  if (e > 5.3) egg = null;
}

layout(); addEventListener('resize', layout);
requestAnimationFrame(frame);
</script>
</body>
</html>
